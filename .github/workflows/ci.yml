name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: adminforge
          POSTGRES_PASSWORD: adminforge-ci
          POSTGRES_DB: adminforge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U adminforge" --health-interval 5s --health-retries 12
    env:
      # CI runs entirely on synthetic data; no tenant configuration exists here.
      ADMINFORGE_ENV_FILE: /dev/null
      NODE_ENV: test
      AUTH_MODE: mock
      DATA_MODE: fixtures
      PUBLIC_BASE_URL: http://localhost:5173
      DATABASE_URL: postgres://adminforge:adminforge-ci@localhost:5432/adminforge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fails on high or critical advisories)
        run: pnpm audit --audit-level high
      - name: Guards (secrets, tenant data, design tokens)
        run: pnpm --filter @adminforge/tests exec vitest run --project guards
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @adminforge/design-tokens build
      - run: pnpm typecheck
      - run: pnpm --filter @adminforge/api db:migrate
      - name: Tests (unit, component, api, content)
        run: pnpm test
      - name: Build (production, as deployed)
        run: pnpm build
        env:
          NODE_ENV: production
      - name: Initial-load budget (≤ 250 KB gzip JS)
        run: node tooling/ci/check-bundle.mjs
      - name: End-to-end and visual (mock mode, system Chrome)
        run: pnpm test:e2e
      - name: Production-build smoke (vite preview of dist/)
        run: pnpm test:e2e:prod
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7
