packages:
  - portal/apps/*
  - portal/packages/*
  - portal/tools/*
  - tests
  - tooling/*
allowBuilds:
  # better-sqlite3 ships prebuilt N-API binaries (prebuilds/<platform>.node); its binding.gyp is only for compiling
  # from source, which we never want (no toolchain in the images; the prebuilt binary is the one we reviewed).
  better-sqlite3: false
  esbuild: true
# Supply chain (S-04, tests/unit/tooling/supply-chain-release-age.test.ts): a version must be seven days old (minutes;
# pnpm's own default is one day) before pnpm resolves it, and every install re-checks the lockfile against that.
# Strict: a too-young version fails the install (in CI) or asks first, instead of being added to the excludes on its
# own. A version whose registry entry has no publish time fails too (pnpm would otherwise skip the check for it).
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# An urgent fix that can't wait seven days — a Dependabot security update skips its cooldown but not this floor: one
# exact version per entry (`name@1.2.3`), each with a comment saying why and when it can go, added in the same pull
# request; remove it once the version has aged past the cutoff. Never a bare package name or pattern. An interactive
# `pnpm install` that asks to approve a too-young version writes it here without a comment: the test refuses that.
minimumReleaseAgeExclude: []
overrides:
  # exceljs pins uuid 8 (GHSA moderate, fixed in 11.1.1); 11 keeps the CommonJS build exceljs requires.
  exceljs>uuid: ^11.1.1
  # monaco-editor 0.57.0 (the latest) pins dompurify 3.4.15: two low advisories (GHSA-p98j-92pf-mc4p,
  # GHSA-6688-9rhm-gjv2), fixed in 3.4.16 (S-30). Drop this once a monaco-editor release requires a fixed version.
  dompurify: ^3.4.16
