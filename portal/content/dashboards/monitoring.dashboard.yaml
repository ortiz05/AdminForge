$schema: ../../packages/schemas/generated/dashboard.schema.json
kind: dashboard
id: automation.monitoring
version: 1.3.1
title: Synthetic monitoring
summary: >-
  Retired — replaced by the Synthetic monitoring screen (/monitoring), which shows every probe by service with its
  history, what it found and what to do; each navigation section shows its own checks' status. This dashboard showed
  the latest result and recent trend of every synthetic probe the scheduler runs as the automation identity, one panel
  per service.
# Retired 2026-10-21 (platform review B-3): it duplicated /monitoring in Automation. To bring it back, set
# `status: active`, bump `version` and give it a `nav` entry that doesn't repeat Synthetic monitoring.
status: retired
owner: portal-admins
tags: [synthetic, monitoring, automation]
nav: { section: automation, label: Probe dashboard, icon: heartbeat, order: 35 }
requires:
  portalRoles: [Portal.Reader]
refresh: 60

layout:
  - widget: markdown
    id: intro
    span: 12
    text: |
      The scheduler runs these probes from this host as the **automation identity** — every 15 minutes, hourly or every
      6 hours, by their sweep (*Automation › Schedules*, tag `probe-sweep`). A probe turns **warn** or **crit** when its
      main measurement crosses its thresholds — latency for reachability checks, delivery time for mail flow, days
      remaining for certificates and credentials, seats in use for licences, failure rate for sign-ins, open incidents
      or offending resources for the rest. [Synthetic monitoring](/monitoring) shows the same probes with their history.

      *Synthetic transactions* — mail flow, a SharePoint file round trip, a Teams meeting — run against test objects
      named in configuration and remove what they made; until those are set up they show *not configured*. A failing
      token check under *AdminForge* usually means the automation identity's certificate or secret expired, or admin
      consent was removed.

  - widget: probeStatus
    id: m365
    title: Microsoft 365
    span: 6
    group: m365

