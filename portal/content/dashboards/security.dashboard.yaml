$schema: ../../packages/schemas/generated/dashboard.schema.json
kind: dashboard
id: security.overview
version: 2.0.0
title: Security posture
summary: Users at risk (Entra ID Protection) and Defender for Cloud secure score per subscription in one view.
owner: security-team
tags: [security, dashboard]
nav: { section: security, label: Overview, icon: gauge, order: 5 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [IdentityRiskyUser.Read.All]
    arm: [user_impersonation]
  entraRoles: [Security Reader]
  azureRoles: [Security Reader]
refresh: 300

datasources:
  risky:
    label: Users at risk
    source: graph
    request:
      path: /identityProtection/riskyUsers
      query:
        $top: 500
        $filter: "riskState eq microsoft.graph.riskState'atRisk'"
    paging: all
    maxItems: 10000
    cache: { ttl: 300 }
    requires: { licences: [identityProtection] }
    transform: >-
      ${ (
        $r := [value.value[riskState = 'atRisk' and $not(isDeleted = true)]];
        {
          "high": $count($r[riskLevel = 'high']),
          "atRisk": $count($r),
          "top": [($r[riskLevel in ['high', 'medium']]^(>riskLastUpdatedDateTime))[[0..5]]]
        }
      ) }
  mdc:
    label: Defender for Cloud secure score
    source: resourceGraph
    query: |
      // af:security.overview#mdcscores
      securityresources
      | where type =~ 'microsoft.security/securescores' and name =~ 'ascScore'
      | extend current = toreal(properties.score.current), max = toreal(properties.score.max), percentage = toreal(properties.score.percentage)
      | join kind=leftouter (resourcecontainers | where type =~ 'microsoft.resources/subscriptions' | project subscriptionId, subscriptionName = name) on subscriptionId
      | project subscriptionId, subscriptionName, current, max, percentage
      | order by percentage asc
    paging: all
    maxItems: 1000
    cache: { ttl: 900 }
    transform: >-
      ${ (
        $rows := [value.value];
        {
          "rows": $rows,
          "overall": $sum([0, $rows.max]) > 0 ? $round($sum($rows.current) / $sum($rows.max), 4) : null
        }
      ) }

layout:
  - widget: licenceGate
    feature: identityProtection
    title: Users at risk need Microsoft Entra ID P2
    body: The users-at-risk figures and the list of users at high or medium risk.
  - widget: kpi
    id: high_risk_users
    data: risky.high
    label: Users at high risk
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
    href: /p/security.risky-users?riskState=atRisk&riskLevel=high
  - widget: kpi
    id: users_at_risk
    data: risky.atRisk
    label: Users at risk
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
    href: /p/security.risky-users?riskState=atRisk
  - widget: kpi
    id: mdc_overall
    data: mdc.overall
    label: Defender for Cloud secure score
    format: percent
    status: "${ $type(value) = 'number' ? (value >= 0.7 ? 'ok' : value >= 0.5 ? 'warn' : 'crit') : 'neutral' }"
    href: /p/security.defender-for-cloud
  - widget: list
    id: risky_users
    title: Users at high or medium risk
    span: 6
    data: risky.top
    primary: userDisplayName
    secondary: riskLastUpdatedDateTime
    secondaryFormat: relativeTime
    status: { field: riskLevel, map: { high: [crit, High], medium: [warn, Medium], low: [info, Low] } }
    href: ${ '/p/security.risky-user?id=' & row.id }
    limit: 6
  - widget: chart
    id: mdc_scores
    title: Defender for Cloud secure score by subscription
    span: 6
    rows: 2
    type: bar
    data: mdc.rows
    x: subscriptionName
    y: percentage
    format: percent
    empty:
      title: No secure scores
      body: >-
        Defender for Cloud calculates a secure score for each subscription after it is first opened. You need Security
        Reader (or Reader) on the subscription.
  - widget: markdown
    span: 12
    text: |
      Drill in: [Risky users](/p/security.risky-users) · [Defender for Cloud](/p/security.defender-for-cloud). Figures
      refresh every 5 minutes.
