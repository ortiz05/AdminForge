$schema: ../../packages/schemas/generated/dashboard.schema.json
kind: dashboard
id: sharepoint.overview
version: 1.0.2
title: SharePoint Online overview
summary: >-
  SharePoint Online and OneDrive at a glance — Microsoft's service health and open issues for both, storage used and
  OneDrive file activity, and the synthetic file round-trip, endpoint and sign-in checks — with links to the site
  pages and SharePoint reports.
owner: m365-team
tags: [sharepoint, onedrive, m365, overview]
template: dashboard
nav: { section: sharepoint, label: Overview, icon: squares-four, order: 5 }
refresh: 300
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [ServiceHealth.Read.All, Reports.Read.All]
  # Service health needs Service Support Administrator or Global Reader; the usage reports need Reports Reader or Global Reader.
  entraRoles: [Global Reader]
  licences: [sharepoint]

datasources:
  # The same requests as the Microsoft 365 overview (shared cache), narrowed to SharePoint Online and OneDrive here.
  health:
    source: graph
    request:
      path: /admin/serviceAnnouncement/healthOverviews
      query:
        $select: id,service,status
    cache: { ttl: 120 }
    transform: >-
      ${ (
        $mine := ['SharePoint Online', 'Microsoft OneDrive', 'OneDrive for Business'];
        $healthy := ['serviceOperational', 'serviceRestored', 'falsePositive', 'postIncidentReviewPublished', 'resolved', 'resolvedExternal', 'mitigated', 'mitigatedExternal'];
        $words := { 'serviceDegradation': 'Degraded', 'serviceInterruption': 'Interrupted', 'investigating': 'Investigating', 'restoringService': 'Restoring service', 'extendedRecovery': 'Extended recovery', 'verifyingService': 'Verifying' };
        $rows := [value.value[service in $mine]];
        $bad := [$rows[$not(status in $healthy)]];
        $worst := $count($bad[status = 'serviceInterruption']) > 0 ? 'serviceInterruption' : $bad[0].status;
        {
          "value": $rows,
          "label": $count($rows) = 0 ? 'Not reported' : $count($bad) = 0 ? 'Healthy' : ($lookup($words, $worst) ? $lookup($words, $worst) : 'Advisory'),
          "tone": $count($rows) = 0 ? 'neutral' : $worst = 'serviceInterruption' ? 'crit' : $count($bad) > 0 ? 'warn' : 'ok',
          "services": $count($bad) = 0 ? $join([$rows.service], ' and ') : $join($bad.service, ' and ')
        }
      ) }
  issues:
    source: graph
    request:
      path: /admin/serviceAnnouncement/issues
      query:
        $filter: isResolved eq false
        $orderby: lastModifiedDateTime desc
        $top: 100
    paging: all
    maxItems: 500
    cache: { ttl: 120 }
    transform: >-
      ${ (
        $mine := ['SharePoint Online', 'Microsoft OneDrive', 'OneDrive for Business'];
        $open := value.value[isResolved = false and service in $mine]^((classification = 'incident' ? 0 : 1), >lastModifiedDateTime);
        $rows := [$open.{ "id": id, "title": title, "service": service, "classification": classification, "lastModifiedDateTime": lastModifiedDateTime }];
        { "rows": $rows, "incidents": $count($rows[classification = 'incident']), "advisories": $count($rows[classification = 'advisory']) }
      ) }
  siteStorage:
    source: graph
    label: SharePoint storage (usage report)
    request:
      beta: true
      path: /reports/getSharePointSiteUsageStorage(period='D7')
      query: { $format: application/json }
    cache: { ttl: 3600 }
    transform: >-
      ${ { "used": (value.value^(>reportDate))[0].storageUsedInBytes } }
  oneDriveStorage:
    source: graph
    label: OneDrive storage (usage report)
    request:
      beta: true
      path: /reports/getOneDriveUsageStorage(period='D7')
      query: { $format: application/json }
    cache: { ttl: 3600 }
    transform: >-
      ${ { "used": (value.value^(>reportDate))[0].storageUsedInBytes } }
  files:
    source: graph
    label: OneDrive file activity (usage report)
    request:
      beta: true
      path: /reports/getOneDriveActivityFileCounts(period='D30')
      query: { $format: application/json }
    cache: { ttl: 3600 }
    transform: >-
      ${ (
        $days := [value.value^(reportDate)];
        { "days": $days, "sharedExternally": $sum([0, $days.sharedExternally]) }
      ) }

layout:
  - widget: kpi
    id: health
    data: health.label
    label: SharePoint and OneDrive health
    format: text
    status: "${ health.tone }"
    statusLabel: "${ health.services }"
    href: /p/m365.service-health?service=SharePoint%20Online
  - widget: kpi
    id: incidents
    data: issues.incidents
    label: Active incidents
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
    hint: "${ issues.advisories = 1 ? '1 advisory open' : issues.advisories & ' advisories open' }"
    href: /p/m365.service-health?service=SharePoint%20Online
  - widget: kpi
    id: siteStorage
    data: siteStorage.used
    label: SharePoint storage used
    format: bytes
    hint: Every site, from the latest usage report.
    href: /p/m365.sharepoint-site-usage
  - widget: kpi
    id: oneDriveStorage
    data: oneDriveStorage.used
    label: OneDrive storage used
    format: bytes
    hint: Every OneDrive, from the latest usage report.
    href: /p/m365.onedrive-usage
  - widget: probeStatus
    id: checks
    title: Synthetic checks
    description: File upload and download round trip, the SharePoint endpoint, sign-ins and the SharePoint admin token — on a schedule, as the automation identity.
    span: 7
    group: sharepoint
    empty:
      title: No SharePoint Online checks have reported yet
      body: The checks report here after their first scheduled run. Every check is on the Monitoring page (Overview).
  - widget: list
    id: activeIssues
    title: SharePoint and OneDrive incidents and advisories
    span: 5
    data: issues.rows
    primary: title
    secondary: service
    status: { field: classification, map: { incident: [crit, Incident], advisory: [info, Advisory] } }
    href: ${ '/p/m365.service-issue?id=' & $encode(row.id) }
    limit: 8
    empty:
      title: No active SharePoint or OneDrive issues
      body: Microsoft isn't tracking any SharePoint Online or OneDrive incident or advisory for this tenant.
  - widget: chart
    id: files
    title: OneDrive file activity (30 days)
    span: 7
    type: line
    data: files.days
    x: reportDate
    y: [viewedOrEdited, synced, sharedInternally, sharedExternally]
    labels: { viewedOrEdited: Viewed or edited, synced: Synced, sharedInternally: Shared internally, sharedExternally: Shared externally }
    format: number
  - widget: markdown
    id: links
    title: Pages and reports
    span: 5
    text: |
      **Pages:** [Sites](/p/m365.sharepoint-sites) · [Sharing](/p/m365.sharepoint-sharing)

      **Reports:** [SharePoint site storage and activity](/p/m365.sharepoint-site-usage) · [OneDrive storage and activity](/p/m365.onedrive-usage) · [Public and Anyone-link sites](/p/m365.anyone-link-sites) · [Every SharePoint Online report](/reports?area=sharepoint)

      **Monitoring:** [SharePoint Online checks](/monitoring?group=sharepoint) · [SharePoint Online service health](/p/m365.service-health?service=SharePoint%20Online) · [OneDrive service health](/p/m365.service-health?service=Microsoft%20OneDrive)
