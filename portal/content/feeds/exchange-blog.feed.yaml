$schema: ../../packages/schemas/generated/feed.schema.json
kind: feed
id: feeds.exchange-blog
version: 1.0.0
title: Exchange Team Blog
summary: >-
  Announcements from the Exchange team, posted on Microsoft Tech Community. Posts about on-premises Exchange Server releases are dropped; AdminForge manages Exchange Online.
owner: portal-admins
tags: [news, m365, public, blog]
publisher: Microsoft Tech Community
homepage: https://techcommunity.microsoft.com/t5/exchange-team-blog/bg-p/Exchange
collector:
  kind: rss
  url: https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=Exchange
  lookbackDays: 90
keep: all
defaultAreas: [m365]
classify:
  # On-premises Exchange Server releases (security updates, cumulative updates, Subscription Edition).
  - match:
      title:
        - Exchange Server Security Updates
        - Exchange Server Security Update
        - Exchange Server Cumulative Update
        - Exchange Server Subscription Edition
        - Exchange Server SE
    exclude: true
  - match: { title: [retirement, retiring, retire, deprecation, deprecated, end of support] }
    kind: retirement
  - match: { text: [Exchange Online] }
    tags: [exchange]
# The feed carries whole articles: only the headline and a short excerpt are kept, with the link back.
pollMinutes: 180
retentionDays: 180
