$schema: ../../packages/schemas/generated/feed.schema.json
kind: feed
id: feeds.m365-service-health
version: 1.0.0
title: Microsoft 365 service health
summary: >-
  Incidents and advisories Microsoft posts for your tenant's Microsoft 365 services, read with Microsoft Graph as the
  automation identity. An incident stays in Breaking until Microsoft marks it resolved.
owner: portal-admins
tags: [news, m365, tenant, health]
publisher: Microsoft
homepage: https://admin.cloud.microsoft/#/servicehealth
collector:
  kind: serviceHealth
  lookbackDays: 14
# Every service the tenant has is kept (an outage matters whoever owns the service); managed services get their area.
keep: all
defaultAreas: [m365]
classify:
  - match: { services: [Microsoft Entra, Microsoft Entra ID, Azure Active Directory, Identity Service] }
    areas: [identity]
    tags: [entra]
  - match: { services: [Exchange Online, Exchange Online Protection] }
    areas: [m365]
    tags: [exchange]
  - match: { services: [Microsoft Teams] }
    areas: [m365]
    tags: [teams]
  - match: { services: [SharePoint Online] }
    areas: [m365]
    tags: [sharepoint]
  - match: { services: [OneDrive for Business] }
    areas: [m365]
    tags: [onedrive]
  - match: { services: [Microsoft Intune, Mobile Device Management for Office 365] }
    areas: [endpoint]
    tags: [intune]
  - match:
      services:
        - Microsoft Defender XDR
        - Microsoft 365 Defender
        - Microsoft Defender for Office 365
        - Microsoft Defender for Endpoint
        - Microsoft Defender for Identity
        - Microsoft Defender for Cloud Apps
    areas: [security]
    tags: [defender]
pollMinutes: 60
retentionDays: 90
requires:
  scopes:
    graph: [ServiceHealth.Read.All]
