$schema: ../../packages/schemas/generated/feed.schema.json
kind: feed
id: feeds.vmware-security-blog
version: 1.0.0
title: VMware security blog
summary: >-
  Posts from VMware's (Broadcom's) own security blog — threat research and the security features of VMware products.
  Not the security advisories (VMSA): those have no feed AdminForge can read (docs/news.md).
owner: portal-admins
tags: [news, infrastructure, security, public, blog, vmware]
publisher: VMware by Broadcom
homepage: https://blogs.vmware.com/security/
collector:
  kind: rss
  url: https://blogs.vmware.com/security/feed/
  lookbackDays: 90
keep: all
defaultAreas: [infrastructure, security]
classify:
  - match: { title: [vulnerability, CVE, exploit, ransomware, RCE] }
    kind: security
    tags: [vmware]
  - match: { text: [VMware] }
    tags: [vmware]
pollMinutes: 360
retentionDays: 180
