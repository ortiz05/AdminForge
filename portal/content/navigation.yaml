$schema: ../packages/schemas/generated/navigation.schema.json
kind: navigation
id: portal.navigation
version: 1.3.0
title: Navigation
summary: Section order, labels and icons for the navigation rail. Pages join a section through nav.section.
owner: portal-admins

sections:
  - key: overview
    label: Overview
    icon: house
    order: 10
    items:
      - { key: news, label: News and changes, href: /news, icon: newspaper, order: 5 }
  - key: identity
    label: Identity
    icon: identification-card
    order: 20
    items:
      - { key: identity-checks, label: Service checks, href: /monitoring?group=identity, icon: pulse, order: 90 }
  - key: m365
    label: Microsoft 365
    icon: squares-four
    order: 30
    items:
      - { key: m365-checks, label: Service checks, href: /monitoring?group=m365, icon: pulse, order: 90 }
  # Each Microsoft 365 workload is its own parent; Microsoft 365 keeps what spans them (service health, Message
  # center, licences, usage, groups). Page keys stay `m365.*`: a page moves with its nav.section, links keep working.
  # "Service checks" opens Synthetic monitoring for the section's own probes (a probe's `group`).
  - key: exchange
    label: Exchange Online
    icon: envelope-simple
    order: 32
    items:
      - { key: exchange-checks, label: Service checks, href: /monitoring?group=exchange, icon: pulse, order: 90 }
  - key: sharepoint
    label: SharePoint Online
    icon: globe-hemisphere-west
    order: 34
    items:
      - { key: sharepoint-checks, label: Service checks, href: /monitoring?group=sharepoint, icon: pulse, order: 90 }
  - key: teams
    label: Teams
    icon: microsoft-teams-logo
    order: 36
    items:
      - { key: teams-checks, label: Service checks, href: /monitoring?group=teams, icon: pulse, order: 90 }
  - key: endpoint
    label: Endpoint
    icon: devices
    order: 40
    items:
      - { key: endpoint-checks, label: Service checks, href: /monitoring?group=endpoint, icon: pulse, order: 90 }
  - key: security
    label: Security
    icon: shield-check
    order: 50
  - key: azure
    label: Azure
    icon: cloud
    order: 60
    items:
      - { key: azure-checks, label: Configuration checks, href: /monitoring?group=azure, icon: pulse, order: 90 }
  # Cost and billing across every subscription, for the people who manage Azure spend (finance and engineering).
  # Its reports are listed in the Reports catalogue (area billing).
  - key: billing
    label: Azure Billing
    icon: currency-circle-dollar
    order: 65
    items:
      - { key: billing-reports, label: Billing reports, href: /reports?area=billing, icon: chart-bar, order: 50 }
  - key: automation
    label: Automation
    icon: lightning
    order: 70
    items:
      - { key: runs, label: Runs, href: /runs, icon: list-checks, order: 10 }
      - { key: approvals, label: Approvals, href: /approvals, icon: seal-check, order: 15 }
      - { key: schedules, label: Schedules, href: /schedules, icon: calendar-check, order: 20 }
      - { key: monitoring, label: Synthetic monitoring, href: /monitoring, icon: pulse, order: 30 }
      - { key: query, label: Query Studio, href: /query, icon: terminal, order: 40 }
  - key: reports
    label: Reports
    icon: chart-bar
    order: 80
    # Reports keep `nav: { section: reports, icon }` (the icon is the catalogue's row icon) but aren't listed one by one:
    # the rail shows the catalogue, where every report can be filtered, opened and scheduled.
    listDefinitions: false
    items:
      - { key: reports-catalog, label: All reports, href: /reports, icon: chart-bar, order: 10 }
  - key: admin
    label: Admin
    icon: gear-six
    order: 90
    roles: [Portal.Admin]
    items:
      - { key: audit, label: Audit, href: /audit, icon: scroll, order: 10 }
      - { key: appearance, label: Appearance, href: /appearance, icon: palette, order: 20 }
      - { key: settings, label: Settings, href: /settings, icon: gear-six, order: 30 }
