$schema: ../../../packages/schemas/generated/page.schema.json
kind: page
id: endpoint.apps
version: 2.0.0
title: Apps
summary: >-
  Apps managed by Intune — Win32, Microsoft Store, Microsoft 365 Apps, line-of-business, store and web apps — by
  platform and type, with publisher, assignment and last change.
owner: endpoint-team
tags: [endpoint, intune, apps]
template: list-detail
nav: { section: endpoint, label: Apps, icon: package, order: 40 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [DeviceManagementApps.Read.All]
  entraRoles: [Intune Administrator]
  licences: [intune]

params:
  q: { type: string, default: "", label: Search, placeholder: App name or publisher }
  platform: { type: enum, values: [Any, Windows, macOS, iOS, Android, Web], default: Any, label: Platform, facet: true }
  assigned: { type: enum, values: [Any, Assigned, Unassigned], default: Any, label: Assignment, facet: true }
  kind:
    type: enum
    label: App type
    facet: true
    default: Any
    values:
      - { value: Any, label: Any }
      - { value: Win32, label: Windows app (Win32) }
      - { value: Store, label: Store app }
      - { value: M365, label: Microsoft 365 Apps }
      - { value: LOB, label: Line-of-business }
      - { value: Web, label: Web link }
      - { value: Other, label: Other }

filters:
  search: q
  facets: [platform, kind, assigned]

savedViews:
  enabled: true
  shared: true
  presets:
    - { name: Win32 apps, params: { kind: Win32 } }
    - { name: Unassigned apps, params: { assigned: Unassigned } }

datasources:
  apps:
    source: graph
    request:
      path: /deviceAppManagement/mobileApps
      query:
        # v1.0 has no isAssigned (beta only): whether an app is assigned comes from its assignments.
        $select: id,displayName,publisher,description,createdDateTime,lastModifiedDateTime,isFeatured,publishingState
        $expand: assignments($select=id)
    paging: all
    maxItems: 10000
    cache: { ttl: 300 }
    # Apps are grouped natively by Graph type: the type and platform are worked out once per type, and the facets,
    # assignment and search filter natively ($applyAdvanced) — 10,000 apps fit the transform budget.
    transform: >-
      ${ (
        $q := params.q ? params.q : '';
        $type := function($t) {
          $t in ['win32LobApp', 'winGetApp'] ? 'Win32'
          : $t in ['officeSuiteApp', 'macOSOfficeSuiteApp'] ? 'M365'
          : $contains($t, 'StoreApp') or $contains($t, 'VppApp') or $t in ['microsoftStoreForBusinessApp', 'androidManagedStoreApp', 'managedAndroidStoreApp', 'managedIOSStoreApp'] ? 'Store'
          : $contains($t, 'LobApp') or $contains($t, 'MSI') or $t = 'windowsAppX' or $t = 'windowsUniversalAppX' ? 'LOB'
          : $t in ['webApp', 'windowsWebApp'] ? 'Web' : 'Other'
        };
        $platform := function($t) {
          $t in ['webApp'] ? 'Web'
          : $contains($t, 'win') or $contains($t, 'Windows') or $t in ['officeSuiteApp', 'microsoftStoreForBusinessApp', 'microsoftEdgeApp', 'winGetApp'] ? 'Windows'
          : $contains($t, 'macOS') ? 'macOS' : $contains($t, 'ios') or $contains($t, 'IOS') ? 'iOS'
          : $contains($t, 'ndroid') ? 'Android' : 'Other'
        };
        $f := function($rows, $clauses) { $applyAdvanced($rows, { "join": "and", "clauses": $clauses }) };
        $apps := value.value;
        $byType := $apps{ `@odata.type`: $ };
        $typed := [$keys($byType).(
          $t := $substringAfter($, '#microsoft.graph.');
          $withFields($lookup($byType, $), { "odataType": $t, "kind": $type($t), "platform": $platform($t) })
        )];
        $assigned := { "path": "assignments", "type": "string", "op": "notEmpty", "value": null };
        $unassigned := { "path": "assignments", "type": "string", "op": "isEmpty", "value": null };
        $labelled := $append(
          $withFields($f($typed, [$assigned]), { "assigned": true }),
          $withFields($f($typed, [$unassigned]), { "assigned": false })
        );
        $shown := $f($labelled, $append($append($append(
          params.platform != 'Any' ? [{ "path": "platform", "type": "string", "op": "eq", "value": params.platform }] : [],
          params.kind != 'Any' ? [{ "path": "kind", "type": "string", "op": "eq", "value": params.kind }] : []),
          params.assigned != 'Any' ? [{ "path": "assigned", "type": "boolean", "op": "eq", "value": params.assigned = 'Assigned' }] : []),
          $q != '' ? [{ "join": "or", "clauses": [
            { "path": "displayName", "type": "string", "op": "contains", "value": $q },
            { "path": "publisher", "type": "string", "op": "contains", "value": $q }
          ] }] : []));
        $byPlatform := $labelled{ platform: $count($) };
        {
          "rows": $append([], $shown^(displayName)),
          "total": $count($labelled),
          "win32": $count($f($labelled, [{ "path": "kind", "type": "string", "op": "eq", "value": "Win32" }])),
          "unassigned": $count($f($labelled, [$unassigned])),
          "byPlatform": $append([], [$keys($byPlatform).{ "platform": $, "apps": $lookup($byPlatform, $) }]^(>apps)),
          "partial": value.truncated = true
        }
      ) }

layout:
  - widget: licenceGate
    feature: intune
    title: Intune isn't licensed in this tenant
  - widget: markdown
    span: 12
    when: ${ apps.partial = true }
    text: >-
      **Partial data.** Intune has more apps than this page reads (10,000); the figures and the list cover the ones read.
  - widget: kpi
    id: total
    data: apps.total
    label: Apps
    format: number
  - widget: kpi
    id: win32
    data: apps.win32
    label: Windows (Win32) apps
    format: number
    href: /p/endpoint.apps?kind=Win32
  - widget: kpi
    id: unassigned
    data: apps.unassigned
    label: Unassigned
    format: number
    status: "${ value > 0 ? 'info' : 'ok' }"
    href: /p/endpoint.apps?assigned=Unassigned
  - widget: chart
    id: byPlatform
    title: Apps by platform
    type: bar
    span: 3
    rows: 1
    data: apps.byPlatform
    x: platform
    y: apps
    format: number
  - widget: table
    id: apps
    span: 12
    data: apps.rows
    rowKey: id
    columns:
      - { field: displayName, label: App, kind: identity, secondary: publisher, sortable: true }
      - { field: kind, label: Type, filter: { type: facet, param: kind } }
      - { field: platform, label: Platform, filter: { type: facet, param: platform } }
      - { field: assigned, label: Assigned, kind: status, map: { "true": [ok, Assigned], "false": [neutral, Not assigned] }, filter: { type: facet, param: assigned } }
      - { field: publishingState, label: Publishing, hidden: true }
      - { field: isFeatured, label: Featured in Company Portal, kind: boolean, hidden: true }
      - { field: lastModifiedDateTime, label: Modified, kind: relativeTime, sortable: true }
      - { field: createdDateTime, label: Created, kind: date, hidden: true }
      - { field: odataType, label: Graph type, kind: code, hidden: true }
      - { field: id, label: App id, kind: guid, hidden: true }
    rowActions:
      - label: Open in Intune admin center
        icon: arrow-square-out
        href: "https://intune.microsoft.com/#view/Microsoft_Intune_Apps/SettingsMenu/~/0/appId/${ $encode(row.id) }"
    empty:
      title: No apps match
      body: Clear a facet or the search.

export:
  formats: [csv, xlsx]
  fileName: intune-apps
  data: apps.rows
  columns: all
