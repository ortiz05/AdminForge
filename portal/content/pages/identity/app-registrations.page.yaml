$schema: ../../../packages/schemas/generated/page.schema.json
kind: page
id: identity.app-registrations
version: 2.0.0
title: App registrations
summary: >-
  Applications registered in this tenant, with credential expiry status, sign-in audience, API permission counts and
  owners. Find apps with expired or expiring secrets and apps nobody owns.
owner: identity-team
tags: [identity, apps, credentials]
template: list-detail
nav: { section: identity, label: App registrations, icon: app-window, order: 40 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Application.Read.All]
  entraRoles: [Global Reader]

params:
  q: { type: string, default: "", label: Search, placeholder: App name starts with }
  audience:
    type: enum
    label: Audience
    facet: true
    default: Any
    values:
      - { value: Any, label: Any }
      - { value: AzureADMyOrg, label: This organisation only }
      - { value: AzureADMultipleOrgs, label: Any organisation }
      - { value: AzureADandPersonalMicrosoftAccount, label: Organisations and personal accounts }
      - { value: PersonalMicrosoftAccount, label: Personal accounts only }
  owners: { type: enum, values: [Any, Owned, Ownerless], default: Any, label: Owners, facet: true }
  # Kept for one release so saved views and links from 1.x still open (credential state now filters the loaded rows).
  credentials: { type: string, default: "", label: Credentials (no longer used), hidden: true }

filters:
  search: q
  facets: [audience, owners]
  # Compiled server-side into `${ advanced }` (OData). The full list expands owners, which advanced queries can't, so
  # only operators /applications supports without ConsistencyLevel: eventual are offered.
  advanced:
    dialect: odata
    param: adv
    fields:
      - { field: displayName, label: Name, type: string, operators: [eq, startsWith, in] }
      - { field: appId, label: Application (client) id, type: guid, operators: [eq, in] }
      - { field: publisherDomain, label: Publisher domain, type: string, operators: [eq, startsWith] }
      - { field: serviceManagementReference, label: Service management reference, type: string, operators: [eq, startsWith] }
      - { field: createdDateTime, label: Created, type: date, operators: [ge, le] }

savedViews:
  enabled: true
  shared: true
  presets:
    - { name: Ownerless apps, params: { owners: Ownerless } }
    - { name: Multi-tenant apps, params: { audience: AzureADMultipleOrgs } }

# Built for large tenants (20k app registrations): the list pages through Graph, which filters it (audience, name,
# owners); credential state is worked out for the rows of one page. The owner views are advanced queries ($count of
# owners), which can't expand the owners — those rows have no owner names. Totals come from $count; the credential
# figures read a capped list with native filters (past the cap the strip says they're partial — the credential expiry
# report has every credential).
datasources:
  apps:
    source: graph
    request:
      path: /applications
      # Only the owner views are advanced queries (owners/$count); the full list expands owners without one.
      headers: { ConsistencyLevel: "${ params.owners in ['Owned', 'Ownerless'] ? 'eventual' : '' }" }
      query:
        $select: id,appId,displayName,createdDateTime,signInAudience,publisherDomain,passwordCredentials,keyCredentials,requiredResourceAccess,web,spa,publicClient,notes,serviceManagementReference,verifiedPublisher
        $expand: "${ params.owners in ['Owned', 'Ownerless'] ? undefined : 'owners($select=id,displayName,userPrincipalName)' }"
        $count: "${ params.owners in ['Owned', 'Ownerless'] ? 'true' : undefined }"
        $top: 100
        $filter: >-
          ${ $join([
               params.audience != 'Any' ? 'signInAudience eq ' & $odata(params.audience),
               params.q ? 'startswith(displayName, ' & $odata(params.q) & ')',
               params.owners = 'Owned' ? 'owners/$count ne 0',
               params.owners = 'Ownerless' ? 'owners/$count eq 0',
               advanced
             ][$], ' and ') }
    paging: cursor
    cache: { ttl: 300 }
    # Credential state, permission counts and owners for the rows of this page; keeps @odata.nextLink / @odata.count.
    transform: >-
      ${ (
        $view := $$.params.owners in ['Owned', 'Ownerless'] ? $$.params.owners;
        $merge([value, { "value": [value.value.(
          $creds := $append(passwordCredentials.{ "type": "Secret", "end": endDateTime }, keyCredentials.{ "type": "Certificate", "end": endDateTime });
          $days := [$creds[end].$daysUntil(end)];
          $next := $count($days[$ >= 0]) > 0 ? $min($days[$ >= 0]) : null;
          {
            "id": id,
            "appId": appId,
            "displayName": displayName,
            "audience": signInAudience,
            "publisherDomain": publisherDomain,
            "created": createdDateTime,
            "secrets": $count(passwordCredentials),
            "certificates": $count(keyCredentials),
            "nextExpiryDays": $next,
            "credentialState": $count($creds) = 0 ? 'none'
                               : $count($days[$ < 0]) > 0 ? 'expired'
                               : $next != null and $next <= 30 ? 'expiring' : 'ok',
            "apiPermissions": $count(requiredResourceAccess.resourceAccess),
            "applicationPermissions": $count(requiredResourceAccess.resourceAccess[type = 'Role']),
            "platforms": [web.redirectUris ? 'Web', spa.redirectUris ? 'SPA', publicClient.redirectUris ? 'Mobile/desktop'],
            "ownerCount": $view = 'Ownerless' ? 0 : $view = 'Owned' ? null : $count(owners),
            "ownerNames": $join(owners.displayName, ', '),
            "verifiedPublisher": verifiedPublisher.displayName,
            "serviceManagementReference": serviceManagementReference,
            "notes": notes
          }
        )] }])
      ) }
  counts:
    source: graphBatch
    requests:
      total: { path: /applications/$count, headers: { ConsistencyLevel: eventual } }
      ownerless:
        path: /applications/$count
        query: { $filter: "owners/$count eq 0" }
        headers: { ConsistencyLevel: eventual }
    cache: { ttl: 600 }
  credentials:
    source: graph
    request:
      path: /applications
      query:
        $select: id,passwordCredentials,keyCredentials
        $top: 999
    paging: all
    maxItems: 10000
    cache: { ttl: 1800 }
    # Apps with a credential past its end date, and apps whose next credential ends within 30 days — native filters.
    transform: >-
      ${ (
        $now := $iso();
        $soon := $daysAgo(-30);
        $before := function($when) { { "join": "or", "clauses": [
          { "path": "passwordCredentials.endDateTime", "type": "date", "op": "lt", "value": $when },
          { "path": "keyCredentials.endDateTime", "type": "date", "op": "lt", "value": $when }
        ] } };
        $expired := $applyAdvanced(value.value, $before($now));
        {
          "expired": $count($expired),
          "expiring": $count($applyAdvanced(value.value, $before($soon))) - $count($expired)
        }
      ) }

layout:
  - widget: kpi
    id: total
    data: counts.total
    label: App registrations
    format: number
  - widget: kpi
    id: expired
    data: credentials.expired
    label: With expired credentials
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
    href: /p/identity.app-credential-expiry
  - widget: kpi
    id: expiring
    data: credentials.expiring
    label: Expiring within 30 days
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
    href: /p/identity.app-credential-expiry
  - widget: kpi
    id: ownerless
    data: counts.ownerless
    label: Without owners
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
    href: /p/identity.app-registrations?owners=Ownerless
  - widget: table
    id: apps
    span: 12
    data: apps.value
    rowKey: id
    selection: multi
    columns:
      - { field: displayName, label: Application, kind: identity, secondary: appId, sortable: true }
      - field: credentialState
        label: Credentials
        kind: status
        map: { expired: [crit, Expired], expiring: [warn, Expiring soon], ok: [ok, Valid], none: [neutral, None] }
        filter: facet
      - { field: nextExpiryDays, label: Next expiry (days), kind: number, filter: range, sortable: true }
      - { field: secrets, label: Secrets, kind: number }
      - { field: certificates, label: Certificates, kind: number }
      - field: audience
        label: Audience
        kind: status
        map: { AzureADMyOrg: [neutral, Single tenant], AzureADMultipleOrgs: [info, Multi-tenant], AzureADandPersonalMicrosoftAccount: [warn, Multi-tenant + personal], PersonalMicrosoftAccount: [warn, Personal only] }
        filter: { type: facet, param: audience }
      - { field: ownerCount, label: Owners, kind: number, filter: range }
      - { field: ownerNames, label: Owner names, hidden: true }
      - { field: apiPermissions, label: API permissions, kind: number }
      - { field: applicationPermissions, label: Application permissions, kind: number, hidden: true }
      - { field: platforms, label: Platforms, kind: tags, hidden: true }
      - { field: verifiedPublisher, label: Verified publisher, hidden: true }
      - { field: serviceManagementReference, label: Service reference, hidden: true }
      - { field: created, label: Created, kind: date, filter: date }
      - { field: id, label: Object id, kind: guid, hidden: true }
    inspect:
      page: identity.app-registration
      params:
        id: ${ row.id }
        appId: ${ row.appId }
    rowActions:
      - playbook: identity.rotate-app-secret
        label: Rotate secret
        icon: key
        inputs:
          appObjectId: ${ row.id }
        when: ${ row.secrets > 0 }
      - playbook: identity.remove-expired-app-credentials
        label: Remove expired secrets
        icon: broom
        inputs:
          appObjectId: ${ row.id }
        when: ${ row.credentialState = 'expired' }
      - playbook: identity.add-app-owner
        label: Add owner
        icon: user-plus
        inputs:
          appObjectId: ${ row.id }
      - label: Open in Entra admin center
        icon: arrow-square-out
        href: "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationMenuBlade/~/Overview/appId/${ $encode(row.appId) }"
    bulkActions:
      - playbook: identity.remove-expired-app-credentials
        label: Remove expired secrets
        icon: broom
        forEach:
          inputs:
            appObjectId: ${ row.id }
          concurrency: 3
        maxItems: 100
        when: ${ $count(rows[credentialState = 'expired']) = $count(rows) }
    empty:
      title: No app registrations match
      body: Clear the filters or the search.

export:
  formats: [csv, xlsx]
  fileName: app-registrations
  data: apps.value
  columns: visible
