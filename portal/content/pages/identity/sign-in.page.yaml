$schema: ../../../packages/schemas/generated/page.schema.json
kind: page
id: identity.sign-in
version: 1.1.0
title: Sign-in
summary: One sign-in event — result and failure reason, location, device, and the Conditional Access policies that applied.
owner: identity-team
tags: [identity, sign-ins, investigation]
template: entity
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [AuditLog.Read.All, Directory.Read.All]
  entraRoles: [Reports Reader]
  licences: [signInLogs]

params:
  id: { type: guid, label: Sign-in id, required: true, hidden: true }
  # When the sign-in happened (the lists pass it): bounds the lookup, which is what keeps it fast.
  at: { type: date, time: true, label: Signed in at, hidden: true }

datasources:
  signIn:
    source: graph
    request:
      # Not GET /auditLogs/signIns/{id}: Graph can take minutes to answer it and then time out. A filter on the id,
      # bounded to five minutes around the sign-in's time (`at`, which every list passes), answers in about a second —
      # also when the sign-in isn't there. Without `at` (an old link) the search covers the last 7 days: an id that
      # isn't in the log took ~10 s over 7 days and timed out (165 s) over 30 (measured 2026-10-16).
      path: /auditLogs/signIns
      query:
        $filter: >-
          ${ $join([
               "id eq " & $odata($guid(params.id)),
               "createdDateTime ge " & (params.at ? $iso($toMillis(params.at) - 300000) : $daysAgo(7)),
               params.at ? "createdDateTime le " & $iso($toMillis(params.at) + 300000)
             ][$], ' and ') }
        $top: 1
    # Short: sign-ins reach the log a few minutes late, so "not found" must not stick for long.
    cache: { ttl: 300 }
    # The row with this id (Graph returns only that one; the check keeps any other answer from showing).
    transform: >-
      ${ (
        $id := $lowercase(params.id);
        $s := value.value[$lowercase(id) = $id][0];
        $s ? $merge([$s, {
          "result": $s.status.errorCode = 0 ? 'success' : 'failure',
          "place": $join([$s.location.city, $s.location.state, $s.location.countryOrRegion][$], ', '),
          "coordinates": $s.location.geoCoordinates.latitude ? $s.location.geoCoordinates.latitude & ', ' & $s.location.geoCoordinates.longitude : null,
          "policies": [$s.appliedConditionalAccessPolicies.{
            "id": id,
            "displayName": displayName,
            "result": result,
            "grant": $join(enforcedGrantControls, ', '),
            "session": $join(enforcedSessionControls, ', ')
          }^(result = 'failure' ? 0 : result = 'success' ? 1 : 2, displayName)]
        }])
      ) }

# `signIn` is empty when the sign-in isn't in the log (older than 30 days, or an edited link).
header:
  title: "${ signIn.id ? signIn.userDisplayName & ' → ' & signIn.appDisplayName : 'Sign-in not found' }"
  subtitle: "${ signIn.id ? signIn.createdDateTime & ' · ' & signIn.ipAddress & (signIn.place ? ' · ' & signIn.place : '') : '' }"
  status: "${ signIn.id ? (signIn.result = 'success' ? 'ok' : 'crit') : 'neutral' }"
  statusLabel: "${ signIn.id ? (signIn.result = 'success' ? 'Success' : 'Failure ' & signIn.status.errorCode) : 'Not found' }"
  ids:
    Request id: "${ signIn.id ? signIn.id : params.id }"
    Correlation id: ${ signIn.correlationId }

actions:
  - label: Open user
    icon: user
    when: ${ $exists(signIn.userId) }
    href: "/p/identity.user?id=${ $encode(signIn.userId) }"
  - playbook: identity.revoke-sessions
    label: Revoke the user's sessions
    icon: sign-out
    when: ${ $exists(signIn.userId) }
    inputs:
      userId: ${ signIn.userId }

tabs:
  - id: details
    label: Details
    layout:
      - widget: markdown
        id: notFound
        span: 12
        when: ${ $not($exists(signIn.id)) }
        text: |
          **This sign-in wasn't found.** Microsoft keeps sign-ins for 30 days, so it may be older than that; a sign-in
          from the last few minutes may not have arrived yet; and a link without the sign-in's time only searches the
          last 7 days. Open it again from [Sign-in logs](/p/identity.sign-ins) to see what the log holds now.
      - widget: keyValue
        id: basics
        title: Sign-in
        span: 6
        data: signIn
        fields:
          - { field: createdDateTime, label: Time, kind: datetime }
          - { field: userPrincipalName, label: User }
          - { field: appDisplayName, label: Application }
          - { field: resourceDisplayName, label: Resource }
          - { field: result, label: Result, kind: status, map: { success: [ok, Success], failure: [crit, Failure] } }
          - { field: status.errorCode, label: Error code, kind: number }
          - { field: status.failureReason, label: Failure reason }
          - { field: status.additionalDetails, label: Additional details }
          - { field: clientAppUsed, label: Client app }
          - { field: isInteractive, label: Interactive, kind: boolean }
          - { field: conditionalAccessStatus, label: Conditional Access, kind: status, map: { success: [ok, Success], failure: [crit, Failure], notApplied: [neutral, Not applied] } }
      - widget: keyValue
        id: context
        title: Location and device
        span: 6
        data: signIn
        fields:
          - { field: ipAddress, label: IP address, kind: code }
          - { field: place, label: Location }
          - { field: coordinates, label: Coordinates }
          - { field: deviceDetail.displayName, label: Device }
          - { field: deviceDetail.operatingSystem, label: Operating system }
          - { field: deviceDetail.browser, label: Browser }
          - { field: deviceDetail.trustType, label: Join type }
          - { field: deviceDetail.isCompliant, label: Compliant, kind: boolean }
          - { field: deviceDetail.isManaged, label: Managed, kind: boolean }
      - widget: keyValue
        id: risk
        title: Risk
        description: Risk detail needs Entra ID P2 (Identity Protection).
        span: 12
        data: signIn
        fields:
          - { field: riskLevelDuringSignIn, label: Sign-in risk, kind: status, map: { none: [ok, None], low: [info, Low], medium: [warn, Medium], high: [crit, High], hidden: [neutral, Hidden] } }
          - { field: riskLevelAggregated, label: Aggregated risk }
          - { field: riskState, label: Risk state }
          - { field: riskDetail, label: Risk detail }
          - { field: riskEventTypes_v2, label: Detections, kind: tags }
  - id: conditionalAccess
    label: Conditional Access
    layout:
      - widget: table
        id: policies
        span: 12
        data: signIn.policies
        rowKey: id
        columns:
          - { field: displayName, label: Policy }
          - field: result
            label: Result
            kind: status
            map: { success: [ok, Satisfied], failure: [crit, Blocked or not satisfied], notApplied: [neutral, Not applied], notEnabled: [neutral, Off], reportOnlySuccess: [info, Report-only satisfied], reportOnlyFailure: [warn, Report-only would fail], reportOnlyNotApplied: [neutral, Report-only not applied], reportOnlyInterrupted: [info, Report-only interrupted] }
            filter: facet
          - { field: grant, label: Grant controls enforced }
          - { field: session, label: Session controls enforced }
        inspect:
          page: identity.ca-policy
          params:
            id: ${ row.id }
        empty:
          title: No policies evaluated
          body: Conditional Access didn't evaluate any policy for this sign-in.
