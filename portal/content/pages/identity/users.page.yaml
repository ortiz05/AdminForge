$schema: ../../../packages/schemas/generated/page.schema.json
kind: page
id: identity.users
version: 1.4.0
title: Users
summary: >-
  Member and guest accounts — filter by type, sign-in status, licensing, source, department and MFA registration,
  then act on one user or many.
owner: identity-team
tags: [identity, users]
template: list-detail
nav: { section: identity, label: Users, icon: users, order: 10 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [User.Read.All, AuditLog.Read.All]
  entraRoles: [Directory Readers]

params:
  q: { type: string, default: "", label: Search, placeholder: Name or sign-in name }
  userType: { type: enum, values: [All, Member, Guest], default: All, label: Type, facet: true }
  enabled: { type: enum, values: [Any, Enabled, Disabled], default: Any, label: Sign-in, facet: true }
  licensed: { type: enum, values: [Any, Licensed, Unlicensed], default: Any, label: Licences, facet: true }
  source:
    type: enum
    label: Source
    facet: true
    default: Any
    values:
      - { value: Any, label: Cloud or synced }
      - { value: Cloud, label: Cloud only }
      - { value: Synced, label: Synced from AD }
  mfa:
    type: enum
    label: MFA
    facet: true
    default: Any
    description: Uses the authentication methods registration report (Entra ID P1), refreshed by Microsoft every few hours.
    values:
      - { value: Any, label: Any }
      - { value: Registered, label: MFA registered }
      - { value: NotRegistered, label: Not MFA registered }
  department: { type: string, label: Department, facet: true }
  invitation:
    type: enum
    label: Invitation
    facet: true
    default: Any
    values:
      - { value: Any, label: Any }
      - { value: Pending, label: Not yet accepted }
  created:
    type: enum
    label: Created
    facet: true
    default: Any
    values:
      - { value: Any, label: Any time }
      - { value: Last30Days, label: In the last 30 days }
  activity:
    type: enum
    label: Last sign-in
    facet: true
    default: Any
    description: >-
      Last successful sign-in (Entra ID P1). Accounts with no recorded sign-in aren't listed here — the Inactive users
      report includes them.
    values:
      - { value: Any, label: Any time }
      - { value: Inactive90, label: Over 90 days ago }
      - { value: Inactive365, label: Over a year ago }

filters:
  search: q
  facets: [userType, enabled, licensed, source, mfa, department, invitation, created, activity]
  advanced:
    dialect: odata
    param: adv
    fields:
      - { field: department, label: Department, type: string, operators: [eq, startsWith] }
      - { field: jobTitle, label: Job title, type: string, operators: [eq, startsWith] }
      - { field: companyName, label: Company, type: string, operators: [eq, startsWith] }
      - { field: officeLocation, label: Office, type: string, operators: [eq, startsWith] }
      - { field: city, label: City, type: string, operators: [eq, startsWith] }
      - { field: country, label: Country or region, type: string, operators: [eq, startsWith] }
      - { field: usageLocation, label: Usage location, type: string, operators: [eq] }
      - { field: employeeType, label: Employee type, type: string, operators: [eq] }
      - { field: createdDateTime, label: Created, type: date, operators: [ge, le] }
      - { field: onPremisesSyncEnabled, label: Synced from AD, type: boolean, operators: [eq] }

savedViews:
  enabled: true
  shared: true
  presets:
    - { name: Guests, params: { userType: Guest } }
    - { name: Disabled accounts, params: { enabled: Disabled } }
    - { name: Unlicensed members, params: { userType: Member, licensed: Unlicensed } }
    - { name: Synced from AD, params: { source: Synced } }
    - { name: Not MFA registered, params: { mfa: NotRegistered, userType: Member } }
    - name: Pending guest invitations
      params: { userType: Guest, invitation: Pending }
      columns: [displayName, userType, externalUserState, createdDateTime]
    - { name: Blocked but licensed, params: { enabled: Disabled, licensed: Licensed } }
    - name: New in the last 30 days
      params: { created: Last30Days }
      columns: [displayName, userType, department, sourceLabel, createdDateTime]
    - { name: Members inactive 90 days, params: { userType: Member, enabled: Enabled, activity: Inactive90 } }
    - { name: No sign-in for a year, params: { activity: Inactive365 } }

datasources:
  users:
    source: graph
    # signInActivity needs Entra ID P1 and AuditLog.Read.All (see the report: $select can't depend on licences yet).
    requires: { licences: [signInLogs] }
    when: ${ $not(params.mfa in ['Registered', 'NotRegistered']) and params.activity = 'Any' }
    request:
      method: GET
      path: /users
      headers: { ConsistencyLevel: eventual }
      query:
        $select: id,displayName,userPrincipalName,mail,accountEnabled,userType,department,jobTitle,companyName,officeLocation,usageLocation,employeeId,createdDateTime,onPremisesSyncEnabled,onPremisesLastSyncDateTime,assignedLicenses,externalUserState,signInActivity
        $count: true
        $top: 100
        # Every user-supplied value goes through $odata() / $odataSearch(); empty clauses drop out. `advanced` is
        # the query builder's filter, validated against filters.advanced.fields and compiled to OData by the server.
        $filter: >-
          ${ $join([
               params.userType != 'All' ? "userType eq " & $odata(params.userType),
               params.enabled = 'Enabled' ? "accountEnabled eq true",
               params.enabled = 'Disabled' ? "accountEnabled eq false",
               params.department ? "department eq " & $odata(params.department),
               params.licensed = 'Licensed' ? "assignedLicenses/$count ne 0",
               params.licensed = 'Unlicensed' ? "assignedLicenses/$count eq 0",
               params.source = 'Synced' ? "onPremisesSyncEnabled eq true",
               params.source = 'Cloud' ? "NOT(onPremisesSyncEnabled eq true)",
               params.invitation = 'Pending' ? "externalUserState eq 'PendingAcceptance'",
               params.created = 'Last30Days' ? "createdDateTime ge " & $daysAgo(30),
               advanced
             ][$], ' and ') }
        $search: >-
          ${ params.q ? '"displayName:' & $odataSearch(params.q) & '" OR "userPrincipalName:' & $odataSearch(params.q) & '"' }
    paging: cursor
    cache: { ttl: 60 }
    # Adds display fields to each row and keeps @odata.nextLink / @odata.count.
    transform: >-
      ${ $merge([value, { "value": [value.value.$merge([$, {
           "licenceState": $count(assignedLicenses) > 0 ? "Licensed" : "Unlicensed",
           "sourceLabel": onPremisesSyncEnabled = true ? "Synced" : "Cloud"
         }])] }]) }
  # The inactivity views. Graph's sign-in filter can't be combined with any other filter, so it runs alone (as in
  # identity.inactive-users) and the page's other facets run natively below; it never matches accounts with no
  # recorded successful sign-in (the Inactive users report adds those).
  inactive:
    source: graph
    requires: { licences: [signInLogs] }
    when: ${ params.activity in ['Inactive90', 'Inactive365'] and $not(params.mfa in ['Registered', 'NotRegistered']) }
    request:
      path: /users
      query:
        $select: id,displayName,userPrincipalName,mail,accountEnabled,userType,department,jobTitle,companyName,officeLocation,usageLocation,employeeId,createdDateTime,onPremisesSyncEnabled,onPremisesLastSyncDateTime,assignedLicenses,externalUserState,signInActivity
        $filter: "${ 'signInActivity/lastSuccessfulSignInDateTime le ' & $daysAgo(params.activity = 'Inactive365' ? 365 : 90) }"
        $top: 120
    paging: all
    maxItems: 50000
    cache: { ttl: 3600 }
  # Every account of an inactivity view, with the page's facets applied natively and the labels the Graph list adds, by
  # partition: no JSONata per account. The export reads this; the table reads the capped view below.
  inactiveMatches:
    source: static
    when: ${ params.activity in ['Inactive90', 'Inactive365'] and $not(params.mfa in ['Registered', 'NotRegistered']) }
    # Reads ds.inactive in the transform: through `data` the rows would be copied once more.
    data: {}
    transform: >-
      ${ (
        $p := params;
        $c := function($path, $type, $op, $v) { { "path": $path, "type": $type, "op": $op, "value": $v } };
        $f := function($rows, $cl) { $applyAdvanced($rows, { "join": "and", "clauses": $cl }) };
        $licensed := $c('assignedLicenses', 'string', 'notEmpty', null);
        $unlicensed := $c('assignedLicenses', 'string', 'isEmpty', null);
        $synced := $c('onPremisesSyncEnabled', 'boolean', 'eq', true);
        $cloud := $c('onPremisesSyncEnabled', 'boolean', 'ne', true);
        $scoped := $f(ds.inactive.value, [
          $p.userType in ['Member', 'Guest'] ? $c('userType', 'string', 'eq', $p.userType),
          $p.enabled = 'Enabled' ? $c('accountEnabled', 'boolean', 'eq', true),
          $p.enabled = 'Disabled' ? $c('accountEnabled', 'boolean', 'eq', false),
          $p.licensed = 'Licensed' ? $licensed,
          $p.licensed = 'Unlicensed' ? $unlicensed,
          $p.source = 'Synced' ? $synced,
          $p.source = 'Cloud' ? $cloud,
          $p.department ? $c('department', 'string', 'containsAny', [$substring($p.department, 0, 256)]),
          $p.invitation = 'Pending' ? $c('externalUserState', 'string', 'eq', 'PendingAcceptance'),
          $p.created = 'Last30Days' ? $c('createdDateTime', 'date', 'ge', $daysAgo(30))
        ]);
        /* Search: part of the name or the sign-in name, case ignored (containsAny takes texts of ≤ 256 characters). */
        $q := $substring($p.q, 0, 256);
        $byName := $p.q ? $f($scoped, [$c('displayName', 'string', 'containsAny', [$q])]) : $scoped;
        $matched := $p.q
          ? $append($byName, $f($scoped, [
              $c('userPrincipalName', 'string', 'containsAny', [$q]),
              $c('id', 'guid', 'notIn', $append([], $byName.id))
            ]))
          : $scoped;
        $byLicence := $append(
          $withFields($f($matched, [$licensed]), { "licenceState": "Licensed" }),
          $withFields($f($matched, [$unlicensed]), { "licenceState": "Unlicensed" }));
        {
          "rows": $append(
            $withFields($f($byLicence, [$synced]), { "sourceLabel": "Synced" }),
            $withFields($f($byLicence, [$cloud]), { "sourceLabel": "Cloud" })),
          "partial": ds.inactive.truncated = true
        }
      ) }
  # What the browser gets in an inactivity view: the first 10,000 accounts (the export has every one).
  userList:
    source: static
    when: ${ params.activity in ['Inactive90', 'Inactive365'] and $not(params.mfa in ['Registered', 'NotRegistered']) }
    data: {}
    transform: >-
      ${ (
        $m := ds.inactiveMatches;
        { "rows": $take($m.rows, 10000), "matched": $count($m.rows), "listCapped": $count($m.rows) > 10000, "partial": $m.partial }
      ) }
  registrations:
    source: graph
    requires: { licences: [signInLogs], scopes: { graph: [AuditLog.Read.All] } }
    when: ${ params.mfa in ['Registered', 'NotRegistered'] }
    request:
      method: GET
      path: /reports/authenticationMethods/userRegistrationDetails
      query:
        $filter: >-
          ${ $join([
               params.mfa = 'Registered' ? "isMfaRegistered eq true",
               params.mfa = 'NotRegistered' ? "isMfaRegistered eq false",
               params.userType = 'Member' ? "userType eq 'member'",
               params.userType = 'Guest' ? "userType eq 'guest'",
               params.q ? "startswith(userPrincipalName, " & $odata(params.q) & ")"
             ][$], ' and ') }
    paging: cursor
    cache: { ttl: 300 }
  counts:
    source: graphBatch
    requests:
      members: { path: /users/$count, query: { $filter: "userType eq 'Member'" }, headers: { ConsistencyLevel: eventual } }
      guests: { path: /users/$count, query: { $filter: "userType eq 'Guest'" }, headers: { ConsistencyLevel: eventual } }
      disabled: { path: /users/$count, query: { $filter: "accountEnabled eq false" }, headers: { ConsistencyLevel: eventual } }
      unlicensed:
        path: /users/$count
        query: { $filter: "userType eq 'Member' and assignedLicenses/$count eq 0" }
        headers: { ConsistencyLevel: eventual }
    cache: { ttl: 300 }

layout:
  - widget: kpi
    id: members
    data: counts.members
    label: Members
    format: number
    href: /p/identity.users?userType=Member
  - widget: kpi
    id: guests
    data: counts.guests
    label: Guests
    format: number
    href: /p/identity.users?userType=Guest
  - widget: kpi
    id: disabled
    data: counts.disabled
    label: Sign-in blocked
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
    href: /p/identity.users?enabled=Disabled
  - widget: kpi
    id: unlicensed
    data: counts.unlicensed
    label: Unlicensed members
    format: number
    href: /p/identity.users?userType=Member&licensed=Unlicensed

  - widget: table
    id: users
    span: 12
    data: users.value
    when: ${ $not(params.mfa in ['Registered', 'NotRegistered']) and params.activity = 'Any' }
    rowKey: id
    selection: multi
    columns:
      - { field: displayName, label: Name, kind: identity, secondary: userPrincipalName, sortable: true }
      - field: accountEnabled
        label: Sign-in
        kind: status
        map: { "true": [ok, Allowed], "false": [crit, Blocked] }
        filter: { type: facet, param: enabled }
      - field: userType
        label: Type
        kind: enum
        map: { Member: Member, Guest: Guest }
        filter: { type: facet, param: userType }
      - { field: department, label: Department, filter: { type: text, param: department } }
      - { field: jobTitle, label: Job title, hidden: true }
      - field: licenceState
        label: Licences
        kind: status
        map: { Licensed: [ok, Licensed], Unlicensed: [neutral, Unlicensed] }
        filter: { type: facet, param: licensed }
      - field: sourceLabel
        label: Source
        kind: enum
        map: { Cloud: Cloud, Synced: Synced from AD }
        filter: { type: facet, param: source }
      - { field: signInActivity.lastSignInDateTime, label: Last interactive sign-in, kind: relativeTime, filter: date }
      - { field: signInActivity.lastNonInteractiveSignInDateTime, label: Last non-interactive sign-in, kind: relativeTime, hidden: true }
      - { field: createdDateTime, label: Created, kind: date, hidden: true, filter: date }
      - { field: mail, label: Email, hidden: true }
      - { field: companyName, label: Company, hidden: true }
      - { field: officeLocation, label: Office, hidden: true }
      - { field: usageLocation, label: Usage location, hidden: true }
      - { field: employeeId, label: Employee id, hidden: true }
      - { field: externalUserState, label: Invitation state, hidden: true }
      - { field: onPremisesLastSyncDateTime, label: Last directory sync, kind: relativeTime, hidden: true }
      - { field: id, label: Object id, kind: guid, hidden: true }
    inspect:
      page: identity.user
      params:
        id: ${ row.id }
    rowActions:
      - playbook: identity.disable-user
        label: Block sign-in
        icon: prohibit
        inputs:
          userId: ${ row.id }
        when: ${ row.accountEnabled = true }
      - playbook: identity.enable-user
        label: Allow sign-in
        icon: check-circle
        inputs:
          userId: ${ row.id }
        when: ${ row.accountEnabled = false and $not(row.onPremisesSyncEnabled = true) }
      - playbook: identity.revoke-sessions
        label: Revoke sessions
        icon: sign-out
        inputs:
          userId: ${ row.id }
      - playbook: identity.reset-password
        label: Reset password
        icon: password
        inputs:
          userId: ${ row.id }
        when: ${ row.userType = 'Member' }
      - playbook: identity.issue-tap
        label: Issue Temporary Access Pass
        icon: ticket
        inputs:
          userId: ${ row.id }
        when: ${ row.accountEnabled = true }
      - playbook: identity.reset-mfa
        label: Reset MFA methods
        icon: shield-slash
        inputs:
          userId: ${ row.id }
      - playbook: identity.offboard-user
        label: Offboard
        icon: user-minus
        inputs:
          userId: ${ row.id }
        when: ${ row.userType = 'Member' }
      - label: Open in Entra admin center
        icon: arrow-square-out
        href: "https://entra.microsoft.com/#view/Microsoft_AAD_UsersAndTenants/UserProfileMenuBlade/~/overview/userId/${ $encode(row.id) }"
    bulkActions:
      - playbook: identity.disable-user
        label: Block sign-in
        icon: prohibit
        forEach:
          inputs:
            userId: ${ row.id }
          concurrency: 5
        maxItems: 100
        when: ${ $count(rows[accountEnabled = true]) > 0 }
      - playbook: identity.enable-user
        label: Allow sign-in
        icon: check-circle
        forEach:
          inputs:
            userId: ${ row.id }
          concurrency: 5
        maxItems: 100
        when: ${ $count(rows[accountEnabled = false]) > 0 }
      - playbook: identity.revoke-sessions
        label: Revoke sessions
        icon: sign-out
        forEach:
          inputs:
            userId: ${ row.id }
          concurrency: 5
        maxItems: 200
      - playbook: identity.add-group-members
        label: Add to group
        icon: users-three
        forEach:
          inputs:
            userIds: ${ [row.id] }
          concurrency: 5
        maxItems: 500
      - playbook: identity.assign-licence
        label: Assign licence
        icon: identification-badge
        forEach:
          inputs:
            userId: ${ row.id }
          concurrency: 5
        maxItems: 200
    empty:
      title: No users match these filters
      body: Clear a facet or the search. Search matches the start of words in the name or sign-in name.

  - widget: markdown
    id: activityNote
    span: 12
    when: ${ params.activity in ['Inactive90', 'Inactive365'] and $not(params.mfa in ['Registered', 'NotRegistered']) }
    text: >-
      **Last successful sign-in ${ params.activity = 'Inactive365' ? 'over a year' : 'over 90 days' } ago.** Accounts
      with no recorded sign-in aren't listed: [Inactive users](/p/identity.inactive-users) includes them. Search matches
      part of the name or sign-in name, and the advanced filter doesn't apply here.${ userList.listCapped = true ? ' The first 10,000 of ' & $formatNumber(userList.matched, '#,##0') & ' accounts are listed; the export has every one.' : '' }${ userList.partial = true ? ' **Partial:** the read stopped at 50,000 accounts — narrow it with a facet.' : '' }
  - widget: table
    id: userList
    span: 12
    data: userList.rows
    when: ${ params.activity in ['Inactive90', 'Inactive365'] and $not(params.mfa in ['Registered', 'NotRegistered']) }
    rowKey: id
    selection: multi
    columns:
      - { field: displayName, label: Name, kind: identity, secondary: userPrincipalName, sortable: true }
      - field: accountEnabled
        label: Sign-in
        kind: status
        map: { "true": [ok, Allowed], "false": [crit, Blocked] }
        filter: { type: facet, param: enabled }
      - field: userType
        label: Type
        kind: enum
        map: { Member: Member, Guest: Guest }
        filter: { type: facet, param: userType }
      - { field: department, label: Department, filter: { type: text, param: department } }
      - { field: jobTitle, label: Job title, hidden: true }
      - field: licenceState
        label: Licences
        kind: status
        map: { Licensed: [ok, Licensed], Unlicensed: [neutral, Unlicensed] }
        filter: { type: facet, param: licensed }
      - field: sourceLabel
        label: Source
        kind: enum
        map: { Cloud: Cloud, Synced: Synced from AD }
        filter: { type: facet, param: source }
      - { field: signInActivity.lastSuccessfulSignInDateTime, label: Last successful sign-in, kind: relativeTime }
      - { field: signInActivity.lastSignInDateTime, label: Last interactive sign-in, kind: relativeTime, hidden: true }
      - { field: signInActivity.lastNonInteractiveSignInDateTime, label: Last non-interactive sign-in, kind: relativeTime, hidden: true }
      - { field: createdDateTime, label: Created, kind: date, hidden: true, filter: date }
      - { field: mail, label: Email, hidden: true }
      - { field: companyName, label: Company, hidden: true }
      - { field: officeLocation, label: Office, hidden: true }
      - { field: usageLocation, label: Usage location, hidden: true }
      - { field: employeeId, label: Employee id, hidden: true }
      - { field: externalUserState, label: Invitation state, hidden: true }
      - { field: onPremisesLastSyncDateTime, label: Last directory sync, kind: relativeTime, hidden: true }
      - { field: id, label: Object id, kind: guid, hidden: true }
    inspect:
      page: identity.user
      params:
        id: ${ row.id }
    rowActions:
      - playbook: identity.disable-user
        label: Block sign-in
        icon: prohibit
        inputs:
          userId: ${ row.id }
        when: ${ row.accountEnabled = true }
      - playbook: identity.enable-user
        label: Allow sign-in
        icon: check-circle
        inputs:
          userId: ${ row.id }
        when: ${ row.accountEnabled = false and $not(row.onPremisesSyncEnabled = true) }
      - playbook: identity.revoke-sessions
        label: Revoke sessions
        icon: sign-out
        inputs:
          userId: ${ row.id }
      - playbook: identity.reset-password
        label: Reset password
        icon: password
        inputs:
          userId: ${ row.id }
        when: ${ row.userType = 'Member' }
      - playbook: identity.issue-tap
        label: Issue Temporary Access Pass
        icon: ticket
        inputs:
          userId: ${ row.id }
        when: ${ row.accountEnabled = true }
      - playbook: identity.reset-mfa
        label: Reset MFA methods
        icon: shield-slash
        inputs:
          userId: ${ row.id }
      - playbook: identity.offboard-user
        label: Offboard
        icon: user-minus
        inputs:
          userId: ${ row.id }
        when: ${ row.userType = 'Member' }
      - label: Open in Entra admin center
        icon: arrow-square-out
        href: "https://entra.microsoft.com/#view/Microsoft_AAD_UsersAndTenants/UserProfileMenuBlade/~/overview/userId/${ $encode(row.id) }"
    bulkActions:
      - playbook: identity.disable-user
        label: Block sign-in
        icon: prohibit
        forEach:
          inputs:
            userId: ${ row.id }
          concurrency: 5
        maxItems: 100
        when: ${ $count(rows[accountEnabled = true]) > 0 }
      - playbook: identity.enable-user
        label: Allow sign-in
        icon: check-circle
        forEach:
          inputs:
            userId: ${ row.id }
          concurrency: 5
        maxItems: 100
        when: ${ $count(rows[accountEnabled = false]) > 0 }
      - playbook: identity.revoke-sessions
        label: Revoke sessions
        icon: sign-out
        forEach:
          inputs:
            userId: ${ row.id }
          concurrency: 5
        maxItems: 200
      - playbook: identity.add-group-members
        label: Add to group
        icon: users-three
        forEach:
          inputs:
            userIds: ${ [row.id] }
          concurrency: 5
        maxItems: 500
      - playbook: identity.assign-licence
        label: Assign licence
        icon: identification-badge
        forEach:
          inputs:
            userId: ${ row.id }
          concurrency: 5
        maxItems: 200
    empty:
      title: Nobody matches
      body: Everyone in scope signed in more recently. Clear a facet or the search.

  - widget: markdown
    id: mfaNote
    span: 12
    when: ${ params.mfa in ['Registered', 'NotRegistered'] }
    text: |
      Showing the **authentication methods registration report** (refreshed by Microsoft every few hours). The
      department, licence and source filters don't apply in this view; type and search do. Open the
      [MFA registration](/p/identity.auth-registration) page for the full report.
  - widget: table
    id: registrations
    span: 12
    data: registrations.value
    when: ${ params.mfa in ['Registered', 'NotRegistered'] }
    rowKey: id
    selection: multi
    columns:
      - { field: userDisplayName, label: Name, kind: identity, secondary: userPrincipalName }
      - field: isMfaRegistered
        label: MFA registered
        kind: status
        map: { "true": [ok, Registered], "false": [crit, Not registered] }
      - { field: methodsRegistered, label: Methods, kind: tags }
      - { field: defaultMfaMethod, label: Default method }
      - { field: isAdmin, label: Admin, kind: boolean }
      - { field: userType, label: Type }
      - { field: isPasswordlessCapable, label: Passwordless capable, kind: boolean, hidden: true }
      - { field: isSsprRegistered, label: SSPR registered, kind: boolean, hidden: true }
      - { field: lastUpdatedDateTime, label: Report updated, kind: relativeTime, hidden: true }
      - { field: id, label: Object id, kind: guid, hidden: true }
    inspect:
      page: identity.user
      params:
        id: ${ row.id }
    rowActions:
      - playbook: identity.issue-tap
        label: Issue Temporary Access Pass
        icon: ticket
        inputs:
          userId: ${ row.id }
      - playbook: identity.reset-mfa
        label: Reset MFA methods
        icon: shield-slash
        inputs:
          userId: ${ row.id }
        when: ${ row.isMfaRegistered = true }
    bulkActions:
      - playbook: identity.add-group-members
        label: Add to group
        icon: users-three
        forEach:
          inputs:
            userIds: ${ [row.id] }
          concurrency: 5
        maxItems: 500
    empty:
      title: Nobody matches
      body: Every user in scope matches the other MFA state, or the registration report hasn't been generated yet.

export:
  formats: [csv, xlsx]
  fileName: users
  # The MFA view exports its registrations; the inactivity views every match (their table lists the first 10,000).
  data: >-
    ${ params.mfa in ['Registered', 'NotRegistered'] ? 'registrations.value'
       : params.activity in ['Inactive90', 'Inactive365'] ? 'inactiveMatches.rows' : 'users.value' }
  columns: visible
