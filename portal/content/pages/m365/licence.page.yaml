$schema: ../../../packages/schemas/generated/page.schema.json
kind: page
id: m365.licence
version: 2.1.1
title: Licence
summary: One subscription — who holds a seat, whether it was assigned directly or through a group, assignment errors, and the service plans it includes.
owner: m365-team
tags: [m365, licensing]
template: entity
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Organization.Read.All, User.Read.All, Group.Read.All, AuditLog.Read.All]
  entraRoles: [License Administrator, Global Reader]

params:
  skuId: { type: guid, label: SKU, required: true, hidden: true }
  q: { type: string, default: "", label: Search, placeholder: Name or sign-in name }
  # Kept for one release so saved views and links from 1.x still open (assignment now filters the loaded rows).
  assignment: { type: string, default: "", label: Assigned (no longer used), hidden: true }
  enabled:
    type: enum
    label: Sign-in
    facet: true
    default: Any
    values: [Any, Enabled, Disabled]

filters:
  search: q
  facets: [enabled]

savedViews:
  enabled: true
  shared: true
  presets:
    - { name: Disabled accounts holding a seat, params: { enabled: Disabled } }

datasources:
  sku:
    source: graph
    request:
      path: /subscribedSkus
      query:
        $select: skuId,skuPartNumber,capabilityStatus,appliesTo,consumedUnits,prepaidUnits,servicePlans
    cache: { ttl: 300 }
    # The one subscribedSku with this skuId, plus seat maths and its service plans.
    transform: >-
      ${ (
        $p := params;
        $s := value.value[skuId = $lowercase($p.skuId)][0];
        $enabled := $s.prepaidUnits.enabled ? $s.prepaidUnits.enabled : 0;
        $s ? {
          "skuId": $s.skuId,
          "skuPartNumber": $s.skuPartNumber,
          "capabilityStatus": $s.capabilityStatus,
          "appliesTo": $s.appliesTo,
          "enabled": $enabled,
          "consumed": $s.consumedUnits,
          "available": $max([0, $enabled - $s.consumedUnits]),
          "warning": $s.prepaidUnits.warning,
          "suspended": $s.prepaidUnits.suspended,
          "utilization": $enabled > 0 ? $round($s.consumedUnits / $enabled, 4) : 0,
          "servicePlans": [$s.servicePlans.{ "servicePlanId": servicePlanId, "servicePlanName": servicePlanName, "provisioningStatus": provisioningStatus, "appliesTo": appliesTo }]
        }
      ) }
  # Built for large tenants (an E3 or E5 SKU held by 100k people): the list pages through Graph, which filters and
  # searches it; the transform only labels the rows of one page; the counts come from $count.
  users:
    source: graph
    # signInActivity (Last sign-in) needs Microsoft Entra ID P1 and AuditLog.Read.All: without P1 Graph refuses the
    # whole list, so it says which licence it needs ($select can't depend on licences yet: docs/backlog.md, as on
    # identity.users).
    requires: { licences: [signInLogs] }
    request:
      path: /users
      headers: { ConsistencyLevel: eventual }
      query:
        $filter: >-
          ${ $join([
               'assignedLicenses/any(x:x/skuId eq ' & $guid(params.skuId) & ')',
               params.enabled = 'Enabled' ? 'accountEnabled eq true',
               params.enabled = 'Disabled' ? 'accountEnabled eq false'
             ][$], ' and ') }
        $search: >-
          ${ params.q ? '"displayName:' & $odataSearch(params.q) & '" OR "userPrincipalName:' & $odataSearch(params.q) & '"' }
        $select: id,displayName,userPrincipalName,accountEnabled,userType,department,usageLocation,licenseAssignmentStates,signInActivity
        $count: true
        $top: 100
    paging: cursor
    cache: { ttl: 300 }
    # How each seat was assigned (direct / group / both) and its assignment error, for the rows of this page; keeps
    # @odata.nextLink / @odata.count.
    transform: >-
      ${ (
        $sku := $lowercase(params.skuId);
        $merge([value, { "value": [value.value.(
          $states := licenseAssignmentStates[$lowercase(skuId) = $sku];
          $direct := $exists($states[$not($exists(assignedByGroup)) or assignedByGroup = null]);
          $group := $exists($states[$exists(assignedByGroup) and assignedByGroup != null]);
          $err := $states[error != 'None' and $exists(error)][0].error;
          $merge([$, {
            "assignment": $direct and $group ? 'Both' : $group ? 'Group' : 'Direct',
            "error": $err ? $err : null,
            "state": $err ? 'Error' : $states[0].state
          }])
        )] }])
      ) }
  counts:
    source: graphBatch
    requests:
      holders:
        path: /users/$count
        query: { $filter: "${ 'assignedLicenses/any(x:x/skuId eq ' & $guid(params.skuId) & ')' }" }
        headers: { ConsistencyLevel: eventual }
      disabled:
        path: /users/$count
        query: { $filter: "${ 'assignedLicenses/any(x:x/skuId eq ' & $guid(params.skuId) & ') and accountEnabled eq false' }" }
        headers: { ConsistencyLevel: eventual }
      groups:
        path: /groups/$count
        query: { $filter: "${ 'assignedLicenses/any(x:x/skuId eq ' & $guid(params.skuId) & ')' }" }
        headers: { ConsistencyLevel: eventual }
    cache: { ttl: 300 }

header:
  title: ${ sku.skuPartNumber }
  subtitle: "${ sku.consumed & ' of ' & sku.enabled & ' seats assigned' }"
  status: "${ sku.capabilityStatus != 'Enabled' ? 'crit' : sku.utilization >= 0.9 ? 'warn' : 'ok' }"
  statusLabel: "${ sku.capabilityStatus != 'Enabled' ? sku.capabilityStatus : sku.utilization >= 0.9 ? 'Nearly full' : 'Seats available' }"
  ids:
    SKU id: ${ sku.skuId }

actions:
  - playbook: identity.assign-licence
    label: Assign this licence
    icon: user-plus
    inputs:
      sku: ${ params.skuId }
  - label: Open in Microsoft 365 admin center
    icon: arrow-square-out
    href: "https://admin.microsoft.com/Adminportal/Home#/licensedetailpage?skuId=${ $encode(params.skuId) }"

layout:
  - widget: kpi
    id: assigned
    data: counts.holders
    label: Users with a seat
    format: number
  - widget: kpi
    id: groups
    data: counts.groups
    label: Groups assigning it
    format: number
  - widget: kpi
    id: disabled
    data: counts.disabled
    label: Disabled accounts holding a seat
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
    href: ${ '/p/m365.licence?skuId=' & $encode(params.skuId) & '&enabled=Disabled' }
  - widget: markdown
    span: 12
    text: >-
      Seats held by accounts that stopped signing in: [Inactive licensed users](/p/m365.inactive-licensed-users) ·
      assignment errors for every licence: [Licence assignment errors](/p/identity.licence-assignment-errors).

tabs:
  - id: users
    label: Users
    layout:
      - widget: table
        id: users
        span: 12
        data: users.value
        rowKey: id
        columns:
          - { field: displayName, label: Name, kind: identity, secondary: userPrincipalName }
          - field: accountEnabled
            label: Sign-in
            kind: status
            map: { "true": [ok, Enabled], "false": [crit, Disabled] }
            filter: { type: facet, param: enabled }
          - field: assignment
            label: Assigned
            kind: enum
            map: { Direct: Directly, Group: Through a group, Both: Directly and by group }
            filter: facet
          - field: state
            label: Assignment state
            kind: status
            map: { Active: [ok, Active], ActiveWithError: [warn, Active with error], Disabled: [neutral, Disabled], Error: [crit, Error] }
            filter: facet
          - { field: error, label: Error, filter: facet }
          - { field: department, label: Department, filter: text }
          - { field: signInActivity.lastSuccessfulSignInDateTime, label: Last sign-in, kind: relativeTime, filter: date }
          - { field: usageLocation, label: Usage location, filter: facet, hidden: true }
          - { field: userType, label: Type, filter: facet, hidden: true }
          - { field: id, label: Object id, kind: guid, hidden: true }
        inspect:
          page: identity.user
          params:
            id: ${ row.id }
        selection: multi
        rowActions:
          - playbook: identity.remove-licence
            label: Remove licence
            icon: user-minus
            inputs:
              userId: ${ row.id }
              sku: ${ params.skuId }
            when: ${ row.assignment in ['Direct', 'Both'] }
          - label: Open licences in Entra admin center
            icon: arrow-square-out
            href: "https://entra.microsoft.com/#view/Microsoft_AAD_UsersAndTenants/UserProfileMenuBlade/~/Licenses/userId/${ $encode(row.id) }"
        bulkActions:
          - playbook: identity.remove-licence
            label: Remove licence (direct assignments)
            icon: user-minus
            forEach:
              inputs:
                userId: ${ row.id }
                sku: ${ params.skuId }
              concurrency: 5
            maxItems: 200
            when: "${ $count(rows[assignment = 'Group']) = 0 }"
        empty:
          title: Nobody matches
          body: No user holds this licence with the current filters. Clear the filters to see every assignment.
  - id: plans
    label: Service plans
    layout:
      - widget: table
        span: 12
        data: sku.servicePlans
        rowKey: servicePlanId
        columns:
          - { field: servicePlanName, label: Service plan }
          - field: provisioningStatus
            label: Provisioning
            kind: status
            map:
              Success: [ok, Provisioned]
              PendingActivation: [warn, Pending activation]
              PendingInput: [warn, Pending input]
              PendingProvisioning: [info, Provisioning]
              Disabled: [neutral, Disabled]
            filter: facet
          - { field: appliesTo, label: Applies to, filter: facet }
          - { field: servicePlanId, label: Service plan id, kind: guid, hidden: true }
        empty:
          title: No service plans
          body: Microsoft didn't return service plans for this subscription.

export:
  formats: [csv, xlsx]
  fileName: licence-${ sku.skuPartNumber }-users
  data: users.rows
  columns: all
