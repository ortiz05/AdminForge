$schema: ../../../packages/schemas/generated/page.schema.json
kind: page
id: m365.sharepoint-sharing
version: 1.1.0
title: SharePoint sharing
summary: Tenant-wide SharePoint and OneDrive sharing settings and each site's sharing level — find sites that allow Anyone links.
owner: m365-team
tags: [m365, sharepoint, sharing, security]
template: list-detail
nav: { section: m365, label: SharePoint sharing, icon: share-network, order: 85 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    sharepointAdmin: [AllSites.FullControl]
  entraRoles: [SharePoint Administrator]
  licences: [sharepoint]

params:
  q: { type: string, default: "", label: Search, placeholder: "Site title or URL" }
  sharing:
    type: enum
    label: Sharing level
    facet: true
    default: All
    values:
      - { value: All, label: Any sharing level }
      - { value: ExternalUserAndGuestSharing, label: Anyone }
      - { value: ExternalUserSharingOnly, label: New and existing guests }
      - { value: ExistingExternalUserSharingOnly, label: Existing guests only }
      - { value: Disabled, label: Only people in the organization }
  template:
    type: enum
    label: Template
    facet: true
    default: All
    values:
      - { value: All, label: All templates }
      - { value: GROUP#0, label: Team site (Microsoft 365 group) }
      - { value: STS#3, label: Team site (no group) }
      - { value: SITEPAGEPUBLISHING#0, label: Communication site }
      - { value: TEAMCHANNEL#1, label: Channel site }
  includeOneDrive: { type: boolean, label: Include OneDrive sites, default: false, facet: true }

filters:
  search: q
  facets: [sharing, template, includeOneDrive]

savedViews:
  enabled: true
  shared: true
  presets:
    - { name: Sites allowing Anyone links, params: { sharing: ExternalUserAndGuestSharing } }
    - { name: Guest sharing enabled, params: { sharing: ExternalUserSharingOnly } }

datasources:
  sharing:
    source: runner
    label: Sharing settings (PowerShell)
    script: sharepoint/Get-SiteSharing.ps1
    sha256: 5875541d03d15d067d7f19c4e326b2d83b87ad2551893918cf77d4213d58e1c3
    services: [sharepointAdmin]
    timeoutSeconds: 900
    parameters:
      includeOneDrive: ${ params.includeOneDrive = true }
      template: "${ params.template != 'All' ? params.template }"
      includeSites: true
    cache: { ttl: 900 }
    # value = [script output] — one object { tenant, summary, sites }. Labels the sharing levels and link settings, gives
    # untitled sites (OneDrive host, search centre) their URL as title, converts MB to bytes.
    transform: >-
      ${ (
        $v := value[0];  /* runner result = [output data]; one summary object */
        $p := params;
        $labels := {
          "ExternalUserAndGuestSharing": "Anyone",
          "ExternalUserSharingOnly": "New and existing guests",
          "ExistingExternalUserSharingOnly": "Existing guests only",
          "Disabled": "Only people in the organization"
        };
        $linkTypes := {
          "None": "Not set (SharePoint default)",
          "Direct": "Specific people",
          "Internal": "People in the organization",
          "AnonymousAccess": "Anyone with the link"
        };
        $permissions := { "None": "Not set (SharePoint default)", "View": "View", "Edit": "Edit" };
        $domains := { "None": "No domain restriction", "AllowList": "Only the allowed domains", "BlockList": "All but the blocked domains" };
        $t := $v.tenant;
        $q := $lowercase($trim($p.q ? $p.q : ''));
        $all := [$v.sites.$merge([$, {
          "title": title ? title : url,
          "storageUsedInBytes": storageUsedMB ? storageUsedMB * 1048576 : 0,
          "sharingLabel": $lookup($labels, sharingCapability)
        }])];
        $rows := [$all[
            ($q = '' or $contains($lowercase(title & ' ' & url & ' ' & (owner ? owner : '')), $q))
            and ($p.sharing = 'All' or $not($exists($p.sharing)) or sharingCapability = $p.sharing)
          ]];
        {
          "tenant": $merge([$t, {
            "sharingLabel": $lookup($labels, $t.sharingCapability),
            "oneDriveSharingLabel": $lookup($labels, $t.oneDriveSharingCapability),
            "defaultLinkLabel": $exists($lookup($linkTypes, $t.defaultSharingLinkType)) ? $lookup($linkTypes, $t.defaultSharingLinkType) : $t.defaultSharingLinkType,
            "defaultPermissionLabel": $exists($lookup($permissions, $t.defaultLinkPermission)) ? $lookup($permissions, $t.defaultLinkPermission) : $t.defaultLinkPermission,
            "domainRestrictionLabel": $exists($lookup($domains, $t.sharingDomainRestrictionMode)) ? $lookup($domains, $t.sharingDomainRestrictionMode) : $t.sharingDomainRestrictionMode,
            "anyoneLinkExpiry": $type($t.requireAnonymousLinksExpireInDays) = 'number' and $t.requireAnonymousLinksExpireInDays > 0
              ? $string($t.requireAnonymousLinksExpireInDays) & ' days' : 'Never'
          }]),
          "rows": $rows,
          "total": $v.summary.total,
          "anyone": $v.summary.anyoneLinks,
          "guests": $count($all[sharingCapability = 'ExternalUserSharingOnly']),
          "internal": $count($all[sharingCapability = 'Disabled']),
          "byLevel": [$v.summary.bySharingCapability.{ "level": $lookup($labels, sharingCapability), "count": count }]
        }
      ) }

layout:
  - widget: kpi
    id: total
    data: sharing.total
    label: Sites
    format: number
  - widget: kpi
    id: anyone
    data: sharing.anyone
    label: Allow Anyone links
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
    href: /p/m365.sharepoint-sharing?sharing=ExternalUserAndGuestSharing
  - widget: kpi
    id: guests
    data: sharing.guests
    label: Allow new guests
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: internal
    data: sharing.internal
    label: Internal only
    format: number
  - widget: keyValue
    id: tenant
    title: Organization-level settings
    span: 7
    data: sharing.tenant
    fields:
      - field: sharingCapability
        label: SharePoint sharing
        kind: status
        map:
          ExternalUserAndGuestSharing: [crit, Anyone]
          ExternalUserSharingOnly: [warn, New and existing guests]
          ExistingExternalUserSharingOnly: [info, Existing guests only]
          Disabled: [ok, Only people in the organization]
      - field: oneDriveSharingCapability
        label: OneDrive sharing
        kind: status
        map:
          ExternalUserAndGuestSharing: [crit, Anyone]
          ExternalUserSharingOnly: [warn, New and existing guests]
          ExistingExternalUserSharingOnly: [info, Existing guests only]
          Disabled: [ok, Only people in the organization]
      - { field: defaultLinkLabel, label: Default link type }
      - { field: defaultPermissionLabel, label: Default link permission }
      - { field: anyoneLinkExpiry, label: Anyone links expire after }
      - { field: domainRestrictionLabel, label: Domain restriction }
      - { field: preventExternalUsersFromResharing, label: Guests can't reshare, kind: boolean }
  - widget: chart
    id: byLevel
    title: Sites by sharing level
    span: 5
    type: donut
    data: sharing.byLevel
    x: level
    y: count
    format: number
  - widget: table
    id: sites
    span: 12
    data: sharing.rows
    rowKey: url
    columns:
      - { field: title, label: Site, kind: identity, secondary: url }
      - field: sharingCapability
        label: Sharing
        kind: status
        map:
          ExternalUserAndGuestSharing: [crit, Anyone]
          ExternalUserSharingOnly: [warn, New and existing guests]
          ExistingExternalUserSharingOnly: [info, Existing guests only]
          Disabled: [ok, Only people in the organization]
        filter: { type: facet, param: sharing }
      - { field: template, label: Template, filter: { type: facet, param: template } }
      - { field: storageUsedInBytes, label: Storage, kind: bytes, align: end, filter: range, sortable: true }
      - { field: lastContentModified, label: Last content change, kind: relativeTime, filter: date, sortable: true }
      - { field: lockState, label: Lock state, filter: facet, hidden: true }
      - { field: owner, label: Owner, hidden: true }
      - { field: groupId, label: Microsoft 365 group id, kind: guid, hidden: true }
    rowActions:
      - label: Open site
        icon: arrow-square-out
        href: ${ row.url }
      - label: Group and owners
        icon: users-three
        href: /p/m365.team?id=${ $encode(row.groupId) }
        when: ${ $boolean(row.groupId) }
      - label: Open in SharePoint admin center
        icon: arrow-square-out
        href: "${ 'https://' & env.AF_SPO_TENANT_NAME & '-admin.sharepoint.com/_layouts/15/online/AdminHome.aspx#/siteManagement' }"
        when: ${ $boolean(env.AF_SPO_TENANT_NAME) }
    empty:
      title: No sites match
      body: Clear the filters. Reading sharing settings needs the SharePoint Administrator role.

export:
  formats: [csv, xlsx]
  fileName: sharepoint-sharing
  data: sharing.rows
  columns: all
