$schema: ../../../packages/schemas/generated/page.schema.json
kind: page
id: m365.sharepoint-sites
version: 2.1.0
title: SharePoint sites
summary: SharePoint sites with their storage, activity and how many Anyone links they hold.
owner: m365-team
tags: [m365, sharepoint, storage]
template: list-detail
nav: { section: sharepoint, label: Sites, icon: globe-hemisphere-west, order: 10 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Sites.Read.All, Reports.Read.All]
  entraRoles: [SharePoint Administrator, Reports Reader, Global Reader]
  licences: [sharepoint]

params:
  q: { type: string, default: "", label: Search sites, placeholder: Site name or keyword }
  activity:
    type: enum
    label: Activity
    facet: true
    default: All
    values:
      - { value: All, label: Any activity }
      - { value: inactive, label: No activity for 90+ days }
      - { value: anyone, label: Has Anyone links }
  template:
    type: enum
    label: Template
    facet: true
    default: All
    values:
      - { value: All, label: All templates }
      - { value: Group, label: Team site (Microsoft 365 group) }
      - { value: Team Site, label: Team site (no group) }
      - { value: Communication Site, label: Communication site }
      - { value: Team Channel, label: Private or shared channel }

filters:
  search: q
  facets: [activity, template]

savedViews:
  enabled: true
  shared: true
  presets:
    - { name: Inactive sites, params: { activity: inactive } }
    - { name: Sites with Anyone links, params: { activity: anyone } }

datasources:
  sites:
    source: graph
    label: Sites (search)
    request:
      path: /sites
      query:
        search: "${ params.q ? params.q : '*' }"
        $select: id,name,displayName,webUrl,description,createdDateTime,lastModifiedDateTime
        $top: 200
    paging: cursor
    cache: { ttl: 300 }
  siteList:
    source: graph
    label: Site usage report (last 7 days)
    request:
      beta: true
      path: /reports/getSharePointSiteUsageDetail(period='D7')
      query: { $format: application/json }
    paging: all
    maxItems: 40000
    cache: { ttl: 3600 }
    # The report's own rows with native filters ($applyAdvanced): no per-site JSONata, which doesn't fit the budget
    # beyond ~1,500 sites. The list keeps the first 10,000 (largest first); the export has every site of the view.
    transform: >-
      ${ (
        $p := params;
        $f := function($rows, $clauses) { $applyAdvanced($rows, { "join": "and", "clauses": $clauses }) };
        $all := $f(value.value, [{ "path": "isDeleted", "type": "boolean", "op": "ne", "value": true }]);
        $idle := { "join": "or", "clauses": [
          { "path": "lastActivityDate", "type": "date", "op": "isEmpty", "value": null },
          { "path": "lastActivityDate", "type": "date", "op": "lt", "value": $daysAgo(90) }
        ] };
        $anyone := { "path": "anonymousLinkCount", "type": "number", "op": "gt", "value": 0 };
        $clauses := $append(
          $p.activity = 'inactive' ? [$idle] : $p.activity = 'anyone' ? [$anyone] : [],
          $p.template and $p.template != 'All' ? [{ "path": "rootWebTemplate", "type": "string", "op": "eq", "value": $p.template }] : []
        );
        $shown := $count($clauses) > 0 ? $f($all, $clauses) : $all;
        $sorted := $shown^(>storageUsedInBytes);
        {
          "rows": $sorted,
          "partial": value.truncated = true,
          "sites": $count($all),
          "inactive": $count($f($all, [$idle])),
          "withAnyoneLinks": $count($f($all, [$anyone])),
          "top": [$take($sorted, 10).{ "site": $substring(siteUrl ? siteUrl : '', 0, 8) = 'https://' ? $reverse($split($replace(siteUrl, /\/$/, ''), '/'))[0] : siteId, "storageUsedInBytes": storageUsedInBytes }],
          "concealed": $exists($all[0].siteUrl) and $substring($all[0].siteUrl, 0, 8) != 'https://'
        }
      ) }
  # What the page shows of siteList: its figures and the first 10,000 rows, so the browser gets a small answer. The
  # export reads siteList itself — every row of the view (export.maxRows keeps its read at the same cap).
  storage:
    source: static
    data: ${ ds.siteList }
    cache: { ttl: 3600 }
    transform: >-
      ${ $merge([value, { "rows": $take(value.rows, 10000), "listCapped": $count(value.rows) > 10000 }]) }
  usage:
    source: graph
    label: SharePoint storage (usage report)
    request:
      beta: true
      path: /reports/getSharePointSiteUsageStorage(period='D7')
      query: { $format: application/json }
    cache: { ttl: 3600 }
    transform: >-
      ${ { "used": (value.value^(>reportDate))[0].storageUsedInBytes } }

layout:
  - widget: markdown
    id: concealed
    span: 12
    when: ${ storage.concealed = true }
    text: |
      **Site names are concealed in usage reports.** The storage table shows site ids instead of URLs, and owners as
      hashes. A Global Administrator can turn off *Display concealed user, group, and site names in all reports* in
      the Microsoft 365 admin center → **Settings → Org settings → Services → Reports**.
  - widget: kpi
    id: sites
    data: storage.sites
    label: Active sites
    format: number
  - widget: kpi
    id: usedBytes
    data: usage.used
    label: Storage used
    format: bytes
  - widget: kpi
    id: inactive
    data: storage.inactive
    label: No activity for 90+ days
    format: number
    status: "${ value > 0 ? 'info' : 'ok' }"
    href: /p/m365.sharepoint-sites?activity=inactive
  - widget: kpi
    id: withAnyoneLinks
    data: storage.withAnyoneLinks
    label: Sites with Anyone links
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
    href: /p/m365.sharepoint-sites?activity=anyone
  - widget: chart
    id: topStorage
    title: Largest sites
    span: 12
    type: bar
    data: storage.top
    x: site
    y: storageUsedInBytes
    format: bytes
  - widget: markdown
    span: 12
    when: ${ storage.partial = true }
    text: >-
      **Partial data.** Microsoft has more sites than this page reads (40,000); the figures, the list and the
      export cover the ones read.
  - widget: markdown
    span: 12
    when: ${ storage.listCapped = true }
    text: The usage list shows the 10,000 largest sites of this view; the CSV/XLSX export has all of them.
  - widget: table
    id: usage
    title: Storage and activity
    span: 12
    data: storage.rows
    rowKey: siteId
    columns:
      - { field: siteUrl, label: Site, kind: identity, secondary: siteId }
      - { field: ownerDisplayName, label: Owner, hidden: true }
      - { field: rootWebTemplate, label: Template, filter: { type: facet, param: template } }
      - { field: storageUsedInBytes, label: Storage used, kind: bytes, align: end, filter: range, sortable: true }
      - { field: fileCount, label: Files, kind: number, align: end, filter: range }
      - { field: lastActivityDate, label: Last activity, kind: date, filter: date, sortable: true }
      - { field: anonymousLinkCount, label: Anyone links, kind: number, align: end, filter: range, sortable: true }
      - { field: secureLinkForGuestCount, label: Guest links, kind: number, align: end, hidden: true }
      - { field: companyLinkCount, label: Organization links, kind: number, align: end, hidden: true }
      - { field: activeFileCount, label: Active files, kind: number, hidden: true }
      - { field: pageViewCount, label: Page views, kind: number, hidden: true }
      - { field: storageAllocatedInBytes, label: Quota, kind: bytes, align: end }
      - { field: ownerPrincipalName, label: Owner sign-in name, hidden: true }
      - { field: siteId, label: Site collection id, kind: guid, hidden: true }
    rowActions:
      - label: Open site
        icon: arrow-square-out
        href: ${ row.siteUrl }
        when: ${ $substring(row.siteUrl, 0, 8) = 'https://' }
    empty:
      title: No sites match
      body: Usage data appears 24–48 hours after activity, and only once Microsoft has started the usage reports for the tenant.
  - widget: table
    id: sites
    title: Sites
    span: 12
    data: sites.value
    rowKey: id
    columns:
      - { field: displayName, label: Site, kind: identity, secondary: webUrl }
      - { field: name, label: Name, hidden: true }
      - { field: createdDateTime, label: Created, kind: date, filter: date }
      - { field: lastModifiedDateTime, label: Last modified, kind: relativeTime, filter: date, sortable: true }
      - { field: description, label: Description, hidden: true }
      - { field: id, label: Site id, kind: code, hidden: true }
    inspect:
      page: m365.sharepoint-site
      params:
        id: ${ row.id }
    rowActions:
      - label: Open site
        icon: arrow-square-out
        href: ${ row.webUrl }
    empty:
      title: No sites found
      body: Search matches site names and keywords. Use * to list every site you can read.

export:
  formats: [csv, xlsx]
  fileName: sharepoint-site-usage
  data: siteList.rows
  maxRows: 40000
  columns: all
