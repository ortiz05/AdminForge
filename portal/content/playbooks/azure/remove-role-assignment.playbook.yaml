$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: azure.remove-role-assignment
version: 1.2.0
title: Remove Azure role assignment
summary: Removes one Azure RBAC role assignment. Needs approval by a second engineer; refuses to remove your own assignment.
owner: azure-team
tags: [azure, rbac, access]
risk: high
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    arm: [user_impersonation]
  azureRoles: [Role Based Access Control Administrator]
# Typed (high risk, and a bulk action): the role's name; in bulk, how many assignments. An assignment whose role can't
# be read, or whose (custom) role name can't be typed, asks for its GUID (the end of the assignment id), which the
# message then shows (`confirmAs`).
confirm:
  type: typed
  value: ${ steps.confirmAs.output.value }
  message: >-
    ${ 'Remove ' & (steps.confirmAs.output.byName ? steps.role.output.properties.roleName : 'this role (assignment ' & steps.lookup.output.name & ')') & ' from '
       & ($who := $lookup({ 'User': 'the user', 'Group': 'the group', 'ForeignGroup': 'the group', 'ServicePrincipal': 'the app' }, steps.lookup.output.properties.principalType); $who ? $who : 'the principal') & ' '
       & steps.lookup.output.properties.principalId & ' at ' & steps.lookup.output.properties.scope
       & '? They lose the access it grants within a few minutes.' }
approval:
  required: true
  approvers: [Playbook.Approver]
  minApprovals: 1
  expiresIn: PT8H

inputs:
  assignmentId:
    type: string
    label: Role assignment id
    pattern: "^/.+/providers/[Mm]icrosoft\\.[Aa]uthorization/role[Aa]ssignments/[0-9a-fA-F-]{36}$"
  reason: { type: string, label: Justification, minLength: 10, multiline: true, description: Shown to the approver and recorded in the audit log. }

steps:
  - id: path
    type: transform
    expression: ${ $join($split(inputs.assignmentId, '/')[$ != ''].('/' & $encode($)), '') }

  - id: lookup
    type: arm
    mode: read
    describe: Read the role assignment
    request:
      method: GET
      path: ${ steps.path.output }
      apiVersion: "2022-04-01"

  - id: notSelf
    type: assert
    that: ${ $lowercase(steps.lookup.output.properties.principalId) != $lowercase(user.oid) }
    message: This assignment is your own. Ask another administrator to remove it.

  # The role's name, for the confirmation, the plan and the summary. Read at the assignment's own scope, so it needs no
  # read access above it; if it still can't be read, the confirmation asks for the assignment's GUID.
  - id: role
    type: arm
    mode: read
    describe: Read the role the assignment grants
    onError: continue
    request:
      method: GET
      path: >-
        ${ $join($split(steps.lookup.output.properties.scope, '/')[$ != ''].('/' & $encode($)), '')
           & '/providers/Microsoft.Authorization/roleDefinitions/'
           & $encode($split(steps.lookup.output.properties.roleDefinitionId, '/')[-1]) }
      apiVersion: "2022-04-01"

  # What the confirmation asks for: the role's name, or the assignment's GUID when the role couldn't be read or its name
  # has nothing a person can type (a custom role's name is chosen by whoever created it; the class: what the API's
  # comparison drops, control characters, anything outside the BMP) — such a name could never be confirmed.
  - id: confirmAs
    type: transform
    describe: Work out what the confirmation asks for
    expression: >-
      ${ (
        $name := steps.role.output.properties.roleName;
        $byName := $type($name) = 'string'
          and $contains($name, /[^\s\u0000-\u001f\u007f-\u009f\u00ad\u034f\u0600-\u0605\u061c\u06dd\u070f\u0890\u0891\u08e2\u115f\u1160\u17b4\u17b5\u180b-\u180f\u200b-\u200f\u202a-\u202e\u2060-\u206f\u3164\ufe00-\ufe0f\uffa0\ufff0-\ufffb\ud800-\udfff]/)
          and $not($contains($name, '[redacted]'));
        { 'value': $byName ? $name : steps.lookup.output.name, 'byName': $byName }
      ) }

  - id: delete
    type: arm
    mode: write
    describe: >-
      ${ 'Remove ' & (steps.role.output.properties.roleName ? steps.role.output.properties.roleName : 'the role') & ' from '
         & ($who := $lookup({ 'User': 'the user', 'Group': 'the group', 'ForeignGroup': 'the group', 'ServicePrincipal': 'the app' }, steps.lookup.output.properties.principalType); $who ? $who : 'the principal') & ' '
         & steps.lookup.output.properties.principalId & ' at ' & steps.lookup.output.properties.scope }
    request:
      method: DELETE
      path: ${ steps.path.output }
      apiVersion: "2022-04-01"
    compensate:
      type: arm
      describe: Recreate the role assignment
      request:
        method: PUT
        path: ${ steps.path.output }
        apiVersion: "2022-04-01"
        body: >-
          ${ { 'properties': {
            'roleDefinitionId': steps.lookup.output.properties.roleDefinitionId,
            'principalId': steps.lookup.output.properties.principalId,
            'principalType': steps.lookup.output.properties.principalType,
            'condition': steps.lookup.output.properties.condition,
            'conditionVersion': steps.lookup.output.properties.conditionVersion,
            'description': steps.lookup.output.properties.description
          } } }

outputs:
  summary: >-
    ${ (steps.role.output.properties.roleName ? steps.role.output.properties.roleName : 'The role') & ' was removed from '
       & ($who := $lookup({ 'User': 'the user', 'Group': 'the group', 'ForeignGroup': 'the group', 'ServicePrincipal': 'the app' }, steps.lookup.output.properties.principalType); $who ? $who : 'the principal') & ' '
       & steps.lookup.output.properties.principalId & ' at ' & steps.lookup.output.properties.scope & '.' }

tests:
  - name: refuses to remove the engineer's own assignment
    inputs: { assignmentId: /subscriptions/00000000-0000-4000-8000-0000000000a1/providers/Microsoft.Authorization/roleAssignments/30000000-0000-4000-8000-000000000201, reason: quarterly access review }
    user: { oid: 00000000-0000-4000-8000-000000000a01, upn: alex.admin@example.com }
    mocks:
      lookup: { properties: { principalId: 00000000-0000-4000-8000-000000000a01, principalType: User, scope: /subscriptions/00000000-0000-4000-8000-0000000000a1 } }
    expect: { status: failed, failedStep: notSelf }
  - name: plans the removal
    inputs: { assignmentId: /subscriptions/00000000-0000-4000-8000-0000000000a1/providers/Microsoft.Authorization/roleAssignments/30000000-0000-4000-8000-000000000202, reason: quarterly access review }
    user: { oid: 00000000-0000-4000-8000-000000000a01, upn: alex.admin@example.com }
    mocks:
      lookup:
        name: 30000000-0000-4000-8000-000000000202
        properties:
          roleDefinitionId: /subscriptions/00000000-0000-4000-8000-0000000000a1/providers/Microsoft.Authorization/roleDefinitions/8e3af657-a8ff-443c-a75c-2fe8c4bcb635
          principalId: 30000000-0000-4000-8000-000000000102
          principalType: User
          scope: /subscriptions/00000000-0000-4000-8000-0000000000a1
      role: { name: 8e3af657-a8ff-443c-a75c-2fe8c4bcb635, properties: { roleName: Owner } }
    expect:
      status: succeeded
      plan: [delete]
      outputs: { summary: Owner was removed from the user 30000000-0000-4000-8000-000000000102 at /subscriptions/00000000-0000-4000-8000-0000000000a1. }
  - name: still plans the removal when the role can't be read
    inputs: { assignmentId: /subscriptions/00000000-0000-4000-8000-0000000000a1/providers/Microsoft.Authorization/roleAssignments/30000000-0000-4000-8000-000000000203, reason: quarterly access review }
    user: { oid: 00000000-0000-4000-8000-000000000a01, upn: alex.admin@example.com }
    mocks:
      lookup:
        name: 30000000-0000-4000-8000-000000000203
        properties:
          roleDefinitionId: /providers/Microsoft.Management/managementGroups/mg-example/providers/Microsoft.Authorization/roleDefinitions/30000000-0000-4000-8000-000000000301
          principalId: 30000000-0000-4000-8000-000000000103
          principalType: Group
          scope: /subscriptions/00000000-0000-4000-8000-0000000000a1
    errors:
      role: { status: 403, code: AuthorizationFailed, message: The client does not have authorization to read the role definition. }
    expect:
      status: succeeded
      plan: [delete]
      steps: { role: failed }
      outputs: { summary: The role was removed from the group 30000000-0000-4000-8000-000000000103 at /subscriptions/00000000-0000-4000-8000-0000000000a1. }
