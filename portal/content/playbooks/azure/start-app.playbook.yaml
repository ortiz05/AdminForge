$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: azure.start-app
version: 1.0.0
title: Start Function App or web app
summary: Starts a stopped Function App or App Service web app.
owner: azure-team
tags: [azure, functions, app-service]
risk: low
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    arm: [user_impersonation]
  azureRoles: [Website Contributor]
confirm:
  type: click
  message: Start the app? Timer, queue and event triggers resume immediately.
approval:
  required: false

inputs:
  subscriptionId: { type: string, format: guid, label: Subscription, picker: subscription }
  resourceGroup: { type: string, label: Resource group, pattern: "^[-\\w._()]{1,90}$" }
  name: { type: string, label: App name, pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,58}$" }
  reason: { type: string, label: Reason, required: false, multiline: true, description: Recorded in the audit log. }

steps:
  - id: lookup
    type: arm
    mode: read
    describe: Read the app and its current state
    request:
      method: GET
      path: /subscriptions/${ $encode($guid(inputs.subscriptionId)) }/resourceGroups/${ $encode(inputs.resourceGroup) }/providers/Microsoft.Web/sites/${ $encode(inputs.name) }
      apiVersion: "2023-12-01"

  - id: guard
    type: assert
    that: ${ steps.lookup.output.properties.state = 'Stopped' }
    message: ${ inputs.name & ' is ' & $lowercase(steps.lookup.output.properties.state) & ', not stopped.' }

  - id: start
    type: arm
    mode: write
    describe: ${ 'Start ' & inputs.name }
    retry: { max: 2, backoff: exponential, delay: 5s }
    request:
      method: POST
      path: /subscriptions/${ $encode($guid(inputs.subscriptionId)) }/resourceGroups/${ $encode(inputs.resourceGroup) }/providers/Microsoft.Web/sites/${ $encode(inputs.name) }/start
      apiVersion: "2023-12-01"

outputs:
  summary: ${ inputs.name & ' started.' }

tests:
  - name: refuses an app that is already running
    inputs: { subscriptionId: 00000000-0000-4000-8000-0000000000a1, resourceGroup: rg-example-functions, name: func-example }
    mocks:
      lookup: { name: func-example, properties: { state: Running } }
    expect: { status: failed, failedStep: guard }
  - name: plans a start for a stopped app
    inputs: { subscriptionId: 00000000-0000-4000-8000-0000000000a1, resourceGroup: rg-example-functions, name: func-example-orders, reason: incident 5130 resolved }
    mocks:
      lookup: { name: func-example-orders, properties: { state: Stopped } }
    expect:
      status: succeeded
      plan: [start]
      outputs: { summary: func-example-orders started. }
