$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: azure.stop-app
version: 1.0.0
title: Stop Function App or web app
summary: Stops a running Function App or App Service web app. Triggers stop firing and HTTP requests fail until the app is started again.
owner: azure-team
tags: [azure, functions, app-service, incident]
risk: high
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    arm: [user_impersonation]
  azureRoles: [Website Contributor]
confirm:
  type: typed
  value: ${ steps.lookup.output.name }
  message: Stopping takes the app offline. Type the app name to confirm.
approval:
  required: false

inputs:
  subscriptionId: { type: string, format: guid, label: Subscription, picker: subscription }
  resourceGroup: { type: string, label: Resource group, pattern: "^[-\\w._()]{1,90}$" }
  name: { type: string, label: App name, pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,58}$" }
  reason: { type: string, label: Reason, minLength: 10, multiline: true, description: Recorded in the audit log. }

steps:
  - id: lookup
    type: arm
    mode: read
    describe: Read the app and its current state
    request:
      method: GET
      path: /subscriptions/${ $encode($guid(inputs.subscriptionId)) }/resourceGroups/${ $encode(inputs.resourceGroup) }/providers/Microsoft.Web/sites/${ $encode(inputs.name) }
      apiVersion: "2023-12-01"

  - id: guard
    type: assert
    that: ${ steps.lookup.output.properties.state = 'Running' }
    message: ${ inputs.name & ' is already ' & $lowercase(steps.lookup.output.properties.state) & '.' }

  - id: stop
    type: arm
    mode: write
    describe: ${ 'Stop ' & inputs.name }
    request:
      method: POST
      path: /subscriptions/${ $encode($guid(inputs.subscriptionId)) }/resourceGroups/${ $encode(inputs.resourceGroup) }/providers/Microsoft.Web/sites/${ $encode(inputs.name) }/stop
      apiVersion: "2023-12-01"
    compensate:
      type: arm
      describe: ${ 'Start ' & inputs.name & ' again' }
      request:
        method: POST
        path: /subscriptions/${ $encode($guid(inputs.subscriptionId)) }/resourceGroups/${ $encode(inputs.resourceGroup) }/providers/Microsoft.Web/sites/${ $encode(inputs.name) }/start
        apiVersion: "2023-12-01"

outputs:
  summary: ${ inputs.name & ' stopped. Start it again with Start Function App or web app.' }

tests:
  - name: refuses an app that is already stopped
    inputs: { subscriptionId: 00000000-0000-4000-8000-0000000000a1, resourceGroup: rg-example-functions, name: func-example-orders, reason: incident 5130 containment }
    mocks:
      lookup: { name: func-example-orders, properties: { state: Stopped } }
    expect: { status: failed, failedStep: guard }
  - name: plans a stop for a running app
    inputs: { subscriptionId: 00000000-0000-4000-8000-0000000000a1, resourceGroup: rg-example-functions, name: func-example, reason: incident 5131 containment }
    mocks:
      lookup: { name: func-example, properties: { state: Running } }
    expect:
      status: succeeded
      plan: [stop]
      outputs: { summary: func-example stopped. Start it again with Start Function App or web app. }
