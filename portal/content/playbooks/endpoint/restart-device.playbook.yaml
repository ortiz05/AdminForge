$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: endpoint.restart-device
version: 1.1.0
title: Restart Intune device
summary: >-
  Restarts an Intune-managed Windows, macOS or supervised iOS/iPadOS device the next time it checks in. The user gets
  no chance to save work on most platforms — warn them first.
owner: endpoint-team
tags: [endpoint, intune, bulk]
risk: medium
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph: [DeviceManagementManagedDevices.Read.All, DeviceManagementManagedDevices.PrivilegedOperations.All]
  entraRoles: [Intune Administrator]
  licences: [intune]
# Typed: offered as a bulk action (risk medium or higher), where a run asks for the number of items instead. One
# device: its name, or its Intune id when the name can't be typed (`confirmAs`; people name their own devices).
confirm:
  type: typed
  value: ${ steps.confirmAs.output.value }
  message: >-
    ${ 'Restart ' & (steps.confirmAs.output.byName ? steps.device.output.deviceName : 'the device with Intune id ' & steps.device.output.id)
       & ' (' & steps.device.output.userPrincipalName & ')? Unsaved work may be lost.' }
approval:
  required: false

inputs:
  managedDeviceId: { type: string, format: guid, label: Device (Intune id), picker: device }
  reason: { type: string, label: Reason, required: false, multiline: true }

steps:
  - id: device
    type: graph
    mode: read
    describe: Look up the managed device
    request:
      method: GET
      path: /deviceManagement/managedDevices/${ $encode($guid(inputs.managedDeviceId)) }
      query:
        $select: id,deviceName,operatingSystem,isSupervised,managementState,userPrincipalName

  # What the confirmation asks for: the device's name, or its Intune id when the name has nothing a person can type
  # (spaces or invisible characters only) or holds a masked value — such a name could never be confirmed (the class:
  # what the API's comparison drops, control characters, anything outside the BMP).
  - id: confirmAs
    type: transform
    describe: Work out what the confirmation asks for
    expression: >-
      ${ (
        $name := steps.device.output.deviceName;
        $byName := $type($name) = 'string'
          and $contains($name, /[^\s\u0000-\u001f\u007f-\u009f\u00ad\u034f\u0600-\u0605\u061c\u06dd\u070f\u0890\u0891\u08e2\u115f\u1160\u17b4\u17b5\u180b-\u180f\u200b-\u200f\u202a-\u202e\u2060-\u206f\u3164\ufe00-\ufe0f\uffa0\ufff0-\ufffb\ud800-\udfff]/)
          and $not($contains($name, '[redacted]'));
        { 'value': $byName ? $name : steps.device.output.id, 'byName': $byName }
      ) }

  - id: supported
    type: assert
    that: >-
      ${ steps.device.output.operatingSystem in ['Windows', 'macOS']
         or (steps.device.output.operatingSystem in ['iOS', 'iPadOS'] and steps.device.output.isSupervised = true) }
    message: ${ 'Remote restart is not supported for ' & steps.device.output.operatingSystem & ' devices like ' & steps.device.output.deviceName & '.' }

  # Not retried after a restart: a second reboot could come after the person is back at work and lose it again. A
  # restart in flight when the worker stopped ends `needs_review` instead.
  - id: restart
    type: graph
    mode: write
    idempotent: false
    describe: ${ 'Restart ' & steps.device.output.deviceName }
    request:
      method: POST
      path: /deviceManagement/managedDevices/${ $encode($guid(inputs.managedDeviceId)) }/rebootNow

outputs:
  summary: ${ 'Restart requested for ' & steps.device.output.deviceName & '. It restarts at its next check-in.' }

tests:
  - name: refuses an Android device
    inputs: { managedDeviceId: 00000000-0000-4000-8000-000000000604 }
    mocks:
      device: { id: 00000000-0000-4000-8000-000000000604, deviceName: Pixel 8 – M. Chen, operatingSystem: Android, isSupervised: false, managementState: managed, userPrincipalName: m.chen@example.com }
    expect: { status: failed, failedStep: supported }
  - name: plans a restart for a Windows device
    inputs: { managedDeviceId: 00000000-0000-4000-8000-000000000601 }
    mocks:
      device: { id: 00000000-0000-4000-8000-000000000601, deviceName: EX-LT-0142, operatingSystem: Windows, isSupervised: false, managementState: managed, userPrincipalName: a.lee@example.com }
    expect:
      status: succeeded
      plan: [restart]
