$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: identity.add-app-owner
version: 1.4.0
title: Add app registration owner
summary: >-
  Makes a user an owner of an app registration. Owners can add credentials and sign in as the app with its
  permissions, so this needs a second engineer's approval (the new owner can't approve it) and refuses making yourself
  an owner. Only add people accountable for the app.
owner: identity-team
tags: [identity, apps, governance]
risk: high
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph: [Application.ReadWrite.All, User.Read.All]
  entraRoles: [Cloud Application Administrator]
# Typed (high risk): the app's name, or its object id when the name can't be typed (`confirmAs`).
confirm:
  type: typed
  value: ${ steps.confirmAs.output.value }
  message: >-
    ${ 'Make ' & steps.owner.output.userPrincipalName & ' an owner of '
       & (steps.confirmAs.output.byName ? steps.app.output.displayName : 'the app registration with object id ' & steps.app.output.id)
       & '? Owners can add secrets and change sign-in settings for this app.' }
# An owner can add a secret and act as the app with its API permissions: a second engineer approves, and the new
# owner may not approve it. The change then runs as the approver.
approval:
  required: true
  approvers: [Playbook.Approver]
  minApprovals: 1
  expiresIn: PT8H
  excludes: ${ $guid(inputs.ownerId) }

inputs:
  appObjectId: { type: string, format: guid, label: App registration (object id), picker: app }
  ownerId: { type: string, format: guid, label: New owner, picker: user }

steps:
  - id: app
    type: graph
    mode: read
    describe: Look up the app registration
    request:
      method: GET
      path: /applications/${ $encode($guid(inputs.appObjectId)) }
      query:
        $select: id,appId,displayName

  - id: notPortalApp
    type: assert
    that: >-
      ${ $not(steps.app.output.appId in $append([env.AF_READ_CLIENT_ID, env.AF_WRITE_CLIENT_ID, env.AF_AUTOMATION_CLIENT_ID], $map($split(env.AF_PROTECTED_APP_IDS ? env.AF_PROTECTED_APP_IDS : '', ','), function($v) { $trim($v) }))) }
    message: This is one of AdminForge's own app registrations (or a protected app such as the provisioner). Owners of these apps could add credentials and act as them, so manage their owners in the Microsoft Entra admin center.

  # What the confirmation asks for. An app's name is chosen by whoever registered it: one with nothing a person can type
  # (spaces or invisible characters only) or holding a masked value could never be confirmed — the object id stands in
  # for it then (the class: what the API's comparison drops, control characters, anything outside the BMP).
  - id: confirmAs
    type: transform
    describe: Work out what the confirmation asks for
    expression: >-
      ${ (
        $name := steps.app.output.displayName;
        $byName := $type($name) = 'string'
          and $contains($name, /[^\s\u0000-\u001f\u007f-\u009f\u00ad\u034f\u0600-\u0605\u061c\u06dd\u070f\u0890\u0891\u08e2\u115f\u1160\u17b4\u17b5\u180b-\u180f\u200b-\u200f\u202a-\u202e\u2060-\u206f\u3164\ufe00-\ufe0f\uffa0\ufff0-\ufffb\ud800-\udfff]/)
          and $not($contains($name, '[redacted]'));
        { 'value': $byName ? $name : steps.app.output.id, 'byName': $byName }
      ) }

  - id: owner
    type: graph
    mode: read
    describe: Look up the new owner
    request:
      method: GET
      path: /users/${ $encode($guid(inputs.ownerId)) }
      query:
        $select: id,displayName,userPrincipalName,accountEnabled,userType

  - id: ownerIsMember
    type: assert
    that: ${ steps.owner.output.accountEnabled = true and steps.owner.output.userType = 'Member' }
    message: ${ steps.owner.output.userPrincipalName & ' must be an enabled member account (not a guest) to own an app.' }

  - id: owners
    type: graph
    mode: read
    describe: Read current owners
    request:
      method: GET
      path: /applications/${ $encode($guid(inputs.appObjectId)) }/owners
      query:
        $select: id,displayName,userPrincipalName

  - id: notOwnerYet
    type: assert
    that: ${ $not($guid(inputs.ownerId) in steps.owners.output.value.id) }
    message: ${ steps.owner.output.userPrincipalName & ' already owns ' & steps.app.output.displayName & '.' }

  - id: notSelf
    type: assert
    that: ${ $not($guid(inputs.ownerId) = $lowercase(user.oid)) }
    message: You can't make yourself an owner of an app registration. Ask another engineer.

  - id: addOwner
    type: graph
    mode: write
    describe: ${ 'Add ' & steps.owner.output.userPrincipalName & ' as owner of ' & steps.app.output.displayName }
    request:
      method: POST
      path: /applications/${ $encode($guid(inputs.appObjectId)) }/owners/$ref
      body:
        "@odata.id": https://graph.microsoft.com/v1.0/directoryObjects/${ $guid(inputs.ownerId) }
    compensate:
      type: graph
      describe: Remove the owner again
      request:
        method: DELETE
        path: /applications/${ $encode($guid(inputs.appObjectId)) }/owners/${ $encode($guid(inputs.ownerId)) }/$ref

outputs:
  summary: ${ steps.owner.output.userPrincipalName & ' now owns the app registration ' & steps.app.output.displayName & '.' }

tests:
  - name: refuses AdminForge's own and protected apps (AF_PROTECTED_APP_IDS)
    inputs: { appObjectId: 00000000-0000-4000-8000-000000000301, ownerId: 00000000-0000-4000-8000-000000000101 }
    env: { AF_PROTECTED_APP_IDS: "00000000-0000-4000-8001-0000000000ff, 00000000-0000-4000-8001-0000000003ff" }
    mocks:
      app: { id: 00000000-0000-4000-8000-000000000301, appId: 00000000-0000-4000-8001-0000000003ff, displayName: Provisioner, passwordCredentials: [], keyCredentials: [] }
    expect: { status: failed, failedStep: notPortalApp }
  - name: refuses a guest owner
    inputs: { appObjectId: 00000000-0000-4000-8000-000000000301, ownerId: 00000000-0000-4000-8000-000000000106 }
    mocks:
      app: { id: 00000000-0000-4000-8000-000000000301, appId: 00000000-0000-4000-8001-000000000301, displayName: Example HR Sync }
      owner: { id: 00000000-0000-4000-8000-000000000106, userPrincipalName: j.doe_partner.example#EXT#@exampleorg.onmicrosoft.com, accountEnabled: true, userType: Guest }
    expect: { status: failed, failedStep: ownerIsMember }
  - name: plans adding an owner
    inputs: { appObjectId: 00000000-0000-4000-8000-000000000301, ownerId: 00000000-0000-4000-8000-000000000102 }
    mocks:
      app: { id: 00000000-0000-4000-8000-000000000301, appId: 00000000-0000-4000-8001-000000000301, displayName: Example HR Sync }
      owner: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      owners: { value: [{ id: 00000000-0000-4000-8000-000000000101, userPrincipalName: a.lee@example.com }] }
    expect:
      status: succeeded
      plan: [addOwner]
  - name: refuses making yourself an owner
    inputs: { appObjectId: 00000000-0000-4000-8000-000000000301, ownerId: 00000000-0000-4000-8000-0000000000a1 }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      app: { id: 00000000-0000-4000-8000-000000000301, appId: 00000000-0000-4000-8001-000000000301, displayName: Example HR Sync }
      owner: { id: 00000000-0000-4000-8000-0000000000a1, userPrincipalName: avery@example.com, accountEnabled: true, userType: Member }
      owners: { value: [{ id: 00000000-0000-4000-8000-000000000101, userPrincipalName: a.lee@example.com }] }
    expect: { status: failed, failedStep: notSelf }
  - name: waits for a second engineer before adding the owner
    dryRun: false
    inputs: { appObjectId: 00000000-0000-4000-8000-000000000301, ownerId: 00000000-0000-4000-8000-000000000102 }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      app: { id: 00000000-0000-4000-8000-000000000301, appId: 00000000-0000-4000-8001-000000000301, displayName: Example HR Sync }
      owner: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      owners: { value: [{ id: 00000000-0000-4000-8000-000000000101, userPrincipalName: a.lee@example.com }] }
    expect: { status: awaiting_approval }
