$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: identity.add-group-members
version: 1.2.0
title: Add group members
summary: >-
  Adds one or more users to a cloud security or Microsoft 365 group. Refuses dynamic groups, groups synced from
  on-premises AD, distribution lists / mail-enabled security groups (manage those in Exchange Online), and adding
  yourself. Role-assignable groups carry Microsoft Entra roles, so adding members to one needs a second engineer's
  approval, and nobody being added can approve it.
owner: identity-team
tags: [identity, groups, bulk]
risk: high
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph: [Group.Read.All, GroupMember.ReadWrite.All]
  # Role-assignable groups also need Privileged Role Administrator.
  entraRoles: [Groups Administrator]
# Group membership grants access (apps, Azure roles, policies; directory roles for role-assignable groups): type the
# group's name to confirm.
confirm:
  type: typed
  value: ${ steps.group.output.displayName }
  message: >-
    ${ 'Add ' & $count(inputs.userIds) & ' member(s) to ' & steps.group.output.displayName
       & (steps.group.output.isAssignableToRole = true
          ? ', a role-assignable group: members receive its Microsoft Entra roles, so a second engineer must approve.'
          : '.')
       & ' Type the group name to confirm.' }
approval:
  required: false

inputs:
  groupId: { type: string, format: guid, label: Group, picker: group }
  userIds: { type: user, multiple: true, maxItems: 500, label: Users to add }
  reason: { type: string, label: Reason, required: false, multiline: true }

steps:
  - id: group
    type: graph
    mode: read
    describe: Look up the group
    request:
      method: GET
      path: /groups/${ $encode($guid(inputs.groupId)) }
      query:
        $select: id,displayName,uniqueName,groupTypes,mailEnabled,securityEnabled,onPremisesSyncEnabled,isAssignableToRole

  - id: notPortalGroup
    type: assert
    that: >-
      ${ $not($substring($lowercase(steps.group.output.uniqueName ? steps.group.output.uniqueName : ''), 0, 14) = 'sg-adminforge-' or $substring($lowercase(steps.group.output.displayName), 0, 14) = 'sg-adminforge-') }
    message: This group grants AdminForge roles. Change it in the Microsoft Entra admin center, outside AdminForge, so nobody can grant themselves portal access from inside the portal.

  - id: notDynamic
    type: assert
    that: ${ $not('DynamicMembership' in steps.group.output.groupTypes) }
    message: ${ steps.group.output.displayName & ' has dynamic membership; change its membership rule instead.' }

  - id: notSynced
    type: assert
    that: ${ $not(steps.group.output.onPremisesSyncEnabled = true) }
    message: ${ steps.group.output.displayName & ' is synced from on-premises AD; change its membership there.' }

  - id: notExchangeManaged
    type: assert
    that: ${ $not(steps.group.output.mailEnabled = true and $not('Unified' in steps.group.output.groupTypes)) }
    message: ${ steps.group.output.displayName & ' is a distribution list or mail-enabled security group; manage its members in Exchange Online.' }

  - id: notSelf
    type: assert
    that: ${ $not($lowercase(user.oid) in [inputs.userIds].$lowercase($)) }
    message: You can't add yourself to a group. Ask another engineer to add you.

  # Members of a role-assignable group receive its Microsoft Entra roles: a second engineer approves, and nobody being
  # added may approve it. The additions then run as the approver (who needs Privileged Role Administrator).
  - id: approve
    type: approval
    when: ${ steps.group.output.isAssignableToRole = true }
    message: >-
      ${ 'Add ' & $count(inputs.userIds) & ' member(s) to the role-assignable group ' & steps.group.output.displayName
         & '. Members receive its Microsoft Entra roles.' & (inputs.reason ? ' Reason: ' & inputs.reason : '') }
    approvers: [Playbook.Approver]
    minApprovals: 1
    expiresIn: PT8H
    excludes: ${ inputs.userIds }

  - id: add
    type: forEach
    items: ${ [inputs.userIds] }
    as: memberId
    concurrency: 5
    steps:
      - id: addMember
        type: graph
        mode: write
        describe: ${ 'Add ' & memberId & ' to ' & steps.group.output.displayName }
        # Graph answers 400 when the user is already a member; carry on with the rest of the list.
        onError: continue
        request:
          method: POST
          path: /groups/${ $encode($guid(inputs.groupId)) }/members/$ref
          body:
            "@odata.id": https://graph.microsoft.com/v1.0/directoryObjects/${ $guid(memberId) }
        compensate:
          type: graph
          describe: Remove the member again
          request:
            method: DELETE
            path: /groups/${ $encode($guid(inputs.groupId)) }/members/${ $encode($guid(memberId)) }/$ref

outputs:
  summary: ${ 'Requested ' & $count(inputs.userIds) & ' addition(s) to ' & steps.group.output.displayName & '. Users who were already members are reported as skipped.' }

tests:
  - name: refuses AdminForge's role groups
    inputs: { groupId: 00000000-0000-4000-8000-0000000002ff, userIds: [00000000-0000-4000-8000-000000000102] }
    mocks:
      group: { id: 00000000-0000-4000-8000-0000000002ff, displayName: SG-AdminForge-dev-Portal.Operator, uniqueName: sg-adminforge-dev-portal-operator, groupTypes: [], mailEnabled: false, securityEnabled: true, onPremisesSyncEnabled: null }
    expect: { status: failed, failedStep: notPortalGroup }
  - name: refuses a dynamic group
    inputs: { groupId: 00000000-0000-4000-8000-000000000203, userIds: [00000000-0000-4000-8000-000000000102] }
    mocks:
      group: { id: 00000000-0000-4000-8000-000000000203, displayName: All Employees (dynamic), groupTypes: [DynamicMembership], mailEnabled: false, securityEnabled: true, onPremisesSyncEnabled: null }
    expect: { status: failed, failedStep: notDynamic }
  - name: refuses a distribution list
    inputs: { groupId: 00000000-0000-4000-8000-000000000206, userIds: [00000000-0000-4000-8000-000000000102] }
    mocks:
      group: { id: 00000000-0000-4000-8000-000000000206, displayName: Finance Announcements, groupTypes: [], mailEnabled: true, securityEnabled: false, onPremisesSyncEnabled: null }
    expect: { status: failed, failedStep: notExchangeManaged }
  - name: plans adding a user to a cloud security group
    inputs: { groupId: 00000000-0000-4000-8000-000000000201, userIds: [00000000-0000-4000-8000-000000000102] }
    mocks:
      group: { id: 00000000-0000-4000-8000-000000000201, displayName: SG-App-Payroll-Users, groupTypes: [], mailEnabled: false, securityEnabled: true, onPremisesSyncEnabled: null, isAssignableToRole: false }
    expect:
      status: succeeded
      plan: [addMember]
      outputs: { summary: Requested 1 addition(s) to SG-App-Payroll-Users. Users who were already members are reported as skipped. }
  - name: refuses adding yourself
    inputs: { groupId: 00000000-0000-4000-8000-000000000201, userIds: [00000000-0000-4000-8000-000000000102, 00000000-0000-4000-8000-0000000000A1] }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      group: { id: 00000000-0000-4000-8000-000000000201, displayName: SG-App-Payroll-Users, groupTypes: [], mailEnabled: false, securityEnabled: true, onPremisesSyncEnabled: null, isAssignableToRole: false }
    expect: { status: failed, failedStep: notSelf }
  - name: adds members to a group that is not role-assignable without an approval
    dryRun: false
    inputs: { groupId: 00000000-0000-4000-8000-000000000201, userIds: [00000000-0000-4000-8000-000000000102] }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      group: { id: 00000000-0000-4000-8000-000000000201, displayName: SG-App-Payroll-Users, groupTypes: [], mailEnabled: false, securityEnabled: true, onPremisesSyncEnabled: null, isAssignableToRole: false }
    expect: { status: succeeded, steps: { approve: skipped, addMember: succeeded } }
  - name: waits for a second engineer before adding members to a role-assignable group
    dryRun: false
    inputs: { groupId: 00000000-0000-4000-8000-000000000208, userIds: [00000000-0000-4000-8000-000000000102] }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      group: { id: 00000000-0000-4000-8000-000000000208, displayName: SG-PIM-Identity-Admins, groupTypes: [], mailEnabled: false, securityEnabled: true, onPremisesSyncEnabled: null, isAssignableToRole: true }
    expect: { status: awaiting_approval }
