$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: identity.add-group-owner
version: 1.1.0
title: Add group owner
summary: Makes a user an owner of a group (owners manage membership and settings, and receive access reviews).
owner: identity-team
tags: [identity, groups, governance]
risk: medium
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph: [Group.ReadWrite.All, User.Read.All]
  entraRoles: [Groups Administrator]
confirm:
  type: click
  message: ${ 'Make ' & steps.owner.output.userPrincipalName & ' an owner of ' & steps.group.output.displayName & '?' }
approval:
  required: false

inputs:
  groupId: { type: string, format: guid, label: Group, picker: group }
  ownerId: { type: string, format: guid, label: New owner, picker: user }

steps:
  - id: group
    type: graph
    mode: read
    describe: Look up the group
    request:
      method: GET
      path: /groups/${ $encode($guid(inputs.groupId)) }
      query:
        $select: id,displayName,uniqueName,groupTypes,isAssignableToRole

  - id: notPortalGroup
    type: assert
    that: >-
      ${ $not($substring($lowercase(steps.group.output.uniqueName ? steps.group.output.uniqueName : ''), 0, 14) = 'sg-adminforge-' or $substring($lowercase(steps.group.output.displayName), 0, 14) = 'sg-adminforge-') }
    message: This group grants AdminForge roles. Change it in the Microsoft Entra admin center, outside AdminForge, so nobody can grant themselves portal access from inside the portal.

  - id: owner
    type: graph
    mode: read
    describe: Look up the new owner
    request:
      method: GET
      path: /users/${ $encode($guid(inputs.ownerId)) }
      query:
        $select: id,displayName,userPrincipalName,accountEnabled,userType

  - id: ownerActive
    type: assert
    that: ${ steps.owner.output.accountEnabled = true }
    message: ${ steps.owner.output.userPrincipalName & ' is blocked from signing in; choose an active account.' }

  - id: owners
    type: graph
    mode: read
    describe: Read current owners
    request:
      method: GET
      path: /groups/${ $encode($guid(inputs.groupId)) }/owners
      query:
        $select: id,displayName,userPrincipalName

  - id: notOwnerYet
    type: assert
    that: ${ $not($guid(inputs.ownerId) in steps.owners.output.value.id) }
    message: ${ steps.owner.output.userPrincipalName & ' already owns ' & steps.group.output.displayName & '.' }

  - id: addOwner
    type: graph
    mode: write
    describe: ${ 'Add ' & steps.owner.output.userPrincipalName & ' as owner of ' & steps.group.output.displayName }
    request:
      method: POST
      path: /groups/${ $encode($guid(inputs.groupId)) }/owners/$ref
      body:
        "@odata.id": https://graph.microsoft.com/v1.0/users/${ $guid(inputs.ownerId) }
    compensate:
      type: graph
      describe: Remove the owner again
      request:
        method: DELETE
        path: /groups/${ $encode($guid(inputs.groupId)) }/owners/${ $encode($guid(inputs.ownerId)) }/$ref

outputs:
  summary: ${ steps.owner.output.userPrincipalName & ' now owns ' & steps.group.output.displayName & '.' }

tests:
  - name: refuses AdminForge's role groups
    inputs: { groupId: 00000000-0000-4000-8000-0000000002ff, ownerId: 00000000-0000-4000-8000-000000000101 }
    mocks:
      group: { id: 00000000-0000-4000-8000-0000000002ff, displayName: SG-AdminForge-dev-Portal.Operator, uniqueName: sg-adminforge-dev-portal-operator, groupTypes: [], mailEnabled: false, securityEnabled: true, onPremisesSyncEnabled: null }
    expect: { status: failed, failedStep: notPortalGroup }
  - name: refuses an existing owner
    inputs: { groupId: 00000000-0000-4000-8000-000000000201, ownerId: 00000000-0000-4000-8000-000000000101 }
    mocks:
      group: { id: 00000000-0000-4000-8000-000000000201, displayName: SG-App-Payroll-Users, groupTypes: [] }
      owner: { id: 00000000-0000-4000-8000-000000000101, userPrincipalName: a.lee@example.com, accountEnabled: true, userType: Member }
      owners: { value: [{ id: 00000000-0000-4000-8000-000000000101, userPrincipalName: a.lee@example.com }] }
    expect: { status: failed, failedStep: notOwnerYet }
  - name: plans adding a second owner
    inputs: { groupId: 00000000-0000-4000-8000-000000000201, ownerId: 00000000-0000-4000-8000-000000000102 }
    mocks:
      group: { id: 00000000-0000-4000-8000-000000000201, displayName: SG-App-Payroll-Users, groupTypes: [] }
      owner: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      owners: { value: [{ id: 00000000-0000-4000-8000-000000000101, userPrincipalName: a.lee@example.com }] }
    expect:
      status: succeeded
      plan: [addOwner]
      outputs: { summary: m.chen@example.com now owns SG-App-Payroll-Users. }
