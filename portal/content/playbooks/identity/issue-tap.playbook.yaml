$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: identity.issue-tap
version: 1.1.0
title: Issue Temporary Access Pass
summary: >-
  Creates a time-limited Temporary Access Pass so a user can sign in and register MFA or passwordless methods
  (onboarding, lost device, account recovery). Checks the tenant's TAP policy first; the pass is shown once. Not for your own account or for the people who approve AdminForge changes.
owner: identity-team
tags: [identity, users, mfa, helpdesk]
risk: high
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph: [User.Read.All, Directory.Read.All, Application.Read.All, Policy.Read.All, UserAuthenticationMethod.ReadWrite.All]
  # Privileged Authentication Administrator is needed when the target holds an admin role.
  entraRoles: [Authentication Administrator]
confirm:
  type: typed
  value: ${ steps.lookup.output.userPrincipalName }
  message: >-
    ${ 'Anyone holding the pass can sign in as this user for ' & inputs.lifetimeMinutes & ' minutes'
       & (inputs.isUsableOnce = true ? ' (one use)' : '') & '. Verify the requester first. Type the sign-in name to confirm.' }
approval:
  required: false

inputs:
  userId: { type: string, format: guid, label: User, picker: user }
  lifetimeMinutes: { type: number, label: Valid for, unit: minutes, default: 60, min: 10, max: 43200, integer: true }
  isUsableOnce: { type: boolean, label: One-time use, default: true }
  replaceExisting: { type: boolean, label: Replace an existing pass, default: true }
  reason: { type: string, label: Reason, minLength: 10, multiline: true }

steps:
  - id: lookup
    type: graph
    mode: read
    describe: Look up the user
    request:
      method: GET
      path: /users/${ $encode($guid(inputs.userId)) }
      query:
        $select: id,displayName,userPrincipalName,accountEnabled,userType

  - id: notSelf
    type: assert
    that: ${ $not($guid(inputs.userId) = $lowercase(user.oid)) }
    message: You can't issue a Temporary Access Pass for your own account. Ask another engineer.

  # The people who approve AdminForge changes — everyone holding Playbook.Approver or Portal.Admin on AdminForge's
  # Read app, through a group or directly — get no new credential from an engineer through AdminForge: whoever held it
  # could approve their own changes as a second person. Read from the role assignments, not group names.
  - id: readAppConfigured
    type: assert
    that: ${ $exists(env.AF_READ_CLIENT_ID) and $string(env.AF_READ_CLIENT_ID) != '' }
    message: >-
      AdminForge can't check who approves its changes because its Read app isn't configured (AF_READ_CLIENT_ID), so
      nothing was changed. An administrator sets it with pnpm adminforge provision entra.

  - id: portalApp
    type: graph
    mode: read
    describe: Read AdminForge's portal roles
    request:
      method: GET
      path: /servicePrincipals(appId='${ $guid(env.AF_READ_CLIENT_ID) }')
      query:
        $select: id,appRoles

  - id: roleHolders
    type: graph
    mode: read
    describe: Read who holds AdminForge's portal roles
    paging: all
    maxItems: 5000
    request:
      method: GET
      path: /servicePrincipals/${ $encode($guid(steps.portalApp.output.id)) }/appRoleAssignedTo
      query:
        $select: principalId,principalType,appRoleId
        $top: 999

  - id: approvers
    type: transform
    describe: The groups and people who approve AdminForge changes
    expression: >-
      ${ (
        $roles := [steps.portalApp.output.appRoles[value in ['Playbook.Approver', 'Portal.Admin']].$lowercase(id)];
        $held := [steps.roleHolders.output.value[$lowercase(appRoleId) in $roles]];
        {
          "complete": $not(steps.roleHolders.output.truncated = true),
          "groups": [$distinct($held[principalType = 'Group'].$lowercase(principalId))],
          "direct": $lowercase($guid(inputs.userId)) in $held.$lowercase(principalId)
        }
      ) }

  - id: approverGroupsReadable
    type: assert
    that: ${ steps.approvers.output.complete and $count(steps.approvers.output.groups) <= 20 }
    message: >-
      AdminForge couldn't check whether this person approves AdminForge changes (too many groups hold its portal roles),
      so nothing was changed. Make this change in the Microsoft Entra admin center.

  - id: targetGroups
    type: graph
    mode: read
    describe: Check whether the user belongs to a group that approves AdminForge changes
    when: ${ $count(steps.approvers.output.groups) > 0 }
    request:
      method: POST
      path: /users/${ $encode($guid(inputs.userId)) }/checkMemberGroups
      body:
        groupIds: ${ steps.approvers.output.groups[] }

  - id: notApprover
    type: assert
    that: ${ $not(steps.approvers.output.direct) and $count(steps.targetGroups.output.value) = 0 }
    message: >-
      ${ steps.lookup.output.userPrincipalName & ' approves AdminForge changes (Playbook Approver or Portal Admin). '
         & 'Issue a pass for them in the Microsoft Entra admin center, by someone other than you, so nobody can act as a second approver for their own change.' }

  - id: canSignIn
    type: assert
    that: ${ steps.lookup.output.accountEnabled = true }
    message: ${ steps.lookup.output.userPrincipalName & ' is blocked from signing in; enable sign-in first.' }

  - id: policy
    type: graph
    mode: read
    describe: Read the Temporary Access Pass policy
    request:
      method: GET
      path: /policies/authenticationMethodsPolicy/authenticationMethodConfigurations/TemporaryAccessPass

  - id: policyEnabled
    type: assert
    that: ${ steps.policy.output.state = 'enabled' }
    message: The Temporary Access Pass method is turned off in the authentication methods policy (Entra admin center → Authentication methods → Policies).

  - id: lifetimeAllowed
    type: assert
    that: >-
      ${ inputs.lifetimeMinutes >= steps.policy.output.minimumLifetimeInMinutes
         and inputs.lifetimeMinutes <= steps.policy.output.maximumLifetimeInMinutes }
    message: >-
      ${ 'The policy allows passes valid for ' & steps.policy.output.minimumLifetimeInMinutes & '–'
         & steps.policy.output.maximumLifetimeInMinutes & ' minutes; you asked for ' & inputs.lifetimeMinutes & '.' }

  - id: usageAllowed
    type: assert
    that: ${ $not(steps.policy.output.isUsableOnce = true and inputs.isUsableOnce = false) }
    message: The policy only allows one-time passes; turn on One-time use.

  - id: existing
    type: graph
    mode: read
    describe: Check for an existing pass (a user can hold only one)
    request:
      method: GET
      path: /users/${ $encode($guid(inputs.userId)) }/authentication/temporaryAccessPassMethods

  - id: noConflict
    type: assert
    that: ${ $count(steps.existing.output.value) = 0 or inputs.replaceExisting = true }
    message: ${ steps.lookup.output.userPrincipalName & ' already has a Temporary Access Pass. Turn on Replace to issue a new one.' }

  - id: removeExisting
    type: forEach
    items: ${ [steps.existing.output.value] }
    as: pass
    steps:
      - id: removePass
        type: graph
        mode: write
        describe: Delete the existing Temporary Access Pass
        request:
          method: DELETE
          path: /users/${ $encode($guid(inputs.userId)) }/authentication/temporaryAccessPassMethods/${ $encode(pass.id) }

  - id: create
    type: graph
    mode: write
    describe: "${ 'Create a ' & inputs.lifetimeMinutes & '-minute' & (inputs.isUsableOnce = true ? ' one-time' : '') & ' Temporary Access Pass' }"
    idempotent: false
    request:
      method: POST
      path: /users/${ $encode($guid(inputs.userId)) }/authentication/temporaryAccessPassMethods
      body:
        lifetimeInMinutes: ${ inputs.lifetimeMinutes }
        isUsableOnce: ${ inputs.isUsableOnce }
    # Shown once to the engineer who ran this (live on the run page); never stored, logged, or visible to later steps.
    secretOutputs: [temporaryAccessPass]
    dryRunOutput:
      temporaryAccessPass: null
      lifetimeInMinutes: ${ inputs.lifetimeMinutes }
      isUsableOnce: ${ inputs.isUsableOnce }
      startDateTime: null

outputs:
  summary: >-
    ${ 'Temporary Access Pass issued for ' & steps.lookup.output.userPrincipalName & ', valid ' & inputs.lifetimeMinutes
       & ' minutes' & (inputs.isUsableOnce = true ? ', one use' : '') & '. Share it over a verified channel; it is not shown again.' }
  # Returned once by Entra ID. See the report: the engine must treat this output as secret (redact at rest).
  validUntil: >-
    ${ steps.create.output.startDateTime
       ? $fromMillis($toMillis(steps.create.output.startDateTime) + steps.create.output.lifetimeInMinutes * 60000) }

tests:
  - name: stops with a setup message when the Read app isn't configured
    inputs: { userId: 00000000-0000-4000-8000-000000000102, lifetimeMinutes: 60, isUsableOnce: true, replaceExisting: true, reason: new phone ticket 4401 }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
    expect: { status: failed, failedStep: readAppConfigured }
  - name: refuses your own account
    inputs: { userId: 00000000-0000-4000-8000-0000000000A1, lifetimeMinutes: 60, isUsableOnce: true, replaceExisting: true, reason: new phone ticket 4401 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-0000000000a1, userPrincipalName: avery@example.com, accountEnabled: true, userType: Member }
    expect: { status: failed, failedStep: notSelf }
  - name: refuses someone who approves AdminForge changes (Playbook Approver or Portal Admin group)
    inputs: { userId: 00000000-0000-4000-8000-000000000102, lifetimeMinutes: 60, isUsableOnce: true, replaceExisting: true, reason: new phone ticket 4401 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [00000000-0000-4000-8000-0000000002FA] }
    expect: { status: failed, failedStep: notApprover }
  - name: refuses when the TAP method is disabled in policy
    inputs: { userId: 00000000-0000-4000-8000-000000000102, lifetimeMinutes: 60, isUsableOnce: true, replaceExisting: true, reason: new phone ticket 4401 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [] }
      policy: { id: TemporaryAccessPass, state: disabled, minimumLifetimeInMinutes: 60, maximumLifetimeInMinutes: 480, isUsableOnce: false }
    expect: { status: failed, failedStep: policyEnabled }
  - name: refuses a lifetime outside the policy
    inputs: { userId: 00000000-0000-4000-8000-000000000102, lifetimeMinutes: 1440, isUsableOnce: true, replaceExisting: true, reason: new phone ticket 4402 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [] }
      policy: { id: TemporaryAccessPass, state: enabled, minimumLifetimeInMinutes: 60, maximumLifetimeInMinutes: 480, isUsableOnce: false }
    expect: { status: failed, failedStep: lifetimeAllowed }
  - name: refuses to replace an existing pass unless asked
    inputs: { userId: 00000000-0000-4000-8000-000000000102, lifetimeMinutes: 60, isUsableOnce: true, replaceExisting: false, reason: new phone ticket 4403 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [] }
      policy: { id: TemporaryAccessPass, state: enabled, minimumLifetimeInMinutes: 60, maximumLifetimeInMinutes: 480, isUsableOnce: false }
      existing: { value: [{ id: 00000000-0000-4000-8000-00000000f301, lifetimeInMinutes: 60 }] }
    expect: { status: failed, failedStep: noConflict }
  - name: replaces the existing pass and plans a new one
    inputs: { userId: 00000000-0000-4000-8000-000000000102, lifetimeMinutes: 120, isUsableOnce: true, replaceExisting: true, reason: new phone ticket 4404 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [] }
      policy: { id: TemporaryAccessPass, state: enabled, minimumLifetimeInMinutes: 60, maximumLifetimeInMinutes: 480, isUsableOnce: false }
      existing: { value: [{ id: 00000000-0000-4000-8000-00000000f301, lifetimeInMinutes: 60 }] }
    expect:
      status: succeeded
      plan: [removePass, create]
  - name: plans a pass when none exists
    inputs: { userId: 00000000-0000-4000-8000-000000000102, lifetimeMinutes: 60, isUsableOnce: true, replaceExisting: true, reason: new phone ticket 4405 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [] }
      policy: { id: TemporaryAccessPass, state: enabled, minimumLifetimeInMinutes: 60, maximumLifetimeInMinutes: 480, isUsableOnce: false }
      existing: { value: [] }
    expect:
      status: succeeded
      plan: [create]
