$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: identity.remove-app-owner
version: 1.1.0
title: Remove app registration owner
summary: Removes an owner from an app registration. Refuses to remove the last owner, so every app stays accountable.
owner: identity-team
tags: [identity, apps, governance]
risk: medium
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph: [Application.ReadWrite.All]
  entraRoles: [Cloud Application Administrator]
confirm:
  type: click
  message: ${ 'Remove ' & steps.current.output.displayName & ' as owner of ' & steps.app.output.displayName & '?' }
approval:
  required: false

inputs:
  appObjectId: { type: string, format: guid, label: App registration (object id), picker: app }
  ownerId: { type: string, format: guid, label: Owner to remove, picker: user }

steps:
  - id: app
    type: graph
    mode: read
    describe: Look up the app registration
    request:
      method: GET
      path: /applications/${ $encode($guid(inputs.appObjectId)) }
      query:
        $select: id,appId,displayName

  - id: notPortalApp
    type: assert
    that: >-
      ${ $not(steps.app.output.appId in $append([env.AF_READ_CLIENT_ID, env.AF_WRITE_CLIENT_ID, env.AF_AUTOMATION_CLIENT_ID], $map($split(env.AF_PROTECTED_APP_IDS ? env.AF_PROTECTED_APP_IDS : '', ','), function($v) { $trim($v) }))) }
    message: This is one of AdminForge's own app registrations (or a protected app such as the provisioner); manage its owners in the Microsoft Entra admin center.

  - id: owners
    type: graph
    mode: read
    describe: Read current owners
    request:
      method: GET
      path: /applications/${ $encode($guid(inputs.appObjectId)) }/owners
      query:
        $select: id,displayName,userPrincipalName

  - id: current
    type: transform
    expression: ${ steps.owners.output.value[id = $lowercase($$.inputs.ownerId)][0] }

  - id: isOwner
    type: assert
    that: ${ $exists(steps.current.output.id) }
    message: ${ 'That account is not an owner of ' & steps.app.output.displayName & '.' }

  - id: notLastOwner
    type: assert
    that: ${ $count(steps.owners.output.value) > 1 }
    message: ${ steps.current.output.displayName & ' is the only owner of ' & steps.app.output.displayName & '. Add another owner first.' }

  - id: removeOwner
    type: graph
    mode: write
    describe: ${ 'Remove ' & steps.current.output.displayName & ' as owner of ' & steps.app.output.displayName }
    request:
      method: DELETE
      path: /applications/${ $encode($guid(inputs.appObjectId)) }/owners/${ $encode($guid(inputs.ownerId)) }/$ref
    compensate:
      type: graph
      describe: Add the owner back
      request:
        method: POST
        path: /applications/${ $encode($guid(inputs.appObjectId)) }/owners/$ref
        body:
          "@odata.id": https://graph.microsoft.com/v1.0/directoryObjects/${ $guid(inputs.ownerId) }

outputs:
  summary: ${ steps.current.output.displayName & ' no longer owns the app registration ' & steps.app.output.displayName & '.' }

tests:
  - name: refuses AdminForge's own and protected apps (AF_PROTECTED_APP_IDS)
    inputs: { appObjectId: 00000000-0000-4000-8000-000000000301, ownerId: 00000000-0000-4000-8000-000000000101 }
    env: { AF_PROTECTED_APP_IDS: "00000000-0000-4000-8001-0000000000ff, 00000000-0000-4000-8001-0000000003ff" }
    mocks:
      app: { id: 00000000-0000-4000-8000-000000000301, appId: 00000000-0000-4000-8001-0000000003ff, displayName: Provisioner, passwordCredentials: [], keyCredentials: [] }
    expect: { status: failed, failedStep: notPortalApp }
  - name: refuses to remove the last owner
    inputs: { appObjectId: 00000000-0000-4000-8000-000000000301, ownerId: 00000000-0000-4000-8000-000000000101 }
    mocks:
      app: { id: 00000000-0000-4000-8000-000000000301, appId: 00000000-0000-4000-8001-000000000301, displayName: Example HR Sync }
      owners: { value: [{ id: 00000000-0000-4000-8000-000000000101, displayName: Avery Lee, userPrincipalName: a.lee@example.com }] }
    expect: { status: failed, failedStep: notLastOwner }
  - name: plans removing one of two owners
    inputs: { appObjectId: 00000000-0000-4000-8000-000000000301, ownerId: 00000000-0000-4000-8000-000000000101 }
    mocks:
      app: { id: 00000000-0000-4000-8000-000000000301, appId: 00000000-0000-4000-8001-000000000301, displayName: Example HR Sync }
      owners:
        value:
          - { id: 00000000-0000-4000-8000-000000000101, displayName: Avery Lee, userPrincipalName: a.lee@example.com }
          - { id: 00000000-0000-4000-8000-000000000102, displayName: Morgan Chen, userPrincipalName: m.chen@example.com }
    expect:
      status: succeeded
      plan: [removeOwner]
      outputs: { summary: Avery Lee no longer owns the app registration Example HR Sync. }
