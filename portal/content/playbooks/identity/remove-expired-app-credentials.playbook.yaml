$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: identity.remove-expired-app-credentials
version: 1.2.0
title: Remove expired app credentials
summary: >-
  Removes client secrets that have already expired from an app registration (credential hygiene; expired secrets are
  noise in reviews and a sign of unmanaged apps). Expired certificates are listed for manual removal, because Graph
  only removes a certificate with a proof signed by another valid key.
owner: identity-team
tags: [identity, apps, credentials, hygiene]
risk: medium
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph: [Application.ReadWrite.All]
  entraRoles: [Cloud Application Administrator]
# Typed: offered as a bulk action (risk medium or higher), where a run asks for the number of items instead. One
# app: its name, or its object id when the name can't be typed (`confirmAs`).
confirm:
  type: typed
  value: ${ steps.confirmAs.output.value }
  message: >-
    ${ 'Remove ' & $count(steps.expired.output.secrets) & ' expired secret(s) from '
       & (steps.confirmAs.output.byName ? steps.app.output.displayName : 'the app registration with object id ' & steps.app.output.id)
       & ': ' & $join(steps.expired.output.secrets.label, ', ') & '?' }
approval:
  required: false

inputs:
  appObjectId: { type: string, format: guid, label: App registration (object id), picker: app }
  graceDays: { type: number, label: Expired for at least, unit: days, default: 0, min: 0, max: 365, integer: true }

steps:
  - id: app
    type: graph
    mode: read
    describe: Look up the app registration and its credentials
    request:
      method: GET
      path: /applications/${ $encode($guid(inputs.appObjectId)) }
      query:
        $select: id,appId,displayName,passwordCredentials,keyCredentials

  - id: notPortalApp
    type: assert
    that: >-
      ${ $not(steps.app.output.appId in $append([env.AF_READ_CLIENT_ID, env.AF_WRITE_CLIENT_ID, env.AF_AUTOMATION_CLIENT_ID], $map($split(env.AF_PROTECTED_APP_IDS ? env.AF_PROTECTED_APP_IDS : '', ','), function($v) { $trim($v) }))) }
    message: This is one of AdminForge's own app registrations (or a protected app such as the provisioner). An AdminForge administrator manages its credentials through provisioning, so the portal's own configuration stays in step.

  # What the confirmation asks for: the app's name (chosen by whoever registered it), or its object id when the name has
  # nothing a person can type (spaces or invisible characters only) or holds a masked value — such a name could never be
  # confirmed (the class: what the API's comparison drops, control characters, anything outside the BMP).
  - id: confirmAs
    type: transform
    describe: Work out what the confirmation asks for
    expression: >-
      ${ (
        $name := steps.app.output.displayName;
        $byName := $type($name) = 'string'
          and $contains($name, /[^\s\u0000-\u001f\u007f-\u009f\u00ad\u034f\u0600-\u0605\u061c\u06dd\u070f\u0890\u0891\u08e2\u115f\u1160\u17b4\u17b5\u180b-\u180f\u200b-\u200f\u202a-\u202e\u2060-\u206f\u3164\ufe00-\ufe0f\uffa0\ufff0-\ufffb\ud800-\udfff]/)
          and $not($contains($name, '[redacted]'));
        { 'value': $byName ? $name : steps.app.output.id, 'byName': $byName }
      ) }

  - id: expired
    type: transform
    expression: >-
      ${ (
        $grace := inputs.graceDays ? inputs.graceDays : 0;
        $old := function($c) { $c.endDateTime and $daysUntil($c.endDateTime) < -$grace };
        {
          "secrets": [steps.app.output.passwordCredentials[$old($)].{
            "keyId": keyId,
            "label": (displayName ? displayName : keyId) & ' (expired ' & $substring(endDateTime, 0, 10) & ')'
          }],
          "certificates": [steps.app.output.keyCredentials[$old($)].((displayName ? displayName : keyId) & ' (expired ' & $substring(endDateTime, 0, 10) & ')')]
        }
      ) }

  - id: anyExpired
    type: assert
    that: ${ $count(steps.expired.output.secrets) > 0 }
    message: >-
      ${ steps.app.output.displayName & ' has no expired client secrets'
         & ($count(steps.expired.output.certificates) > 0 ? ' (expired certificates must be removed in the Entra admin center: ' & $join(steps.expired.output.certificates, ', ') & ')' : '') & '.' }

  - id: remove
    type: forEach
    items: ${ steps.expired.output.secrets }
    as: secret
    concurrency: 1
    steps:
      - id: removeSecret
        type: graph
        mode: write
        describe: ${ 'Remove secret ' & secret.label & ' (cannot be undone; the value is already unusable)' }
        request:
          method: POST
          path: /applications/${ $encode($guid(inputs.appObjectId)) }/removePassword
          body:
            keyId: ${ secret.keyId }

outputs:
  summary: ${ 'Removed ' & $count(steps.expired.output.secrets) & ' expired secret(s) from ' & steps.app.output.displayName & '.' }
  certificatesToRemoveManually: ${ steps.expired.output.certificates }

tests:
  - name: refuses AdminForge's own and protected apps (AF_PROTECTED_APP_IDS)
    inputs: { appObjectId: 00000000-0000-4000-8000-000000000302, graceDays: 0 }
    env: { AF_PROTECTED_APP_IDS: "00000000-0000-4000-8001-0000000000ff, 00000000-0000-4000-8001-0000000003ff" }
    mocks:
      app: { id: 00000000-0000-4000-8000-000000000302, appId: 00000000-0000-4000-8001-0000000003ff, displayName: Provisioner, passwordCredentials: [], keyCredentials: [] }
    expect: { status: failed, failedStep: notPortalApp }
  - name: fails when only certificates have expired
    inputs: { appObjectId: 00000000-0000-4000-8000-000000000302, graceDays: 0 }
    mocks:
      app:
        id: 00000000-0000-4000-8000-000000000302
        displayName: Example Portal
        passwordCredentials: [{ keyId: 00000000-0000-4000-8000-00000000c201, displayName: ci, endDateTime: "2099-01-01T00:00:00Z" }]
        keyCredentials: [{ keyId: 00000000-0000-4000-8000-00000000c202, displayName: CN=portal, endDateTime: "2020-01-01T00:00:00Z" }]
    expect: { status: failed, failedStep: anyExpired }
  - name: plans removing the expired secret only
    inputs: { appObjectId: 00000000-0000-4000-8000-000000000302, graceDays: 0 }
    mocks:
      app:
        id: 00000000-0000-4000-8000-000000000302
        displayName: Example Portal
        passwordCredentials:
          - { keyId: 00000000-0000-4000-8000-00000000c201, displayName: ci, endDateTime: "2099-01-01T00:00:00Z" }
          - { keyId: 00000000-0000-4000-8000-00000000c203, displayName: old-ci, endDateTime: "2020-06-30T00:00:00Z" }
        keyCredentials: []
    expect:
      status: succeeded
      plan: [removeSecret]
      outputs: { summary: Removed 1 expired secret(s) from Example Portal. }
