$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: identity.remove-group-members
version: 1.2.0
title: Remove group members
summary: >-
  Removes users, devices or nested groups from a cloud security or Microsoft 365 group. Refuses dynamic groups, groups
  synced from on-premises AD, distribution lists / mail-enabled security groups, AdminForge's own role groups and
  accounts marked as protected, such as break-glass accounts.
owner: identity-team
tags: [identity, groups, bulk]
risk: medium
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph: [Group.Read.All, GroupMember.ReadWrite.All]
  # Role-assignable groups also need Privileged Role Administrator.
  entraRoles: [Groups Administrator]
# Typed: offered as a bulk action (risk medium or higher), where a run asks for the number of items instead. One
# group: its name, or its object id when the name can't be typed (`confirmAs`).
confirm:
  type: typed
  value: ${ steps.confirmAs.output.value }
  message: >-
    ${ 'Remove ' & $count(inputs.memberIds) & ' member(s) from '
       & (steps.confirmAs.output.byName ? steps.group.output.displayName : 'the group with object id ' & steps.group.output.id)
       & '? They lose any access, licences or roles granted through this group.' }
approval:
  required: false

inputs:
  groupId: { type: string, format: guid, label: Group, picker: group }
  memberIds:
    type: user
    multiple: true
    maxItems: 500
    label: Members to remove
    description: Object ids of users, devices or groups.
  reason: { type: string, label: Reason, required: false, multiline: true }

steps:
  - id: group
    type: graph
    mode: read
    describe: Look up the group
    request:
      method: GET
      path: /groups/${ $encode($guid(inputs.groupId)) }
      query:
        $select: id,displayName,uniqueName,groupTypes,mailEnabled,securityEnabled,onPremisesSyncEnabled,isAssignableToRole

  # What the confirmation asks for: the group's name (anyone who may create groups chooses one), or its object id when
  # the name has nothing a person can type (spaces or invisible characters only) or holds a masked value — such a name
  # could never be confirmed (the class: what the API's comparison drops, control characters, anything outside the BMP).
  - id: confirmAs
    type: transform
    describe: Work out what the confirmation asks for
    expression: >-
      ${ (
        $name := steps.group.output.displayName;
        $byName := $type($name) = 'string'
          and $contains($name, /[^\s\u0000-\u001f\u007f-\u009f\u00ad\u034f\u0600-\u0605\u061c\u06dd\u070f\u0890\u0891\u08e2\u115f\u1160\u17b4\u17b5\u180b-\u180f\u200b-\u200f\u202a-\u202e\u2060-\u206f\u3164\ufe00-\ufe0f\uffa0\ufff0-\ufffb\ud800-\udfff]/)
          and $not($contains($name, '[redacted]'));
        { 'value': $byName ? $name : steps.group.output.id, 'byName': $byName }
      ) }

  # AdminForge refuses any write naming a portal group or a protected account by id (protected_object); these checks
  # explain it before anything runs.
  - id: notPortalGroup
    type: assert
    that: >-
      ${ $not($substring($lowercase(steps.group.output.uniqueName ? steps.group.output.uniqueName : ''), 0, 14) = 'sg-adminforge-' or $substring($lowercase(steps.group.output.displayName), 0, 14) = 'sg-adminforge-') }
    message: This group grants AdminForge roles. Change its members in the Microsoft Entra admin center, outside AdminForge, so nobody can take portal access away from others (or grant it) from inside the portal.

  - id: notProtectedMembers
    type: assert
    that: >-
      ${ (
        $protected := [$split(env.AF_PROTECTED_USER_IDS ? env.AF_PROTECTED_USER_IDS : '', /[\s,]+/).$lowercase($)[$ != ''] ];
        $count([inputs.memberIds][$lowercase($) in $protected]) = 0
      ) }
    message: One of these accounts is marked as protected (a break-glass or emergency-access account). Change its group memberships in the Microsoft Entra admin center, outside AdminForge.

  - id: notDynamic
    type: assert
    that: ${ $not('DynamicMembership' in steps.group.output.groupTypes) }
    message: ${ steps.group.output.displayName & ' has dynamic membership; change its membership rule instead.' }

  - id: notSynced
    type: assert
    that: ${ $not(steps.group.output.onPremisesSyncEnabled = true) }
    message: ${ steps.group.output.displayName & ' is synced from on-premises AD; change its membership there.' }

  - id: notExchangeManaged
    type: assert
    that: ${ $not(steps.group.output.mailEnabled = true and $not('Unified' in steps.group.output.groupTypes)) }
    message: ${ steps.group.output.displayName & ' is a distribution list or mail-enabled security group; manage its members in Exchange Online.' }

  - id: remove
    type: forEach
    items: ${ [inputs.memberIds] }
    as: memberId
    concurrency: 5
    steps:
      - id: removeMember
        type: graph
        mode: write
        describe: ${ 'Remove ' & memberId & ' from ' & steps.group.output.displayName }
        onError: continue
        request:
          method: DELETE
          path: /groups/${ $encode($guid(inputs.groupId)) }/members/${ $encode($guid(memberId)) }/$ref
        compensate:
          type: graph
          describe: Add the member back
          request:
            method: POST
            path: /groups/${ $encode($guid(inputs.groupId)) }/members/$ref
            body:
              "@odata.id": https://graph.microsoft.com/v1.0/directoryObjects/${ $guid(memberId) }

outputs:
  summary: ${ 'Requested ' & $count(inputs.memberIds) & ' removal(s) from ' & steps.group.output.displayName & '.' }

tests:
  - name: refuses AdminForge's role groups
    inputs: { groupId: 00000000-0000-4000-8000-0000000002ff, memberIds: [00000000-0000-4000-8000-000000000102] }
    mocks:
      group: { id: 00000000-0000-4000-8000-0000000002ff, displayName: SG-AdminForge-dev-Playbook.Approver, uniqueName: sg-adminforge-dev-playbook-approver, groupTypes: [], mailEnabled: false, securityEnabled: true, onPremisesSyncEnabled: null }
    expect: { status: failed, failedStep: notPortalGroup }
  - name: refuses removing a protected (break-glass) account
    env: { AF_PROTECTED_USER_IDS: "00000000-0000-4000-8000-0000000001ff, 00000000-0000-4000-8000-0000000001fe" }
    inputs: { groupId: 00000000-0000-4000-8000-000000000201, memberIds: [00000000-0000-4000-8000-000000000103, 00000000-0000-4000-8000-0000000001FE] }
    mocks:
      group: { id: 00000000-0000-4000-8000-000000000201, displayName: SG-App-Payroll-Users, groupTypes: [], mailEnabled: false, securityEnabled: true, onPremisesSyncEnabled: null }
    expect: { status: failed, failedStep: notProtectedMembers }
  - name: refuses a group synced from on-premises AD
    inputs: { groupId: 00000000-0000-4000-8000-000000000205, memberIds: [00000000-0000-4000-8000-000000000108] }
    mocks:
      group: { id: 00000000-0000-4000-8000-000000000205, displayName: GG-Engineering (AD), groupTypes: [], mailEnabled: false, securityEnabled: true, onPremisesSyncEnabled: true }
    expect: { status: failed, failedStep: notSynced }
  - name: plans removing a member from a Microsoft 365 group
    env: { AF_PROTECTED_USER_IDS: 00000000-0000-4000-8000-0000000001ff }
    inputs: { groupId: 00000000-0000-4000-8000-000000000202, memberIds: [00000000-0000-4000-8000-000000000103] }
    mocks:
      group: { id: 00000000-0000-4000-8000-000000000202, displayName: Project Falcon, groupTypes: [Unified], mailEnabled: true, securityEnabled: false, onPremisesSyncEnabled: null }
    expect:
      status: succeeded
      plan: [removeMember]
      outputs: { summary: Requested 1 removal(s) from Project Falcon. }
