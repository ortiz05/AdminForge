$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: identity.reset-mfa
version: 1.1.0
title: Reset MFA methods
summary: >-
  Removes a user's registered MFA methods (Authenticator, OATH tokens, phone, Temporary Access Pass; optionally FIDO2 keys,
  passkeys, Windows Hello and platform credentials) so they must register again. The password is kept. Not for your
  own account or for the people who approve AdminForge changes.
owner: identity-team
tags: [identity, users, mfa, incident]
risk: high
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph: [User.Read.All, Directory.Read.All, Application.Read.All, UserAuthenticationMethod.ReadWrite.All, User.RevokeSessions.All]
  # Privileged Authentication Administrator is needed when the target holds an admin role.
  entraRoles: [Authentication Administrator]
confirm:
  type: typed
  value: ${ steps.lookup.output.userPrincipalName }
  message: >-
    ${ 'Removes ' & $count(steps.plan.output) & ' method(s): ' & $join(steps.plan.output.label, ', ')
       & '. Removed methods cannot be restored; the user re-registers at next sign-in. Type the sign-in name to confirm.' }
approval:
  required: false

inputs:
  userId: { type: string, format: guid, label: User, picker: user }
  includePhishingResistant:
    type: boolean
    label: Also remove FIDO2 keys, passkeys, Windows Hello and platform credentials
    description: Leave off for a lost phone; turn on when the account is compromised (an attacker may have registered a passkey).
    default: false
  revokeSessions: { type: boolean, label: Also sign the user out everywhere, default: true }
  reason: { type: string, label: Reason, minLength: 10, multiline: true }

steps:
  - id: lookup
    type: graph
    mode: read
    describe: Look up the user
    request:
      method: GET
      path: /users/${ $encode($guid(inputs.userId)) }
      query:
        $select: id,displayName,userPrincipalName,accountEnabled,userType

  - id: notSelf
    type: assert
    that: ${ $not($guid(inputs.userId) = $lowercase(user.oid)) }
    message: You can't remove your own MFA methods here. Ask another engineer.

  # The people who approve AdminForge changes — everyone holding Playbook.Approver or Portal.Admin on AdminForge's
  # Read app, through a group or directly — get no new credential from an engineer through AdminForge: whoever held it
  # could approve their own changes as a second person. Read from the role assignments, not group names.
  - id: readAppConfigured
    type: assert
    that: ${ $exists(env.AF_READ_CLIENT_ID) and $string(env.AF_READ_CLIENT_ID) != '' }
    message: >-
      AdminForge can't check who approves its changes because its Read app isn't configured (AF_READ_CLIENT_ID), so
      nothing was changed. An administrator sets it with pnpm adminforge provision entra.

  - id: portalApp
    type: graph
    mode: read
    describe: Read AdminForge's portal roles
    request:
      method: GET
      path: /servicePrincipals(appId='${ $guid(env.AF_READ_CLIENT_ID) }')
      query:
        $select: id,appRoles

  - id: roleHolders
    type: graph
    mode: read
    describe: Read who holds AdminForge's portal roles
    paging: all
    maxItems: 5000
    request:
      method: GET
      path: /servicePrincipals/${ $encode($guid(steps.portalApp.output.id)) }/appRoleAssignedTo
      query:
        $select: principalId,principalType,appRoleId
        $top: 999

  - id: approvers
    type: transform
    describe: The groups and people who approve AdminForge changes
    expression: >-
      ${ (
        $roles := [steps.portalApp.output.appRoles[value in ['Playbook.Approver', 'Portal.Admin']].$lowercase(id)];
        $held := [steps.roleHolders.output.value[$lowercase(appRoleId) in $roles]];
        {
          "complete": $not(steps.roleHolders.output.truncated = true),
          "groups": [$distinct($held[principalType = 'Group'].$lowercase(principalId))],
          "direct": $lowercase($guid(inputs.userId)) in $held.$lowercase(principalId)
        }
      ) }

  - id: approverGroupsReadable
    type: assert
    that: ${ steps.approvers.output.complete and $count(steps.approvers.output.groups) <= 20 }
    message: >-
      AdminForge couldn't check whether this person approves AdminForge changes (too many groups hold its portal roles),
      so nothing was changed. Make this change in the Microsoft Entra admin center.

  - id: targetGroups
    type: graph
    mode: read
    describe: Check whether the user belongs to a group that approves AdminForge changes
    when: ${ $count(steps.approvers.output.groups) > 0 }
    request:
      method: POST
      path: /users/${ $encode($guid(inputs.userId)) }/checkMemberGroups
      body:
        groupIds: ${ steps.approvers.output.groups[] }

  - id: notApprover
    type: assert
    that: ${ $not(steps.approvers.output.direct) and $count(steps.targetGroups.output.value) = 0 }
    message: >-
      ${ steps.lookup.output.userPrincipalName & ' approves AdminForge changes (Playbook Approver or Portal Admin). '
         & 'Change their MFA methods for them in the Microsoft Entra admin center, by someone other than you, so nobody can act as a second approver for their own change.' }

  - id: methods
    type: graph
    mode: read
    describe: List registered authentication methods
    request:
      method: GET
      path: /users/${ $encode($guid(inputs.userId)) }/authentication/methods

  # Maps each method type to its collection; phones go last because the default phone can't be removed while others exist.
  - id: plan
    type: transform
    expression: >-
      ${ (
        $strong := inputs.includePhishingResistant = true;
        $types := {
          "#microsoft.graph.microsoftAuthenticatorAuthenticationMethod": { "segment": "microsoftAuthenticatorMethods", "label": "Microsoft Authenticator", "order": 1, "strong": false },
          "#microsoft.graph.softwareOathAuthenticationMethod": { "segment": "softwareOathMethods", "label": "Software OATH token", "order": 2, "strong": false },
          "#microsoft.graph.temporaryAccessPassAuthenticationMethod": { "segment": "temporaryAccessPassMethods", "label": "Temporary Access Pass", "order": 3, "strong": false },
          "#microsoft.graph.fido2AuthenticationMethod": { "segment": "fido2Methods", "label": "FIDO2 key / passkey", "order": 4, "strong": true },
          "#microsoft.graph.windowsHelloForBusinessAuthenticationMethod": { "segment": "windowsHelloForBusinessMethods", "label": "Windows Hello for Business", "order": 5, "strong": true },
          "#microsoft.graph.platformCredentialAuthenticationMethod": { "segment": "platformCredentialMethods", "label": "Platform credential", "order": 6, "strong": true },
          "#microsoft.graph.phoneAuthenticationMethod": { "segment": "phoneMethods", "label": "Phone", "order": 9, "strong": false }
        };
        $rows := [steps.methods.output.value.(
          $t := $lookup($types, `@odata.type`);
          $t and ($t.strong = false or $strong) ? {
            "id": id,
            "segment": $t.segment,
            "label": $t.label & (displayName ? ' (' & displayName & ')' : phoneNumber ? ' (' & phoneType & ')' : ''),
            "order": $t.order
          }
        )];
        [$rows^(order)]
      ) }

  - id: hasMethods
    type: assert
    that: ${ $count(steps.plan.output) > 0 }
    message: >-
      ${ steps.lookup.output.userPrincipalName & ' has no MFA methods to remove'
         & (inputs.includePhishingResistant = true ? '.' : ' (phishing-resistant methods are kept unless you include them).') }

  - id: remove
    type: forEach
    items: ${ steps.plan.output }
    as: method
    concurrency: 1
    steps:
      - id: removeMethod
        type: graph
        mode: write
        describe: ${ 'Remove ' & method.label }
        onError: continue
        request:
          method: DELETE
          path: /users/${ $encode($guid(inputs.userId)) }/authentication/${ $encode(method.segment) }/${ $encode(method.id) }

  - id: revoke
    type: graph
    mode: write
    describe: Revoke refresh tokens and session cookies
    when: ${ inputs.revokeSessions = true }
    request:
      method: POST
      path: /users/${ $encode($guid(inputs.userId)) }/revokeSignInSessions
    dryRunOutput: { value: true }

outputs:
  summary: >-
    ${ 'Removed ' & $count(steps.plan.output) & ' MFA method(s) for ' & steps.lookup.output.userPrincipalName
       & (inputs.revokeSessions = true ? ' and revoked all sessions' : '')
       & '. The user is asked to register again at next sign-in; issue a Temporary Access Pass if they cannot.' }
  removed: ${ [steps.plan.output.label] }

tests:
  - name: stops with a setup message when the Read app isn't configured
    inputs: { userId: 00000000-0000-4000-8000-000000000102, includePhishingResistant: false, revokeSessions: true, reason: lost phone ticket 3301 }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
    expect: { status: failed, failedStep: readAppConfigured }
  - name: refuses your own account
    inputs: { userId: 00000000-0000-4000-8000-0000000000a1, includePhishingResistant: false, revokeSessions: true, reason: lost phone ticket 3301 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-0000000000a1, userPrincipalName: avery@example.com, accountEnabled: true, userType: Member }
    expect: { status: failed, failedStep: notSelf }
  - name: refuses someone who approves AdminForge changes (Playbook Approver or Portal Admin group)
    inputs: { userId: 00000000-0000-4000-8000-000000000102, includePhishingResistant: false, revokeSessions: true, reason: lost phone ticket 3301 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [00000000-0000-4000-8000-0000000002FA] }
    expect: { status: failed, failedStep: notApprover }
  - name: fails when nothing but a password and a kept passkey are registered
    inputs: { userId: 00000000-0000-4000-8000-000000000102, includePhishingResistant: false, revokeSessions: true, reason: lost phone ticket 3301 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [] }
      methods:
        value:
          - { "@odata.type": "#microsoft.graph.passwordAuthenticationMethod", id: 28c10230-6103-485e-b985-444c60001490 }
          - { "@odata.type": "#microsoft.graph.fido2AuthenticationMethod", id: 00000000-0000-4000-8000-00000000f201, displayName: YubiKey 5C }
    expect: { status: failed, failedStep: hasMethods }
  - name: plans removing the Authenticator app and revoking sessions
    inputs: { userId: 00000000-0000-4000-8000-000000000102, includePhishingResistant: false, revokeSessions: true, reason: lost phone ticket 3302 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [] }
      methods:
        value:
          - { "@odata.type": "#microsoft.graph.passwordAuthenticationMethod", id: 28c10230-6103-485e-b985-444c60001490 }
          - { "@odata.type": "#microsoft.graph.microsoftAuthenticatorAuthenticationMethod", id: 00000000-0000-4000-8000-00000000f202, displayName: Pixel 8 }
          - { "@odata.type": "#microsoft.graph.fido2AuthenticationMethod", id: 00000000-0000-4000-8000-00000000f201, displayName: YubiKey 5C }
    expect:
      status: succeeded
      plan: [removeMethod, revoke]
      outputs: { removed: [Microsoft Authenticator (Pixel 8)] }
