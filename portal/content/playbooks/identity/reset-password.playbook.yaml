$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: identity.reset-password
version: 1.1.0
title: Reset password
summary: >-
  Resets a user's password to a temporary password generated by Microsoft Entra ID (shown once, must be changed at next
  sign-in) and optionally revokes their sessions. Synced users need password writeback.
owner: identity-team
tags: [identity, users, helpdesk]
risk: high
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph: [User.Read.All, Directory.Read.All, Application.Read.All, UserAuthenticationMethod.ReadWrite.All, User.RevokeSessions.All]
  # Privileged Authentication Administrator is needed when the target holds an admin role.
  entraRoles: [Authentication Administrator]
confirm:
  type: typed
  value: ${ steps.lookup.output.userPrincipalName }
  message: Type the user's sign-in name to confirm. The new temporary password is shown once on the run page.
approval:
  required: false

inputs:
  userId: { type: string, format: guid, label: User, picker: user }
  revokeSessions: { type: boolean, label: Also sign the user out everywhere, default: true }
  reason: { type: string, label: Reason, minLength: 10, multiline: true }

steps:
  - id: lookup
    type: graph
    mode: read
    describe: Look up the user
    request:
      method: GET
      path: /users/${ $encode($guid(inputs.userId)) }
      query:
        $select: id,displayName,userPrincipalName,accountEnabled,userType,onPremisesSyncEnabled

  - id: notSelf
    type: assert
    that: ${ $not($guid(inputs.userId) = $lowercase(user.oid)) }
    message: You can't reset your own password here. Use self-service password reset (https://aka.ms/sspr).

  # The people who approve AdminForge changes — everyone holding Playbook.Approver or Portal.Admin on AdminForge's
  # Read app, through a group or directly — get no new credential from an engineer through AdminForge: whoever held it
  # could approve their own changes as a second person. Read from the role assignments, not group names.
  - id: readAppConfigured
    type: assert
    that: ${ $exists(env.AF_READ_CLIENT_ID) and $string(env.AF_READ_CLIENT_ID) != '' }
    message: >-
      AdminForge can't check who approves its changes because its Read app isn't configured (AF_READ_CLIENT_ID), so
      nothing was changed. An administrator sets it with pnpm adminforge provision entra.

  - id: portalApp
    type: graph
    mode: read
    describe: Read AdminForge's portal roles
    request:
      method: GET
      path: /servicePrincipals(appId='${ $guid(env.AF_READ_CLIENT_ID) }')
      query:
        $select: id,appRoles

  - id: roleHolders
    type: graph
    mode: read
    describe: Read who holds AdminForge's portal roles
    paging: all
    maxItems: 5000
    request:
      method: GET
      path: /servicePrincipals/${ $encode($guid(steps.portalApp.output.id)) }/appRoleAssignedTo
      query:
        $select: principalId,principalType,appRoleId
        $top: 999

  - id: approvers
    type: transform
    describe: The groups and people who approve AdminForge changes
    expression: >-
      ${ (
        $roles := [steps.portalApp.output.appRoles[value in ['Playbook.Approver', 'Portal.Admin']].$lowercase(id)];
        $held := [steps.roleHolders.output.value[$lowercase(appRoleId) in $roles]];
        {
          "complete": $not(steps.roleHolders.output.truncated = true),
          "groups": [$distinct($held[principalType = 'Group'].$lowercase(principalId))],
          "direct": $lowercase($guid(inputs.userId)) in $held.$lowercase(principalId)
        }
      ) }

  - id: approverGroupsReadable
    type: assert
    that: ${ steps.approvers.output.complete and $count(steps.approvers.output.groups) <= 20 }
    message: >-
      AdminForge couldn't check whether this person approves AdminForge changes (too many groups hold its portal roles),
      so nothing was changed. Make this change in the Microsoft Entra admin center.

  - id: targetGroups
    type: graph
    mode: read
    describe: Check whether the user belongs to a group that approves AdminForge changes
    when: ${ $count(steps.approvers.output.groups) > 0 }
    request:
      method: POST
      path: /users/${ $encode($guid(inputs.userId)) }/checkMemberGroups
      body:
        groupIds: ${ steps.approvers.output.groups[] }

  - id: notApprover
    type: assert
    that: ${ $not(steps.approvers.output.direct) and $count(steps.targetGroups.output.value) = 0 }
    message: >-
      ${ steps.lookup.output.userPrincipalName & ' approves AdminForge changes (Playbook Approver or Portal Admin). '
         & 'Reset their password for them in the Microsoft Entra admin center, by someone other than you, so nobody can act as a second approver for their own change.' }

  - id: notGuest
    type: assert
    that: ${ $not(steps.lookup.output.userType = 'Guest') }
    message: ${ steps.lookup.output.userPrincipalName & ' is a guest; guests sign in with their home organisation and have no password here.' }

  # Password authentication method id is the same well-known value in every tenant.
  - id: reset
    type: graph
    mode: write
    describe: Reset the password to a system-generated temporary password (change required at next sign-in)
    idempotent: false
    request:
      method: POST
      path: /users/${ $encode($guid(inputs.userId)) }/authentication/methods/28c10230-6103-485e-b985-444c60001490/resetPassword
      body: {}
    # Shown once to the engineer who ran this (live on the run page); never stored, logged, or visible to later steps.
    secretOutputs: [newPassword]
    dryRunOutput: { newPassword: null }

  - id: revoke
    type: graph
    mode: write
    describe: Revoke refresh tokens and session cookies
    when: ${ inputs.revokeSessions = true }
    request:
      method: POST
      path: /users/${ $encode($guid(inputs.userId)) }/revokeSignInSessions
    dryRunOutput: { value: true }

outputs:
  summary: >-
    ${ 'Password reset for ' & steps.lookup.output.userPrincipalName
       & (steps.lookup.output.onPremisesSyncEnabled = true ? ' (written back to on-premises AD)' : '')
       & (inputs.revokeSessions = true ? '; all sessions revoked.' : '.')
       & ' Give the temporary password to the user over a verified channel; it is not shown again.' }

tests:
  - name: stops with a setup message when the Read app isn't configured
    inputs: { userId: 00000000-0000-4000-8000-000000000102, revokeSessions: true, reason: helpdesk ticket 2201 }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
    expect: { status: failed, failedStep: readAppConfigured }
  - name: refuses someone assigned Portal Admin directly
    inputs: { userId: 00000000-0000-4000-8000-000000000102, revokeSessions: true, reason: helpdesk ticket 2201 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-000000000102, principalType: User, appRoleId: 00000000-0000-4000-8000-0000000006B2 }] }
    expect: { status: failed, failedStep: notApprover }
  - name: refuses a member of a group holding Portal Admin, whatever the group is called
    inputs: { userId: 00000000-0000-4000-8000-000000000102, revokeSessions: true, reason: helpdesk ticket 2201 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002e1, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b2 }] }
      targetGroups: { value: [00000000-0000-4000-8000-0000000002e1] }
    expect: { status: failed, failedStep: notApprover }
  - name: stops when the list of role holders was cut short
    inputs: { userId: 00000000-0000-4000-8000-000000000102, revokeSessions: true, reason: helpdesk ticket 2201 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }] }
      roleHolders: { value: [], truncated: true }
    expect: { status: failed, failedStep: approverGroupsReadable }
  - name: refuses someone who approves AdminForge changes (Playbook Approver or Portal Admin group)
    inputs: { userId: 00000000-0000-4000-8000-000000000102, revokeSessions: true, reason: helpdesk ticket 2201 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [00000000-0000-4000-8000-0000000002FA] }
    expect: { status: failed, failedStep: notApprover }
  - name: refuses guests
    inputs: { userId: 00000000-0000-4000-8000-000000000106, revokeSessions: true, reason: helpdesk ticket 2201 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    user: { oid: 00000000-0000-4000-8000-000000000101 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000106, userPrincipalName: j.doe_partner.example#EXT#@exampleorg.onmicrosoft.com, userType: Guest, accountEnabled: true }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [] }
    expect: { status: failed, failedStep: notGuest }
  - name: refuses the engineer's own account
    inputs: { userId: 00000000-0000-4000-8000-000000000101, revokeSessions: false, reason: helpdesk ticket 2202 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    user: { oid: 00000000-0000-4000-8000-000000000101 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000101, userPrincipalName: a.lee@example.com, userType: Member, accountEnabled: true }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [] }
    expect: { status: failed, failedStep: notSelf }
  - name: plans reset and revoke for a member
    inputs: { userId: 00000000-0000-4000-8000-000000000102, revokeSessions: true, reason: helpdesk ticket 2203 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    user: { oid: 00000000-0000-4000-8000-000000000101 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, userType: Member, accountEnabled: true, onPremisesSyncEnabled: null }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [] }
    expect:
      status: succeeded
      plan: [reset, revoke]
  - name: still resets the password of a portal Operator (only approvers are refused)
    inputs: { userId: 00000000-0000-4000-8000-000000000102, revokeSessions: true, reason: helpdesk ticket 2203 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    user: { oid: 00000000-0000-4000-8000-000000000101 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, userType: Member, accountEnabled: true, onPremisesSyncEnabled: null }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [] }
    expect:
      status: succeeded
      plan: [reset, revoke]
  - name: skips the revocation when not requested
    inputs: { userId: 00000000-0000-4000-8000-000000000102, revokeSessions: false, reason: helpdesk ticket 2204 }
    env: { AF_READ_CLIENT_ID: 22222222-3333-4444-8555-666666666666 }
    user: { oid: 00000000-0000-4000-8000-000000000101 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, userType: Member, accountEnabled: true, onPremisesSyncEnabled: null }
      portalApp: { id: 00000000-0000-4000-8000-0000000006a1, appRoles: [{ id: 00000000-0000-4000-8000-0000000006b1, value: Playbook.Approver }, { id: 00000000-0000-4000-8000-0000000006b2, value: Portal.Admin }, { id: 00000000-0000-4000-8000-0000000006b3, value: Portal.Reader }] }
      roleHolders: { value: [{ principalId: 00000000-0000-4000-8000-0000000002fa, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b1 }, { principalId: 00000000-0000-4000-8000-0000000002f9, principalType: Group, appRoleId: 00000000-0000-4000-8000-0000000006b3 }] }
      targetGroups: { value: [] }
    expect:
      status: succeeded
      plan: [reset]
      steps: { revoke: skipped }
