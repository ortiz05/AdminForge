$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: identity.reset-password
version: 1.0.0
title: Reset password
summary: >-
  Resets a user's password to a temporary password generated by Microsoft Entra ID (shown once, must be changed at next
  sign-in) and optionally revokes their sessions. Synced users need password writeback.
owner: identity-team
tags: [identity, users, helpdesk]
risk: high
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph: [User.Read.All, UserAuthenticationMethod.ReadWrite.All, User.RevokeSessions.All]
  # Privileged Authentication Administrator is needed when the target holds an admin role.
  entraRoles: [Authentication Administrator]
confirm:
  type: typed
  value: ${ steps.lookup.output.userPrincipalName }
  message: Type the user's sign-in name to confirm. The new temporary password is shown once on the run page.
approval:
  required: false

inputs:
  userId: { type: string, format: guid, label: User, picker: user }
  revokeSessions: { type: boolean, label: Also sign the user out everywhere, default: true }
  reason: { type: string, label: Reason, minLength: 10, multiline: true }

steps:
  - id: lookup
    type: graph
    mode: read
    describe: Look up the user
    request:
      method: GET
      path: /users/${ $encode($guid(inputs.userId)) }
      query:
        $select: id,displayName,userPrincipalName,accountEnabled,userType,onPremisesSyncEnabled

  - id: notSelf
    type: assert
    that: ${ $not($guid(inputs.userId) = $lowercase(user.oid)) }
    message: You can't reset your own password here. Use self-service password reset (https://aka.ms/sspr).

  - id: notGuest
    type: assert
    that: ${ $not(steps.lookup.output.userType = 'Guest') }
    message: ${ steps.lookup.output.userPrincipalName & ' is a guest; guests sign in with their home organisation and have no password here.' }

  # Password authentication method id is the same well-known value in every tenant.
  - id: reset
    type: graph
    mode: write
    describe: Reset the password to a system-generated temporary password (change required at next sign-in)
    idempotent: false
    request:
      method: POST
      path: /users/${ $encode($guid(inputs.userId)) }/authentication/methods/28c10230-6103-485e-b985-444c60001490/resetPassword
      body: {}
    # Shown once to the engineer who ran this (live on the run page); never stored, logged, or visible to later steps.
    secretOutputs: [newPassword]
    dryRunOutput: { newPassword: null }

  - id: revoke
    type: graph
    mode: write
    describe: Revoke refresh tokens and session cookies
    when: ${ inputs.revokeSessions = true }
    request:
      method: POST
      path: /users/${ $encode($guid(inputs.userId)) }/revokeSignInSessions
    dryRunOutput: { value: true }

outputs:
  summary: >-
    ${ 'Password reset for ' & steps.lookup.output.userPrincipalName
       & (steps.lookup.output.onPremisesSyncEnabled = true ? ' (written back to on-premises AD)' : '')
       & (inputs.revokeSessions = true ? '; all sessions revoked.' : '.')
       & ' Give the temporary password to the user over a verified channel; it is not shown again.' }

tests:
  - name: refuses guests
    inputs: { userId: 00000000-0000-4000-8000-000000000106, revokeSessions: true, reason: helpdesk ticket 2201 }
    user: { oid: 00000000-0000-4000-8000-000000000101 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000106, userPrincipalName: j.doe_partner.example#EXT#@exampleorg.onmicrosoft.com, userType: Guest, accountEnabled: true }
    expect: { status: failed, failedStep: notGuest }
  - name: refuses the engineer's own account
    inputs: { userId: 00000000-0000-4000-8000-000000000101, revokeSessions: false, reason: helpdesk ticket 2202 }
    user: { oid: 00000000-0000-4000-8000-000000000101 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000101, userPrincipalName: a.lee@example.com, userType: Member, accountEnabled: true }
    expect: { status: failed, failedStep: notSelf }
  - name: plans reset and revoke for a member
    inputs: { userId: 00000000-0000-4000-8000-000000000102, revokeSessions: true, reason: helpdesk ticket 2203 }
    user: { oid: 00000000-0000-4000-8000-000000000101 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, userType: Member, accountEnabled: true, onPremisesSyncEnabled: null }
    expect:
      status: succeeded
      plan: [reset, revoke]
  - name: skips the revocation when not requested
    inputs: { userId: 00000000-0000-4000-8000-000000000102, revokeSessions: false, reason: helpdesk ticket 2204 }
    user: { oid: 00000000-0000-4000-8000-000000000101 }
    mocks:
      lookup: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, userType: Member, accountEnabled: true, onPremisesSyncEnabled: null }
    expect:
      status: succeeded
      plan: [reset]
      steps: { revoke: skipped }
