$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: identity.rotate-app-secret
version: 1.0.0
title: Rotate app secret
summary: >-
  Adds a new client secret to an app registration and returns it once, so the app's owners can swap it in before the old
  secret expires. Old secrets are left in place — remove them with "Remove expired app credentials" after the swap.
  Requires approval.
owner: identity-team
tags: [identity, apps, credentials]
risk: high
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph: [Application.ReadWrite.All]
  entraRoles: [Cloud Application Administrator]
confirm:
  type: typed
  value: ${ steps.app.output.displayName }
  message: >-
    ${ 'A new secret valid for ' & inputs.lifetimeDays & ' days is created for ' & steps.app.output.displayName
       & ' and shown once. Store it in a vault before closing the run. Type the app name to confirm.' }
approval:
  required: true
  approvers: [Playbook.Approver]
  minApprovals: 1
  expiresIn: PT24H

inputs:
  appObjectId: { type: string, format: guid, label: App registration (object id), picker: app }
  secretName: { type: string, label: Secret description, default: Rotated by AdminForge, maxLength: 100 }
  lifetimeDays:
    type: enum
    label: Valid for
    default: 180
    values:
      - { value: 30, label: 30 days }
      - { value: 90, label: 90 days }
      - { value: 180, label: 180 days }
      - { value: 365, label: 1 year }
  reason: { type: string, label: Reason, minLength: 10, multiline: true }

steps:
  - id: app
    type: graph
    mode: read
    describe: Look up the app registration and its secrets
    request:
      method: GET
      path: /applications/${ $encode($guid(inputs.appObjectId)) }
      query:
        $select: id,appId,displayName,passwordCredentials

  - id: notPortalApp
    type: assert
    that: >-
      ${ $not(steps.app.output.appId in [env.AF_READ_CLIENT_ID, env.AF_WRITE_CLIENT_ID, env.AF_AUTOMATION_CLIENT_ID, env.AF_PROVISIONER_CLIENT_ID]) }
    message: This is one of AdminForge's own app registrations. Rotate its credentials with `adminforge provision` so the local configuration is updated too.

  - id: addSecret
    type: graph
    mode: write
    describe: ${ 'Add a client secret "' & inputs.secretName & '" valid for ' & inputs.lifetimeDays & ' days' }
    idempotent: false
    request:
      method: POST
      path: /applications/${ $encode($guid(inputs.appObjectId)) }/addPassword
      body:
        passwordCredential:
          displayName: ${ inputs.secretName }
          endDateTime: ${ $fromMillis($toMillis($iso()) + $number(inputs.lifetimeDays) * 86400000) }
    dryRunOutput:
      keyId: null
      secretText: null
      endDateTime: ${ $fromMillis($toMillis($iso()) + $number(inputs.lifetimeDays) * 86400000) }
    compensate:
      type: graph
      describe: Remove the new secret
      request:
        method: POST
        path: /applications/${ $encode($guid(inputs.appObjectId)) }/removePassword
        body:
          keyId: ${ steps.addSecret.output.keyId }

outputs:
  summary: >-
    ${ 'New secret added to ' & steps.app.output.displayName & ', expiring ' & $substring(steps.addSecret.output.endDateTime, 0, 10)
       & '. Existing secrets: ' & $count(steps.app.output.passwordCredentials)
       & '. Remove the old one after the app has switched.' }
  # Returned once by Entra ID. See the report: the engine must treat this output as secret (redact at rest).
  secretText: ${ steps.addSecret.output.secretText }
  keyId: ${ steps.addSecret.output.keyId }
  expires: ${ steps.addSecret.output.endDateTime }

tests:
  - name: plans a new 90-day secret
    inputs: { appObjectId: 00000000-0000-4000-8000-000000000301, secretName: Rotated by AdminForge, lifetimeDays: 90, reason: Annual rotation CHG-1201 }
    mocks:
      app:
        id: 00000000-0000-4000-8000-000000000301
        appId: 00000000-0000-4000-8001-000000000301
        displayName: Example HR Sync
        passwordCredentials: [{ keyId: 00000000-0000-4000-8000-00000000c101, displayName: prod, endDateTime: "2026-11-01T00:00:00Z" }]
    expect:
      status: succeeded
      plan: [addSecret]
