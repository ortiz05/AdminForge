$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: m365.add-distribution-list-members
version: 1.3.0
title: Add members to a distribution list
summary: >-
  Adds people (and any other mail recipients by address) to a distribution list or mail-enabled security group. People
  who are already members are skipped. You can't add yourself; ask another engineer to add you. A mail-enabled security
  group grants access like any security group, so adding members to one needs a second engineer's approval, and nobody
  being added can approve it.
owner: m365-team
tags: [m365, exchange, distribution-lists]
risk: medium
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph: [User.ReadBasic.All, Group.Read.All]
    exchange: [Exchange.Manage]
  entraRoles: [Exchange Recipient Administrator]
  licences: [exchange]
# Typed: offered as a bulk action (risk medium or higher), where a run asks for the number of items instead. One
# list: its address.
confirm:
  type: typed
  value: ${ inputs.identity }
  message: >-
    ${ 'Add ' & $count(steps.collect.output.addresses) & ' member(s) to ' & inputs.identity
       & '? They start receiving mail sent to the list right away.'
       & (
         $l := steps.list.output.value;
         $count($l) = 1 and $l[0].securityEnabled = false ? ''
         : $count($l) = 1 ? ' It is a mail-enabled security group, so a second engineer must approve.'
         : $count($l) = 0 ? " Microsoft Entra ID has no group with that primary address (use the list's primary address), so a second engineer must approve."
         : ' More than one group has that address in Microsoft Entra ID, so a second engineer must approve.'
       ) }
approval:
  required: false

inputs:
  identity: { type: string, format: email, label: Distribution list, description: Primary email address of the list }
  members:
    type: user
    multiple: true
    maxItems: 100
    required: false
    label: People
    description: People in your organization; their primary email address is added.
  addresses:
    type: string
    multiline: true
    required: false
    label: Other addresses
    description: One email address per line — guests, mail contacts or other recipients that already exist in Exchange Online.
    maxLength: 20000

steps:
  - id: resolve
    type: graph
    mode: read
    describe: Look up the email addresses of the selected people
    when: ${ $count(inputs.members) > 0 }
    request:
      method: POST
      path: /directoryObjects/getByIds
      body:
        ids: ${ inputs.members }
        types: [user]

  - id: collect
    type: transform
    describe: Combine and validate the addresses
    expression: >-
      ${ (
        $users := steps.resolve.output.value;
        $typed := [$split(inputs.addresses ? inputs.addresses : '', /[\s,;]+/)[$ != '']];
        {
          "addresses": [$distinct([$append([$users[mail != null].mail], $typed)].$lowercase($))],
          "noMailbox": [$users[$not($exists(mail)) or mail = null].userPrincipalName],
          "invalid": [$typed[$not($contains($, /^[^\s@]{1,64}@[^\s@.]+(\.[^\s@.]+)+$/))]]
        }
      ) }

  - id: everyoneHasMail
    type: assert
    that: ${ $count(steps.collect.output.noMailbox) = 0 }
    message: >-
      ${ "These people have no mailbox, so they can't be list members: " & $join(steps.collect.output.noMailbox, ', ') }

  - id: validAddresses
    type: assert
    that: ${ $count(steps.collect.output.invalid) = 0 }
    message: >-
      ${ 'These are not valid email addresses: ' & $join(steps.collect.output.invalid, ', ') }

  # Your own addresses — primary, aliases and UPN. Checked here, not only by the script: for a mail-enabled security
  # group the update runs as the approver, and the script's own check refuses the addresses of whoever runs it.
  - id: me
    type: graph
    mode: read
    describe: Look up your own email addresses
    request:
      method: GET
      path: /me
      query:
        $select: id,mail,userPrincipalName,proxyAddresses

  # A mail-enabled security group grants access like any security group: nobody adds themselves, under any address.
  - id: notSelf
    type: assert
    that: >-
      ${ (
        $mine := $append($append([$lowercase(user.upn)], [steps.me.output.mail][$ != null].$lowercase($)),
          [steps.me.output.proxyAddresses[$contains($lowercase($), /^smtp:/)]].$substringAfter($lowercase($), 'smtp:'));
        $not($lowercase(user.oid) in [inputs.members].$lowercase($))
          and $count(steps.collect.output.addresses[$ in $mine]) = 0
      ) }
    message: You can't add yourself to a list or group, under any of your addresses. Ask another engineer to add you.

  - id: somethingToAdd
    type: assert
    that: ${ $count(steps.collect.output.addresses) > 0 }
    message: Pick at least one person or type an address.

  - id: list
    type: graph
    mode: read
    describe: Look up whether the list is a mail-enabled security group
    request:
      method: GET
      path: /groups
      query:
        $filter: ${ 'mail eq ' & $odata(inputs.identity) }
        $select: id,displayName,mailEnabled,securityEnabled
        $top: 2

  # A mail-enabled security group grants access like any security group (2026-10-22 review, owner decision): a second
  # engineer approves adding members, and nobody being added may approve it. A list Microsoft Entra ID can't name is
  # treated the same way. The update then runs as the approver (who needs Exchange Recipient Administrator).
  # `excludes` names the people picked; addresses typed have no object id here — Exchange refuses the approver's own
  # addresses at the write, which runs as them (Set-DistributionListMembers.ps1).
  - id: approve
    type: approval
    when: ${ $not($count(steps.list.output.value) = 1 and steps.list.output.value[0].securityEnabled = false) }
    message: >-
      ${ (
        $l := steps.list.output.value;
        $a := steps.collect.output.addresses;
        $what := $count($l) = 1 ? 'the mail-enabled security group ' & inputs.identity
          : $count($l) = 0 ? inputs.identity & " (Microsoft Entra ID has no group with that primary address: check it is the list's primary address)"
          : inputs.identity & ' (more than one group has that address in Microsoft Entra ID)';
        'Add ' & $count($a) & ' member(s) to ' & $what & ': ' & $join($a[[0..9]], ', ')
          & ($count($a) > 10 ? ' and ' & ($count($a) - 10) & ' more' : '')
          & '. They get whatever access the group grants. You make the change yourself (Exchange Recipient Administrator).'
      ) }
    approvers: [Playbook.Approver]
    minApprovals: 1
    expiresIn: PT8H
    excludes: ${ [inputs.members] }

  - id: update
    type: runner
    mode: write
    describe: ${ 'Add ' & $count(steps.collect.output.addresses) & ' member(s) to ' & inputs.identity }
    script: exchange/Set-DistributionListMembers.ps1
    sha256: 6d89533e1c43f2adc5533ddfa41ca98042e20c450f6ae03a558d4ac6f9ca4773
    services: [exchange]
    timeoutSeconds: 600
    parameters:
      identity: ${ inputs.identity }
      add: ${ steps.collect.output.addresses }
    idempotent: true
    # The runner returns one element per output event; this script emits one result object.
    dryRunOutput:
      - group: ${ inputs.identity }
        added: ${ steps.collect.output.addresses }
        removed: []
        skipped: []
        failed: []

outputs:
  summary: >-
    ${ 'Added ' & $count(steps.update.output[0].added) & ' member(s) to ' & inputs.identity
       & ($count(steps.update.output[0].skipped) > 0 ? '; ' & $count(steps.update.output[0].skipped) & ' were already members' : '') & '.' }
  added: ${ steps.update.output[0].added }

tests:
  - name: adds people and typed addresses
    inputs:
      identity: sales-team@example.com
      members: [10000000-0000-4000-8000-000000000002, 10000000-0000-4000-8000-000000000005]
      addresses: "Kim.Lee@partner.example\n"
    user: { oid: 10000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      resolve:
        value:
          - { id: 10000000-0000-4000-8000-000000000002, userPrincipalName: alex.wilber@example.com, mail: alex.wilber@example.com }
          - { id: 10000000-0000-4000-8000-000000000005, userPrincipalName: isaiah.langer@example.com, mail: isaiah.langer@example.com }
      me: { id: 10000000-0000-4000-8000-0000000000a1, mail: avery.mail@example.com, userPrincipalName: avery@example.com, proxyAddresses: ['SMTP:avery.mail@example.com', 'smtp:avery.alias@example.com', 'X500:/o=ExchangeLabs/cn=avery'] }
      list:
        value:
          - { id: 00000000-0000-4000-8000-000000000301, displayName: Sales Team, mailEnabled: true, securityEnabled: false }
    expect:
      status: succeeded
      plan: [update]
      outputs:
        summary: Added 3 member(s) to sales-team@example.com.
        added: [alex.wilber@example.com, isaiah.langer@example.com, kim.lee@partner.example]
  - name: refuses adding yourself, typed
    inputs:
      identity: sales-team@example.com
      addresses: "Avery@example.com\n"
    user: { oid: 10000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      me: { id: 10000000-0000-4000-8000-0000000000a1, mail: avery.mail@example.com, userPrincipalName: avery@example.com, proxyAddresses: ['SMTP:avery.mail@example.com', 'smtp:avery.alias@example.com', 'X500:/o=ExchangeLabs/cn=avery'] }
    expect: { status: failed, failedStep: notSelf }
  - name: refuses adding yourself by an alias, also for a list that needs approval
    inputs:
      identity: finance-access@example.com
      addresses: "Avery.Alias@example.com\n"
    user: { oid: 10000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      me: { id: 10000000-0000-4000-8000-0000000000a1, mail: avery.mail@example.com, userPrincipalName: avery@example.com, proxyAddresses: ['SMTP:avery.mail@example.com', 'smtp:avery.alias@example.com', 'X500:/o=ExchangeLabs/cn=avery'] }
      list:
        value:
          - { id: 00000000-0000-4000-8000-000000000302, displayName: Finance Access, mailEnabled: true, securityEnabled: true }
    expect: { status: failed, failedStep: notSelf }
  - name: refuses adding yourself by your primary address
    inputs:
      identity: sales-team@example.com
      addresses: "avery.mail@example.com\n"
    user: { oid: 10000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      me: { id: 10000000-0000-4000-8000-0000000000a1, mail: avery.mail@example.com, userPrincipalName: avery@example.com, proxyAddresses: ['SMTP:avery.mail@example.com', 'smtp:avery.alias@example.com', 'X500:/o=ExchangeLabs/cn=avery'] }
    expect: { status: failed, failedStep: notSelf }
  - name: refuses adding yourself, picked
    inputs:
      identity: sales-team@example.com
      members: [10000000-0000-4000-8000-0000000000A1]
    user: { oid: 10000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      resolve:
        value:
          - { id: 10000000-0000-4000-8000-0000000000a1, userPrincipalName: avery@example.com, mail: avery.mail@example.com }
      me: { id: 10000000-0000-4000-8000-0000000000a1, mail: avery.mail@example.com, userPrincipalName: avery@example.com, proxyAddresses: ['SMTP:avery.mail@example.com', 'smtp:avery.alias@example.com', 'X500:/o=ExchangeLabs/cn=avery'] }
    expect: { status: failed, failedStep: notSelf }
  - name: refuses people without a mailbox
    inputs:
      identity: sales-team@example.com
      members: [10000000-0000-4000-8000-000000000014]
    mocks:
      resolve:
        value:
          - { id: 10000000-0000-4000-8000-000000000014, userPrincipalName: svc.scanner@example.com }
    expect: { status: failed, failedStep: everyoneHasMail }
  - name: refuses malformed addresses
    inputs: { identity: sales-team@example.com, addresses: "not-an-address" }
    expect: { status: failed, failedStep: validAddresses, steps: { resolve: skipped } }
  - name: refuses an empty request
    inputs: { identity: sales-team@example.com }
    mocks:
      me: { id: 10000000-0000-4000-8000-0000000000a1, mail: avery.mail@example.com, userPrincipalName: avery@example.com, proxyAddresses: ['SMTP:avery.mail@example.com', 'smtp:avery.alias@example.com', 'X500:/o=ExchangeLabs/cn=avery'] }
    expect: { status: failed, failedStep: somethingToAdd }
  - name: adds to a plain distribution list without an approval
    dryRun: false
    inputs:
      identity: sales-team@example.com
      members: [10000000-0000-4000-8000-000000000002]
    mocks:
      resolve:
        value:
          - { id: 10000000-0000-4000-8000-000000000002, userPrincipalName: alex.wilber@example.com, mail: alex.wilber@example.com }
      me: { id: 10000000-0000-4000-8000-0000000000a1, mail: avery.mail@example.com, userPrincipalName: avery@example.com, proxyAddresses: ['SMTP:avery.mail@example.com', 'smtp:avery.alias@example.com', 'X500:/o=ExchangeLabs/cn=avery'] }
      list:
        value:
          - { id: 00000000-0000-4000-8000-000000000301, displayName: Sales Team, mailEnabled: true, securityEnabled: false }
      update:
        - { group: sales-team@example.com, added: [alex.wilber@example.com], removed: [], skipped: [], failed: [] }
    expect: { status: succeeded, steps: { approve: skipped, update: succeeded } }
  - name: asks a second engineer to approve adding members to a mail-enabled security group
    dryRun: false
    inputs:
      identity: finance-access@example.com
      members: [10000000-0000-4000-8000-000000000002]
    mocks:
      resolve:
        value:
          - { id: 10000000-0000-4000-8000-000000000002, userPrincipalName: alex.wilber@example.com, mail: alex.wilber@example.com }
      me: { id: 10000000-0000-4000-8000-0000000000a1, mail: avery.mail@example.com, userPrincipalName: avery@example.com, proxyAddresses: ['SMTP:avery.mail@example.com', 'smtp:avery.alias@example.com', 'X500:/o=ExchangeLabs/cn=avery'] }
      list:
        value:
          - { id: 00000000-0000-4000-8000-000000000302, displayName: Finance Access, mailEnabled: true, securityEnabled: true }
    expect: { status: awaiting_approval }
  - name: asks for approval when Microsoft Entra ID has no group with that primary address
    dryRun: false
    inputs: { identity: unknown-list@example.com, addresses: "kim.lee@partner.example\n" }
    mocks:
      me: { id: 10000000-0000-4000-8000-0000000000a1, mail: avery.mail@example.com, userPrincipalName: avery@example.com, proxyAddresses: ['SMTP:avery.mail@example.com', 'smtp:avery.alias@example.com', 'X500:/o=ExchangeLabs/cn=avery'] }
      list: { value: [] }
    expect: { status: awaiting_approval }
  - name: asks for approval when more than one group has the address
    dryRun: false
    inputs: { identity: shared@example.com, addresses: "kim.lee@partner.example\n" }
    mocks:
      me: { id: 10000000-0000-4000-8000-0000000000a1, mail: avery.mail@example.com, userPrincipalName: avery@example.com, proxyAddresses: ['SMTP:avery.mail@example.com', 'smtp:avery.alias@example.com', 'X500:/o=ExchangeLabs/cn=avery'] }
      list:
        value:
          - { id: 00000000-0000-4000-8000-000000000301, displayName: Sales Team, mailEnabled: true, securityEnabled: false }
          - { id: 00000000-0000-4000-8000-000000000303, displayName: Sales Team (old), mailEnabled: true, securityEnabled: false }
    expect: { status: awaiting_approval }
