$schema: ../../../packages/schemas/generated/playbook.schema.json
kind: playbook
id: m365.remove-mailbox-permission
version: 1.1.1
title: Remove mailbox access
summary: >-
  Takes Full Access, Send As and/or Send on Behalf on a mailbox away from a person or group. Only permissions granted
  directly on the mailbox are removed; inherited ones (granted to the whole organization or database) are reported and
  left alone.
owner: m365-team
tags: [m365, exchange, mailboxes, permissions]
risk: medium
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph: [User.Read.All, Group.Read.All]
    exchange: [Exchange.Manage]
  entraRoles: [Exchange Recipient Administrator]
  licences: [exchange]
confirm:
  type: click
  message: >-
    ${ inputs.trustee & ' loses ' & steps.plan.output.removeText & ' on ' & steps.plan.output.mailbox
       & '. Outlook may keep showing the mailbox for up to an hour.' }

inputs:
  mailbox: { type: string, format: email, label: Mailbox, description: Primary email address of the mailbox }
  trustee: { type: string, format: email, label: Person or group, description: "Sign-in name or email address, as shown on the mailbox's Access tab" }
  permission:
    type: enum
    label: Access to remove
    default: Both
    values:
      - { value: FullAccess, label: Full Access }
      - { value: SendAs, label: Send As }
      - { value: SendOnBehalf, label: Send on Behalf }
      - { value: Both, label: Full Access and Send As }
  reason: { type: string, label: Reason, minLength: 10, multiline: true, placeholder: e.g. REQ-2230 — cover arrangement ended }

steps:
  - id: current
    type: runner
    mode: read
    describe: Read who has access to the mailbox
    script: exchange/Get-MailboxPermissions.ps1
    sha256: 88085eb774261034cc6c99b9c9a59dc3f00f63fe2d43a6fa87dbe2b1c5fa9150
    services: [exchange]
    timeoutSeconds: 300
    parameters:
      identity: ${ inputs.mailbox }

  - id: plan
    type: transform
    describe: Work out which direct permissions the trustee holds
    expression: >-
      ${ (
        $label := function($p) { $p = 'FullAccess' ? 'Full Access' : $p = 'SendAs' ? 'Send As' : 'Send on Behalf' };
        $want := inputs.permission = 'Both' ? ['FullAccess', 'SendAs'] : [inputs.permission];
        $t := $lowercase(inputs.trustee);
        $mine := steps.current.output[0].permissions[($lowercase(trustee) = $t or $lowercase(trusteeAddress) = $t) and $not(deny = true)];
        $direct := [$mine[$not(inherited = true)].permission];
        $remove := [$filter($want, function($p) { $p in $direct })];
        $inherited := [$filter($want, function($p) { $p in [$mine[inherited = true].permission] })];
        {
          "mailbox": steps.current.output[0].mailbox.primarySmtpAddress,
          "remove": $remove,
          "inherited": $inherited,
          "wantText": $join([$want.$label($)], ' or '),
          "removeText": $join([$remove.$label($)], ' and '),
          "inheritedText": $join([$inherited.$label($)], ' and ')
        }
      ) }

  - id: somethingToRemove
    type: assert
    that: ${ $count(steps.plan.output.remove) > 0 }
    message: >-
      ${ $count(steps.plan.output.inherited) > 0
         ? inputs.trustee & ' has ' & steps.plan.output.inheritedText & ' on ' & steps.plan.output.mailbox
           & ' only through an inherited permission (granted to the whole organization or database). Remove it in the Exchange admin center or with PowerShell at that level.'
         : inputs.trustee & ' has no ' & steps.plan.output.wantText & ' on ' & steps.plan.output.mailbox
           & ". Nothing to remove; refresh the mailbox's Access tab to see who has access now." }

  - id: owner
    type: graph
    mode: read
    describe: Look up the mailbox's account
    request:
      method: GET
      path: /users/${ $encode(steps.current.output[0].mailbox.userPrincipalName) }
      query:
        $select: id,displayName,userPrincipalName

  - id: trusteeUser
    type: graph
    mode: read
    describe: Look up the person losing access
    request:
      method: GET
      path: /users
      query:
        $filter: ${ 'mail eq ' & $odata(inputs.trustee) & ' or userPrincipalName eq ' & $odata(inputs.trustee) }
        $select: id,displayName,userPrincipalName

  - id: trusteeGroup
    type: graph
    mode: read
    describe: Look up the group losing access
    when: ${ $count(steps.trusteeUser.output.value) = 0 }
    request:
      method: GET
      path: /groups
      query:
        $filter: ${ 'mail eq ' & $odata(inputs.trustee) }
        $select: id,displayName,mail

  - id: trusteeFound
    type: assert
    that: ${ $count(steps.trusteeUser.output.value) + $count(steps.trusteeGroup.output.value) = 1 }
    message: >-
      ${ inputs.trustee & " isn't a single person or group in the directory, so AdminForge can't tell whose access"
         & ' this is. Remove it in the Exchange admin center (the mailbox › Delegation).' }

  - id: remove
    type: runner
    mode: write
    describe: ${ 'Remove ' & steps.plan.output.removeText & ' for ' & inputs.trustee & ' on ' & steps.plan.output.mailbox }
    script: exchange/Set-MailboxPermission.ps1
    sha256: cfd5d4a827b19b38a1e28462f4133d0369aaa748f56c043fa9c88f5eced5e6fd
    services: [exchange]
    timeoutSeconds: 300
    # The object ids let AdminForge's protected-object guard see whose mailbox and whose access this is; the script
    # checks them against Exchange.
    parameters:
      identity: ${ steps.plan.output.mailbox }
      mailboxObjectId: ${ steps.owner.output.id }
      trustee: ${ inputs.trustee }
      trusteeObjectId: ${ $append(steps.trusteeUser.output.value.id, steps.trusteeGroup.output.value.id)[0] }
      action: remove
      permissions: ${ steps.plan.output.remove }
    idempotent: true
    compensate:
      type: runner
      describe: Grant the access again (without Outlook auto-mapping)
      script: exchange/Set-MailboxPermission.ps1
      sha256: cfd5d4a827b19b38a1e28462f4133d0369aaa748f56c043fa9c88f5eced5e6fd
      services: [exchange]
      timeoutSeconds: 300
      parameters:
        identity: ${ steps.plan.output.mailbox }
        mailboxObjectId: ${ steps.owner.output.id }
        trustee: ${ inputs.trustee }
        trusteeObjectId: ${ $append(steps.trusteeUser.output.value.id, steps.trusteeGroup.output.value.id)[0] }
        action: add
        permissions: ${ steps.plan.output.remove }
        autoMapping: false
    dryRunOutput:
      - mailbox: ${ steps.plan.output.mailbox }
        trustee: ${ inputs.trustee }
        action: remove
        changed: ${ steps.plan.output.remove }
        skipped: []
        failed: []
        verified: true

outputs:
  summary: >-
    ${ inputs.trustee & ' no longer has '
       & $join([steps.remove.output[0].changed.($ = 'FullAccess' ? 'Full Access' : $ = 'SendAs' ? 'Send As' : 'Send on Behalf')], ' and ')
       & ' on ' & steps.plan.output.mailbox
       & ($count(steps.plan.output.inherited) > 0 ? '. Still inherited: ' & steps.plan.output.inheritedText : '') & '.'
       & (steps.remove.output[0].verified = false ? " Exchange doesn't show it yet; check the mailbox's Access tab in a few minutes." : '') }
  removed: ${ steps.remove.output[0].changed }

tests:
  - name: removes Full Access and Send As
    inputs: { mailbox: sales@example.com, trustee: kim.akers@example.com, reason: REQ-2230 cover arrangement ended }
    mocks:
      current:
        - mailbox: { displayName: Sales, primarySmtpAddress: sales@example.com, userPrincipalName: sales@example.com }
          permissions:
            - { permission: FullAccess, trustee: Kim.Akers@example.com, inherited: false, deny: false }
            - { permission: SendAs, trustee: kim.akers@example.com, inherited: false, deny: false }
            - { permission: FullAccess, trustee: lee.gu@example.com, inherited: false, deny: false }
      owner: { id: 10000000-0000-4000-8000-000000000400, displayName: Sales, userPrincipalName: sales@example.com }
      trusteeUser: { value: [{ id: 10000000-0000-4000-8000-000000000003, displayName: Kim Akers, userPrincipalName: kim.akers@example.com }] }
    expect:
      status: succeeded
      plan: [remove]
      outputs:
        summary: kim.akers@example.com no longer has Full Access and Send As on sales@example.com.
        removed: [FullAccess, SendAs]
  - name: removes Send on Behalf
    inputs: { mailbox: sales@example.com, trustee: kim.akers@example.com, permission: SendOnBehalf, reason: REQ-2235 assistant moved teams }
    mocks:
      current:
        - mailbox: { displayName: Sales, primarySmtpAddress: sales@example.com, userPrincipalName: sales@example.com }
          permissions:
            - { permission: SendOnBehalf, trustee: kim.akers@example.com, trusteeAddress: kim.akers@example.com, inherited: false, deny: false }
      owner: { id: 10000000-0000-4000-8000-000000000400, displayName: Sales, userPrincipalName: sales@example.com }
      trusteeUser: { value: [{ id: 10000000-0000-4000-8000-000000000003, displayName: Kim Akers, userPrincipalName: kim.akers@example.com }] }
    expect:
      status: succeeded
      plan: [remove]
      outputs:
        summary: kim.akers@example.com no longer has Send on Behalf on sales@example.com.
        removed: [SendOnBehalf]
  - name: matches a trustee listed by sign-in name when given the email address
    inputs: { mailbox: sales@example.com, trustee: kim@example.com, permission: FullAccess, reason: REQ-2236 alias differs from sign-in name }
    mocks:
      current:
        - mailbox: { displayName: Sales, primarySmtpAddress: sales@example.com, userPrincipalName: sales@example.com }
          permissions:
            - { permission: FullAccess, trustee: kim.akers@example.onmicrosoft.com, trusteeAddress: kim@example.com, inherited: false, deny: false }
      owner: { id: 10000000-0000-4000-8000-000000000400, displayName: Sales, userPrincipalName: sales@example.com }
      trusteeUser: { value: [{ id: 10000000-0000-4000-8000-000000000003, displayName: Kim Akers, userPrincipalName: kim.akers@example.onmicrosoft.com }] }
    expect:
      status: succeeded
      plan: [remove]
      outputs:
        removed: [FullAccess]
  - name: removes the direct grant and reports what stays inherited
    inputs: { mailbox: sales@example.com, trustee: lee.gu@example.com, reason: REQ-2231 moved to finance }
    mocks:
      current:
        - mailbox: { displayName: Sales, primarySmtpAddress: sales@example.com, userPrincipalName: sales@example.com }
          permissions:
            - { permission: FullAccess, trustee: lee.gu@example.com, inherited: true, deny: false }
            - { permission: SendAs, trustee: lee.gu@example.com, inherited: false, deny: false }
      owner: { id: 10000000-0000-4000-8000-000000000400, displayName: Sales, userPrincipalName: sales@example.com }
      trusteeUser: { value: [{ id: 10000000-0000-4000-8000-000000000007, displayName: Lee Gu, userPrincipalName: lee.gu@example.com }] }
    expect:
      status: succeeded
      plan: [remove]
      outputs:
        summary: "lee.gu@example.com no longer has Send As on sales@example.com. Still inherited: Full Access."
  - name: refuses when the access is only inherited
    inputs: { mailbox: sales@example.com, trustee: lee.gu@example.com, permission: FullAccess, reason: REQ-2232 audit clean-up }
    mocks:
      current:
        - mailbox: { displayName: Sales, primarySmtpAddress: sales@example.com, userPrincipalName: sales@example.com }
          permissions:
            - { permission: FullAccess, trustee: lee.gu@example.com, inherited: true, deny: false }
    expect: { status: failed, failedStep: somethingToRemove }
  - name: refuses when the trustee has no access
    inputs: { mailbox: sales@example.com, trustee: nobody@example.com, reason: REQ-2233 stale ticket }
    mocks:
      current:
        - mailbox: { displayName: Sales, primarySmtpAddress: sales@example.com, userPrincipalName: sales@example.com }
          permissions: []
    expect: { status: failed, failedStep: somethingToRemove }
  - name: stops when the mailbox can't be read
    inputs: { mailbox: ghost@example.com, trustee: kim.akers@example.com, reason: REQ-2234 typo in the address }
    errors:
      current: { status: 404, code: input, message: "Mailbox 'ghost@example.com' was not found" }
    expect: { status: failed, failedStep: current }
  - name: removes a group's access
    inputs: { mailbox: sales@example.com, trustee: sales-team@example.com, permission: FullAccess, reason: REQ-2237 team moved to the new inbox }
    mocks:
      current:
        - mailbox: { displayName: Sales, primarySmtpAddress: sales@example.com, userPrincipalName: sales@example.com }
          permissions:
            - { permission: FullAccess, trustee: sales-team@example.com, trusteeType: MailUniversalSecurityGroup, inherited: false, deny: false }
      owner: { id: 10000000-0000-4000-8000-000000000400, displayName: Sales, userPrincipalName: sales@example.com }
      trusteeUser: { value: [] }
      trusteeGroup: { value: [{ id: 10000000-0000-4000-8000-000000000410, displayName: Sales team, mail: sales-team@example.com }] }
    expect:
      status: succeeded
      plan: [remove]
      outputs:
        summary: sales-team@example.com no longer has Full Access on sales@example.com.
  - name: refuses a trustee that isn't in the directory
    inputs: { mailbox: sales@example.com, trustee: kim@example.com, permission: FullAccess, reason: REQ-2238 account renamed since }
    mocks:
      current:
        - mailbox: { displayName: Sales, primarySmtpAddress: sales@example.com, userPrincipalName: sales@example.com }
          permissions:
            - { permission: FullAccess, trustee: kim@example.com, inherited: false, deny: false }
      owner: { id: 10000000-0000-4000-8000-000000000400, displayName: Sales, userPrincipalName: sales@example.com }
      trusteeUser: { value: [] }
      trusteeGroup: { value: [] }
    expect: { status: failed, failedStep: trusteeFound }
