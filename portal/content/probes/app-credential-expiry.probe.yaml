$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.app-credential-expiry
version: 1.0.3
title: App registration credential expiry
summary: >-
  Days until the soonest-expiring client secret or certificate across all app registrations. Pair it with the App
  credential expiry report to see which ones.
owner: identity-team
tags: [synthetic, identity, apps, credentials, sweep-6h]
group: identity
remedy: >-
  An app registration's client secret or certificate expires soon; when it does, the app or the integration that signs
  in with it stops working. Ask the app's owner to add a new credential, update wherever it's stored (Key Vault or the
  integration's settings), then remove the old one.
link: { label: Open app credential expiry, href: "/p/identity.app-credential-expiry" }
check:
  kind: appCredentialExpiry
  warnDays: 30
  critDays: 7
  include: [secrets, certificates]
intervalHint: PT6H
timeoutMs: 60000
requires:
  scopes:
    graph: [Application.Read.All]
