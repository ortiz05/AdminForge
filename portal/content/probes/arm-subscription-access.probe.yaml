$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.arm-subscription-access
version: 1.0.3
title: Default subscription access
summary: >-
  Lists one resource group in the default subscription (AF_SUBSCRIPTION_ID) as the automation identity. Fails when the
  identity has lost its Reader role assignment or the subscription is disabled.
owner: azure-team
tags: [synthetic, azure, arm, rbac, sweep-15m]
group: azure
remedy: >-
  The automation identity can't read the default subscription, so Azure checks and reports are blind. Check that it
  still holds Reader on the subscription (or its management group) and that the subscription isn't disabled.
link: { label: Open Subscriptions, href: "/p/azure.subscriptions" }
check:
  kind: arm
  path: /subscriptions/${ $encode(env.AF_SUBSCRIPTION_ID) }/resourcegroups
  apiVersion: "2021-04-01"
  query:
    $top: 1
  expect:
    status: 200
thresholds: { warn: 2000, crit: 8000 }
intervalHint: PT15M
timeoutMs: 20000
requires:
  azureRoles: [Reader]
