$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.defender-new-high-severity-alerts
version: 1.1.0
title: No untriaged high-severity Defender alerts
summary: >-
  Retired — AdminForge doesn't cover the Microsoft Defender portal. Critical while a high-severity Microsoft Defender
  XDR or Entra ID Protection alert is still New (nobody has started on it). Needs a Defender licence and Defender XDR
  set up for the tenant; until then the probe reports why it can't check instead of a status.
# Retired: AdminForge doesn't cover the Microsoft Defender portal (security operations). To bring it back, set
# status: active and bump the version.
status: retired
owner: security-team
tags: [synthetic, security, defender, alerts, sweep-15m]
check:
  kind: graph
  path: /security/alerts_v2
  query:
    $filter: status eq 'new' and severity eq 'high'
    $top: 1
  expect:
    status: 200
    # An empty list means nothing is waiting; any new high-severity alert makes the probe critical.
    bodyContains: '"value":[]'
thresholds: { warn: 3000, crit: 8000 }
intervalHint: PT15M
timeoutMs: 20000
requires:
  scopes:
    graph: [SecurityAlert.Read.All]
  licences: [defender]
