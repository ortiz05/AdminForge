$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.dns-mx
version: 1.0.3
title: Mail exchanger (MX) for the primary domain
summary: Resolves the MX record of AF_MAIL_DOMAIN and expects it to point at Exchange Online Protection.
owner: m365-team
tags: [synthetic, m365, exchange, dns, sweep-1h]
group: exchange
check:
  kind: dnsResolve
  name: ${ env.AF_MAIL_DOMAIN }
  type: MX
  expect:
    contains: [mail.protection.outlook.com]
    minAnswers: 1
intervalHint: PT1H
timeoutMs: 5000
