$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.entra-openid-metadata
version: 1.0.0
title: Entra ID sign-in endpoint
summary: >-
  Fetches the tenant's public OpenID Connect metadata from login.microsoftonline.com. A failure means engineers
  cannot sign in to AdminForge (or the tenant id in configuration is wrong).
owner: portal-admins
tags: [synthetic, identity, http]
check:
  kind: http
  url: ${ 'https://login.microsoftonline.com/' & $encode(env.AF_TENANT_ID) & '/v2.0/.well-known/openid-configuration' }
  method: GET
  expect:
    status: 200
    bodyContains: token_endpoint
thresholds: { warn: 1000, crit: 4000 }
intervalHint: PT5M
timeoutMs: 10000
