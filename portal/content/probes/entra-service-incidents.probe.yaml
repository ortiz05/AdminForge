$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.entra-service-incidents
version: 1.0.0
title: Microsoft Entra without an open incident
summary: >-
  Critical while Microsoft has an open service incident for Microsoft Entra (sign-in, MFA, Conditional Access,
  directory), listed with its id and title — sign-in trouble for every workload starts here.
owner: identity-team
tags: [synthetic, service-health, entra, sign-ins, sweep-15m]
group: identity
check:
  kind: graphCount
  path: /admin/serviceAnnouncement/issues
  query:
    $filter: >-
      isResolved eq false and classification eq 'incident' and service eq 'Microsoft Entra'
    $select: id,title,service,classification,startDateTime,lastModifiedDateTime
  fields: [id, title, service, startDateTime, lastModifiedDateTime]
  detailsLimit: 20
# Any open incident (not an advisory) is critical.
thresholds: { crit: 1 }
intervalHint: PT15M
timeoutMs: 15000
requires:
  # Application permission held by the automation identity (ADR-011).
  scopes:
    graph: [ServiceHealth.Read.All]
