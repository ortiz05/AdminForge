$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.exchange-sign-ins
version: 1.0.1
title: Exchange Online sign-in failure rate
summary: >-
  Failure rate of interactive sign-ins to Exchange Online over the last hour (Entra sign-in logs, filtered to the
  Exchange Online resource). A jump while the tenant-wide rate stays flat points at that workload — an outage, a
  Conditional Access policy that targets it, or a client that broke.
owner: m365-team
tags: [synthetic, sign-ins, exchange, sweep-1h]
group: exchange
remedy: >-
  More sign-ins to Exchange Online are failing than usual. The result names the most common error code; in the failed
  sign-ins it tells you the cause: a Conditional Access policy, MFA, a disabled or locked account, or an old client
  that uses basic authentication. Fix the policy, or contact the affected users.
link: { label: Open failed sign-ins, href: "/p/identity.sign-ins?status=Failure" }
check:
  kind: signInHealth
  window: PT1H
  maxFailurePercent: 30
  minSignIns: 20
  # The resource application (Exchange Online) — the same id in every tenant.
  resourceId: 00000002-0000-0ff1-ce00-000000000000
thresholds: { warn: 15, crit: 30 }
intervalHint: PT1H
timeoutMs: 60000
requires:
  scopes:
    graph: [AuditLog.Read.All]
  licences: [signInLogs]
