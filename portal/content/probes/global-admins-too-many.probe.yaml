$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.global-admins-too-many
version: 1.0.2
title: Global Administrators (too many)
summary: >-
  Counts the accounts that hold the Global Administrator role directly. Microsoft recommends fewer than five: warns at
  five and is critical at eight. Members of role-assignable groups and PIM-eligible holders aren't counted.
owner: identity-team
tags: [identity, privileged, roles, sweep-6h]
group: identity
remedy: >-
  More people hold Global Administrator directly than the threshold, and each one is a way to take over the tenant.
  Review who holds it; move people to narrower roles (User, Exchange or Intune Administrator, …) or make the role
  eligible through PIM instead of permanent.
link: { label: Open the Global Administrator role, href: "/p/identity.role?id=62e90394-69f5-4237-9190-012177145e10" }
check:
  kind: graphCount
  path: /directoryRoles(roleTemplateId='62e90394-69f5-4237-9190-012177145e10')/members
  query:
    $select: id,displayName,userPrincipalName
  fields: [displayName, userPrincipalName]
thresholds: { warn: 5, crit: 8 }
intervalHint: PT6H
timeoutMs: 20000
requires:
  scopes:
    graph: [RoleManagement.Read.Directory]
