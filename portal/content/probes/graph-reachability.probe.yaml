$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.graph-reachability
version: 1.0.3
title: Microsoft Graph reachability
summary: Reads the organization object as the automation identity and measures round-trip latency.
owner: portal-admins
tags: [synthetic, graph, sweep-15m]
group: m365
remedy: >-
  Microsoft Graph didn't answer from this host, so most AdminForge pages and checks fail until it does. Check Service
  health; if there's no incident, check this host's internet access, proxy and DNS.
link: { label: Open Service health, href: "/p/m365.service-health" }
check:
  kind: graph
  path: /organization
  query:
    $select: id
  expect:
    status: 200
thresholds: { warn: 1500, crit: 5000 }
intervalHint: PT15M
timeoutMs: 15000
requires:
  scopes:
    graph: [Organization.Read.All]
