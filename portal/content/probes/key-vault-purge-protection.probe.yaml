$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.key-vault-purge-protection
version: 1.0.2
title: Key Vaults without purge protection
summary: >-
  Key Vaults where purge protection is off, so a deleted vault, key, secret or certificate can be purged before the
  retention period ends (a ransomware and insider-risk path). Purge protection cannot be turned off once enabled.
owner: azure-team
tags: [kql, configuration, azure, key-vault, security, config-check]
group: azure
remedy: >-
  A key vault doesn't have purge protection, so a deleted key, secret or vault can be purged for good before its
  retention period ends. Turn on purge protection (it can't be turned off again); check with the vault's owner first.
link: { label: Open Key Vault configuration, href: "/p/azure.key-vault-configuration" }
check:
  kind: kql
  source: resourceGraph
  query: |
    // af:probes.key-vault-purge-protection
    resources
    | where type =~ 'microsoft.keyvault/vaults'
    | extend purgeProtection = tobool(properties.enablePurgeProtection), softDelete = tobool(properties.enableSoftDelete)
    | where isnull(purgeProtection) or purgeProtection == false
    | project id, name, resourceGroup, subscriptionId, location, softDelete, purgeProtection
    | order by name asc
  metric: rowCount
  detailsLimit: 50
thresholds: { warn: 1, crit: 10 }
intervalHint: PT6H
timeoutMs: 60000
requires:
  azureRoles: [Reader]
