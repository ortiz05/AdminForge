$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.m365-services-interrupted
version: 1.0.0
title: Microsoft 365 services without an interruption
summary: >-
  Counts the Microsoft 365 services whose current health in Microsoft's service health overview is "service
  interruption" — people can't use them — and lists them. Critical at one. Degradations (often advisories) are left to
  the Service health page, so this check only fires when something is actually down.
owner: m365-team
tags: [synthetic, service-health, m365, sweep-15m]
group: m365
check:
  kind: graphCount
  path: /admin/serviceAnnouncement/healthOverviews
  query:
    $select: id,service,status
  items: "${ value[status = 'serviceInterruption'] }"
  fields: [service, status]
thresholds: { crit: 1 }
intervalHint: PT15M
timeoutMs: 15000
requires:
  scopes:
    graph: [ServiceHealth.Read.All]
