$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.m365-workload-incidents
# Retired 2026-10-17: one incident check per workload (exchange-, sharepoint-, onedrive-, teams-, entra-,
# intune-service-incidents) and probes.m365-suite-incidents say which service and which incident.
status: retired
version: 1.2.1
title: Microsoft 365 core workloads without an open incident
summary: >-
  Retired — replaced by an incident check per workload (probes.exchange-service-incidents and the same for
  SharePoint, OneDrive, Teams, Entra and Intune) and probes.m365-suite-incidents, which say which service and which
  incident. It was critical while Microsoft had an open service incident for Exchange Online, Microsoft Teams,
  SharePoint Online, OneDrive for Business or the Microsoft 365 suite.
owner: m365-team
tags: [synthetic, m365, service-health, sweep-15m]
group: m365
check:
  kind: graph
  path: /admin/serviceAnnouncement/issues
  query:
    $filter: >-
      isResolved eq false and classification eq 'incident' and (service eq 'Exchange Online' or service eq 'Microsoft
      Teams' or service eq 'SharePoint Online' or service eq 'Microsoft OneDrive' or service eq 'OneDrive for Business' or service eq 'Microsoft 365 suite')
    $select: id,service
    $top: 1
  expect:
    status: 200
    # An empty list means no open incident; any incident makes the probe critical.
    bodyContains: '"value":[]'
thresholds: { warn: 2000, crit: 6000 }
intervalHint: PT15M
timeoutMs: 15000
requires:
  # Application permission held by the automation identity (ADR-011).
  scopes:
    graph: [ServiceHealth.Read.All]
