$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.portal-readiness
version: 1.0.4
title: AdminForge readiness
summary: Calls the portal's own /readyz endpoint (API up, database file readable, run worker and scheduler reporting) at the configured public URL and measures latency.
owner: portal-admins
tags: [synthetic, portal, http, sweep-15m]
group: platform
remedy: >-
  AdminForge isn't fully ready. HTTP 503 or no answer: the database file can't be read, or the Ingress can't reach
  the pod, so pages may not load. HTTP 200 without the expected text means degraded: pages load, but playbook runs or
  schedules aren't being processed. The AdminForge administrator reads the api container's log first, then checks the
  database volume (mounted, not full) and the Ingress (docs/troubleshooting.md › Operations symptoms).
check:
  kind: http
  url: ${ env.PUBLIC_BASE_URL & '/readyz' }
  method: GET
  expect:
    status: 200
    bodyContains: '"status":"ok"'
thresholds: { warn: 1000, crit: 5000 }
intervalHint: PT15M
timeoutMs: 10000
