$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.saml-certificates-expiring
version: 1.0.1
title: SAML signing certificates expiring within 30 days
summary: >-
  Counts the enabled SAML enterprise applications whose newest token-signing certificate expires within 30 days, so a
  replacement can be created, activated and uploaded to the application before single sign-on breaks. Warns at one.
  Expired or 7-day certificates also turn the companion probe critical; the SAML signing certificate expiry report has
  the details.
owner: identity-team
tags: [identity, apps, saml, certificates, sweep-6h]
group: identity
check:
  kind: graphCount
  path: /servicePrincipals
  query:
    $filter: preferredSingleSignOnMode eq 'saml' and accountEnabled eq true
    $select: id,displayName,keyCredentials
    $top: 999
  # The newest signing certificate of each app (a rollover holds two); apps whose newest one is within 30 days.
  items: >-
    ${ value.(
      $latest := [keyCredentials[usage = 'Sign']^(endDateTime)][-1];
      $left := $latest ? $daysUntil($latest.endDateTime) : null;
      ($type($left) = 'number' and $left <= 30) ? { "displayName": displayName, "expires": $latest.endDateTime, "daysRemaining": $left }
    ) }
  worse: higher
  maxItems: 500
  fields: [displayName, expires, daysRemaining]
thresholds: { warn: 1 }
intervalHint: PT6H
timeoutMs: 30000
requires:
  scopes:
    graph: [Application.Read.All]
