$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.sign-in-health-adminforge
version: 1.0.3
title: AdminForge sign-in failure rate
summary: >-
  Failure rate of sign-ins to the AdminForge Read app (AF_READ_CLIENT_ID) over the last hour. Catches Conditional
  Access or app-registration changes that lock engineers out of the portal.
owner: portal-admins
tags: [synthetic, portal, sign-ins, sweep-1h]
group: platform
remedy: >-
  Sign-ins to AdminForge are failing. The result names the most common error code; in the failed sign-ins it says
  whether it's Conditional Access, a person not assigned to the app, or missing consent.
link: { label: Open failed sign-ins, href: "/p/identity.sign-ins?status=Failure" }
check:
  kind: signInHealth
  window: PT1H
  maxFailurePercent: 30
  minSignIns: 5
  appId: ${ env.AF_READ_CLIENT_ID }
thresholds: { warn: 10, crit: 30 }
intervalHint: PT1H
timeoutMs: 60000
requires:
  scopes:
    graph: [AuditLog.Read.All]
  licences: [signInLogs]
