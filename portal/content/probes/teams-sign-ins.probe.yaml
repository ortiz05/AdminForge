$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.teams-sign-ins
version: 1.0.1
title: Microsoft Teams sign-in failure rate
summary: >-
  Failure rate of interactive sign-ins to Microsoft Teams over the last hour (Entra sign-in logs, filtered to the
  Microsoft Teams resource). A jump while the tenant-wide rate stays flat points at that workload — an outage, a
  Conditional Access policy that targets it, or a client that broke.
owner: m365-team
tags: [synthetic, sign-ins, teams, sweep-1h]
group: teams
remedy: >-
  More sign-ins to Microsoft Teams are failing than usual. The result names the most common error code; in the failed
  sign-ins it tells you the cause: a Conditional Access policy, MFA, or a disabled account. Fix the policy, or contact
  the affected users.
link: { label: Open failed sign-ins, href: "/p/identity.sign-ins?status=Failure" }
check:
  kind: signInHealth
  window: PT1H
  maxFailurePercent: 30
  minSignIns: 20
  # The resource application (Microsoft Teams) — the same id in every tenant.
  resourceId: cc15fd57-2c6c-4117-a88c-83b1d56b4bbe
thresholds: { warn: 15, crit: 30 }
intervalHint: PT1H
timeoutMs: 60000
requires:
  scopes:
    graph: [AuditLog.Read.All]
  licences: [signInLogs]
