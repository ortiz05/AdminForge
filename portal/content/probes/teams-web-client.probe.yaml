$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.teams-web-client
version: 1.0.0
title: Teams web app
summary: >-
  Loads the Teams web app (teams.cloud.microsoft) the way a current Edge browser does, without signing in, and expects
  the app page. An error or no answer means people can't open Teams in a browser.
owner: m365-team
tags: [synthetic, teams, http, sweep-15m]
group: teams
check:
  kind: http
  url: https://teams.cloud.microsoft/v2/
  method: GET
  headers:
    # Teams sends other browsers to an "unsupported browser" page.
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 Edg/130.0.0.0
  expect:
    status: 200
    bodyContains: <html
thresholds: { warn: 2000, crit: 6000 }
intervalHint: PT15M
timeoutMs: 10000
