$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.token-arm
version: 1.0.5
title: Token acquisition — Azure Resource Manager
summary: >-
  Acquires an app-only token for Azure Resource Manager as the automation identity (certificate or secret from local
  configuration). Azure inventory, Resource Graph checks and Cost Management reports depend on it.
owner: portal-admins
tags: [synthetic, identity, tokens, sweep-1h]
group: platform
remedy: >-
  The automation identity couldn't get a token for Azure Resource Manager, so every schedule and probe that uses Azure
  Resource Manager fails until it can. Usually its certificate expired or was replaced, or admin consent was removed. An
  AdminForge administrator checks the automation identity's provisioning (its certificate or secret, and admin consent)
  and renews what is missing (docs/operations.md › Secret and key rotation).
check:
  kind: tokenAcquisition
  service: arm
thresholds: { warn: 1500, crit: 5000 }
intervalHint: PT1H
timeoutMs: 15000
