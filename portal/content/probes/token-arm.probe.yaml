$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.token-arm
version: 1.0.0
title: Token acquisition — Azure Resource Manager
summary: >-
  Acquires an app-only token for Azure Resource Manager as the automation identity (certificate or secret from local configuration).
  Azure inventory, Resource Graph and Function App schedules depend on it.
owner: portal-admins
tags: [synthetic, identity, tokens]
check:
  kind: tokenAcquisition
  service: arm
thresholds: { warn: 1500, crit: 5000 }
intervalHint: PT15M
timeoutMs: 15000
