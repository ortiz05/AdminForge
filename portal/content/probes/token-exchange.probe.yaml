$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.token-exchange
version: 1.0.2
title: Token acquisition — Exchange Online
summary: >-
  Acquires an app-only token for Exchange Online as the automation identity (certificate or secret from local
  configuration). Scheduled Exchange runner scripts depend on it; the identity also needs the Exchange.ManageAsApp
  permission and an Exchange role to do anything with the token.
owner: portal-admins
tags: [synthetic, identity, tokens, sweep-1h]
group: platform
check:
  kind: tokenAcquisition
  service: exchange
thresholds: { warn: 1500, crit: 5000 }
intervalHint: PT1H
timeoutMs: 15000
