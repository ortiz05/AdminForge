$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.token-log-analytics
version: 1.0.4
title: Token acquisition — Log Analytics
summary: >-
  Acquires an app-only token for Log Analytics as the automation identity (certificate or secret from local
  configuration). Log query schedules and sign-in health over a workspace depend on it.
owner: portal-admins
tags: [synthetic, identity, tokens, sweep-1h]
group: platform
remedy: >-
  The automation identity couldn't get a token for Log Analytics, so every schedule and probe that uses Log Analytics
  fails until it can. Usually its certificate expired or was replaced, or admin consent was removed. An AdminForge
  administrator runs adminforge provision status, which checks every provisioned object and gets a live token, then
  renews what it reports (docs/operations.md › Secret and key rotation).
check:
  kind: tokenAcquisition
  service: logAnalytics
thresholds: { warn: 1500, crit: 5000 }
intervalHint: PT1H
timeoutMs: 15000
