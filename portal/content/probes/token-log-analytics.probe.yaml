$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.token-log-analytics
version: 1.0.1
title: Token acquisition — Log Analytics
summary: >-
  Acquires an app-only token for Log Analytics as the automation identity (certificate or secret from local configuration).
  Log query schedules and sign-in health over a workspace depend on it.
owner: portal-admins
tags: [synthetic, identity, tokens, sweep-1h]
check:
  kind: tokenAcquisition
  service: logAnalytics
thresholds: { warn: 1500, crit: 5000 }
intervalHint: PT15M
timeoutMs: 15000
