$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.token-sharepoint-admin
version: 1.0.0
title: Token acquisition — SharePoint admin
summary: >-
  Acquires an app-only token for SharePoint admin as the automation identity (certificate or secret from local configuration).
  Needs AF_SPO_TENANT_NAME. SharePoint only accepts app-only tokens from a certificate credential (AF_AUTOMATION_CERT_PATH), so a token from a client secret passes this probe but SharePoint calls still fail.
owner: portal-admins
tags: [synthetic, identity, tokens]
check:
  kind: tokenAcquisition
  service: sharepointAdmin
thresholds: { warn: 1500, crit: 5000 }
intervalHint: PT15M
timeoutMs: 15000
