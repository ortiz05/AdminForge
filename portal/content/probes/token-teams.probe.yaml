$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.token-teams
version: 1.0.5
title: Token acquisition — Skype and Teams Tenant Admin API
summary: >-
  Acquires an app-only token for Skype and Teams Tenant Admin API as the automation identity (certificate or secret
  from local configuration). Scheduled Teams runner scripts depend on it.
owner: portal-admins
tags: [synthetic, identity, tokens, sweep-1h]
group: platform
remedy: >-
  The automation identity couldn't get a token for Teams administration, so every schedule and probe that uses Teams
  administration fails until it can. Usually its certificate expired or was replaced, or admin consent was removed. An
  AdminForge administrator checks the automation identity's provisioning (its certificate or secret, and admin consent)
  and renews what is missing (docs/operations.md › Secret and key rotation).
check:
  kind: tokenAcquisition
  service: teams
thresholds: { warn: 1500, crit: 5000 }
intervalHint: PT1H
timeoutMs: 15000
