$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.unattached-disks-30-days
version: 1.0.1
title: Managed disks unattached for 30 days or more
summary: >-
  Managed disks that no VM has used for at least 30 days (detached since LastOwnershipUpdateTime, or never attached
  since creation). They are billed in full while nobody uses them. The Orphaned Azure resources report lists them with
  the other orphaned resources and offers tagging the ones to keep.
owner: azure-team
tags: [kql, configuration, azure, cost, compute, config-check]
group: azure
check:
  kind: kql
  source: resourceGraph
  query: |
    // af:probes.unattached-disks-30-days
    resources
    | where type =~ 'microsoft.compute/disks'
    | where tostring(properties.diskState) =~ 'Unattached'
    | extend since = coalesce(todatetime(properties.LastOwnershipUpdateTime), todatetime(properties.timeCreated))
    | where since < ago(30d)
    | project id, name, resourceGroup, subscriptionId, location, sku = tostring(sku.name), sizeGB = toint(properties.diskSizeGB), since, daysUnattached = toint(datetime_diff('day', now(), since))
    | order by sizeGB desc, name asc
  metric: rowCount
  detailsLimit: 100
thresholds: { warn: 1, crit: 25 }
intervalHint: PT6H
timeoutMs: 60000
requires:
  azureRoles: [Reader]
