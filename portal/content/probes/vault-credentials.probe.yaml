$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.vault-credentials
version: 1.0.0
title: Credentials from Vault
summary: >-
  Checks that AdminForge read the automation identity's and every app identity's credential from HashiCorp Vault at
  its last refresh — critical when an identity has no usable credential, a warning when a read failed and the
  credential read earlier stays in use. OK and silent where Vault isn't used.
owner: portal-admins
tags: [synthetic, portal, vault, sweep-15m]
group: platform
remedy: >-
  The details name each identity's Vault path and what Vault answered. Nothing at the path: put its client_secret or
  certificate_pem under AF_VAULT_PATH at identities/ followed by the identity's name (the platform team); AdminForge reads it at the next
  refresh. HTTP 403: Vault's policy for AdminForge doesn't grant that path — add it to the policy. A redirect: point
  AF_VAULT_ADDR at the active node or a load balancer that forwards. Not reached or the login refused: check that Vault
  is up, the network policy lets the pod reach it and its Vault role still logs in. Until then AdminForge uses the
  credentials it read earlier, so schedules keep running while those stay valid.
link: { label: Open monitoring, href: "/monitoring?group=platform" }
check:
  kind: vaultCredentials
intervalHint: PT15M
timeoutMs: 10000
