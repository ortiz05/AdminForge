$schema: ../../packages/schemas/generated/probe.schema.json
kind: probe
id: probes.vault-credentials
version: 1.0.0
title: Credentials from Vault
summary: >-
  Checks that AdminForge read the automation identity's and every app identity's credential from HashiCorp Vault at
  its last refresh — critical when an identity has no credential at its path, a warning when Vault couldn't be read
  (the last good credentials stay in use). OK and silent where Vault isn't used.
owner: portal-admins
tags: [synthetic, portal, vault, sweep-15m]
group: platform
remedy: >-
  An identity with no credential: put its client_secret or certificate_pem at identities/<name> under AF_VAULT_PATH in
  Vault (the platform team), and AdminForge reads it at the next refresh. Vault unreachable: check that Vault is up, the
  network policy lets the AdminForge pod reach it, and its Vault role still logs in; until then AdminForge uses the
  credentials it last read, so schedules keep running while those stay valid.
link: { label: Open monitoring, href: "/monitoring?group=platform" }
check:
  kind: vaultCredentials
intervalHint: PT15M
timeoutMs: 10000
