$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: azure.storage-account-security
version: 1.1.0
title: Storage account security settings
summary: Storage accounts that allow shared key (account key and SAS) access, are reachable from all networks, allow anonymous blob access, accept plain HTTP or TLS below 1.2 — each setting per account, so you can move to Entra ID authorization and private access.
owner: azure-team
tags: [azure, storage, security, network, resource-graph]
nav: { section: reports, label: Storage account security, icon: hard-drives, order: 184 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    arm: [user_impersonation]
  azureRoles: [Reader]

params:
  findingsOnly: { type: boolean, default: true, label: Only accounts with findings, facet: true }
  subscriptionId: { type: string, format: guid, label: Subscription, picker: subscription, facet: true }

datasources:
  accounts:
    source: resourceGraph
    # Resource Graph returns computed booleans as 1/0, so flags are projected as 'true'/'false' text with iff() (tostring() would give True/False).
    # allowSharedKeyAccess and allowBlobPublicAccess are null (= allowed) until someone sets them; publicNetworkAccess is
    # null (= enabled) on older accounts. Anonymous access also needs a container set to public: this is the account switch.
    query: |
      // af:azure.storage-account-security#rows
      resources
      | where type =~ 'microsoft.storage/storageaccounts'
      ${ params.subscriptionId ? "| where subscriptionId == '" & $guid(params.subscriptionId) & "'" }
      | extend publicNetworkAccess = iff(isempty(tostring(properties.publicNetworkAccess)), 'Enabled', tostring(properties.publicNetworkAccess)), defaultAction = tostring(properties.networkAcls.defaultAction)
      | extend network = case(publicNetworkAccess =~ 'Disabled', 'Private only', defaultAction =~ 'Deny', 'Selected networks', 'All networks')
      | extend sharedKey = iff(isnull(properties.allowSharedKeyAccess), true, tobool(properties.allowSharedKeyAccess)), blobPublicAccess = iff(isnull(properties.allowBlobPublicAccess), true, tobool(properties.allowBlobPublicAccess)), httpsOnly = iff(isnull(properties.supportsHttpsTrafficOnly), true, tobool(properties.supportsHttpsTrafficOnly)), minimumTls = iff(isempty(tostring(properties.minimumTlsVersion)), 'TLS1_0', tostring(properties.minimumTlsVersion)), crossTenantReplication = iff(isnull(properties.allowCrossTenantReplication), false, tobool(properties.allowCrossTenantReplication)), privateEndpoints = coalesce(array_length(properties.privateEndpointConnections), 0), sftp = iff(isnull(properties.isSftpEnabled), false, tobool(properties.isSftpEnabled))
      | extend findings = iff(sharedKey, 1, 0) + iff(network == 'All networks', 1, 0) + iff(blobPublicAccess, 1, 0) + iff(httpsOnly, 0, 1) + iff(minimumTls in ('TLS1_0', 'TLS1_1'), 1, 0)
      ${ params.findingsOnly = false ? '' : '| where findings > 0' }
      | join kind=leftouter (resourcecontainers | where type =~ 'microsoft.resources/subscriptions' | project subscriptionId, subscriptionName = name) on subscriptionId
      | project id, name, kind, skuName = tostring(sku.name), network, publicNetworkAccess, defaultAction, privateEndpoints, sharedKey = iff(sharedKey, 'true', 'false'), blobPublicAccess = iff(blobPublicAccess, 'true', 'false'), httpsOnly = iff(httpsOnly, 'true', 'false'), minimumTls, crossTenantReplication = iff(crossTenantReplication, 'true', 'false'), sftp = iff(sftp, 'true', 'false'), findings, resourceGroup, subscriptionId, subscriptionName, location, tags
      | order by findings desc, name asc
    paging: all
    maxItems: 50000
    cache: { ttl: 300 }
  summary:
    source: resourceGraph
    # Same filters as the rows, counted in Resource Graph: no row transform, so large tenants stay within the
    # 250 ms transform budget and exports stream the rows as they are.
    query: |
      // af:azure.storage-account-security#summary
      resources
      | where type =~ 'microsoft.storage/storageaccounts'
      ${ params.subscriptionId ? "| where subscriptionId == '" & $guid(params.subscriptionId) & "'" }
      | extend publicNetworkAccess = iff(isempty(tostring(properties.publicNetworkAccess)), 'Enabled', tostring(properties.publicNetworkAccess)), defaultAction = tostring(properties.networkAcls.defaultAction)
      | extend network = case(publicNetworkAccess =~ 'Disabled', 'Private only', defaultAction =~ 'Deny', 'Selected networks', 'All networks')
      | extend sharedKey = iff(isnull(properties.allowSharedKeyAccess), true, tobool(properties.allowSharedKeyAccess)), blobPublicAccess = iff(isnull(properties.allowBlobPublicAccess), true, tobool(properties.allowBlobPublicAccess)), httpsOnly = iff(isnull(properties.supportsHttpsTrafficOnly), true, tobool(properties.supportsHttpsTrafficOnly)), minimumTls = iff(isempty(tostring(properties.minimumTlsVersion)), 'TLS1_0', tostring(properties.minimumTlsVersion)), crossTenantReplication = iff(isnull(properties.allowCrossTenantReplication), false, tobool(properties.allowCrossTenantReplication)), privateEndpoints = coalesce(array_length(properties.privateEndpointConnections), 0), sftp = iff(isnull(properties.isSftpEnabled), false, tobool(properties.isSftpEnabled))
      | extend findings = iff(sharedKey, 1, 0) + iff(network == 'All networks', 1, 0) + iff(blobPublicAccess, 1, 0) + iff(httpsOnly, 0, 1) + iff(minimumTls in ('TLS1_0', 'TLS1_1'), 1, 0)
      ${ params.findingsOnly = false ? '' : '| where findings > 0' }
      | summarize total = count(), sharedKey = countif(sharedKey), allNetworks = countif(network == 'All networks'), blobPublic = countif(blobPublicAccess), weakTransport = countif(not(httpsOnly) or minimumTls in ('TLS1_0', 'TLS1_1'))
    transform: "${ value.value[0] }"
    cache: { ttl: 300 }

layout:
  - widget: kpi
    data: summary.sharedKey
    label: Shared key access allowed
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    data: summary.allNetworks
    label: Reachable from all networks
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    data: summary.blobPublic
    label: Anonymous blob access allowed
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: kpi
    data: summary.weakTransport
    label: HTTP or TLS below 1.2
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: table
    id: accounts
    span: 12
    data: accounts.value
    rowKey: id
    selection: multi
    columns:
      - { field: name, label: Storage account, kind: identity, secondary: skuName, sortable: true }
      - { field: findings, label: Findings, kind: number, sortable: true, filter: range }
      - field: sharedKey
        label: Shared key
        kind: status
        map: { "true": [warn, Allowed], "false": [ok, Entra ID only] }
        filter: facet
      - field: network
        label: Network access
        kind: status
        map: { All networks: [warn, All networks], Selected networks: [info, Selected networks], Private only: [ok, Private only] }
        filter: facet
      - field: blobPublicAccess
        label: Anonymous blobs
        kind: status
        map: { "true": [crit, Allowed], "false": [ok, Blocked] }
        filter: facet
      - field: httpsOnly
        label: HTTPS only
        kind: status
        map: { "true": [ok, HTTPS only], "false": [crit, HTTP allowed] }
        filter: facet
      - { field: minimumTls, label: Minimum TLS, filter: facet }
      - { field: privateEndpoints, label: Private endpoints, kind: number, filter: range }
      - { field: crossTenantReplication, label: Cross-tenant replication, kind: status, map: { "true": [warn, Allowed], "false": [ok, Blocked] }, hidden: true }
      - { field: sftp, label: SFTP, kind: enum, map: { "true": "On", "false": "Off" }, hidden: true }
      - { field: kind, label: Kind, filter: facet, hidden: true }
      - { field: resourceGroup, label: Resource group, filter: facet }
      - { field: subscriptionName, label: Subscription, filter: facet }
      - { field: location, label: Location, hidden: true }
      - { field: tags, label: Tags, kind: tags, hidden: true }
      - { field: subscriptionId, label: Subscription id, kind: guid, hidden: true }
      - { field: id, label: Resource id, kind: code, hidden: true }
    inspect:
      page: azure.resource
      params:
        id: ${ row.id }
    rowActions:
      - label: Open Configuration in Azure portal
        icon: arrow-square-out
        href: https://portal.azure.com/#resource${ row.id }/configuration
      - label: Prevent shared key authorization (guide)
        icon: book-open
        href: https://learn.microsoft.com/azure/storage/common/shared-key-authorization-prevent
    bulkActions:
      - playbook: azure.add-tags
        label: Add or update a tag
        icon: tag
        forEach:
          inputs:
            resourceId: ${ row.id }
          concurrency: 5
        maxItems: 500
    empty:
      title: Every storage account is locked down
      body: No storage account in the subscriptions you can read allows shared key access, anonymous blobs, plain HTTP, old TLS or access from all networks.

export:
  formats: [csv, xlsx]
  fileName: azure-storage-account-security
  data: accounts.value
  columns: all
