$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: endpoint.autopilot-not-enrolled
version: 2.0.0
title: Autopilot devices not enrolled
summary: >-
  Windows Autopilot devices that haven't enrolled in Intune — never contacted, failed, blocked or waiting for a reset —
  with group tag, assigned user and last contact, to chase devices that were bought but never deployed or got stuck
  during provisioning.
owner: endpoint-team
tags: [endpoint, intune, autopilot, windows, report]
nav: { section: reports, label: Autopilot devices not enrolled, icon: rocket-launch, order: 35 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [DeviceManagementServiceConfig.Read.All]
  entraRoles: [Intune Administrator]
  licences: [intune]

params:
  state:
    type: enum
    label: Enrolment state
    facet: true
    default: any
    values:
      - { value: any, label: Any state except enrolled }
      - { value: notContacted, label: Never contacted }
      - { value: failed, label: Failed or blocked }
      - { value: pendingReset, label: Pending reset }
  minDays:
    type: number
    label: Not contacted for at least
    unit: days
    default: 0
    min: 0
    max: 365
    integer: true
    facet: true

savedViews:
  enabled: true
  shared: true
  presets:
    - { name: Failed or blocked, params: { state: failed } }
    - { name: Never contacted, params: { state: notContacted } }

# Autopilot filters only on serial number and group tag, so every identity is read (500 per page) and the enrolment
# state is checked here. "Never contacted" devices report 0001-01-01 as their last contact.
datasources:
  devices:
    source: graph
    request:
      path: /deviceManagement/windowsAutopilotDeviceIdentities
      query:
        $top: 500
    paging: all
    maxItems: 100000
    cache: { ttl: 1800 }
    # Native filters on disjoint sets ($applyAdvanced): failed or blocked, then the rest; never contacted (Autopilot
    # reports 0001-01-01, shown as no date) before the longest silent. 100k identities fit the transform budget.
    transform: >-
      ${ (
        $state := params.state ? params.state : 'any';
        $min := params.minDays ? $number(params.minDays) : 0;
        $f := function($rows, $clauses) { $applyAdvanced($rows, { "join": "and", "clauses": $clauses }) };
        $all := $f(value.value, [
          { "path": "enrollmentState", "type": "string", "op": "notEmpty", "value": null },
          { "path": "enrollmentState", "type": "string", "op": "ne", "value": "enrolled" }
        ]);
        $neverClause := { "join": "or", "clauses": [
          { "path": "lastContactedDateTime", "type": "date", "op": "isEmpty", "value": null },
          { "path": "lastContactedDateTime", "type": "date", "op": "lt", "value": "1900-01-01T00:00:00Z" }
        ] };
        $contactedClause := { "path": "lastContactedDateTime", "type": "date", "op": "ge", "value": "1900-01-01T00:00:00Z" };
        $failedClause := { "path": "enrollmentState", "type": "string", "op": "in", "value": ['failed', 'blocked'] };
        $otherClause := { "path": "enrollmentState", "type": "string", "op": "notIn", "value": ['failed', 'blocked'] };
        $stateClause := $state = 'any' ? [] : $state = 'failed' ? [$failedClause]
          : [{ "path": "enrollmentState", "type": "string", "op": "eq", "value": $state }];
        /* "At least N days" as before: N whole days since the last contact (the day of contact counts as day 0). */
        $longEnough := $min = 0 ? [] : [{ "path": "lastContactedDateTime", "type": "date", "op": "lt", "value": $daysAgo($min - 1) }];
        $part := function($clause) { (
          $neverRows := $f($all, $append([$clause, $neverClause], $stateClause));
          $never := $withFields($neverRows^(serialNumber), { "lastContactedDateTime": null, "contacted": false });
          $seen := $f($all, $append($append([$clause, $contactedClause], $stateClause), $longEnough));
          $append($never, $withFields($seen^(lastContactedDateTime), { "contacted": true }))
        ) };
        /* A grouping key must be text: only identities with a group tag are grouped. */
        $tagged := $f($all, [{ "path": "groupTag", "type": "string", "op": "notEmpty", "value": null }]);
        $groups := $tagged{ groupTag: $count($) };
        $untagged := $count($f($all, [{ "path": "groupTag", "type": "string", "op": "isEmpty", "value": null }]));
        {
          "rows": $append([], $append($part($failedClause), $part($otherClause))),
          "notEnrolled": $count($all),
          "failed": $count($f($all, [$failedClause])),
          "neverContacted": $count($f($all, [$neverClause])),
          "noGroupTag": $untagged,
          "byGroup": $append([], ([$append(
            [$keys($groups).{ "group": $, "devices": $lookup($groups, $) }],
            $untagged > 0 ? [{ "group": "(none)", "devices": $untagged }] : []
          )]^(>devices))[[0..5]]),
          "partial": value.truncated = true
        }
      ) }

layout:
  - widget: markdown
    span: 12
    when: ${ devices.partial = true }
    text: >-
      **Partial data.** Autopilot has more devices than this report reads (100,000); the figures and the list cover the
      ones read.
  - widget: kpi
    data: devices.notEnrolled
    label: Not enrolled
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    data: devices.failed
    label: Failed or blocked
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
    href: /p/endpoint.autopilot-not-enrolled?state=failed
  - widget: kpi
    data: devices.neverContacted
    label: Never contacted
    format: number
    href: /p/endpoint.autopilot-not-enrolled?state=notContacted
  - widget: kpi
    data: devices.noGroupTag
    label: Without a group tag
    format: number
    status: "${ value > 0 ? 'info' : 'ok' }"
  - widget: markdown
    span: 8
    text: |
      **What to do.** *Failed* or *blocked*: check the enrolment restrictions and the device's Autopilot profile, then
      retry from the Out-of-box experience. *Never contacted*: the device was registered but hasn't been switched on
      on a network yet — confirm it was delivered. A missing group tag usually means no Autopilot profile reaches the
      device, so it won't provision as expected.
  - widget: chart
    id: byGroup
    title: By group tag
    type: bar
    span: 4
    rows: 2
    data: devices.byGroup
    x: group
    y: devices
    format: number
  - widget: table
    id: devices
    span: 12
    data: devices.rows
    rowKey: id
    columns:
      - { field: serialNumber, label: Serial number, kind: code, sortable: true }
      - field: enrollmentState
        label: Enrolment
        kind: status
        map: { notContacted: [neutral, Never contacted], pendingReset: [info, Pending reset], failed: [crit, Failed], blocked: [crit, Blocked], unknown: [neutral, Unknown] }
        filter: facet
      - { field: lastContactedDateTime, label: Last contact, kind: relativeTime, sortable: true }
      - { field: groupTag, label: Group tag, filter: facet }
      - { field: model, label: Model, filter: facet }
      - { field: manufacturer, label: Manufacturer, hidden: true }
      - { field: userPrincipalName, label: Assigned user }
      - { field: purchaseOrderIdentifier, label: Purchase order, hidden: true }
      - { field: id, label: Autopilot id, kind: guid, hidden: true }
    rowActions:
      - label: Open in Intune admin center
        icon: arrow-square-out
        href: https://intune.microsoft.com/#view/Microsoft_Intune_Enrollment/AutopilotDevices.ReactView
      - label: All Autopilot devices
        icon: list
        href: /p/endpoint.autopilot?q=${ $encode(row.serialNumber) }
    empty:
      title: Every Autopilot device is enrolled
      body: No registered device is waiting to enrol or stuck in provisioning.

export:
  formats: [csv, xlsx]
  fileName: autopilot-not-enrolled
  data: devices.rows
  columns: all
