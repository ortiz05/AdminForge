$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: endpoint.device-security-gaps
version: 2.0.0
title: Unencrypted and jailbroken devices
summary: >-
  Intune-managed devices whose disk isn't encrypted (BitLocker, FileVault, Android or Linux encryption) and phones that
  are jailbroken or rooted — the two device states that most often turn a lost device into a data breach.
owner: endpoint-team
tags: [endpoint, intune, encryption, security, report]
nav: { section: reports, label: Unencrypted and jailbroken devices, icon: lock-open, order: 33 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [DeviceManagementManagedDevices.Read.All]
  entraRoles: [Intune Administrator]
  licences: [intune]

params:
  issue:
    type: enum
    label: Problem
    facet: true
    default: any
    values:
      - { value: any, label: Not encrypted or jailbroken }
      - { value: unencrypted, label: Not encrypted }
      - { value: jailbroken, label: Jailbroken or rooted }
  os: { type: enum, values: [Any, Windows, macOS, iOS, Android, Linux], default: Any, label: OS, facet: true }
  ownership: { type: enum, values: [Any, company, personal], default: Any, label: Ownership, facet: true }

savedViews:
  enabled: true
  shared: true
  presets:
    - { name: Unencrypted company laptops, params: { issue: unencrypted, ownership: company } }
    - { name: Jailbroken or rooted phones, params: { issue: jailbroken } }

# Intune doesn't filter on isEncrypted or jailBroken, so the fleet is read with only the fields needed (OS and
# ownership are filtered by Intune) and the two states are checked here. jailBroken is "True", "False" or "Unknown"
# (Windows and macOS always report Unknown).
datasources:
  deviceList:
    source: graph
    label: Managed devices (Intune)
    request:
      path: /deviceManagement/managedDevices
      query:
        $select: id,deviceName,userPrincipalName,userDisplayName,operatingSystem,osVersion,isEncrypted,jailBroken,complianceState,lastSyncDateTime,managedDeviceOwnerType,model,serialNumber
        $top: 1000
        $filter: >-
          ${ $join([
               params.os != 'Any' ? "operatingSystem eq " & $odata(params.os),
               params.ownership != 'Any' ? "managedDeviceOwnerType eq " & $odata(params.ownership)
             ][$], ' and ') }
    paging: all
    maxItems: 100000
    cache: { ttl: 1800 }
    # Native filters ($applyAdvanced) on three disjoint sets — jailbroken and unencrypted, jailbroken only, unencrypted
    # only — labelled with $withFields, so 30k devices fit the transform budget. Rooted devices first.
    transform: >-
      ${ (
        $issue := params.issue ? params.issue : 'any';
        $f := function($rows, $clauses) { $applyAdvanced($rows, { "join": "and", "clauses": $clauses }) };
        $canEncrypt := { "path": "operatingSystem", "type": "string", "op": "in", "value": ['Windows', 'macOS', 'Android', 'Linux'] };
        $unencrypted := { "path": "isEncrypted", "type": "boolean", "op": "eq", "value": false };
        $encrypted := { "join": "or", "clauses": [
          { "path": "isEncrypted", "type": "boolean", "op": "ne", "value": false },
          { "path": "operatingSystem", "type": "string", "op": "notIn", "value": ['Windows', 'macOS', 'Android', 'Linux'] }
        ] };
        $rooted := { "path": "jailBroken", "type": "string", "op": "eq", "value": "True" };
        $notRooted := { "path": "jailBroken", "type": "string", "op": "ne", "value": "True" };
        $both := $withFields($f(value.value, [$rooted, $unencrypted, $canEncrypt]), { "issue": "both", "unencrypted": true, "jailbroken": true });
        $rootedOnly := $withFields($f(value.value, [$rooted, $encrypted]), { "issue": "jailbroken", "unencrypted": false, "jailbroken": true });
        $unencryptedOnly := $withFields($f(value.value, [$notRooted, $unencrypted, $canEncrypt]), { "issue": "unencrypted", "unencrypted": true, "jailbroken": false });
        $rootedRows := $issue = 'unencrypted' ? $both : $append($both, $rootedOnly);
        $unencryptedRows := $issue = 'jailbroken' ? [] : $issue = 'unencrypted' ? $append($both, $unencryptedOnly) : $unencryptedOnly;
        $rootedShown := $issue = 'unencrypted' ? [] : $rootedRows;
        $rows := $append([], $append($rootedShown^(operatingSystem, deviceName), $unencryptedRows^(operatingSystem, deviceName)));
        $withOs := $f($rows, [{ "path": "operatingSystem", "type": "string", "op": "notEmpty", "value": null }]);
        $byOs := $withOs{ operatingSystem: $count($) };
        {
          "rows": $rows,
          "unencrypted": $count($f($rows, [{ "path": "unencrypted", "type": "boolean", "op": "eq", "value": true }])),
          "jailbroken": $count($f($rows, [{ "path": "jailbroken", "type": "boolean", "op": "eq", "value": true }])),
          "companyOwned": $count($f($rows, [{ "path": "managedDeviceOwnerType", "type": "string", "op": "eq", "value": "company" }])),
          "stale": $count($f($rows, [{ "path": "lastSyncDateTime", "type": "date", "op": "lt", "value": $daysAgo(30) }])),
          "byOs": $append([], [$keys($byOs).{ "os": $, "devices": $lookup($byOs, $) }]^(>devices)),
          "partial": value.truncated = true
        }
      ) }
  # What the page shows of deviceList: its figures and the first 10,000 devices. The export reads deviceList itself.
  devices:
    source: static
    data: ${ ds.deviceList }
    cache: { ttl: 1800 }
    transform: >-
      ${ $merge([value, { "rows": $take(value.rows, 10000), "listCapped": $count(value.rows) > 10000 }]) }

layout:
  - widget: markdown
    span: 12
    when: ${ devices.partial = true }
    text: >-
      **Partial data.** Intune has more managed devices than this report reads (100,000); the figures, the list and the
      export cover the ones read.
  - widget: markdown
    span: 12
    when: ${ devices.listCapped = true }
    text: >-
      The list shows the first 10,000 devices (jailbroken or rooted first, then not encrypted; each by OS and name); the
      CSV/XLSX export has all of them.
  - widget: kpi
    data: devices.unencrypted
    label: Not encrypted
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
    href: /p/endpoint.device-security-gaps?issue=unencrypted
  - widget: kpi
    data: devices.jailbroken
    label: Jailbroken or rooted
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
    href: /p/endpoint.device-security-gaps?issue=jailbroken
  - widget: kpi
    data: devices.companyOwned
    label: Company-owned
    format: number
  - widget: kpi
    data: devices.stale
    label: Not checked in for 30+ days
    format: number
    status: "${ value > 0 ? 'info' : 'ok' }"
  - widget: markdown
    span: 8
    text: |
      **What to do.** Require encryption in a compliance policy (and enforce it with an endpoint security disk
      encryption policy) so Conditional Access blocks unencrypted devices; a device that just enrolled can take a day to
      report encryption — sync it first. Jailbroken or rooted devices should be retired (company data removed) and the
      user asked to restore the phone. A device that reported months ago may already be fixed — check the last check-in.
  - widget: chart
    id: byOs
    title: By platform
    type: bar
    span: 4
    rows: 2
    data: devices.byOs
    x: os
    y: devices
    format: number
  - widget: table
    id: devices
    span: 12
    data: devices.rows
    rowKey: id
    selection: multi
    columns:
      - { field: deviceName, label: Device, kind: identity, secondary: userPrincipalName, sortable: true }
      - field: issue
        label: Problem
        kind: status
        map: { both: [crit, Jailbroken and not encrypted], jailbroken: [crit, Jailbroken or rooted], unencrypted: [crit, Not encrypted] }
        filter: facet
      - { field: operatingSystem, label: OS, filter: { type: facet, param: os } }
      - { field: osVersion, label: Version }
      - { field: managedDeviceOwnerType, label: Ownership, filter: { type: facet, param: ownership } }
      - field: complianceState
        label: Compliance
        kind: status
        map: { compliant: [ok, Compliant], noncompliant: [crit, Not compliant], inGracePeriod: [warn, In grace period], unknown: [neutral, Not evaluated], configManager: [info, Configuration Manager] }
        filter: facet
      - { field: lastSyncDateTime, label: Last check-in, kind: relativeTime, sortable: true }
      - { field: model, label: Model, hidden: true }
      - { field: serialNumber, label: Serial number, kind: code, hidden: true }
    inspect:
      page: endpoint.device
      params:
        id: ${ row.id }
    rowActions:
      - playbook: endpoint.sync-device
        label: Sync to re-report
        icon: arrows-clockwise
        inputs:
          managedDeviceId: ${ row.id }
      - playbook: endpoint.retire-device
        label: Retire
        icon: sign-out
        inputs:
          managedDeviceId: ${ row.id }
        when: ${ row.jailbroken = true }
    bulkActions:
      - playbook: endpoint.sync-device
        label: Sync to re-report
        icon: arrows-clockwise
        forEach:
          inputs:
            managedDeviceId: ${ row.id }
          concurrency: 10
        maxItems: 500
    empty:
      title: Every device is encrypted and none is jailbroken
      body: No managed device in this view reports a missing encryption or a jailbreak.

export:
  formats: [csv, xlsx]
  fileName: device-security-gaps-${ params.issue }
  data: deviceList.rows
  maxRows: 100000
  columns: all
