$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: endpoint.non-compliant-devices
version: 2.0.0
title: Non-compliant devices
summary: >-
  Intune devices that are not compliant or in their grace period — who uses them, how long since they checked in,
  and when the grace period ends (after which Conditional Access blocks them).
owner: endpoint-team
tags: [endpoint, intune, compliance, report]
nav: { section: reports, label: Non-compliant devices, icon: seal-warning, order: 31 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [DeviceManagementManagedDevices.Read.All]
  entraRoles: [Intune Administrator]
  licences: [intune]

params:
  state:
    type: enum
    label: State
    facet: true
    default: Both
    values:
      - { value: Both, label: Not compliant or in grace period }
      - { value: noncompliant, label: Not compliant }
      - { value: inGracePeriod, label: In grace period }
  os: { type: enum, values: [Any, Windows, macOS, iOS, Android, Linux], default: Any, label: OS, facet: true }
  ownership: { type: enum, values: [Any, company, personal], default: Any, label: Ownership, facet: true }

datasources:
  deviceList:
    source: graph
    label: Managed devices (Intune)
    request:
      path: /deviceManagement/managedDevices
      query:
        $select: id,deviceName,userPrincipalName,userDisplayName,operatingSystem,osVersion,complianceState,complianceGracePeriodExpirationDateTime,lastSyncDateTime,managedDeviceOwnerType,managementAgent,model,serialNumber,isEncrypted
        $top: 1000
        $filter: >-
          ${ $join([
               params.state = 'Both' ? "(complianceState eq 'noncompliant' or complianceState eq 'inGracePeriod')" : "complianceState eq " & $odata(params.state),
               params.os != 'Any' ? "operatingSystem eq " & $odata(params.os),
               params.ownership != 'Any' ? "managedDeviceOwnerType eq " & $odata(params.ownership)
             ][$], ' and ') }
    paging: all
    maxItems: 100000
    cache: { ttl: 900 }
    # Intune filters the state, OS and ownership. The likely cause is set natively on disjoint sets ($applyAdvanced,
    # $withFields): not checking in for 30 days, else not encrypted (Windows, macOS), else see the policy states. Not
    # compliant first, then in grace period; longest without a check-in first. 30k devices fit the transform budget.
    transform: >-
      ${ (
        $f := function($rows, $clauses) { $applyAdvanced($rows, { "join": "and", "clauses": $clauses }) };
        $wanted := params.state = 'Both' ? ['noncompliant', 'inGracePeriod'] : [params.state];
        $all := $f(value.value, [{ "path": "complianceState", "type": "string", "op": "in", "value": $wanted }]);
        $cutoff := $daysAgo(30);
        $silent := { "path": "lastSyncDateTime", "type": "date", "op": "lt", "value": $cutoff };
        $checkingIn := { "join": "or", "clauses": [
          { "path": "lastSyncDateTime", "type": "date", "op": "isEmpty", "value": null },
          { "path": "lastSyncDateTime", "type": "date", "op": "ge", "value": $cutoff }
        ] };
        $unencrypted := [
          { "path": "isEncrypted", "type": "boolean", "op": "eq", "value": false },
          { "path": "operatingSystem", "type": "string", "op": "in", "value": ['Windows', 'macOS'] }
        ];
        $otherwise := { "join": "or", "clauses": [
          { "path": "isEncrypted", "type": "boolean", "op": "ne", "value": false },
          { "path": "operatingSystem", "type": "string", "op": "notIn", "value": ['Windows', 'macOS'] }
        ] };
        $hasDate := { "path": "lastSyncDateTime", "type": "date", "op": "notEmpty", "value": null };
        $noDate := { "path": "lastSyncDateTime", "type": "date", "op": "isEmpty", "value": null };
        $oldestFirst := function($rows) { ( $dated := $f($rows, [$hasDate]); $append($f($rows, [$noDate]), $dated^(lastSyncDateTime)) ) };
        $labelled := function($rows) {
          $append($append(
            $withFields($f($rows, [$silent]), { "likelyCause": "Not checking in" }),
            $withFields($f($rows, $append([$checkingIn], $unencrypted)), { "likelyCause": "Not encrypted" })),
            $withFields($f($rows, [$checkingIn, $otherwise]), { "likelyCause": "See policy states" }))
        };
        $nonCompliant := $f($all, [{ "path": "complianceState", "type": "string", "op": "eq", "value": "noncompliant" }]);
        $grace := $f($all, [{ "path": "complianceState", "type": "string", "op": "eq", "value": "inGracePeriod" }]);
        /* Intune reports 9999-12-31 as the grace period end of devices not in grace: shown as no date. */
        $rows := $append([], $append(
          $withFields($oldestFirst($labelled($nonCompliant)), { "complianceGracePeriodExpirationDateTime": null }),
          $oldestFirst($labelled($grace))));
        $withOs := $f($rows, [{ "path": "operatingSystem", "type": "string", "op": "notEmpty", "value": null }]);
        $byOs := $withOs{ operatingSystem: $count($) };
        {
          "rows": $rows,
          "nonCompliant": $count($nonCompliant),
          "grace": $count($grace),
          "silent": $count($f($rows, [$silent])),
          "byOs": $append([], [$keys($byOs).{ "os": $, "devices": $lookup($byOs, $) }]^(>devices)),
          "partial": value.truncated = true
        }
      ) }
  # What the page shows of deviceList: its figures and the first 10,000 devices. The export reads deviceList itself.
  devices:
    source: static
    data: ${ ds.deviceList }
    cache: { ttl: 900 }
    transform: >-
      ${ $merge([value, { "rows": $take(value.rows, 10000), "listCapped": $count(value.rows) > 10000 }]) }

layout:
  - widget: markdown
    span: 12
    when: ${ devices.partial = true }
    text: >-
      **Partial data.** Intune has more matching devices than this report reads (100,000); the figures, the list and the
      export cover the ones read.
  - widget: markdown
    span: 12
    when: ${ devices.listCapped = true }
    text: The list shows the first 10,000 devices (not compliant first); the CSV/XLSX export has all of them.
  - widget: kpi
    id: nonCompliant
    data: devices.nonCompliant
    label: Not compliant
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: kpi
    id: grace
    data: devices.grace
    label: In grace period
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: silent
    data: devices.silent
    label: Not checked in for 30+ days
    format: number
  - widget: chart
    id: byOs
    title: By platform
    type: bar
    span: 3
    rows: 1
    data: devices.byOs
    x: os
    y: devices
  - widget: table
    id: devices
    span: 12
    data: devices.rows
    rowKey: id
    selection: multi
    columns:
      - { field: deviceName, label: Device, kind: identity, secondary: userPrincipalName, sortable: true }
      - field: complianceState
        label: State
        kind: status
        map: { noncompliant: [crit, Not compliant], inGracePeriod: [warn, In grace period] }
        filter: { type: facet, param: state }
      - { field: complianceGracePeriodExpirationDateTime, label: Grace period ends, kind: relativeTime }
      - { field: operatingSystem, label: OS, filter: { type: facet, param: os } }
      - { field: osVersion, label: Version }
      - { field: managedDeviceOwnerType, label: Ownership, filter: { type: facet, param: ownership } }
      - { field: lastSyncDateTime, label: Last check-in, kind: relativeTime, sortable: true }
      - { field: likelyCause, label: Likely cause, filter: facet }
      - { field: isEncrypted, label: Encrypted, kind: boolean, hidden: true }
      - { field: managementAgent, label: Managed by, hidden: true }
      - { field: model, label: Model, hidden: true }
      - { field: serialNumber, label: Serial number, kind: code, hidden: true }
    inspect:
      page: endpoint.device
      params:
        id: ${ row.id }
    rowActions:
      - playbook: endpoint.sync-device
        label: Sync to re-evaluate
        icon: arrows-clockwise
        inputs:
          managedDeviceId: ${ row.id }
    bulkActions:
      - playbook: endpoint.sync-device
        label: Sync to re-evaluate
        icon: arrows-clockwise
        forEach:
          inputs:
            managedDeviceId: ${ row.id }
          concurrency: 10
        maxItems: 1000
    empty:
      title: Every device is compliant
      body: No device is non-compliant or in its grace period.

export:
  formats: [csv, xlsx]
  fileName: non-compliant-devices
  data: deviceList.rows
  maxRows: 100000
  columns: all
