$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: endpoint.os-versions
version: 2.0.0
title: OS version distribution
summary: >-
  Operating system versions across Intune-managed devices, with Windows builds named by release (24H2, 23H2…) and
  flagged when out of support — to plan feature updates — and the devices still on an out-of-support release, with
  their user and last check-in, so they can be upgraded or replaced.
owner: endpoint-team
tags: [endpoint, intune, patching, report]
nav: { section: reports, label: OS versions, icon: stack, order: 32 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [DeviceManagementManagedDevices.Read.All]
  entraRoles: [Intune Administrator]
  licences: [intune]

params:
  os: { type: enum, values: [Any, Windows, macOS, iOS, Android], default: Any, label: OS, facet: true }

# Windows release names come from the build number (10.0.<build>); update the map when Microsoft ships a release.
datasources:
  devices:
    source: graph
    request:
      path: /deviceManagement/managedDevices
      query:
        $select: id,deviceName,userPrincipalName,operatingSystem,osVersion,lastSyncDateTime,managedDeviceOwnerType,model
        $filter: ${ params.os != 'Any' ? 'operatingSystem eq ' & $odata(params.os) }
        $top: 1000
    paging: all
    maxItems: 100000
    cache: { ttl: 3600 }
    # Devices are grouped natively (by OS, then version): the release name is worked out once per version, not per
    # device, and the devices on out-of-support releases are picked natively — 30k devices fit the transform budget.
    transform: >-
      ${ (
        $windows := {
          "26200": { "release": "Windows 11 25H2", "supported": true },
          "26100": { "release": "Windows 11 24H2", "supported": true },
          "22631": { "release": "Windows 11 23H2", "supported": true },
          "22621": { "release": "Windows 11 22H2", "supported": false },
          "22000": { "release": "Windows 11 21H2", "supported": false },
          "19045": { "release": "Windows 10 22H2", "supported": false },
          "19044": { "release": "Windows 10 21H2", "supported": false },
          "17763": { "release": "Windows 10 1809 / LTSC 2019", "supported": false }
        };
        $label := function($os, $ver) {
          $os = 'Windows'
            ? ( $build := $split($ver, '.')[2]; $w := $lookup($windows, $build);
                { "release": $w ? $w.release : 'Windows build ' & $build, "supported": $w ? $w.supported : false } )
            : { "release": $os & ' ' & $join($split($ver, '.')[[0..1]], '.'), "supported": true }
        };
        /* A grouping key must be text: devices without an OS or version are counted, not grouped. */
        $devices := value.value;
        $grouped := $applyAdvanced($devices, { "join": "and", "clauses": [
          { "path": "operatingSystem", "type": "string", "op": "notEmpty", "value": null },
          { "path": "osVersion", "type": "string", "op": "notEmpty", "value": null }
        ] });
        $byOs := $grouped{ operatingSystem: $ };
        $versions := [$keys($byOs).(
          $os := $;
          $items := $lookup($byOs, $os);
          $counts := $items{ osVersion: $count($) };
          $keys($counts).(
            $l := $label($os, $);
            { "os": $os, "version": $, "devices": $lookup($counts, $), "release": $l.release, "supported": $l.supported }
          )
        )];
        $total := $count($devices);
        $releases := $versions{ release: {
          "os": (os)[0], "devices": $sum(devices), "supported": (supported)[0], "versions": $join($distinct(version)[[0..4]], ', ')
        } };
        $groups := [$keys($releases).(
          $r := $lookup($releases, $);
          {
            "release": $, "os": $r.os, "devices": $r.devices,
            "share": $total > 0 ? $round($r.devices / $total, 3) : 0,
            "supported": $r.supported, "versions": $r.versions
          }
        )];
        /* Devices on out-of-support builds: one native pass for all of them, grouped per build to label the release. */
        $bad := $versions[supported = false];
        $outdatedAll := $applyAdvanced($grouped, { "join": "and", "clauses": [
          { "path": "operatingSystem", "type": "string", "op": "eq", "value": "Windows" },
          { "path": "osVersion", "type": "string", "op": "in", "value": $append(['-'], $bad.version) }
        ] });
        $byBuild := $outdatedAll{ osVersion: $ };
        $outdated := $append([], [$bad.( $b := $; $withFields($lookup($byBuild, $b.version), { "release": $b.release }) )]^(release, deviceName));
        $unknown := $total - $count($grouped);
        $unknownRow := $unknown > 0 ? [{ "release": "Unknown OS or version", "os": null, "devices": $unknown,
          "share": $total > 0 ? $round($unknown / $total, 3) : 0, "supported": null, "versions": "" }] : [];
        {
          "rows": $append([$groups^(os, >devices)], $unknownRow),
          "total": $total,
          "unsupported": $sum([0, $groups[supported = false].devices]),
          "outdated": $take($outdated, 10000),
          "outdatedCount": $count($outdated),
          "outdatedCapped": $count($outdated) > 10000,
          "chart": [($groups^(>devices))[[0..5]]],
          "partial": value.truncated = true
        }
      ) }

layout:
  - widget: markdown
    span: 12
    when: ${ devices.partial = true }
    text: >-
      **Partial data.** Intune has more managed devices than this report reads (100,000); the figures and lists cover
      the ones read.
  - widget: kpi
    id: total
    data: devices.total
    label: Devices
    format: number
  - widget: kpi
    id: unsupported
    data: devices.unsupported
    label: On out-of-support Windows releases
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
    hint: Listed under Devices on out-of-support releases
  - widget: chart
    id: releaseChart
    title: Most common releases
    type: bar
    span: 6
    rows: 2
    data: devices.chart
    x: release
    y: devices
    format: number
  - widget: table
    id: releases
    span: 12
    data: devices.rows
    rowKey: release
    columns:
      - { field: release, label: Release, sortable: true }
      - { field: os, label: OS, filter: { type: facet, param: os } }
      - { field: devices, label: Devices, kind: number, sortable: true }
      - { field: share, label: Share of fleet, kind: percent, sortable: true }
      - { field: supported, label: Support, kind: status, map: { "true": [ok, Supported], "false": [crit, Out of support] }, filter: facet }
      - { field: versions, label: Versions seen, kind: code }
    rowActions:
      - label: List these devices
        icon: list
        href: "/p/endpoint.devices?os=${ $encode(row.os) }"
    empty:
      title: No managed devices
      body: No devices are enrolled in Intune.
  - widget: markdown
    span: 12
    when: ${ devices.outdatedCapped = true }
    text: >-
      ${ 'The list below shows the first 10,000 of ' & $formatNumber(devices.outdatedCount, '#,##0') & ' devices on out-of-support releases; the CSV/XLSX export has the release summary.' }
  - widget: table
    id: outdated
    title: Devices on out-of-support releases
    span: 12
    data: devices.outdated
    rowKey: id
    columns:
      - { field: deviceName, label: Device, kind: identity, secondary: userPrincipalName, sortable: true }
      - { field: release, label: Release, filter: facet, sortable: true }
      - { field: osVersion, label: Build, kind: code }
      - { field: managedDeviceOwnerType, label: Ownership, filter: facet }
      - { field: lastSyncDateTime, label: Last check-in, kind: relativeTime, sortable: true }
      - { field: model, label: Model, hidden: true }
    inspect:
      page: endpoint.device
      params:
        id: ${ row.id }
    empty:
      title: No device on an out-of-support release
      body: Every Windows device runs a release that still gets security updates.

export:
  formats: [csv, xlsx]
  fileName: os-versions
  data: devices.rows
  columns: all
