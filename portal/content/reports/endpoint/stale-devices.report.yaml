$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: endpoint.stale-devices
version: 2.0.0
title: Stale devices
summary: >-
  Microsoft Entra devices with no activity for the chosen number of days (cleanup candidates), and Intune-managed
  devices that stopped checking in. Hybrid-joined devices must be removed in Active Directory.
owner: endpoint-team
tags: [endpoint, devices, hygiene, report]
nav: { section: reports, label: Stale devices, icon: clock-counter-clockwise, order: 30 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Device.Read.All]
  entraRoles: [Global Reader]

params:
  days:
    type: enum
    label: Inactive for at least
    facet: true
    default: 90
    values:
      - { value: 60, label: 60 days }
      - { value: 90, label: 90 days }
      - { value: 180, label: 180 days }
      - { value: 365, label: 1 year }
  joinType:
    type: enum
    label: Join type
    facet: true
    default: Any
    values:
      - { value: Any, label: Any }
      - { value: AzureAd, label: Microsoft Entra joined }
      - { value: ServerAd, label: Hybrid joined }
      - { value: Workplace, label: Registered }

datasources:
  entraList:
    label: Entra devices
    source: graph
    request:
      path: /devices
      headers: { ConsistencyLevel: eventual }
      query:
        $select: id,deviceId,displayName,operatingSystem,operatingSystemVersion,trustType,accountEnabled,isManaged,isCompliant,approximateLastSignInDateTime,registrationDateTime,model
        $count: true
        $top: 999
        $filter: >-
          ${ $join([
               "approximateLastSignInDateTime le " & $daysAgo($number(params.days ? params.days : 90)),
               params.joinType != 'Any' ? "trustType eq " & $odata(params.joinType)
             ][$], ' and ') }
    paging: all
    maxItems: 100000
    cache: { ttl: 1800 }
    # Microsoft filters the inactivity window; the next step is set natively on disjoint sets ($applyAdvanced,
    # $withFields), oldest first — 100k stale devices fit the transform budget.
    transform: >-
      ${ (
        $f := function($rows, $clauses) { $applyAdvanced($rows, { "join": "and", "clauses": $clauses }) };
        $hybrid := { "path": "trustType", "type": "string", "op": "eq", "value": "ServerAd" };
        $cloud := { "path": "trustType", "type": "string", "op": "ne", "value": "ServerAd" };
        $all := $append($append(
          $withFields($f(value.value, [$hybrid]), { "cleanup": "Delete in AD" }),
          $withFields($f(value.value, [$cloud, { "path": "accountEnabled", "type": "boolean", "op": "eq", "value": true }]), { "cleanup": "Disable, then delete" })),
          $withFields($f(value.value, [$cloud, { "path": "accountEnabled", "type": "boolean", "op": "ne", "value": true }]), { "cleanup": "Delete" }));
        $withOs := $f($all, [{ "path": "operatingSystem", "type": "string", "op": "notEmpty", "value": null }]);
        $byOs := $withOs{ operatingSystem: $count($) };
        {
          "rows": $append([], $all^(approximateLastSignInDateTime)),
          "total": $count($all),
          "enabled": $count($f($all, [{ "path": "accountEnabled", "type": "boolean", "op": "eq", "value": true }])),
          "hybrid": $count($f($all, [$hybrid])),
          "byOs": $append([], ([$keys($byOs).{ "os": $, "devices": $lookup($byOs, $) }]^(>devices))[[0..5]]),
          "partial": value.truncated = true
        }
      ) }
  # What the page shows of entraList: its figures and the first 10,000 devices. The export reads entraList itself.
  entra:
    source: static
    data: ${ ds.entraList }
    cache: { ttl: 1800 }
    transform: >-
      ${ $merge([value, { "rows": $take(value.rows, 10000), "listCapped": $count(value.rows) > 10000 }]) }
  intune:
    source: graph
    requires: { licences: [intune], scopes: { graph: [DeviceManagementManagedDevices.Read.All] } }
    request:
      path: /deviceManagement/managedDevices
      query:
        $select: id,deviceName,userPrincipalName,operatingSystem,osVersion,lastSyncDateTime,managedDeviceOwnerType,complianceState,serialNumber
        $filter: "${ 'lastSyncDateTime le ' & $daysAgo($number(params.days ? params.days : 90)) }"
        $top: 1000
    paging: all
    maxItems: 100000
    cache: { ttl: 1800 }
    # Intune filters the window; oldest check-in first, the page shows the first 10,000.
    transform: >-
      ${ (
        $sorted := $append([], value.value^(lastSyncDateTime));
        {
          "rows": $take($sorted, 10000),
          "total": $count(value.value),
          "listCapped": $count(value.value) > 10000,
          "partial": value.truncated = true
        }
      ) }

layout:
  - widget: markdown
    span: 12
    when: ${ entra.partial = true or intune.partial = true }
    text: >-
      **Partial data.** Microsoft has more stale devices than this report reads (100,000 of each kind); the figures,
      the lists and the export cover the ones read.
  - widget: markdown
    span: 12
    when: ${ entra.listCapped = true or intune.listCapped = true }
    text: >-
      Each list shows its first 10,000 devices (longest inactive first). The CSV/XLSX export has every stale Entra
      device; the Intune list is on this page only.
  - widget: kpi
    id: total
    data: entra.total
    label: Stale Entra devices
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: enabled
    data: entra.enabled
    label: Still enabled
    format: number
  - widget: kpi
    id: hybrid
    data: entra.hybrid
    label: Hybrid joined (clean up in AD)
    format: number
  - widget: kpi
    id: intune
    data: intune.total
    label: Intune devices not checking in
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: markdown
    id: guidance
    span: 8
    text: |
      Microsoft's recommended cleanup: **disable** stale devices first, wait a grace period (for example 30 days) in
      case someone still needs one, then **delete**. Back up BitLocker recovery keys before deleting Windows devices —
      they are removed with the device object. Autopilot devices must be deregistered before deletion.
  - widget: chart
    id: byOs
    title: Stale devices by OS
    type: donut
    span: 4
    rows: 2
    data: entra.byOs
    x: os
    y: devices
  - widget: table
    id: entra
    title: Microsoft Entra devices
    span: 12
    data: entra.rows
    rowKey: id
    selection: multi
    columns:
      - { field: displayName, label: Device, kind: identity, secondary: model, sortable: true }
      - { field: operatingSystem, label: OS, filter: facet }
      - { field: operatingSystemVersion, label: Version, hidden: true }
      - field: trustType
        label: Join type
        kind: status
        map: { AzureAd: [info, Entra joined], ServerAd: [info, Hybrid joined], Workplace: [neutral, Registered] }
        filter: { type: facet, param: joinType }
      - { field: accountEnabled, label: Enabled, kind: boolean, filter: facet }
      - { field: approximateLastSignInDateTime, label: Last activity, kind: relativeTime, sortable: true }
      - { field: cleanup, label: Next step, filter: facet }
      - { field: isManaged, label: Managed, kind: boolean, hidden: true }
      - { field: registrationDateTime, label: Registered, kind: date, hidden: true }
      - { field: deviceId, label: Device id, kind: guid, hidden: true }
      - { field: id, label: Object id, kind: guid, hidden: true }
    inspect:
      page: identity.device
      params:
        id: ${ row.id }
        deviceId: ${ row.deviceId }
    rowActions:
      - playbook: identity.delete-stale-device
        label: Delete
        icon: trash
        inputs:
          deviceObjectId: ${ row.id }
          minInactiveDays: ${ $number(params.days) }
        when: ${ row.trustType != 'ServerAd' }
    bulkActions:
      - playbook: identity.delete-stale-device
        label: Delete selected
        icon: trash
        forEach:
          inputs:
            deviceObjectId: ${ row.id }
          concurrency: 5
        maxItems: 500
        when: ${ $count(rows[trustType = 'ServerAd']) = 0 }
    empty:
      title: No stale Entra devices
      body: Every device signed in within the window.
  - widget: table
    id: intune
    title: Intune devices not checking in
    span: 12
    data: intune.rows
    rowKey: id
    selection: multi
    columns:
      - { field: deviceName, label: Device, kind: identity, secondary: userPrincipalName }
      - { field: operatingSystem, label: OS, filter: facet }
      - { field: managedDeviceOwnerType, label: Ownership, filter: facet }
      - { field: lastSyncDateTime, label: Last check-in, kind: relativeTime }
      - { field: serialNumber, label: Serial number, kind: code, hidden: true }
    inspect:
      page: endpoint.device
      params:
        id: ${ row.id }
    bulkActions:
      - playbook: endpoint.retire-device
        label: Retire
        icon: sign-out
        forEach:
          inputs:
            managedDeviceId: ${ row.id }
          concurrency: 3
        maxItems: 50
    empty:
      title: Every Intune device is checking in
      body: No managed device has been silent for the window.

export:
  formats: [csv, xlsx]
  fileName: stale-devices-${ params.days }d
  data: entraList.rows
  maxRows: 100000
  columns: all
