$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.app-credential-expiry
version: 1.2.0
title: App credential expiry
summary: Client secrets and certificates of app registrations that have expired or expire within the chosen window.
owner: identity-team
tags: [identity, apps, credentials]
nav: { section: reports, label: App credential expiry, icon: key, order: 10 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Application.Read.All]
  entraRoles: [Directory Readers]

params:
  days:
    type: enum
    label: Expiring within
    facet: true
    default: 30
    values:
      - { value: 30, label: 30 days }
      - { value: 60, label: 60 days }
      - { value: 90, label: 90 days }
  includeExpired: { type: boolean, label: Include expired, default: true, facet: true }

datasources:
  credentials:
    source: graph
    request:
      path: /applications
      query:
        $select: id,appId,displayName,passwordCredentials,keyCredentials
        $top: 999
    paging: all
    maxItems: 20000
    cache: { ttl: 300 }
    # value = { value: [applications] }. One row per secret/certificate, soonest expiry first. Apps are picked natively
    # first ($applyAdvanced reads through the credential lists): those with a credential ending within 7 days, then the
    # rest of the window, then (when expired ones are included) apps whose credentials only have expired. Only the
    # first 400 of them become one row per credential, which needs JSONata per credential.
    transform: >-
      ${ (
        $days := params.days ? $number(params.days) : 30;
        $withExpired := params.includeExpired != false;
        $now := $daysAgo(0);
        /* "Within N days" as before: N whole days left (daysRemaining <= N), so up to N + 1 days from now. */
        $horizon := $daysAgo(-($days + 1));
        $endsBetween := function($from, $to) { { "join": "or", "clauses": [
          { "join": "and", "clauses": [
            { "path": "passwordCredentials.endDateTime", "type": "date", "op": "ge", "value": $from },
            { "path": "passwordCredentials.endDateTime", "type": "date", "op": "lt", "value": $to } ] },
          { "join": "and", "clauses": [
            { "path": "keyCredentials.endDateTime", "type": "date", "op": "ge", "value": $from },
            { "path": "keyCredentials.endDateTime", "type": "date", "op": "lt", "value": $to } ] }
        ] } };
        $notIn := function($rows, $taken) { $applyAdvanced($rows, { "join": "and", "clauses": [
          { "path": "id", "type": "string", "op": "notIn", "value": $append(['-'], $taken.id) } ] }) };
        $inWindow := $applyAdvanced(value.value, $endsBetween($now, $horizon));
        $week := $applyAdvanced($inWindow, $endsBetween($now, $daysAgo(-8)));
        $soon := $append([], $append($week, $notIn($inWindow, $week)));
        $expiredOnly := $withExpired ? $notIn($applyAdvanced(value.value, { "join": "or", "clauses": [
          { "path": "passwordCredentials.endDateTime", "type": "date", "op": "lt", "value": $now },
          { "path": "keyCredentials.endDateTime", "type": "date", "op": "lt", "value": $now } ] }), $soon) : [];
        $candidates := $append([], $append($soon, $expiredOnly));
        $from := $withExpired ? '0000' : $now;
        $all := [$take($candidates, 400).(
          $app := $;
          $append(
            passwordCredentials[endDateTime <= $horizon and endDateTime >= $from].{ "type": "Secret", "cred": $ },
            keyCredentials[endDateTime <= $horizon and endDateTime >= $from].{ "type": "Certificate", "cred": $ }
          ).(
            $left := $daysUntil(cred.endDateTime);
            {
              "app": $app.displayName,
              "appId": $app.appId,
              "appObjectId": $app.id,
              "type": type,
              "name": cred.displayName,
              "keyId": cred.keyId,
              "expires": cred.endDateTime,
              "daysRemaining": $left,
              "state": $left < 0 ? "expired" : $left <= 7 ? "critical" : "warning"
            }
          )
        )];
        $rows := [$all[daysRemaining <= $days and ($withExpired or daysRemaining >= 0)]^(daysRemaining)];
        {
          "rows": $rows,
          "total": $count($rows),
          "expired": $count($rows[state = "expired"]),
          "critical": $count($rows[state = "critical"]),
          "apps": $count($candidates),
          "soonApps": $count($soon),
          "expiredApps": $count($expiredOnly),
          "listCapped": $count($candidates) > 400,
          "partial": value.truncated = true
        }
      ) }

layout:
  - widget: markdown
    span: 12
    when: ${ credentials.partial = true }
    text: >-
      **Partial data.** The tenant has more app registrations than this report reads (20,000); the figures and the
      list cover the ones read.
  - widget: markdown
    span: 12
    when: ${ credentials.listCapped = true }
    text: >-
      ${ $formatNumber(credentials.soonApps, '#,##0') & ' app registrations have a credential ending in this window' & (credentials.expiredApps > 0 ? ' and ' & $formatNumber(credentials.expiredApps, '#,##0') & ' only expired ones' : '') & '; the list, the figures and the export cover the first 400 of them (credentials ending within 7 days first).' }
  - widget: kpi
    data: credentials.expired
    label: Expired
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: kpi
    data: credentials.critical
    label: Expire within 7 days
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    data: credentials.total
    label: Credentials in this report
  - widget: table
    id: credentials
    span: 12
    data: credentials.rows
    rowKey: keyId
    columns:
      - { field: app, label: Application, kind: identity, secondary: appId }
      - { field: type, label: Type, filter: facet }
      - { field: name, label: Credential }
      - { field: expires, label: Expires, kind: date, filter: date }
      - { field: daysRemaining, label: Days left, kind: number, filter: range }
      - field: state
        label: Status
        kind: status
        map: { expired: [crit, Expired], critical: [crit, Within 7 days], warning: [warn, Expiring] }
        filter: facet
      - { field: keyId, label: Key id, kind: guid, hidden: true }
      - { field: appObjectId, label: App object id, kind: guid, hidden: true }
    inspect:
      page: identity.app-registration
      params:
        id: ${ row.appObjectId }
        appId: ${ row.appId }
    rowActions:
      - playbook: identity.rotate-app-secret
        label: Rotate secret
        icon: key
        inputs:
          appObjectId: ${ row.appObjectId }
        when: ${ row.type = 'Secret' and row.state != 'expired' }
      - playbook: identity.remove-expired-app-credentials
        label: Remove expired secrets
        icon: broom
        inputs:
          appObjectId: ${ row.appObjectId }
        when: ${ row.type = 'Secret' and row.state = 'expired' }
      - label: Open app registration
        icon: arrow-square-out
        href: "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationMenuBlade/~/Credentials/appId/${ $encode(row.appId) }"
    empty:
      title: Nothing expires in this window
      body: No client secret or certificate has expired or expires within the selected number of days.

export:
  formats: [csv, xlsx]
  fileName: app-credential-expiry-${ params.days }d
  data: credentials.rows
  columns: all
