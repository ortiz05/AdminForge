$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.app-credential-expiry
version: 1.0.0
title: App credential expiry
summary: Client secrets and certificates of app registrations that have expired or expire within the chosen window.
owner: identity-team
tags: [identity, apps, credentials]
nav: { section: reports, label: App credential expiry, icon: key, order: 10 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Application.Read.All]
  entraRoles: [Directory Readers]

params:
  days:
    type: enum
    label: Expiring within
    facet: true
    default: 30
    values:
      - { value: 30, label: 30 days }
      - { value: 60, label: 60 days }
      - { value: 90, label: 90 days }
  includeExpired: { type: boolean, label: Include expired, default: true, facet: true }

datasources:
  credentials:
    source: graph
    request:
      path: /applications
      query:
        $select: id,appId,displayName,passwordCredentials,keyCredentials
        $top: 999
    paging: all
    maxItems: 20000
    cache: { ttl: 300 }
    # value = { value: [applications] }. One row per secret/certificate, soonest expiry first.
    transform: >-
      ${ (
        $days := params.days ? $number(params.days) : 30;
        $withExpired := params.includeExpired != false;
        $all := [value.value.(
          $app := $;
          $append(
            passwordCredentials.{ "type": "Secret", "cred": $ },
            keyCredentials.{ "type": "Certificate", "cred": $ }
          ).(
            $left := $daysUntil(cred.endDateTime);
            {
              "app": $app.displayName,
              "appId": $app.appId,
              "appObjectId": $app.id,
              "type": type,
              "name": cred.displayName,
              "keyId": cred.keyId,
              "expires": cred.endDateTime,
              "daysRemaining": $left,
              "state": $left < 0 ? "expired" : $left <= 7 ? "critical" : "warning"
            }
          )
        )];
        $rows := [$all[daysRemaining <= $days and ($withExpired or daysRemaining >= 0)]^(daysRemaining)];
        {
          "rows": $rows,
          "total": $count($rows),
          "expired": $count($rows[state = "expired"]),
          "critical": $count($rows[state = "critical"])
        }
      ) }

layout:
  - widget: kpi
    data: credentials.expired
    label: Expired
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: kpi
    data: credentials.critical
    label: Expire within 7 days
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    data: credentials.total
    label: Credentials in this report
  - widget: table
    id: credentials
    span: 12
    data: credentials.rows
    rowKey: keyId
    columns:
      - { field: app, label: Application, kind: identity, secondary: appId }
      - { field: type, label: Type, filter: facet }
      - { field: name, label: Credential }
      - { field: expires, label: Expires, kind: date, filter: date }
      - { field: daysRemaining, label: Days left, kind: number, filter: range }
      - field: state
        label: Status
        kind: status
        map: { expired: [crit, Expired], critical: [crit, Within 7 days], warning: [warn, Expiring] }
        filter: facet
      - { field: keyId, label: Key id, kind: guid, hidden: true }
      - { field: appObjectId, label: App object id, kind: guid, hidden: true }
    rowActions:
      - label: Open app registration
        icon: arrow-square-out
        href: "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationMenuBlade/~/Credentials/appId/${ $encode(row.appId) }"

export:
  formats: [csv, xlsx]
  fileName: app-credential-expiry-${ params.days }d
  data: credentials.rows
  columns: all
