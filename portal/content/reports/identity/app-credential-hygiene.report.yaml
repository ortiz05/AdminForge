$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.app-credential-hygiene
version: 2.0.0
title: App credential hygiene
summary: >-
  Live app credentials that break good practice — secrets valid for longer than policy allows, apps juggling several
  active secrets, and secrets or certificates added straight to an enterprise app (service principal), where the Entra
  admin center doesn't show them and attackers like to hide. For what expires soon, see App credential expiry.
owner: identity-team
tags: [identity, apps, credentials, security, hygiene, report]
nav: { section: reports, label: App credential hygiene, icon: key, order: 19 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Application.Read.All]
  entraRoles: [Global Reader]

params:
  maxDays:
    type: enum
    label: Longest allowed secret lifetime
    facet: true
    default: 365
    values:
      - { value: 180, label: 6 months }
      - { value: 365, label: 1 year }
      - { value: 730, label: 2 years }
  finding:
    type: enum
    label: Finding
    facet: true
    default: Any
    values:
      - { value: Any, label: Any finding }
      - { value: long, label: Longer than allowed }
      - { value: several, label: Several active secrets }
      - { value: servicePrincipal, label: On an enterprise app }

# Only credentials that are still valid count here (expired ones belong to the expiry report). Service principals in
# SAML single sign-on mode keep their signing certificate (and its key password) on the enterprise app by design, and
# managed identities' credentials are Microsoft-managed: both are left out.
datasources:
  apps:
    source: graph
    request:
      path: /applications
      query:
        $select: id,appId,displayName,createdDateTime,passwordCredentials,keyCredentials
        $top: 999
    paging: all
    maxItems: 20000
    cache: { ttl: 900 }
  credentials:
    source: graph
    request:
      path: /servicePrincipals
      query:
        $select: id,appId,displayName,passwordCredentials,keyCredentials,preferredSingleSignOnMode,servicePrincipalType,appOwnerOrganizationId
        $top: 999
    paging: all
    maxItems: 50000
    cache: { ttl: 900 }
  # Every live app registration secret, one row each with the app's live secret count, and the apps with a live
  # certificate (its own datasource: each transform has its own time budget).
  secrets:
    source: static
    data: >-
      ${ { "apps": ds.apps.value } }
    transform: >-
      ${ (
        $live := { "join": "and", "clauses": [{ "path": "c.endDateTime", "type": "date", "op": "ge", "value": $iso() }] };
        {
          "rows": $withCount($applyAdvanced($unnest($pick(value.apps, ['id', 'appId', 'displayName', 'passwordCredentials']),
            'passwordCredentials', 'c', 'key'), $live), 'id', 'liveSecrets'),
          "certApps": $distinct($pluck($applyAdvanced($unnest(value.apps, 'keyCredentials', 'c'), $live), 'id'))
        }
      ) }
  # The page: the figures over every credential and the first 2,000 flagged ones (most severe first, then by
  # name); only those are labelled. Classified natively ($unnest, $withCount, $applyAdvanced with a date shifted by
  # days): a JSONata block per credential doesn't fit the budget at tens of thousands of apps.
  page:
    source: static
    data: >-
      ${ {
        "secrets": ds.secrets.rows,
        "certApps": ds.secrets.certApps,
        "sps": $pick($applyAdvanced(ds.credentials.value, { "join": "or", "clauses": [
          { "path": "passwordCredentials.endDateTime", "type": "string", "op": "notEmpty", "value": null },
          { "path": "keyCredentials.endDateTime", "type": "string", "op": "notEmpty", "value": null }
        ] }), ['id', 'appId', 'displayName', 'appOwnerOrganizationId', 'servicePrincipalType', 'preferredSingleSignOnMode',
          'passwordCredentials', 'keyCredentials']),
        "partial": ds.apps.truncated = true or ds.credentials.truncated = true
      } }
    transform: >-
      ${ (
        $max := params.maxDays ? $number(params.maxDays) : 365;
        $microsoft := ['f8cdef31-a31e-4b4a-93e4-5f571e91255a', '72f988bf-86f1-41af-91ab-2d7cd011db47'];
        $now := $iso();
        $c := function($path, $type, $op, $v) { { "path": $path, "type": $type, "op": $op, "value": $v } };
        $and := function($clauses) { { "join": "and", "clauses": $clauses } };
        $lives := function($op, $days) { { "path": "c.endDateTime", "type": "date", "op": $op, "field": "c.startDateTime", "days": $days, "value": null } };
        $live := $and([$c('c.endDateTime', 'date', 'ge', $now)]);
        $regSecrets := value.secrets;
        $veryLong := $applyAdvanced($regSecrets, $and([$lives('gt', 3650)]));
        /* The rest are complements by key: a credential without a start date is never "too long", and still counted. */
        $notIn := function($rows) { $c('key', 'string', 'notIn', $append([], $pluck($rows, 'key'))) };
        $tooLong := $applyAdvanced($regSecrets, $and([$lives('gt', $max), $notIn($veryLong)]));
        $severalOnly := $applyAdvanced($regSecrets, $and([$c('liveSecrets', 'number', 'gt', 1), $notIn($append($veryLong, $tooLong))]));
        $sps := $applyAdvanced(value.sps, $and([
          $c('servicePrincipalType', 'string', 'ne', 'ManagedIdentity'), $c('preferredSingleSignOnMode', 'string', 'ne', 'saml')
        ]));
        $spSecrets := $applyAdvanced($unnest($sps, 'passwordCredentials', 'c', 'key'), $live);
        $spCerts := $applyAdvanced($unnest($sps, 'keyCredentials', 'c', 'key'), $live);
        $spLong := $applyAdvanced($spSecrets, $and([$lives('gt', $max)]));
        $spShort := $applyAdvanced($spSecrets, $and([$notIn($spLong)]));
        $f := $$.params.finding;
        $several := $and([$c('liveSecrets', 'number', 'gt', 1)]);
        /* The rows to show, most severe first, still unlabelled, each with its labels. */
        $msOwner := { "f8cdef31-a31e-4b4a-93e4-5f571e91255a": { "owner": "Microsoft" }, "72f988bf-86f1-41af-91ab-2d7cd011db47": { "owner": "Microsoft" } };
        $label := function($part, $n) { (
          $r := $withFields($take($part.rows, $n), $part.labels);
          $part.labels.object = 'Enterprise app' ? $attach($r, 'appOwnerOrganizationId', $msOwner, { "owner": "Enterprise app" }) : $r
        ) };
        $reg := { "object": "App registration", "type": "Secret", "owner": "This organisation" };
        $ent := { "object": "Enterprise app", "severity": "crit", "finding": "On an enterprise app", "onServicePrincipal": true };
        $parts := [
          { "rows": $f in ['Any', 'long'] ? $veryLong : $f = 'several' ? $applyAdvanced($veryLong, $several) : [],
            "labels": $merge([$reg, { "long": true, "severity": "crit", "finding": "Practically never expires" }]) },
          { "rows": $f in ['Any', 'long', 'servicePrincipal'] ? $spLong : [], "labels": $merge([$ent, { "type": "Secret", "long": true }]) },
          { "rows": $f in ['Any', 'servicePrincipal'] ? $spShort : [], "labels": $merge([$ent, { "type": "Secret", "long": false }]) },
          { "rows": $f in ['Any', 'servicePrincipal'] ? $spCerts : [], "labels": $merge([$ent, { "type": "Certificate", "long": false }]) },
          { "rows": $f in ['Any', 'long'] ? $tooLong : $f = 'several' ? $applyAdvanced($tooLong, $several) : [],
            "labels": $merge([$reg, { "long": true, "severity": "warn", "finding": "Longer than allowed" }]) },
          { "rows": $f in ['Any', 'several'] ? $severalOnly : [],
            "labels": $merge([$reg, { "long": false, "severity": "info", "finding": "Several active secrets" }]) }
        ];
        $budget := function($pairs, $left) {
          $count($pairs) = 0 ? [] : (
            $here := $label($pairs[0], $left);
            $rest := $count($pairs) > 1 ? $pairs[[1..5]] : [];
            $append([$here^(displayName)], $count($here) < $left ? $budget($rest, $left - $count($here)) : [])
          )
        };
        $total := $sum([0, $parts.$count(rows)]);
        {
          "rows": $budget($parts, 2000),
          "listCapped": $total > 2000,
          "listTotal": $total,
          "partial": value.partial = true,
          "long": $count($veryLong) + $count($tooLong) + $count($spLong),
          "onServicePrincipals": $count($spSecrets) + $count($spCerts),
          "several": $count($distinct($pluck($applyAdvanced($regSecrets, $several), 'id'))),
          "secretOnly": $count($distinct($pluck($applyAdvanced($regSecrets, $and([$c('id', 'string', 'notIn', $append([], value.certApps))])), 'id')))
        }
      ) }
  # The export: every flagged credential, labelled (runs only when someone exports).
  exportList:
    source: static
    data: >-
      ${ {
        "secrets": ds.secrets.rows,
        "certApps": ds.secrets.certApps,
        "sps": $pick($applyAdvanced(ds.credentials.value, { "join": "or", "clauses": [
          { "path": "passwordCredentials.endDateTime", "type": "string", "op": "notEmpty", "value": null },
          { "path": "keyCredentials.endDateTime", "type": "string", "op": "notEmpty", "value": null }
        ] }), ['id', 'appId', 'displayName', 'appOwnerOrganizationId', 'servicePrincipalType', 'preferredSingleSignOnMode',
          'passwordCredentials', 'keyCredentials'])
      } }
    transform: >-
      ${ (
        $max := params.maxDays ? $number(params.maxDays) : 365;
        $microsoft := ['f8cdef31-a31e-4b4a-93e4-5f571e91255a', '72f988bf-86f1-41af-91ab-2d7cd011db47'];
        $now := $iso();
        $c := function($path, $type, $op, $v) { { "path": $path, "type": $type, "op": $op, "value": $v } };
        $and := function($clauses) { { "join": "and", "clauses": $clauses } };
        $lives := function($op, $days) { { "path": "c.endDateTime", "type": "date", "op": $op, "field": "c.startDateTime", "days": $days, "value": null } };
        $live := $and([$c('c.endDateTime', 'date', 'ge', $now)]);
        $regSecrets := value.secrets;
        $veryLong := $applyAdvanced($regSecrets, $and([$lives('gt', 3650)]));
        /* The rest are complements by key: a credential without a start date is never "too long", and still counted. */
        $notIn := function($rows) { $c('key', 'string', 'notIn', $append([], $pluck($rows, 'key'))) };
        $tooLong := $applyAdvanced($regSecrets, $and([$lives('gt', $max), $notIn($veryLong)]));
        $severalOnly := $applyAdvanced($regSecrets, $and([$c('liveSecrets', 'number', 'gt', 1), $notIn($append($veryLong, $tooLong))]));
        $sps := $applyAdvanced(value.sps, $and([
          $c('servicePrincipalType', 'string', 'ne', 'ManagedIdentity'), $c('preferredSingleSignOnMode', 'string', 'ne', 'saml')
        ]));
        $spSecrets := $applyAdvanced($unnest($sps, 'passwordCredentials', 'c', 'key'), $live);
        $spCerts := $applyAdvanced($unnest($sps, 'keyCredentials', 'c', 'key'), $live);
        $spLong := $applyAdvanced($spSecrets, $and([$lives('gt', $max)]));
        $spShort := $applyAdvanced($spSecrets, $and([$notIn($spLong)]));
        $f := $$.params.finding;
        $several := $and([$c('liveSecrets', 'number', 'gt', 1)]);
        /* The rows to show, most severe first, still unlabelled, each with its labels. */
        $msOwner := { "f8cdef31-a31e-4b4a-93e4-5f571e91255a": { "owner": "Microsoft" }, "72f988bf-86f1-41af-91ab-2d7cd011db47": { "owner": "Microsoft" } };
        $label := function($part, $n) { (
          $r := $withFields($take($part.rows, $n), $part.labels);
          $part.labels.object = 'Enterprise app' ? $attach($r, 'appOwnerOrganizationId', $msOwner, { "owner": "Enterprise app" }) : $r
        ) };
        $reg := { "object": "App registration", "type": "Secret", "owner": "This organisation" };
        $ent := { "object": "Enterprise app", "severity": "crit", "finding": "On an enterprise app", "onServicePrincipal": true };
        $parts := [
          { "rows": $f in ['Any', 'long'] ? $veryLong : $f = 'several' ? $applyAdvanced($veryLong, $several) : [],
            "labels": $merge([$reg, { "long": true, "severity": "crit", "finding": "Practically never expires" }]) },
          { "rows": $f in ['Any', 'long', 'servicePrincipal'] ? $spLong : [], "labels": $merge([$ent, { "type": "Secret", "long": true }]) },
          { "rows": $f in ['Any', 'servicePrincipal'] ? $spShort : [], "labels": $merge([$ent, { "type": "Secret", "long": false }]) },
          { "rows": $f in ['Any', 'servicePrincipal'] ? $spCerts : [], "labels": $merge([$ent, { "type": "Certificate", "long": false }]) },
          { "rows": $f in ['Any', 'long'] ? $tooLong : $f = 'several' ? $applyAdvanced($tooLong, $several) : [],
            "labels": $merge([$reg, { "long": true, "severity": "warn", "finding": "Longer than allowed" }]) },
          { "rows": $f in ['Any', 'several'] ? $severalOnly : [],
            "labels": $merge([$reg, { "long": false, "severity": "info", "finding": "Several active secrets" }]) }
        ];
        { "rows": $append([], $parts.$label($, 1000000)) }
      ) }

layout:
  - widget: kpi
    id: long
    data: page.long
    label: Secrets valid longer than allowed
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: onServicePrincipals
    data: page.onServicePrincipals
    label: Credentials on enterprise apps
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: kpi
    id: several
    data: page.several
    label: Apps with several active secrets
    format: number
    status: "${ value > 0 ? 'info' : 'ok' }"
  - widget: kpi
    id: secretOnly
    data: page.secretOnly
    label: Apps relying on secrets only (no certificate)
    format: number
  - widget: markdown
    id: guidance
    span: 12
    text: |
      Prefer certificates (or workload identity federation) to client secrets, keep secrets short-lived, and keep one
      active secret per app except during a rotation. A credential on an **enterprise app** that you didn't add for
      SAML or a known integration is a red flag: an attacker with Application Administrator rights can add one there
      to sign in as the app — check the directory audit log ("Add service principal credentials") before removing it.
  - widget: markdown
    id: capped
    span: 12
    when: ${ page.listCapped = true }
    text: |
      **Partial data.** ${ $formatNumber(page.listTotal, '#,##0') } credentials are flagged; the table shows the first
      2,000 (most severe first). The export has every flagged credential read.
  - widget: markdown
    id: partial
    span: 12
    when: ${ page.partial = true }
    text: |
      **Partial read.** The tenant has more app registrations (20,000) or enterprise apps (50,000) than this report
      reads: the figures, the table and the export cover those only.
  - widget: table
    id: credentials
    span: 12
    data: page.rows
    rowKey: key
    columns:
      - { field: displayName, label: App, kind: identity, secondary: appId, sortable: true }
      - { field: object, label: Stored on, filter: facet }
      - { field: type, label: Type, filter: facet }
      - { field: c.displayName, label: Credential }
      - field: severity
        label: Severity
        kind: status
        map: { crit: [crit, Act now], warn: [warn, Fix at next rotation], info: [info, Review] }
        filter: facet
      - { field: finding, label: Finding }
      - { field: liveSecrets, label: Live secrets on the app, kind: number, hidden: true }
      - { field: c.startDateTime, label: Created, kind: date }
      - { field: c.endDateTime, label: Expires, kind: date, sortable: true }
      - { field: owner, label: App owner, hidden: true }
      - { field: c.keyId, label: Key id, kind: guid, hidden: true }
      - { field: id, label: Object id, kind: guid, hidden: true }
    rowActions:
      - playbook: identity.rotate-app-secret
        label: Rotate secret
        icon: key
        inputs:
          appObjectId: ${ row.id }
        when: ${ row.object = 'App registration' and row.type = 'Secret' }
      - { label: Open app registration, icon: app-window, href: "/p/identity.app-registration?id=${ $encode(row.id) }&appId=${ $encode(row.appId) }", when: "${ row.object = 'App registration' }" }
      - { label: Open enterprise app, icon: app-window, href: "/p/identity.enterprise-app?id=${ $encode(row.id) }&appId=${ $encode(row.appId) }", when: "${ row.object = 'Enterprise app' }" }
    empty:
      title: No credential findings
      body: Every live secret is within the allowed lifetime, no app has several active secrets, and no enterprise app holds its own credentials.

export:
  formats: [csv, xlsx]
  fileName: app-credential-hygiene-${ params.maxDays }d
  data: exportList.rows
  columns: all
