$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.app-credential-hygiene
version: 1.0.0
title: App credential hygiene
summary: >-
  Live app credentials that break good practice — secrets valid for longer than policy allows, apps juggling several
  active secrets, and secrets or certificates added straight to an enterprise app (service principal), where the Entra
  admin center doesn't show them and attackers like to hide. For what expires soon, see App credential expiry.
owner: identity-team
tags: [identity, apps, credentials, security, hygiene, report]
nav: { section: reports, label: App credential hygiene, icon: key, order: 19 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Application.Read.All]
  entraRoles: [Global Reader]

params:
  maxDays:
    type: enum
    label: Longest allowed secret lifetime
    facet: true
    default: 365
    values:
      - { value: 180, label: 6 months }
      - { value: 365, label: 1 year }
      - { value: 730, label: 2 years }
  finding:
    type: enum
    label: Finding
    facet: true
    default: Any
    values:
      - { value: Any, label: Any finding }
      - { value: long, label: Longer than allowed }
      - { value: several, label: Several active secrets }
      - { value: servicePrincipal, label: On an enterprise app }

# Only credentials that are still valid count here (expired ones belong to the expiry report). Service principals in
# SAML single sign-on mode keep their signing certificate (and its key password) on the enterprise app by design, and
# managed identities' credentials are Microsoft-managed: both are left out.
datasources:
  apps:
    source: graph
    request:
      path: /applications
      query:
        $select: id,appId,displayName,createdDateTime,passwordCredentials,keyCredentials
        $top: 999
    paging: all
    maxItems: 20000
    cache: { ttl: 900 }
  credentials:
    source: graph
    request:
      path: /servicePrincipals
      query:
        $select: id,appId,displayName,passwordCredentials,keyCredentials,preferredSingleSignOnMode,servicePrincipalType,appOwnerOrganizationId
        $top: 999
    paging: all
    maxItems: 50000
    cache: { ttl: 900 }
    transform: >-
      ${ (
        $max := params.maxDays ? $number(params.maxDays) : 365;
        $microsoft := ['f8cdef31-a31e-4b4a-93e4-5f571e91255a', '72f988bf-86f1-41af-91ab-2d7cd011db47'];
        $live := function($list) { [$list[endDateTime and $daysUntil(endDateTime) >= 0]] };
        $row := function($o, $object, $type, $c, $several) {
          (
            $life := $c.startDateTime ? $daysUntil($c.endDateTime) - $daysUntil($c.startDateTime) : null;
            $long := $type = 'Secret' and $life != null and $life > $max;
            $findings := [
              $object = 'Enterprise app' ? 'On an enterprise app',
              $long ? ($life > 3650 ? 'Practically never expires' : 'Longer than allowed'),
              $several ? 'Several active secrets'
            ];
            {
              "key": $object & '|' & $o.id & '|' & $c.keyId,
              "app": $o.displayName,
              "appId": $o.appId,
              "objectId": $o.id,
              "object": $object,
              "owner": $object = 'App registration' ? 'This organisation'
                       : $o.appOwnerOrganizationId in $microsoft ? 'Microsoft' : 'Enterprise app',
              "type": $type,
              "name": $c.displayName,
              "keyId": $c.keyId,
              "created": $c.startDateTime,
              "expires": $c.endDateTime,
              "lifetimeDays": $life,
              "daysLeft": $daysUntil($c.endDateTime),
              "findings": $findings,
              "long": $long,
              "several": $several,
              "onServicePrincipal": $object = 'Enterprise app',
              "severity": $object = 'Enterprise app' or ($long and $life > 3650) ? 'crit' : $long ? 'warn' : 'info'
            }
          )
        };
        $registrations := [ds.apps.value.(
          $o := $;
          $secrets := $live(passwordCredentials);
          $several := $count($secrets) > 1;
          $append(
            $secrets.$row($o, 'App registration', 'Secret', $, $several),
            $live(keyCredentials).$row($o, 'App registration', 'Certificate', $, false)
          )
        )];
        $secretOnly := $count(ds.apps.value[$count($live(passwordCredentials)) > 0 and $count($live(keyCredentials)) = 0]);
        $enterprise := [value.value[
          servicePrincipalType != 'ManagedIdentity' and preferredSingleSignOnMode != 'saml'
        ].(
          $o := $;
          $append(
            $live(passwordCredentials).$row($o, 'Enterprise app', 'Secret', $, false),
            $live(keyCredentials).$row($o, 'Enterprise app', 'Certificate', $, false)
          )
        )];
        $flagged := $append($registrations, $enterprise)[$count(findings) > 0];
        $shown := $flagged[
          $$.params.finding = 'Any'
          or ($$.params.finding = 'long' and long)
          or ($$.params.finding = 'several' and several)
          or ($$.params.finding = 'servicePrincipal' and onServicePrincipal)
        ];
        $rank := { "crit": 0, "warn": 1, "info": 2 };
        {
          "rows": [$shown^($lookup($rank, severity), app, >lifetimeDays)],
          "long": $count($flagged[long]),
          "onServicePrincipals": $count($flagged[onServicePrincipal]),
          "several": $count($distinct($flagged[several].objectId)),
          "secretOnly": $secretOnly
        }
      ) }

layout:
  - widget: kpi
    id: long
    data: credentials.long
    label: Secrets valid longer than allowed
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: onServicePrincipals
    data: credentials.onServicePrincipals
    label: Credentials on enterprise apps
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: kpi
    id: several
    data: credentials.several
    label: Apps with several active secrets
    format: number
    status: "${ value > 0 ? 'info' : 'ok' }"
  - widget: kpi
    id: secretOnly
    data: credentials.secretOnly
    label: Apps relying on secrets only (no certificate)
    format: number
  - widget: markdown
    id: guidance
    span: 12
    text: |
      Prefer certificates (or workload identity federation) to client secrets, keep secrets short-lived, and keep one
      active secret per app except during a rotation. A credential on an **enterprise app** that you didn't add for
      SAML or a known integration is a red flag: an attacker with Application Administrator rights can add one there
      to sign in as the app — check the directory audit log ("Add service principal credentials") before removing it.
  - widget: table
    id: credentials
    span: 12
    data: credentials.rows
    rowKey: key
    columns:
      - { field: app, label: App, kind: identity, secondary: appId, sortable: true }
      - { field: object, label: Stored on, filter: facet }
      - { field: type, label: Type, filter: facet }
      - { field: name, label: Credential }
      - field: severity
        label: Severity
        kind: status
        map: { crit: [crit, Act now], warn: [warn, Fix at next rotation], info: [info, Review] }
        filter: facet
      - { field: findings, label: Findings, kind: tags }
      - { field: lifetimeDays, label: Lifetime (days), kind: number, filter: range, sortable: true }
      - { field: created, label: Created, kind: date }
      - { field: expires, label: Expires, kind: date, sortable: true }
      - { field: daysLeft, label: Days left, kind: number, hidden: true }
      - { field: owner, label: App owner, hidden: true }
      - { field: keyId, label: Key id, kind: guid, hidden: true }
      - { field: objectId, label: Object id, kind: guid, hidden: true }
    rowActions:
      - playbook: identity.rotate-app-secret
        label: Rotate secret
        icon: key
        inputs:
          appObjectId: ${ row.objectId }
        when: ${ row.object = 'App registration' and row.type = 'Secret' }
      - { label: Open app registration, icon: app-window, href: "/p/identity.app-registration?id=${ $encode(row.objectId) }&appId=${ $encode(row.appId) }", when: "${ row.object = 'App registration' }" }
      - { label: Open enterprise app, icon: app-window, href: "/p/identity.enterprise-app?id=${ $encode(row.objectId) }&appId=${ $encode(row.appId) }", when: "${ row.object = 'Enterprise app' }" }
    empty:
      title: No credential findings
      body: Every live secret is within the allowed lifetime, no app has several active secrets, and no enterprise app holds its own credentials.

export:
  formats: [csv, xlsx]
  fileName: app-credential-hygiene-${ params.maxDays }d
  data: credentials.rows
  columns: all
