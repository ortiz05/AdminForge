$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.app-permissions
version: 2.1.0
title: Application permissions
summary: >-
  Application permissions (app roles) granted to service principals on Microsoft Graph, Exchange Online and SharePoint
  Online — the apps that can read mail, files or the directory, or change roles, apps and policies, with no user signed
  in. Each grant is tiered by impact and shows whether the app comes from this organisation, a third party, a managed
  identity or Microsoft.
owner: identity-team
tags: [identity, apps, permissions, consent, security, report, review]
nav: { section: reports, label: Application permissions, icon: shield-star, order: 16 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Application.Read.All, Directory.Read.All]
  entraRoles: [Global Reader]

params:
  tier:
    type: enum
    label: Impact
    facet: true
    default: high
    values:
      - { value: high, label: Critical and high }
      - { value: critical, label: Critical only }
      - { value: all, label: All permissions }
  holder:
    type: enum
    label: Held by
    facet: true
    default: Any
    values:
      - { value: Any, label: Any app }
      - { value: This organisation, label: Apps from this organisation }
      - { value: Other organisation, label: Third-party apps }
      - { value: Managed identity, label: Managed identities }
      - { value: Microsoft, label: Microsoft apps }

# Application permissions live on the resource's service principal (appRoleAssignedTo), addressed by its well-known
# appId so nothing tenant-specific is needed. Exchange Online and SharePoint Online only exist in licensed tenants: their
# sub-requests answer 404 there and are skipped. Holders are looked up in one getByIds call (up to 1,000 apps).
datasources:
  apis:
    source: graphBatch
    requests:
      org: { path: /organization, query: { $select: id } }
      graph: { path: "/servicePrincipals(appId='00000003-0000-0000-c000-000000000000')", query: { $select: "id,appId,displayName,appRoles" } }
      exchange: { path: "/servicePrincipals(appId='00000002-0000-0ff1-ce00-000000000000')", query: { $select: "id,appId,displayName,appRoles" } }
      sharepoint: { path: "/servicePrincipals(appId='00000003-0000-0ff1-ce00-000000000000')", query: { $select: "id,appId,displayName,appRoles" } }
      exchangeGrants: { path: "/servicePrincipals(appId='00000002-0000-0ff1-ce00-000000000000')/appRoleAssignedTo", query: { $top: 999 } }
      sharepointGrants: { path: "/servicePrincipals(appId='00000003-0000-0ff1-ce00-000000000000')/appRoleAssignedTo", query: { $top: 999 } }
    cache: { ttl: 3600 }
    # App role id → permission name for the three APIs, plus their grants (Graph's come from `grants`, paged).
    transform: >-
      ${ {
        "org": value.org.value[0].id,
        "roles": $merge([[value.graph.appRoles, value.exchange.appRoles, value.sharepoint.appRoles].{ id: value }]),
        "grants": [value.exchangeGrants.value, value.sharepointGrants.value],
        "truncated": $exists(value.exchangeGrants.`@odata.nextLink`) or $exists(value.sharepointGrants.`@odata.nextLink`)
      } }
  grants:
    source: graph
    request:
      path: "/servicePrincipals(appId='00000003-0000-0000-c000-000000000000')/appRoleAssignedTo"
      query:
        $select: id,principalId,principalDisplayName,principalType,appRoleId,resourceDisplayName,resourceId,createdDateTime
        $top: 999
    paging: all
    maxItems: 50000
    cache: { ttl: 3600 }
  holders:
    source: graph
    when: ${ $count($append(ds.grants.value, ds.apis.grants)) > 0 }
    request:
      method: POST
      path: /directoryObjects/getByIds
      body:
        ids: ${ $take($distinct($pluck($append(ds.grants.value, ds.apis.grants), 'principalId')), 1000) }
        types: [servicePrincipal]
    cache: { ttl: 3600 }
  # The full list (every grant at the chosen impact, sorted, with who holds it) for the export and the page view.
  permissionList:
    source: static
    data: >-
      ${ {
        "grants": $append(ds.grants.value, ds.apis.grants),
        "roles": ds.apis.roles,
        "org": ds.apis.org,
        "holders": ds.holders.value
      } }
    # Critical = can take over the tenant or every mailbox/site/device (role, app, policy, group, device or credential
    # control): what provisioning treats as tier 0 for app-only identities (portal/tools/cli/src/provision/privilege.ts:
    # PRIVILEGED_APP_ROLES, and $criticalFamily is a copy of PRIVILEGED_APP_FAMILIES — 512 characters at most, the
    # `validate` limit) plus full mailbox and site access, and Exchange.ManageAsApp (provisioning holds it at the write
    # ceiling: its reach is the Exchange role assigned by hand). tests/content/app-permissions-critical-tier.test.ts
    # keeps them in step;
    # high = reads or changes content (mail, files, chats, calendars) or writes anything; medium = reads the directory.
    # Each distinct permission and each holder is classified once and joined onto the grants natively ($attach):
    # a JSONata block per grant doesn't fit the budget at tens of thousands of grants.
    transform: >-
      ${ (
        $critical := ['AppRoleAssignment.ReadWrite.All', 'Application.ReadWrite.All', 'Application.ReadWrite.OwnedBy',
          'Application.ReadUpdate.All', 'DelegatedPermissionGrant.ReadWrite.All', 'Directory.ReadWrite.All',
          'Directory.Write.Restricted', 'Domain.ReadWrite.All', 'Domain-InternalFederation.ReadWrite.All',
          'Organization.ReadWrite.All', 'PublicKeyInfrastructure.ReadWrite.All', 'MutualTlsOauthConfiguration.ReadWrite.All',
          'TrustFrameworkKeySet.ReadWrite.All', 'SpiffeTrustDomain.ReadWrite.All', 'IdentityProvider.ReadWrite.All',
          'EntitlementManagement.ReadWrite.All', 'User-PasswordProfile.ReadWrite.All', 'AuthenticationContext.ReadWrite.All',
          'OnPremDirectorySynchronization.ReadWrite.All', 'Synchronization.ReadWrite.All', 'Group.ReadWrite.All',
          'GroupMember.ReadWrite.All', 'DelegatedAdminRelationship.ReadWrite.All', 'DeviceManagementConfiguration.ReadWrite.All',
          'DeviceManagementScripts.ReadWrite.All', 'DeviceManagementApps.ReadWrite.All', 'DeviceManagementRBAC.ReadWrite.All',
          'DeviceManagementManagedDevices.PrivilegedOperations.All', 'full_access_as_app', 'Exchange.ManageAsApp',
          'Sites.FullControl.All'];
        $criticalFamily := /^(RoleManagement|RoleManagementPolicy|RoleAssignmentSchedule|RoleEligibilitySchedule|PrivilegedAccess|PrivilegedAssignmentSchedule|PrivilegedEligibilitySchedule|Policy)\.ReadWrite\.|^UserAuth(entication)?Method(-[A-Za-z]+)?\.(ReadWrite|Delete)\.|^LifecycleWorkflows(-Workflow)?\.(ReadWrite\.All|Activate)$|^AgentIdentityBlueprint\.(AddRemoveCreds|ReadWrite|UpdateAuthProperties)\.|^TeamsAppInstallation\.ReadWriteAndConsent/i;
        $microsoft := ['f8cdef31-a31e-4b4a-93e4-5f571e91255a', '72f988bf-86f1-41af-91ab-2d7cd011db47'];
        $tier := function($p) {
          $p in $critical or $contains($p, $criticalFamily) ? 'critical'
          : $contains($p, 'ReadWrite') or $contains($p, 'FullControl') or $contains($p, '.Send')
            or $contains($p, /^(Mail|Files|Sites|Chat|ChannelMessage|Calendars|Contacts|Notes|MailboxSettings|OnlineMeeting\w*|CallRecords|EWS|Exchange)\./) ? 'high'
          : $contains($p, /\.Read(Basic)?\.(All|Directory)$/) ? 'medium' : 'low'
        };
        $roles := value.roles ? value.roles : {};
        $own := $append([], [$append([env.AF_READ_CLIENT_ID, env.AF_WRITE_CLIENT_ID, env.AF_AUTOMATION_CLIENT_ID],
          env.AF_PROTECTED_APP_IDS ? [$split(env.AF_PROTECTED_APP_IDS, ',').$trim($)] : [])[$ != '']]);
        $org := value.org ? value.org : '-';
        $rank := { "critical": 0, "high": 1, "medium": 2, "low": 3 };
        $eq := function($path, $op, $v) { { "join": "and", "clauses": [{ "path": $path, "type": "string", "op": $op, "value": $v }] } };
        $grants := value.grants;
        $holders := value.holders;
        $roleIds := $distinct($pluck($grants, 'appRoleId'));
        $perm := $roleIds{ $: (
          $name := $lookup($roles, $);
          $p := $name ? $name : $;
          $t := $tier($p);
          { "permission": $p, "tier": $t, "rank": $lookup($rank, $t) }
        ) };
        $mi := $applyAdvanced($holders, $eq('servicePrincipalType', 'eq', 'ManagedIdentity'));
        $spApps := $applyAdvanced($holders, $eq('servicePrincipalType', 'ne', 'ManagedIdentity'));
        $ms := $applyAdvanced($spApps, $eq('appOwnerOrganizationId', 'in', $microsoft));
        $notMs := $applyAdvanced($spApps, $eq('appOwnerOrganizationId', 'notIn', $microsoft));
        $other := $applyAdvanced($notMs, $eq('appOwnerOrganizationId', 'ne', $org));
        $labelled := $append($append($append($append(
          $withFields($mi, { "holder": "Managed identity" }),
          $withFields($ms, { "holder": "Microsoft" })),
          $withFields($applyAdvanced($notMs, $eq('appOwnerOrganizationId', 'eq', $org)), { "holder": "This organisation" })),
          $withFields($applyAdvanced($other, $eq('verifiedPublisher.displayName', 'notEmpty', null)), { "holder": "Other organisation" })),
          $withFields($applyAdvanced($other, $eq('verifiedPublisher.displayName', 'isEmpty', null)),
            { "holder": "Other organisation", "verifiedPublisher": { "displayName": "Unverified publisher" } }));
        $marked := $append(
          $withFields($applyAdvanced($labelled, $eq('appId', 'in', $own)), { "adminforge": true }),
          $withFields($applyAdvanced($labelled, $eq('appId', 'notIn', $own)), { "adminforge": false }));
        $small := $pick($marked, ['id', 'appId', 'holder', 'verifiedPublisher', 'accountEnabled', 'adminforge']);
        $holder := $small{ id: $ };
        /* Critical, then high (then medium and low) grants, each picked natively by their permission ids: the list
           comes out in impact order without sorting tens of thousands of rows (the page sorts the rows it shows), and
           only the grants shown get their permission attached. */
        $tierIds := function($t) { $append([], $keys($perm)[$lookup($perm, $).tier = $t]) };
        $ofTier := function($t) { $applyAdvanced($grants, $eq('appRoleId', 'in', $tierIds($t))) };
        $criticalGrants := $ofTier('critical');
        $highGrants := $ofTier('high');
        $risky := $attach($append($criticalGrants, $highGrants), 'appRoleId', $perm);
        $base := $$.params.tier = 'all'
            ? $append($risky, $attach($append($ofTier('medium'), $ofTier('low')), 'appRoleId', $perm))
          : $$.params.tier = 'high' ? $risky
          : $take($risky, $count($criticalGrants));
        $joined := $attach($base, 'principalId', $holder, { "holder": "Unknown", "adminforge": false }, 'sp');
        $shown := $$.params.holder = 'Any' ? $joined : $applyAdvanced($joined, $eq('sp.holder', 'eq', $$.params.holder));
        /* The figures cover every grant, whatever the filters. */
        $third := $applyAdvanced($risky, $eq('principalId', 'in', $append([], $pluck($other, 'id'))));
        $byPermission := $risky{ permission: $count($distinct($pluck($, 'principalId'))) };
        {
          "rows": $append([], $shown),
          "figures": {
            "critical": $count($criticalGrants),
            "criticalApps": $count($distinct($pluck($criticalGrants, 'principalId'))),
            "thirdParty": $count($distinct($pluck($third, 'principalId'))),
            "total": $count($grants),
            "top": $take($each($byPermission, function($v, $k) { { "permission": $k, "apps": $v } })^(>apps, permission), 6)
          }
        }
      ) }
  # The page: the figures over every grant and the first 2,000 rows of the list (the export has them all).
  permissions:
    source: static
    data: >-
      ${ {
        "first": $take(ds.permissionList.rows, 2000),
        "count": $count(ds.permissionList.rows),
        "figures": ds.permissionList.figures,
        "truncated": ds.apis.truncated = true or $count($distinct($pluck($append(ds.grants.value, ds.apis.grants), 'principalId'))) > 1000,
        "partial": ds.grants.truncated = true
      } }
    transform: >-
      ${ $merge([value.figures, {
        /* A sort key must not be empty: grants of an app without a name go last. */
        "rows": $append(
          [$applyAdvanced(value.first, { "join": "and", "clauses": [{ "path": "principalDisplayName", "type": "string", "op": "notEmpty", "value": null }] })^(rank, principalDisplayName, permission)],
          [$applyAdvanced(value.first, { "join": "and", "clauses": [{ "path": "principalDisplayName", "type": "string", "op": "isEmpty", "value": null }] })^(rank, permission)]),
        "listCapped": value.count > 2000,
        "listTotal": value.count,
        "truncated": value.truncated,
        "partial": value.partial
      }]) }

layout:
  - widget: kpi
    id: critical
    data: permissions.critical
    label: Critical permissions granted
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: kpi
    id: criticalApps
    data: permissions.criticalApps
    label: Apps holding critical permissions
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: thirdParty
    data: permissions.thirdParty
    label: Third-party apps with high-impact permissions
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: total
    data: permissions.total
    label: Application permissions granted
    format: number
  - widget: chart
    id: top
    title: Most granted high-impact permissions (apps)
    type: bar
    span: 12
    rows: 2
    data: permissions.top
    x: permission
    y: apps
    format: number
    empty:
      title: No high-impact permissions
      body: No app holds a critical or high-impact application permission.
  - widget: markdown
    id: capped
    span: 12
    when: ${ permissions.listCapped = true }
    text: |
      **Partial data.** ${ $formatNumber(permissions.listTotal, '#,##0') } grants match; the table shows the first 2,000
      (critical first). The export has every grant read.
  - widget: markdown
    id: partial
    span: 12
    when: ${ permissions.partial = true }
    text: |
      **Partial read.** Microsoft Graph has more application permission grants than this report reads (50,000): the
      figures, the table and the export cover those only. Review the rest in the Entra admin center.
  - widget: markdown
    id: truncated
    span: 12
    when: ${ permissions.truncated = true }
    text: |
      **Partial result.** More apps hold permissions than one lookup covers (1,000), or Exchange/SharePoint returned
      more than one page; apps beyond that show as Unknown. Review the rest in the Entra admin center.
  - widget: table
    id: permissions
    span: 12
    data: permissions.rows
    rowKey: id
    columns:
      - { field: principalDisplayName, label: App, kind: identity, secondary: sp.verifiedPublisher.displayName, sortable: true }
      - { field: permission, label: Permission, kind: code, filter: facet, sortable: true }
      - { field: resourceDisplayName, label: API, filter: facet }
      - field: tier
        label: Impact
        kind: status
        map: { critical: [crit, Critical], high: [warn, High], medium: [info, Medium], low: [neutral, Low] }
        filter: { type: facet, param: tier }
      - field: sp.holder
        label: Held by
        kind: status
        map: { "This organisation": [neutral, This organisation], "Other organisation": [warn, Third party], "Managed identity": [info, Managed identity], Microsoft: [neutral, Microsoft], Unknown: [neutral, Unknown] }
        filter: { type: facet, param: holder }
      - { field: sp.accountEnabled, label: Sign-in, kind: status, map: { "true": [ok, Enabled], "false": [neutral, Disabled] } }
      - { field: createdDateTime, label: Granted, kind: date, filter: date, sortable: true }
      - { field: sp.verifiedPublisher.displayName, label: Verified publisher, hidden: true }
      - { field: sp.adminforge, label: AdminForge app, kind: boolean, hidden: true }
      - { field: sp.appId, label: Application (client) id, kind: guid, hidden: true }
      - { field: principalId, label: Service principal object id, kind: guid, hidden: true }
      - { field: id, label: Assignment id, hidden: true }
    inspect:
      page: identity.enterprise-app
      params:
        id: ${ row.principalId }
        appId: ${ row.sp.appId }
    rowActions:
      - playbook: identity.disable-enterprise-app
        label: Disable sign-in
        icon: prohibit
        inputs:
          servicePrincipalId: ${ row.principalId }
        when: ${ row.sp.accountEnabled = true and row.sp.adminforge != true and row.sp.holder in ['This organisation', 'Other organisation'] }
      - label: Review in Entra admin center
        icon: arrow-square-out
        href: "https://entra.microsoft.com/#view/Microsoft_AAD_IAM/ManagedAppMenuBlade/~/Permissions/objectId/${ $encode(row.principalId) }/appId/${ $encode(row.sp.appId) }"
        when: ${ $boolean(row.sp.appId) }
    empty:
      title: No application permissions match
      body: No app holds an application permission at this impact level (check the Impact and Held by filters).

export:
  formats: [csv, xlsx]
  fileName: application-permissions-${ params.tier }
  data: permissionList.rows
  columns: all
