$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.app-registration-risks
version: 2.0.0
title: App registration configuration risks
summary: >-
  App registrations configured in ways that make token theft or misuse easier — wildcard or plain-HTTP redirect URIs,
  redirect URIs on shared hosting domains that can be taken over, the implicit grant, public client flows, sign-in
  from personal Microsoft accounts — and apps that request critical application permissions.
owner: identity-team
tags: [identity, apps, configuration, security, report]
nav: { section: reports, label: App registration risks, icon: warning-diamond, order: 20 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Application.Read.All]
  entraRoles: [Global Reader]

params:
  severity:
    type: enum
    label: Severity
    facet: true
    default: warn
    values:
      - { value: crit, label: Critical only }
      - { value: warn, label: Warnings and critical }
      - { value: all, label: Everything (including informational) }

datasources:
  graphApi:
    source: graph
    request:
      path: "/servicePrincipals(appId='00000003-0000-0000-c000-000000000000')"
      query:
        $select: id,appRoles
    cache: { ttl: 86400 }
    transform: >-
      ${ $merge([[value.appRoles].{ id: value }]) }
  appList:
    label: App registrations
    source: graph
    request:
      path: /applications
      query:
        $select: id,appId,displayName,createdDateTime,signInAudience,web,spa,publicClient,isFallbackPublicClient,requiredResourceAccess
        $top: 999
    paging: all
    maxItems: 20000
    cache: { ttl: 900 }
    # Every check runs natively ($applyAdvanced reads through the redirect URI lists), giving a set of apps per
    # finding; each app that has any finding gets one true/false field per finding and its worst severity — no
    # JSONata per app. Plain HTTP: apps with an http:// URI and no localhost one natively; apps with both are checked
    # per URI with JSONata (http is allowed for localhost only). The page shows the first 2,000 (`apps`); the export
    # reads this whole list.
    transform: >-
      ${ (
        $critical := ['RoleManagement.ReadWrite.Directory', 'AppRoleAssignment.ReadWrite.All', 'Application.ReadWrite.All',
          'Directory.ReadWrite.All', 'Domain.ReadWrite.All', 'Organization.ReadWrite.All', 'Policy.ReadWrite.ConditionalAccess',
          'Policy.ReadWrite.AuthenticationMethod', 'Policy.ReadWrite.PermissionGrant', 'Policy.ReadWrite.Authorization',
          'PrivilegedAccess.ReadWrite.AzureADGroup', 'RoleAssignmentSchedule.ReadWrite.Directory',
          'RoleEligibilitySchedule.ReadWrite.Directory', 'UserAuthenticationMethod.ReadWrite.All',
          'DelegatedPermissionGrant.ReadWrite.All', 'Group.ReadWrite.All', 'GroupMember.ReadWrite.All',
          'Mail.ReadWrite', 'Mail.Send', 'Files.ReadWrite.All', 'Sites.ReadWrite.All', 'Sites.FullControl.All', 'User.ReadWrite.All'];
        $roles := ds.graphApi ? ds.graphApi : {};
        $criticalIds := [$keys($roles)[$lookup($roles, $) in $critical]];
        $apps := value.value;
        $any := function($paths, $op, $values) { { "join": "or", "clauses": [$paths.( $p := $; $values.{ "path": $p, "type": "string", "op": $op, "value": $ } )] } };
        $all3 := ['web.redirectUris', 'spa.redirectUris', 'publicClient.redirectUris'];
        $web2 := ['web.redirectUris', 'spa.redirectUris'];
        $local := ['localhost', '127.0.0.1', '[::1]'];
        $checks := [
          { "field": "wildcardUri", "severity": "crit", "filter": $any($all3, 'contains', ['*']) },
          { "field": "plainHttpUri", "severity": "crit", "filter": { "join": "and", "clauses": [
            $any($web2, 'startsWith', ['http://']),
            { "join": "and", "clauses": [$web2.( $p := $; $local.{ "path": $p, "type": "string", "op": "notContains", "value": $ } )] }
          ] } },
          { "field": "sharedHostingUri", "severity": "warn", "filter": $any($all3, 'contains', ['.azurewebsites.net', '.cloudapp.net',
            '.cloudapp.azure.com', '.trafficmanager.net', '.blob.core.windows.net', '.herokuapp.com', '.ngrok.io', '.ngrok-free.app',
            '.ngrok.app', '.glitch.me', '.vercel.app', '.netlify.app', '.github.io']) },
          { "field": "implicitAccessTokens", "severity": "warn", "filter": { "join": "and", "clauses": [
            { "path": "web.implicitGrantSettings.enableAccessTokenIssuance", "type": "boolean", "op": "eq", "value": true }] } },
          { "field": "publicClient", "severity": "warn", "filter": { "join": "and", "clauses": [
            { "path": "isFallbackPublicClient", "type": "boolean", "op": "eq", "value": true }] } },
          { "field": "personalAccounts", "severity": "warn", "filter": { "join": "and", "clauses": [
            { "path": "signInAudience", "type": "string", "op": "in", "value": ['AzureADandPersonalMicrosoftAccount', 'PersonalMicrosoftAccount'] }] } },
          { "field": "criticalPermissions", "severity": "warn", "filter": { "join": "and", "clauses": [
            { "path": "requiredResourceAccess.resourceAccess.id", "type": "string", "op": "in", "value": $append(['-'], $criticalIds) },
            { "path": "requiredResourceAccess.resourceAccess.type", "type": "string", "op": "eq", "value": "Role" }] } },
          { "field": "implicitIdTokens", "severity": "info", "filter": { "join": "and", "clauses": [
            { "path": "web.implicitGrantSettings.enableIdTokenIssuance", "type": "boolean", "op": "eq", "value": true }] } },
          { "field": "multiTenant", "severity": "info", "filter": { "join": "and", "clauses": [
            { "path": "signInAudience", "type": "string", "op": "eq", "value": "AzureADMultipleOrgs" }] } },
          { "field": "localhostUri", "severity": "info", "filter": $any($web2, 'contains', $local) }
        ];
        $level := params.severity ? params.severity : 'warn';
        $levels := $level = 'crit' ? ['crit'] : $level = 'warn' ? ['crit', 'warn'] : ['crit', 'warn', 'info'];
        $localUri := /^https?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:|\/|$)/i;
        $httpAndLocal := $applyAdvanced($apps, { "join": "and", "clauses": [$any($web2, 'startsWith', ['http://']), $any($web2, 'contains', $local)] });
        $httpExact := [$httpAndLocal[$count($append(web.redirectUris, spa.redirectUris)[$contains($, /^http:\/\//i) and $not($contains($, $localUri))]) > 0].id];
        $found := $append($checks.{ "field": field, "severity": severity, "ids": $append(['-'], $applyAdvanced($apps, filter).id) },
          [{ "field": "plainHttpUri", "severity": "crit", "ids": $append(['-'], $httpExact) }]);
        $idsOf := function($sev) { $append(['-'], $found[severity = $sev].ids) };
        $byId := function($rows, $op, $ids) { $applyAdvanced($rows, { "join": "and", "clauses": [{ "path": "id", "type": "string", "op": $op, "value": $ids }] }) };
        /* One copy of each app with a finding at the levels shown; then true on each finding it has (copies only the
           apps that have that finding). */
        $flagged := $reduce($found, function($rows, $c) {
          $append($withFields($byId($rows, 'in', $c.ids), { $c.field: true }), $byId($rows, 'notIn', $c.ids))
        }, $withFields($byId($apps, 'in', $append(['-'], [$levels.$idsOf($)])), {
          "wildcardUri": false, "plainHttpUri": false, "sharedHostingUri": false, "implicitAccessTokens": false,
          "publicClient": false, "personalAccounts": false, "criticalPermissions": false, "implicitIdTokens": false,
          "multiTenant": false, "localhostUri": false }));
        $crit := $withFields($byId($flagged, 'in', $idsOf('crit')), { "severity": "crit" });
        $warn := $withFields($byId($byId($flagged, 'notIn', $idsOf('crit')), 'in', $idsOf('warn')), { "severity": "warn" });
        $info := $level = 'all' ? $withFields($byId($byId($flagged, 'notIn', $append($idsOf('crit'), $idsOf('warn'))), 'in', $idsOf('info')), { "severity": "info" }) : [];
        $shown := $append([], $append($append($crit^(displayName), $level = 'crit' ? [] : $warn^(displayName)), $level = 'all' ? $info^(displayName) : []));
        $appsWith := function($field) { $count($found[field = $field].ids) - $count($found[field = $field]) };
        {
          "rows": $shown,
          "listed": $count($shown),
          "critical": $count($crit),
          "implicit": $appsWith('implicitAccessTokens'),
          "publicClient": $appsWith('publicClient'),
          "personal": $appsWith('personalAccounts'),
          "partial": value.truncated = true
        }
      ) }

  # What the page shows of appList: its figures and the first 2,000 apps. The export reads appList itself.
  apps:
    source: static
    data: ${ ds.appList }
    cache: { ttl: 900 }
    transform: >-
      ${ $merge([value, { "rows": $take(value.rows, 2000), "listCapped": $count(value.rows) > 2000 }]) }
layout:
  - widget: markdown
    span: 12
    when: ${ apps.partial = true }
    text: >-
      **Partial data.** The tenant has more app registrations than this report reads (20,000); the figures and the
      list cover the ones read.
  - widget: markdown
    span: 12
    when: ${ apps.listCapped = true }
    text: >-
      ${ 'The list shows the first 2,000 of ' & $formatNumber(apps.listed, '#,##0') & ' app registrations with findings (critical first); the figures and the CSV/XLSX export cover all of them.' }
  - widget: kpi
    id: critical
    data: apps.critical
    label: Apps with wildcard or plain-HTTP redirect URIs
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: kpi
    id: implicit
    data: apps.implicit
    label: Implicit grant issuing access tokens
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: publicClient
    data: apps.publicClient
    label: Public client flows allowed
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: personal
    data: apps.personal
    label: Personal accounts can sign in
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: table
    id: apps
    span: 12
    data: apps.rows
    rowKey: id
    columns:
      - { field: displayName, label: App, kind: identity, secondary: appId, sortable: true }
      - field: severity
        label: Severity
        kind: status
        map: { crit: [crit, Critical], warn: [warn, Warning], info: [info, Informational] }
        filter: { type: facet, param: severity }
      - { field: wildcardUri, label: Wildcard redirect URI, kind: boolean, filter: facet }
      - { field: plainHttpUri, label: Plain-HTTP redirect URI, kind: boolean, filter: facet }
      - { field: sharedHostingUri, label: Shared-hosting redirect URI, kind: boolean, filter: facet }
      - { field: implicitAccessTokens, label: Implicit grant (access tokens), kind: boolean, filter: facet }
      - { field: publicClient, label: Public client flows, kind: boolean, filter: facet }
      - { field: personalAccounts, label: Personal accounts, kind: boolean, hidden: true }
      - { field: criticalPermissions, label: Critical application permissions requested, kind: boolean, filter: facet }
      - { field: implicitIdTokens, label: Implicit grant (ID tokens), kind: boolean, hidden: true }
      - { field: multiTenant, label: Multi-tenant, kind: boolean, hidden: true }
      - { field: localhostUri, label: Localhost redirect URI, kind: boolean, hidden: true }
      - field: signInAudience
        label: Audience
        kind: status
        map: { AzureADMyOrg: [neutral, Single tenant], AzureADMultipleOrgs: [info, Multi-tenant], AzureADandPersonalMicrosoftAccount: [warn, Multi-tenant + personal], PersonalMicrosoftAccount: [warn, Personal only] }
        filter: facet
      - { field: createdDateTime, label: Created, kind: date, filter: date }
      - { field: id, label: Object id, kind: guid, hidden: true }
    inspect:
      page: identity.app-registration
      params:
        id: ${ row.id }
        appId: ${ row.appId }
    rowActions:
      - label: Fix in Entra admin center (Authentication)
        icon: arrow-square-out
        href: "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationMenuBlade/~/Authentication/appId/${ $encode(row.appId) }"
    empty:
      title: No configuration risks
      body: No app registration has a finding at this severity.

export:
  formats: [csv, xlsx]
  fileName: app-registration-risks
  data: appList.rows
  maxRows: 20000
  columns: all
