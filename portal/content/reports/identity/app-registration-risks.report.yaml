$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.app-registration-risks
version: 2.2.0
title: App registration configuration risks
summary: >-
  App registrations configured in ways that make token theft or misuse easier — wildcard or plain-HTTP redirect URIs,
  redirect URIs on shared hosting domains that can be taken over, the implicit grant, public client flows, sign-in
  from personal Microsoft accounts — and apps that request critical application permissions.
owner: identity-team
tags: [identity, apps, configuration, security, report]
nav: { section: reports, label: App registration risks, icon: warning-diamond, order: 20 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Application.Read.All]
  entraRoles: [Global Reader]

params:
  severity:
    type: enum
    label: Severity
    facet: true
    default: warn
    values:
      - { value: crit, label: Critical only }
      - { value: warn, label: Warnings and critical }
      - { value: all, label: Everything (including informational) }

datasources:
  graphApi:
    source: graph
    request:
      path: "/servicePrincipals(appId='00000003-0000-0000-c000-000000000000')"
      query:
        $select: id,appRoles
    cache: { ttl: 86400 }
    transform: >-
      ${ $merge([[value.appRoles].{ id: value }]) }
  appList:
    label: App registrations
    source: graph
    request:
      path: /applications
      query:
        $select: id,appId,displayName,createdDateTime,signInAudience,web,spa,publicClient,isFallbackPublicClient,requiredResourceAccess
        $top: 999
    paging: all
    maxItems: 15000
    cache: { ttl: 900 }
    # Every check runs natively ($applyAdvanced reads through the redirect URI lists), giving a set of apps per
    # finding; each app that has any finding gets one true/false field per finding and its worst severity — no
    # JSONata per app. Plain HTTP: apps with an http:// URI and no localhost one natively; apps with both are checked
    # per URI with JSONata (http is allowed for localhost only). The page shows the first 2,000 (`apps`); the export
    # reads this whole list.
    transform: >-
      ${ (
        /* Tier 0 for app-only identities (as identity.app-permissions: PRIVILEGED_APP_ROLES and a copy of
           PRIVILEGED_APP_FAMILIES, tests/content/app-permissions-critical-tier.test.ts), plus writing every mailbox,
           file, site or user. */
        $critical := ['AppRoleAssignment.ReadWrite.All', 'Application.ReadWrite.All', 'Application.ReadWrite.OwnedBy',
          'Application.ReadUpdate.All', 'DelegatedPermissionGrant.ReadWrite.All', 'Directory.ReadWrite.All',
          'Directory.Write.Restricted', 'Domain.ReadWrite.All', 'Domain-InternalFederation.ReadWrite.All',
          'Organization.ReadWrite.All', 'PublicKeyInfrastructure.ReadWrite.All', 'MutualTlsOauthConfiguration.ReadWrite.All',
          'TrustFrameworkKeySet.ReadWrite.All', 'SpiffeTrustDomain.ReadWrite.All', 'IdentityProvider.ReadWrite.All',
          'EntitlementManagement.ReadWrite.All', 'User-PasswordProfile.ReadWrite.All', 'AuthenticationContext.ReadWrite.All',
          'OnPremDirectorySynchronization.ReadWrite.All', 'Synchronization.ReadWrite.All', 'Group.ReadWrite.All',
          'GroupMember.ReadWrite.All', 'DelegatedAdminRelationship.ReadWrite.All', 'DeviceManagementConfiguration.ReadWrite.All',
          'DeviceManagementScripts.ReadWrite.All', 'DeviceManagementApps.ReadWrite.All', 'DeviceManagementRBAC.ReadWrite.All',
          'DeviceManagementManagedDevices.PrivilegedOperations.All',
          'Device.ReadWrite.All', 'CustomSecAttributeAssignment.ReadWrite.All', 'IdentityRiskyUser.ReadWrite.All', 'EventListener.ReadWrite.All', 'CustomAuthenticationExtension.ReadWrite.All', 'OnPremisesPublishingProfiles.ReadWrite.All', 'MultiTenantOrganization.ReadWrite.All', 'SharePointTenantSettings.ReadWrite.All', 'AdministrativeUnit.ReadWrite.All', 'DeviceManagementCloudCA.ReadWrite.All', 'User.ManageIdentities.All', 'RoleManagementAlert.ReadWrite.Directory', 'RoleAssignmentSchedule.Remove.Directory', 'RoleEligibilitySchedule.Remove.Directory', 'PrivilegedAssignmentSchedule.Remove.AzureADGroup', 'PrivilegedEligibilitySchedule.Remove.AzureADGroup', 'AgentIdentity.Create.All', 'AgentIdentity.CreateAsManager', 'AgentIdentity.DeleteRestore.All', 'AgentIdentity.EnableDisable.All', 'AgentIdentity.ReadWrite.All', 'AgentIdentityBlueprint.Create', 'AgentIdentityBlueprint.DeleteRestore.All', 'AgentIdentityBlueprint.UpdateBranding.All', 'AgentIdentityBlueprintPrincipal.Create', 'AgentIdentityBlueprintPrincipal.DeleteRestore.All', 'AgentIdentityBlueprintPrincipal.EnableDisable.All', 'AgentIdentityBlueprintPrincipal.ReadWrite.All', 'AgentInstance.ReadWrite.All', 'AgentInstance.ReadWrite.ManagedBy',
          'Mail.ReadWrite', 'Mail.Send', 'Files.ReadWrite.All',
          'Sites.ReadWrite.All', 'Sites.FullControl.All', 'User.ReadWrite.All'];
        $criticalFamily := /^(RoleManagement|RoleManagementPolicy|RoleAssignmentSchedule|RoleEligibilitySchedule|PrivilegedAccess|PrivilegedAssignmentSchedule|PrivilegedEligibilitySchedule|Policy)\.ReadWrite\.|^UserAuth(entication)?Method(-[A-Za-z]+)?\.(ReadWrite|Delete)\.|^LifecycleWorkflows(-Workflow)?\.(ReadWrite\.All|Activate)$|^AgentIdentityBlueprint\.(AddRemoveCreds|ReadWrite|UpdateAuthProperties)\.|^TeamsAppInstallation\.ReadWriteAndConsent/i;
        $roles := ds.graphApi ? ds.graphApi : {};
        $criticalIds := [$keys($roles)[$lookup($roles, $) in $critical or $contains($lookup($roles, $), $criticalFamily)]];
        $apps := value.value;
        $local := ['localhost', '127.0.0.1', '[::1]'];
        $all3 := ['web.redirectUris', 'spa.redirectUris', 'publicClient.redirectUris'];
        $web2 := ['web.redirectUris', 'spa.redirectUris'];
        /* Any of these URI lists holds a URI that contains (starts with) any of the texts. */
        $any := function($paths, $op, $values) { { "join": "or", "clauses": [$paths.{ "path": $, "type": "string", "op": $op, "value": $values }] } };
        $is := function($path, $type, $op, $value) { { "join": "and", "clauses": [{ "path": $path, "type": $type, "op": $op, "value": $value }] } };
        /* Every finding's filter, all checked in one native pass over the apps ($idsWhere): the app ids per finding. */
        $severity := {
          "wildcardUri": "crit", "plainHttpUri": "crit", "sharedHostingUri": "warn", "implicitAccessTokens": "warn",
          "publicClient": "warn", "personalAccounts": "warn", "criticalPermissions": "warn", "implicitIdTokens": "info",
          "multiTenant": "info", "localhostUri": "info"
        };
        $sets := $idsWhere($apps, 'id', {
          "wildcardUri": $any($all3, 'containsAny', ['*']),
          "sharedHostingUri": $any($all3, 'containsAny', ['.azurewebsites.net', '.cloudapp.net', '.cloudapp.azure.com',
            '.trafficmanager.net', '.blob.core.windows.net', '.herokuapp.com', '.ngrok.io', '.ngrok-free.app', '.ngrok.app',
            '.glitch.me', '.vercel.app', '.netlify.app', '.github.io']),
          "localhostUri": $any($web2, 'containsAny', $local),
          "httpCandidate": $any($web2, 'startsWithAny', ['http://']),
          "implicitAccessTokens": $is('web.implicitGrantSettings.enableAccessTokenIssuance', 'boolean', 'eq', true),
          "publicClient": $is('isFallbackPublicClient', 'boolean', 'eq', true),
          "personalAccounts": $is('signInAudience', 'string', 'in', ['AzureADandPersonalMicrosoftAccount', 'PersonalMicrosoftAccount']),
          /* As before 2.0: a critical app role id requested, and an application permission (type Role) requested. */
          "criticalPermissions": { "join": "and", "clauses": [
            { "path": "requiredResourceAccess.resourceAccess.id", "type": "string", "op": "in", "value": $append(['-'], $criticalIds) },
            { "path": "requiredResourceAccess.resourceAccess.type", "type": "string", "op": "eq", "value": "Role" }] },
          "implicitIdTokens": $is('web.implicitGrantSettings.enableIdTokenIssuance', 'boolean', 'eq', true),
          "multiTenant": $is('signInAudience', 'string', 'eq', 'AzureADMultipleOrgs')
        });
        /* Plain HTTP: a web or SPA redirect URI on http:// that isn't localhost (http://localhost, :port or /path; also
           127.0.0.1 and [::1]) — checked per URI, only for the apps with an http:// URI. */
        $candidates := $applyAdvanced($apps, $is('id', 'string', 'in', $append(['-'], $sets.httpCandidate)));
        $uri := function($list) { $unnest($pick($candidates, ['id', $list]), $list & '.redirectUris', 'uri') };
        $plainHttp := $distinct($pluck($applyAdvanced($append($uri('web'), $uri('spa')), { "join": "and", "clauses": [
          { "path": "uri", "type": "string", "op": "startsWith", "value": "http://" },
          { "path": "uri", "type": "string", "op": "notStartsWithAny", "value": $append($local.('http://' & $ & ':'), $local.('http://' & $ & '/')) },
          { "path": "uri", "type": "string", "op": "notIn", "value": $local.('http://' & $) }
        ] }), 'id'));
        $level := params.severity ? params.severity : 'warn';
        /* Every app once, small (only the fields the table and export show — not the redirect URI lists or permissions),
           with one true/false field per finding (one native pass); then each severity is a native filter on those
           fields — no lists of ids through JSONata. */
        $flagged := $flagIn($pick($apps, ['id', 'appId', 'displayName', 'signInAudience', 'createdDateTime']), 'id',
          $merge($keys($severity).{ $: $append(['-'], $ = 'plainHttpUri' ? $plainHttp : $lookup($sets, $)) }));
        $fields := function($sev) { [$keys($severity)[$lookup($severity, $) = $sev]] };
        $anyTrue := function($sev) { { "join": "or", "clauses": [$fields($sev).{ "path": $, "type": "boolean", "op": "eq", "value": true }] } };
        $noneTrue := function($sev) { { "join": "and", "clauses": [$fields($sev).{ "path": $, "type": "boolean", "op": "ne", "value": true }] } };
        $crit := $withFields($applyAdvanced($flagged, $anyTrue('crit')), { "severity": "crit" });
        $warn := $level = 'crit' ? [] : $withFields($applyAdvanced($flagged, { "join": "and", "clauses": [$noneTrue('crit'), $anyTrue('warn')] }), { "severity": "warn" });
        $info := $level = 'all' ? $withFields($applyAdvanced($flagged, { "join": "and", "clauses": [$noneTrue('crit'), $noneTrue('warn'), $anyTrue('info')] }), { "severity": "info" }) : [];
        $shown := $append([], $append($append($crit^(displayName), $warn^(displayName)), $info^(displayName)));
        $appsWith := function($field) { $count($lookup($sets, $field)) };
        {
          "rows": $shown,
          "listed": $count($shown),
          "critical": $count($crit),
          "implicit": $appsWith('implicitAccessTokens'),
          "publicClient": $appsWith('publicClient'),
          "personal": $appsWith('personalAccounts'),
          "partial": value.truncated = true
        }
      ) }

  # What the page shows of appList: its figures and the first 2,000 apps. The export reads appList itself.
  apps:
    source: static
    data: ${ ds.appList }
    cache: { ttl: 900 }
    transform: >-
      ${ $merge([value, { "rows": $take(value.rows, 2000), "listCapped": $count(value.rows) > 2000 }]) }
layout:
  - widget: markdown
    span: 12
    when: ${ apps.partial = true }
    text: >-
      **Partial data.** The tenant has more app registrations than this report reads (15,000); the figures and the
      list cover the ones read.
  - widget: markdown
    span: 12
    when: ${ apps.listCapped = true }
    text: >-
      ${ 'The list shows the first 2,000 of ' & $formatNumber(apps.listed, '#,##0') & ' app registrations with findings (critical first); the figures and the CSV/XLSX export cover all of them.' }
  - widget: kpi
    id: critical
    data: apps.critical
    label: Apps with wildcard or plain-HTTP redirect URIs
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: kpi
    id: implicit
    data: apps.implicit
    label: Implicit grant issuing access tokens
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: publicClient
    data: apps.publicClient
    label: Public client flows allowed
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: personal
    data: apps.personal
    label: Personal accounts can sign in
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: table
    id: apps
    span: 12
    data: apps.rows
    rowKey: id
    columns:
      - { field: displayName, label: App, kind: identity, secondary: appId, sortable: true }
      - field: severity
        label: Severity
        kind: status
        map: { crit: [crit, Critical], warn: [warn, Warning], info: [info, Informational] }
        filter: { type: facet, param: severity }
      - { field: wildcardUri, label: Wildcard redirect URI, kind: boolean, filter: facet }
      - { field: plainHttpUri, label: Plain-HTTP redirect URI, kind: boolean, filter: facet }
      - { field: sharedHostingUri, label: Shared-hosting redirect URI, kind: boolean, filter: facet }
      - { field: implicitAccessTokens, label: Implicit grant (access tokens), kind: boolean, filter: facet }
      - { field: publicClient, label: Public client flows, kind: boolean, filter: facet }
      - { field: personalAccounts, label: Personal accounts, kind: boolean, hidden: true }
      - { field: criticalPermissions, label: Critical application permissions requested, kind: boolean, filter: facet }
      - { field: implicitIdTokens, label: Implicit grant (ID tokens), kind: boolean, hidden: true }
      - { field: multiTenant, label: Multi-tenant, kind: boolean, hidden: true }
      - { field: localhostUri, label: Localhost redirect URI, kind: boolean, hidden: true }
      - field: signInAudience
        label: Audience
        kind: status
        map: { AzureADMyOrg: [neutral, Single tenant], AzureADMultipleOrgs: [info, Multi-tenant], AzureADandPersonalMicrosoftAccount: [warn, Multi-tenant + personal], PersonalMicrosoftAccount: [warn, Personal only] }
        filter: facet
      - { field: createdDateTime, label: Created, kind: date, filter: date }
      - { field: id, label: Object id, kind: guid, hidden: true }
    inspect:
      page: identity.app-registration
      params:
        id: ${ row.id }
        appId: ${ row.appId }
    rowActions:
      - label: Fix in Entra admin center (Authentication)
        icon: arrow-square-out
        href: "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationMenuBlade/~/Authentication/appId/${ $encode(row.appId) }"
    empty:
      title: No configuration risks
      body: No app registration has a finding at this severity.

export:
  formats: [csv, xlsx]
  fileName: app-registration-risks
  data: appList.rows
  maxRows: 15000
  columns: all
