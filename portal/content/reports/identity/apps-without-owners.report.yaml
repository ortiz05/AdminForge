$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.apps-without-owners
version: 2.0.0
title: Apps without owners
summary: >-
  App registrations and third-party enterprise apps that nobody owns — no one to rotate their secrets, answer for their
  permissions or decide when to retire them. Apps that hold live credentials or request application permissions come
  first. Microsoft apps and managed identities are left out.
owner: identity-team
tags: [identity, apps, governance, hygiene, report]
nav: { section: reports, label: Apps without owners, icon: user-circle-dashed, order: 18 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Application.Read.All]
  entraRoles: [Global Reader]

params:
  kind:
    type: enum
    label: Apps
    facet: true
    default: Both
    values:
      - { value: Both, label: App registrations and enterprise apps }
      - { value: App registrations, label: App registrations }
      - { value: Enterprise apps, label: Enterprise apps (third-party) }

# `owners/$count eq 0` is an advanced query (ConsistencyLevel: eventual + $count), so Graph returns only the ownerless
# objects. Enterprise apps whose app registration lives in this tenant are covered by their registration row.
datasources:
  org:
    source: graph
    request:
      path: /organization
      query:
        $select: id
    cache: { ttl: 3600 }
  apps:
    source: graph
    when: ${ params.kind != 'Enterprise apps' }
    request:
      path: /applications
      headers: { ConsistencyLevel: eventual }
      query:
        $filter: owners/$count eq 0
        $count: true
        $select: id,appId,displayName,createdDateTime,signInAudience,passwordCredentials,keyCredentials,requiredResourceAccess,serviceManagementReference
        $top: 999
    paging: all
    maxItems: 20000
    cache: { ttl: 900 }
  sps:
    source: graph
    when: ${ params.kind != 'App registrations' }
    request:
      path: /servicePrincipals
      headers: { ConsistencyLevel: eventual }
      query:
        $filter: "owners/$count eq 0 and tags/any(t:t eq 'WindowsAzureActiveDirectoryIntegratedApp')"
        $count: true
        $select: id,appId,displayName,servicePrincipalType,appOwnerOrganizationId,accountEnabled,appRoleAssignmentRequired,preferredSingleSignOnMode,verifiedPublisher
        $top: 999
    paging: all
    maxItems: 20000
    cache: { ttl: 900 }
  report:
    source: static
    data: >-
      ${ {
        "apps": ds.apps.value,
        "sps": ds.sps.value,
        "org": ds.org.value[0].id,
        "partial": ds.apps.truncated = true or ds.sps.truncated = true
      } }
    # Classified natively ($applyAdvanced, $withFields, $attach): a JSONata block per app doesn't fit the budget at
    # tens of thousands of ownerless apps. Rows come out highest attention first.
    transform: >-
      ${ (
        $microsoft := ['f8cdef31-a31e-4b4a-93e4-5f571e91255a', '72f988bf-86f1-41af-91ab-2d7cd011db47'];
        $org := value.org ? value.org : '-';
        $c := function($path, $type, $op, $v) { { "path": $path, "type": $type, "op": $op, "value": $v } };
        $all := function($clauses) { { "join": "and", "clauses": $clauses } };
        $any := function($clauses) { { "join": "or", "clauses": $clauses } };
        $now := $iso();
        $audience := {
          "AzureADMyOrg": { "detail": "Single tenant" },
          "AzureADMultipleOrgs": { "detail": "Multi-tenant" },
          "PersonalMicrosoftAccount": { "detail": "Personal accounts" }
        };
        $regs := $attach($withFields(value.apps, { "kind": "App registration" }), 'signInAudience', $audience,
          { "detail": "Multi-tenant and personal accounts" });
        $live := $any([
          $c('passwordCredentials.endDateTime', 'date', 'ge', $now),
          $c('keyCredentials.endDateTime', 'date', 'ge', $now)
        ]);
        $role := $all([$c('requiredResourceAccess.resourceAccess.type', 'string', 'eq', 'Role')]);
        $withCreds := $withFields($applyAdvanced($regs, $live), { "attention": "high", "reason": "Live credentials" });
        /* The rest are the complement by id (a list path matches when any value does, so "no live credential"
           can't be written as one condition). */
        $except := function($rows, $taken) { $applyAdvanced($rows, $all([$c('id', 'string', 'notIn', $append([], $pluck($taken, 'id')))])) };
        $quiet := $except($regs, $withCreds);
        $withPerms := $withFields($applyAdvanced($quiet, $role), { "attention": "high", "reason": "Application permissions requested" });
        $calm := $except($quiet, $withPerms);
        $wide := $withFields($applyAdvanced($calm, $all([$c('signInAudience', 'string', 'ne', 'AzureADMyOrg')])), { "attention": "medium" });
        $single := $withFields($applyAdvanced($calm, $all([$c('signInAudience', 'string', 'eq', 'AzureADMyOrg')])), { "attention": "low" });
        $third := $withFields($applyAdvanced(value.sps, $all([
          $c('servicePrincipalType', 'string', 'eq', 'Application'),
          $c('appOwnerOrganizationId', 'string', 'notIn', $append($microsoft, $org))
        ])), { "kind": "Enterprise app" });
        $publishers := $distinct($pluck($third, 'verifiedPublisher.displayName'));
        $byPublisher := $publishers{ $: { "detail": $ } };
        $sps := $attach($third, 'verifiedPublisher.displayName', $byPublisher, { "detail": "Unverified publisher" });
        $open := $withFields($applyAdvanced($sps, $all([
          $c('accountEnabled', 'boolean', 'ne', false), $c('appRoleAssignmentRequired', 'boolean', 'eq', false)
        ])), { "attention": "medium" });
        $closed := $withFields($except($sps, $open), { "attention": "low" });
        $high := $append($withCreds, $withPerms);
        $medium := $append($wide, $open);
        $low := $append($single, $closed);
        {
          "rows": $append($append([$high^(displayName)], [$medium^(kind, displayName)]), [$low^(kind, displayName)]),
          "registrations": $count($regs),
          "withAccess": $count($high),
          "enterprise": $count($sps),
          "openToAll": $count($open),
          "partial": value.partial = true
        }
      ) }

layout:
  - widget: kpi
    id: registrations
    data: report.registrations
    label: App registrations without owners
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: withAccess
    data: report.withAccess
    label: Ownerless apps that can act on their own
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: kpi
    id: enterprise
    data: report.enterprise
    label: Third-party enterprise apps without owners
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: openToAll
    data: report.openToAll
    label: Ownerless enterprise apps open to every user
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: markdown
    id: partial
    span: 12
    when: ${ report.partial = true }
    text: |
      **Partial read.** The tenant has more ownerless app registrations or enterprise apps than this report reads
      (20,000 each): the figures, the table and the export cover those only.
  - widget: table
    id: apps
    span: 12
    data: report.rows
    rowKey: id
    columns:
      - { field: displayName, label: App, kind: identity, secondary: appId, sortable: true }
      - { field: kind, label: Type, filter: { type: facet, param: kind } }
      - field: attention
        label: Attention
        kind: status
        map: { high: [crit, Can act on its own], medium: [warn, Broad sign-in], low: [neutral, Review] }
        filter: facet
      - { field: detail, label: Audience or publisher }
      - { field: reason, label: Why it needs an owner }
      - { field: appRoleAssignmentRequired, label: Assignment required, kind: boolean, hidden: true }
      - { field: accountEnabled, label: Sign-in enabled, kind: boolean, hidden: true }
      - { field: createdDateTime, label: Created, kind: date, filter: date }
      - { field: serviceManagementReference, label: Service reference, hidden: true }
      - { field: id, label: Object id, kind: guid, hidden: true }
    rowActions:
      - playbook: identity.add-app-owner
        label: Add owner
        icon: user-plus
        inputs:
          appObjectId: ${ row.id }
        when: ${ row.kind = 'App registration' }
      - { label: Open app registration, icon: app-window, href: "/p/identity.app-registration?id=${ $encode(row.id) }&appId=${ $encode(row.appId) }", when: "${ row.kind = 'App registration' }" }
      - { label: Open enterprise app, icon: app-window, href: "/p/identity.enterprise-app?id=${ $encode(row.id) }&appId=${ $encode(row.appId) }", when: "${ row.kind = 'Enterprise app' }" }
      - label: Add owners in Entra admin center
        icon: arrow-square-out
        href: "https://entra.microsoft.com/#view/Microsoft_AAD_IAM/ManagedAppMenuBlade/~/Owners/objectId/${ $encode(row.id) }/appId/${ $encode(row.appId) }"
        when: ${ row.kind = 'Enterprise app' }
    empty:
      title: Every app has an owner
      body: Each app registration and third-party enterprise app in scope has at least one owner.

export:
  formats: [csv, xlsx]
  fileName: apps-without-owners
  data: report.rows
  columns: all
