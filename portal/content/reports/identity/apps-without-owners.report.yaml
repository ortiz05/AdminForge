$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.apps-without-owners
version: 1.0.0
title: Apps without owners
summary: >-
  App registrations and third-party enterprise apps that nobody owns — no one to rotate their secrets, answer for their
  permissions or decide when to retire them. Apps that hold live credentials or request application permissions come
  first. Microsoft apps and managed identities are left out.
owner: identity-team
tags: [identity, apps, governance, hygiene, report]
nav: { section: reports, label: Apps without owners, icon: user-circle-dashed, order: 18 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Application.Read.All]
  entraRoles: [Global Reader]

params:
  kind:
    type: enum
    label: Apps
    facet: true
    default: Both
    values:
      - { value: Both, label: App registrations and enterprise apps }
      - { value: App registrations, label: App registrations }
      - { value: Enterprise apps, label: Enterprise apps (third-party) }

# `owners/$count eq 0` is an advanced query (ConsistencyLevel: eventual + $count), so Graph returns only the ownerless
# objects. Enterprise apps whose app registration lives in this tenant are covered by their registration row.
datasources:
  org:
    source: graph
    request:
      path: /organization
      query:
        $select: id
    cache: { ttl: 3600 }
  apps:
    source: graph
    when: ${ params.kind != 'Enterprise apps' }
    request:
      path: /applications
      headers: { ConsistencyLevel: eventual }
      query:
        $filter: owners/$count eq 0
        $count: true
        $select: id,appId,displayName,createdDateTime,signInAudience,passwordCredentials,keyCredentials,requiredResourceAccess,serviceManagementReference
        $top: 999
    paging: all
    maxItems: 20000
    cache: { ttl: 900 }
  sps:
    source: graph
    when: ${ params.kind != 'App registrations' }
    request:
      path: /servicePrincipals
      headers: { ConsistencyLevel: eventual }
      query:
        $filter: "owners/$count eq 0 and tags/any(t:t eq 'WindowsAzureActiveDirectoryIntegratedApp')"
        $count: true
        $select: id,appId,displayName,servicePrincipalType,appOwnerOrganizationId,accountEnabled,appRoleAssignmentRequired,preferredSingleSignOnMode,verifiedPublisher
        $top: 999
    paging: all
    maxItems: 20000
    cache: { ttl: 900 }
  report:
    source: static
    data: >-
      ${ { "apps": ds.apps.value, "sps": ds.sps.value, "org": ds.org.value[0].id } }
    transform: >-
      ${ (
        $microsoft := ['f8cdef31-a31e-4b4a-93e4-5f571e91255a', '72f988bf-86f1-41af-91ab-2d7cd011db47'];
        $org := value.org;
        $registrations := [value.apps.(
          $active := [$append(passwordCredentials, keyCredentials)[endDateTime and $daysUntil(endDateTime) >= 0]];
          $appPerms := $count(requiredResourceAccess.resourceAccess[type = 'Role']);
          {
            "key": 'app|' & id,
            "kind": 'App registration',
            "id": id,
            "appId": appId,
            "name": displayName,
            "detail": signInAudience = 'AzureADMyOrg' ? 'Single tenant'
                      : signInAudience = 'AzureADMultipleOrgs' ? 'Multi-tenant'
                      : signInAudience = 'PersonalMicrosoftAccount' ? 'Personal accounts' : 'Multi-tenant and personal accounts',
            "activeCredentials": $count($active),
            "applicationPermissions": $appPerms,
            "created": createdDateTime,
            "reference": serviceManagementReference,
            "attention": $count($active) > 0 or $appPerms > 0 ? 'high' : signInAudience != 'AzureADMyOrg' ? 'medium' : 'low'
          }
        )];
        $enterprise := [value.sps[
          servicePrincipalType = 'Application' and $not(appOwnerOrganizationId in $microsoft) and appOwnerOrganizationId != $org
        ].{
          "key": 'sp|' & id,
          "kind": 'Enterprise app',
          "id": id,
          "appId": appId,
          "name": displayName,
          "detail": verifiedPublisher.displayName ? verifiedPublisher.displayName : 'Unverified publisher',
          "enabled": accountEnabled,
          "assignmentRequired": appRoleAssignmentRequired,
          "attention": accountEnabled != false and appRoleAssignmentRequired = false ? 'medium' : 'low'
        }];
        $all := $append($registrations, $enterprise);
        $rank := { "high": 0, "medium": 1, "low": 2 };
        {
          "rows": [$all^($lookup($rank, attention), kind, name)],
          "registrations": $count($registrations),
          "withAccess": $count($registrations[attention = 'high']),
          "enterprise": $count($enterprise),
          "openToAll": $count($enterprise[attention = 'medium'])
        }
      ) }

layout:
  - widget: kpi
    id: registrations
    data: report.registrations
    label: App registrations without owners
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: withAccess
    data: report.withAccess
    label: Ownerless apps that can act on their own
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: kpi
    id: enterprise
    data: report.enterprise
    label: Third-party enterprise apps without owners
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: openToAll
    data: report.openToAll
    label: Ownerless enterprise apps open to every user
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: table
    id: apps
    span: 12
    data: report.rows
    rowKey: key
    columns:
      - { field: name, label: App, kind: identity, secondary: appId, sortable: true }
      - { field: kind, label: Type, filter: { type: facet, param: kind } }
      - field: attention
        label: Attention
        kind: status
        map: { high: [crit, Can act on its own], medium: [warn, Broad sign-in], low: [neutral, Review] }
        filter: facet
      - { field: detail, label: Audience or publisher }
      - { field: activeCredentials, label: Live credentials, kind: number, sortable: true }
      - { field: applicationPermissions, label: App permissions requested, kind: number }
      - { field: assignmentRequired, label: Assignment required, kind: boolean, hidden: true }
      - { field: enabled, label: Sign-in enabled, kind: boolean, hidden: true }
      - { field: created, label: Created, kind: date, filter: date }
      - { field: reference, label: Service reference, hidden: true }
      - { field: id, label: Object id, kind: guid, hidden: true }
    rowActions:
      - playbook: identity.add-app-owner
        label: Add owner
        icon: user-plus
        inputs:
          appObjectId: ${ row.id }
        when: ${ row.kind = 'App registration' }
      - { label: Open app registration, icon: app-window, href: "/p/identity.app-registration?id=${ $encode(row.id) }&appId=${ $encode(row.appId) }", when: "${ row.kind = 'App registration' }" }
      - { label: Open enterprise app, icon: app-window, href: "/p/identity.enterprise-app?id=${ $encode(row.id) }&appId=${ $encode(row.appId) }", when: "${ row.kind = 'Enterprise app' }" }
      - label: Add owners in Entra admin center
        icon: arrow-square-out
        href: "https://entra.microsoft.com/#view/Microsoft_AAD_IAM/ManagedAppMenuBlade/~/Owners/objectId/${ $encode(row.id) }/appId/${ $encode(row.appId) }"
        when: ${ row.kind = 'Enterprise app' }
    empty:
      title: Every app has an owner
      body: Each app registration and third-party enterprise app in scope has at least one owner.

export:
  formats: [csv, xlsx]
  fileName: apps-without-owners
  data: report.rows
  columns: all
