$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.consent-grants
version: 2.0.0
title: Delegated permission grants
summary: >-
  OAuth delegated permission grants — admin consent on behalf of all users and consent individual users gave
  themselves — with the app, its publisher, the API, the permissions and who consented. Grants that reach mail, files,
  sites, chats or the directory, or let an app act fully as the user, are flagged so you can revoke what nobody can
  justify.
owner: identity-team
tags: [identity, apps, consent, permissions, security, report, review]
nav: { section: reports, label: Delegated permission grants, icon: handshake, order: 17 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Directory.Read.All]
  entraRoles: [Global Reader]

params:
  consent:
    type: enum
    label: Consent
    facet: true
    default: Any
    values:
      - { value: Any, label: Admin or user }
      - { value: Admin, label: Admin consent (all users) }
      - { value: User, label: User consent }
  risk:
    type: enum
    label: Permissions
    facet: true
    default: risky
    values:
      - { value: risky, label: High-impact grants only }
      - { value: all, label: All grants }

# Grants carry object ids only; apps, APIs and consenting users are resolved in one getByIds call (up to 1,000 ids —
# apps and APIs first). A static datasource joins the three, so the table still renders when there are no grants.
datasources:
  grants:
    source: graph
    request:
      path: /oauth2PermissionGrants
      query:
        $top: 999
    paging: all
    maxItems: 50000
    cache: { ttl: 900 }
  org:
    source: graph
    request:
      path: /organization
      query:
        $select: id
    cache: { ttl: 3600 }
  objects:
    source: graph
    when: ${ $count(ds.grants.value) > 0 }
    request:
      method: POST
      path: /directoryObjects/getByIds
      body:
        ids: >-
          ${ $take($append($distinct($append($pluck(ds.grants.value, 'clientId'), $pluck(ds.grants.value, 'resourceId'))), $distinct($pluck(ds.grants.value, 'principalId'))), 1000) }
        types: [servicePrincipal, user]
    cache: { ttl: 900 }
  # The full list (every grant matching the filters, sorted, with app, API and user) for the export and the page.
  grantList:
    source: static
    # Whether the names lookup (≤ 1,000 ids) missed some is counted here: each expression has its own time budget.
    data: >-
      ${ {
        "grants": ds.grants.value,
        "objects": ds.objects.value,
        "org": ds.org.value[0].id,
        "truncated": $count($distinct($append($append($pluck(ds.grants.value, 'clientId'), $pluck(ds.grants.value, 'resourceId')),
          $pluck(ds.grants.value, 'principalId')))) > 1000,
        "partial": ds.grants.truncated = true
      } }
    # critical = directory/role/app/policy control or full mailbox/site access as the user; high = content (mail,
    # files, sites, chats, calendars), anything that writes, sends, or impersonates the user on an API.
    # Each distinct scope string and each object is classified once and joined onto the grants natively ($attach).
    transform: >-
      ${ (
        $critical := ['Directory.ReadWrite.All', 'Directory.AccessAsUser.All', 'RoleManagement.ReadWrite.Directory',
          'Application.ReadWrite.All', 'AppRoleAssignment.ReadWrite.All', 'DelegatedPermissionGrant.ReadWrite.All',
          'Policy.ReadWrite.ConditionalAccess', 'Policy.ReadWrite.AuthenticationMethod', 'Policy.ReadWrite.PermissionGrant',
          'Policy.ReadWrite.Authorization', 'UserAuthenticationMethod.ReadWrite.All', 'full_access_as_user',
          'EWS.AccessAsUser.All', 'Sites.FullControl.All', 'Exchange.Manage'];
        $high := function($s) {
          $contains($s, 'ReadWrite') or $contains($s, '.Send') or $contains($s, 'AccessAsUser') or $s = 'user_impersonation'
          or $contains($s, /^(Mail|Files|Sites|Notes|Chat|ChannelMessage|MailboxSettings|Calendars|Contacts|OnlineMeeting\w*|EAS|IMAP|POP|SMTP)\./)
        };
        $microsoft := ['f8cdef31-a31e-4b4a-93e4-5f571e91255a', '72f988bf-86f1-41af-91ab-2d7cd011db47'];
        $org := value.org ? value.org : '-';
        $own := $append([], [$append([env.AF_READ_CLIENT_ID, env.AF_WRITE_CLIENT_ID, env.AF_AUTOMATION_CLIENT_ID],
          env.AF_PROTECTED_APP_IDS ? [$split(env.AF_PROTECTED_APP_IDS, ',').$trim($)] : [])[$ != '']]);
        $rank := { "critical": 0, "high": 1, "low": 2 };
        $eq := function($path, $op, $v) { { "join": "and", "clauses": [{ "path": $path, "type": "string", "op": $op, "value": $v }] } };
        $g := value.grants;
        $objects := value.objects;
        $scopeStrings := $distinct($pluck($g, 'scope'));
        $scopeTable := $scopeStrings{ $: (
          $scopes := [$split($trim($), ' ')[$ != '']];
          $crit := [$scopes[$ in $critical]];
          $hi := [$scopes[$not($ in $critical) and $high($)]];
          $t := $count($crit) > 0 ? 'critical' : $count($hi) > 0 ? 'high' : 'low';
          { "scopes": $scopes, "risky": $append($crit, $hi), "tier": $t, "rank": $lookup($rank, $t) }
        ) };
        $sps := $applyAdvanced($objects, $eq('appId', 'notEmpty', null));
        $other := $applyAdvanced($sps, $eq('appOwnerOrganizationId', 'notIn', $append($microsoft, $org)));
        $clients := $append($append($append($append(
          $withFields($applyAdvanced($sps, $eq('appOwnerOrganizationId', 'in', $microsoft)), { "origin": "Microsoft" }),
          $withFields($applyAdvanced($sps, $eq('appOwnerOrganizationId', 'eq', $org)), { "origin": "This organisation" })),
          $withFields($applyAdvanced($other, $eq('verifiedPublisher.displayName', 'notEmpty', null)), { "origin": "Other organisation" })),
          $withFields($applyAdvanced($other, $eq('verifiedPublisher.displayName', 'isEmpty', null)),
            { "origin": "Other organisation", "verifiedPublisher": { "displayName": "Unverified publisher" } })),
          $withFields($applyAdvanced($objects, $eq('appId', 'isEmpty', null)), { "origin": "Unknown" }));
        $marked := $append(
          $withFields($applyAdvanced($clients, $eq('appId', 'in', $own)), { "adminforge": true }),
          $withFields($applyAdvanced($clients, $eq('appId', 'notIn', $own)), { "adminforge": false }));
        $small := $pick($marked, ['id', 'displayName', 'appId', 'verifiedPublisher', 'origin', 'adminforge', 'userPrincipalName']);
        $byId := $small{ id: $ };
        /* Critical, then high (then low) grants, each picked natively: the list comes out in impact order without
           sorting tens of thousands of rows (the page sorts the rows it shows). */
        $tierStrings := function($t) { $append([], $keys($scopeTable)[$lookup($scopeTable, $).tier = $t]) };
        $criticalGrants := $applyAdvanced($g, $eq('scope', 'in', $tierStrings('critical')));
        $highGrants := $applyAdvanced($g, $eq('scope', 'in', $tierStrings('high')));
        $lowGrants := $$.params.risk = 'all'
          ? $applyAdvanced($g, $eq('scope', 'notIn', $append($tierStrings('critical'), $tierStrings('high'))))
          : [];
        /* An admin grant is for every user: "All users" (page and export), set per tier to keep the order. */
        $forAll := function($rows) { $append(
          $withFields($applyAdvanced($rows, $eq('consentType', 'eq', 'AllPrincipals')), { "who": { "displayName": "All users" } }),
          $applyAdvanced($rows, $eq('consentType', 'ne', 'AllPrincipals'))) };
        $tiered := $append($append($forAll($criticalGrants), $forAll($highGrants)), $forAll($lowGrants));
        $consented := $$.params.consent = 'Any' ? $tiered
          : $applyAdvanced($tiered, $eq('consentType', 'eq', $$.params.consent = 'Admin' ? 'AllPrincipals' : 'Principal'));
        /* Its scope's tier, app, API and user in one pass over one lookup (scope strings and object ids never
           collide); an admin grant keeps its "All users". */
        $joined := $attach($consented, ['scope', 'clientId', 'resourceId', 'principalId'], $merge([$scopeTable, $byId]),
          { "sc": { "scopes": [], "risky": [], "tier": "low", "rank": 2 }, "client": { "origin": "Unknown", "adminforge": false } },
          ['sc', 'client', 'resource', 'who']);
        /* The figures cover every grant, whatever the filters. */
        $riskyAll := $append($criticalGrants, $highGrants);
        $admin := $applyAdvanced($riskyAll, $eq('consentType', 'eq', 'AllPrincipals'));
        {
          "rows": $joined,
          "figures": {
            "critical": $count($criticalGrants),
            "adminRisky": $count($admin),
            "userRisky": $count($riskyAll) - $count($admin),
            "apps": $count($distinct($pluck($riskyAll, 'clientId'))),
            "truncated": value.truncated = true,
            "partial": value.partial = true
          }
        }
      ) }
  # The page: the figures over every grant and the first 2,000 rows of the list (the export has them all).
  report:
    source: static
    data: >-
      ${ {
        "first": $take(ds.grantList.rows, 2000),
        "count": $count(ds.grantList.rows),
        "figures": ds.grantList.figures
      } }
    transform: >-
      ${ (
        $f := function($path, $op, $v) { { "join": "and", "clauses": [{ "path": $path, "type": "string", "op": $op, "value": $v }] } };
        $named := function($rows, $path) { $applyAdvanced($rows, $f($path, 'notEmpty', null)) };
        $nameless := function($rows, $path) { $applyAdvanced($rows, $f($path, 'isEmpty', null)) };
        /* Apps, APIs and users the names lookup (≤ 1,000 ids) didn't resolve show by their object id. */
        $clients := $nameless(value.first, 'client.displayName');
        $clientIds := $distinct($pluck($clients, 'clientId'));
        $step1 := $append($named(value.first, 'client.displayName'), $attach($clients, 'clientId',
          $count($clientIds) > 0 ? $clientIds{ $: { "displayName": $, "origin": "Unknown", "adminforge": false } } : {}, null, 'client'));
        $apis := $nameless($step1, 'resource.displayName');
        $apiIds := $distinct($pluck($apis, 'resourceId'));
        $step2 := $append($named($step1, 'resource.displayName'), $attach($apis, 'resourceId',
          $count($apiIds) > 0 ? $apiIds{ $: { "displayName": $ } } : {}, null, 'resource'));
        $users := $applyAdvanced($step2, { "join": "and", "clauses": [
          { "path": "who.displayName", "type": "string", "op": "isEmpty", "value": null },
          { "path": "principalId", "type": "string", "op": "notEmpty", "value": null }
        ] });
        $userIds := $distinct($pluck($users, 'principalId'));
        $page := $append($applyAdvanced($step2, { "join": "or", "clauses": [
          { "path": "who.displayName", "type": "string", "op": "notEmpty", "value": null },
          { "path": "principalId", "type": "string", "op": "isEmpty", "value": null }
        ] }), $attach($users, 'principalId', $count($userIds) > 0 ? $userIds{ $: { "displayName": $ } } : {}, null, 'who'));
        $merge([value.figures, {
          /* A sort key must not be empty: grants of an app without a name or id go last. */
          "rows": $append(
            [$named($page, 'client.displayName')^(sc.rank, consentType, client.displayName)],
            [$nameless($page, 'client.displayName')^(sc.rank, consentType)]),
          "listCapped": value.count > 2000,
          "listTotal": value.count
        }])
      ) }

layout:
  - widget: kpi
    id: critical
    data: report.critical
    label: Grants with critical permissions
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: kpi
    id: adminRisky
    data: report.adminRisky
    label: High-impact admin consents
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: userRisky
    data: report.userRisky
    label: High-impact user consents
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: apps
    data: report.apps
    label: Apps with high-impact grants
    format: number
  - widget: markdown
    id: guidance
    span: 12
    text: |
      Admin consent applies to **every user**; user consent only to the user who gave it. Revoking a grant stops new
      tokens with those permissions (tokens already issued last until they expire). To stop users consenting to risky
      apps, allow user consent only for verified publishers and low-impact permissions and turn on the admin consent
      workflow — see the **Identity settings baseline** report.
  - widget: markdown
    id: capped
    span: 12
    when: ${ report.listCapped = true }
    text: |
      **Partial data.** ${ $formatNumber(report.listTotal, '#,##0') } grants match; the table shows the first 2,000
      (critical first). The export has every grant read.
  - widget: markdown
    id: truncated
    span: 12
    when: ${ report.truncated = true }
    text: |
      **Partial names.** More apps, APIs and users are involved than one lookup covers (1,000): the rest show by their
      object id on this page and are blank in the export (its id columns have them).
  - widget: markdown
    id: partial
    span: 12
    when: ${ report.partial = true }
    text: |
      **Partial read.** Microsoft Graph has more delegated permission grants than this report reads (50,000): the
      figures, the table and the export cover those only. Review the rest in the Entra admin center.
  - widget: table
    id: grants
    span: 12
    data: report.rows
    rowKey: id
    columns:
      - { field: client.displayName, label: App, kind: identity, secondary: client.verifiedPublisher.displayName, sortable: true }
      - field: client.origin
        label: Publisher
        kind: status
        map: { "This organisation": [neutral, This organisation], "Other organisation": [warn, Third party], Microsoft: [neutral, Microsoft], Unknown: [neutral, Unknown] }
        filter: facet
      - field: consentType
        label: Consent
        kind: status
        map: { AllPrincipals: [info, Admin (all users)], Principal: [neutral, User] }
        filter: { type: facet, param: consent }
      - { field: who.displayName, label: Consented for, kind: identity, secondary: who.userPrincipalName }
      - { field: resource.displayName, label: API, filter: facet }
      - field: sc.tier
        label: Impact
        kind: status
        map: { critical: [crit, Critical], high: [warn, High], low: [ok, Low] }
        filter: facet
      - { field: sc.risky, label: High-impact permissions, kind: tags }
      - { field: sc.scopes, label: All permissions, kind: tags, hidden: true }
      - { field: client.adminforge, label: AdminForge app, kind: boolean, hidden: true }
      - { field: client.appId, label: Application (client) id, kind: guid, hidden: true }
      - { field: clientId, label: App object id, kind: guid, hidden: true }
      - { field: resourceId, label: API object id, kind: guid, hidden: true }
      - { field: principalId, label: User object id, kind: guid, hidden: true }
      - { field: id, label: Grant id, hidden: true }
    inspect:
      page: identity.enterprise-app
      params:
        id: ${ row.clientId }
        appId: ${ row.client.appId }
    rowActions:
      - playbook: identity.revoke-consent-grant
        label: Revoke grant
        icon: prohibit
        inputs:
          grantId: ${ row.id }
        when: ${ row.client.adminforge != true }
      - { label: Open user, icon: user, href: "/p/identity.user?id=${ $encode(row.principalId) }", when: "${ $boolean(row.principalId) }" }
    empty:
      title: No grants match
      body: No delegated permission grant matches the filters (try All grants).

export:
  formats: [csv, xlsx]
  fileName: delegated-permission-grants
  data: grantList.rows
  columns: all
