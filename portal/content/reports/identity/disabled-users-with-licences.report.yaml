$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.disabled-users-with-licences
version: 2.0.0
title: Licensed disabled accounts
summary: >-
  Accounts whose sign-in is blocked but that still hold licences — seats paid for and not used. One row per account and
  licence, showing whether the licence is assigned directly (remove it here) or through a group (remove the account
  from the group or exclude it). Shared mailboxes converted from users keep a licence only when they need one.
owner: identity-team
tags: [identity, licensing, cost, hygiene, report]
nav: { section: reports, label: Licensed disabled accounts, icon: currency-circle-dollar, order: 22 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [User.Read.All, Organization.Read.All]
  entraRoles: [Directory Readers]

params:
  assignment:
    type: enum
    label: Assigned
    facet: true
    default: Any
    values:
      - { value: Any, label: Directly or through a group }
      - { value: Direct, label: Directly (removable here) }
      - { value: Group, label: Through a group }

# `accountEnabled eq false and assignedLicenses/$count ne 0` is an advanced query: Graph returns only the disabled,
# licensed accounts. licenseAssignmentStates says how each licence got there.
datasources:
  skus:
    source: graph
    request:
      path: /subscribedSkus
      query:
        $select: skuId,skuPartNumber
    cache: { ttl: 3600 }
  users:
    source: graph
    request:
      path: /users
      headers: { ConsistencyLevel: eventual }
      query:
        $filter: accountEnabled eq false and assignedLicenses/$count ne 0
        $count: true
        $select: id,displayName,userPrincipalName,userType,department,jobTitle,assignedLicenses,licenseAssignmentStates,onPremisesSyncEnabled,createdDateTime
        $top: 999
    paging: all
    maxItems: 50000
    cache: { ttl: 900 }
    # One row per licence assignment (licenseAssignmentStates: direct, or through a group), built natively
    # ($unnest): a per-user, per-licence JSONata block doesn't fit the budget at tens of thousands of accounts.
    transform: >-
      ${ (
        $skus := ds.skus.value;
        $partNumbers := $applyAdvanced($skus, { "join": "and", "clauses": [{ "path": "skuId", "type": "string", "op": "notEmpty", "value": null }] }){ skuId: skuPartNumber };
        $users := value.value;
        $c := function($path, $type, $op, $v) { { "path": $path, "type": $type, "op": $op, "value": $v } };
        $where := function($rows, $clauses) { $applyAdvanced($rows, { "join": "and", "clauses": $clauses }) };
        /* One slim row per licence assignment (the user's licence lists stay out of every row and copy). */
        $states := $unnest($pick($users, ['id', 'displayName', 'userPrincipalName', 'userType', 'department', 'createdDateTime',
          'onPremisesSyncEnabled', 'licenseAssignmentStates']), 'licenseAssignmentStates', 'st', 'key');
        $synced := $c('onPremisesSyncEnabled', 'boolean', 'eq', true);
        $cloud := $c('onPremisesSyncEnabled', 'boolean', 'ne', true);
        $byHand := $c('st.assignedByGroup', 'string', 'isEmpty', null);
        $byGroup := $c('st.assignedByGroup', 'string', 'notEmpty', null);
        /* A failed assignment (a group licence that hit CountViolation, …) holds no seat: left out. */
        $held := $c('st.state', 'string', 'ne', 'Error');
        $direct := $append(
          $withFields($where($states, [$synced, $byHand, $held]), { "source": "Synced", "assignment": "Direct" }),
          $withFields($where($states, [$cloud, $byHand, $held]), { "source": "Cloud", "assignment": "Direct" }));
        $group := $append(
          $withFields($where($states, [$synced, $byGroup, $held]), { "source": "Synced", "assignment": "Group" }),
          $withFields($where($states, [$cloud, $byGroup, $held]), { "source": "Cloud", "assignment": "Group" }));
        /* Each SKU's part number, its id when the tenant's SKU list doesn't have it (Remove licence needs one). */
        $skuIds := $distinct($pluck($states, 'st.skuId'));
        $names := $count($skuIds) > 0 ? $skuIds{ $: { "sku": ($n := $lookup($partNumbers, $); $n ? $n : $) } } : {};
        $shown := $attach(
          $$.params.assignment = 'Direct' ? $direct : $$.params.assignment = 'Group' ? $group : $append($direct, $group),
          'st.skuId', $names);
        $assigned := $pluck($users, 'assignedLicenses');
        $bySku := $assigned{ skuId: $count($) };
        {
          /* A sort key must not be empty: accounts without a name go last. */
          "rows": $append(
            [$where($shown, [$c('displayName', 'string', 'notEmpty', null)])^(displayName, sku)],
            [$where($shown, [$c('displayName', 'string', 'isEmpty', null)])^(sku)]),
          "accounts": $count($users),
          "licences": $count($assigned),
          "direct": $count($direct),
          "chart": $take($each($bySku, function($v, $k) {
            { "sku": $lookup($names, $k).sku ? $lookup($names, $k).sku : $k, "seats": $v }
          })^(>seats, sku), 6)
        }
      ) }

layout:
  - widget: kpi
    id: accounts
    data: users.accounts
    label: Disabled accounts holding licences
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: licences
    data: users.licences
    label: Licences tied up
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: direct
    data: users.direct
    label: Assigned directly (removable here)
    format: number
  - widget: chart
    id: bySku
    title: Licences held by disabled accounts
    type: bar
    span: 3
    rows: 1
    data: users.chart
    x: sku
    y: seats
    format: number
  - widget: table
    id: licences
    span: 12
    data: users.rows
    rowKey: key
    selection: multi
    columns:
      - { field: displayName, label: Account, kind: identity, secondary: userPrincipalName, sortable: true }
      - { field: sku, label: Licence, filter: facet, sortable: true }
      - field: assignment
        label: Assigned
        kind: status
        map: { Direct: [warn, Directly], Group: [info, Through a group] }
        filter: facet
      - { field: department, label: Department, filter: facet }
      - { field: source, label: Source, filter: facet }
      - { field: userType, label: Type, hidden: true }
      - { field: st.assignedByGroup, label: Assigning group id, kind: guid, hidden: true }
      - { field: st.error, label: Assignment error, hidden: true }
      - { field: createdDateTime, label: Created, kind: date, hidden: true }
      - { field: st.skuId, label: SKU id, kind: guid, hidden: true }
      - { field: id, label: Object id, kind: guid, hidden: true }
    inspect:
      page: identity.user
      params:
        id: ${ row.id }
    rowActions:
      - playbook: identity.remove-licence
        label: Remove licence
        icon: minus-circle
        inputs:
          userId: ${ row.id }
          sku: ${ row.sku }
        when: ${ row.assignment != 'Group' }
      - { label: Open licensing group, icon: users-three, href: "/p/identity.group?id=${ $encode(row.st.assignedByGroup) }", when: "${ $boolean(row.st.assignedByGroup) }" }
    bulkActions:
      - playbook: identity.remove-licence
        label: Remove licence
        icon: minus-circle
        forEach:
          inputs:
            userId: ${ row.id }
            sku: ${ row.sku }
          concurrency: 5
        maxItems: 200
        when: ${ $count(rows[assignment != 'Group']) = $count(rows) }
    empty:
      title: No licences to reclaim
      body: No blocked account holds a licence.

export:
  formats: [csv, xlsx]
  fileName: licensed-disabled-accounts
  data: users.rows
  columns: all
