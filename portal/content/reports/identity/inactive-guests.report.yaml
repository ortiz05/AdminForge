$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.inactive-guests
version: 2.0.0
title: Inactive guests
summary: >-
  Guest accounts that haven't signed in for the chosen number of days, plus invitations never redeemed — the external
  access to review and remove. Includes the guest's home domain and who they are.
owner: identity-team
tags: [identity, guests, hygiene, report]
nav: { section: reports, label: Inactive guests, icon: user-switch, order: 13 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [User.Read.All, AuditLog.Read.All]
  entraRoles: [Reports Reader]
  licences: [signInLogs]

params:
  days:
    type: enum
    label: Inactive for at least
    facet: true
    default: 90
    values:
      - { value: 30, label: 30 days }
      - { value: 90, label: 90 days }
      - { value: 180, label: 180 days }
      - { value: 365, label: 1 year }
  pending: { type: enum, values: [Include, Only, Exclude], default: Include, label: Unredeemed invitations, facet: true }

# Microsoft narrows each set: accounts whose last successful sign-in is older than the window (Graph can't combine a
# signInActivity filter with others, so guests are picked natively), guests created before the window that never
# signed in, and unredeemed invitations. Filters run natively ($applyAdvanced) — 100k guests fit the transform budget.
datasources:
  inactive:
    source: graph
    request:
      path: /users
      query:
        $select: id,displayName,userPrincipalName,mail,accountEnabled,userType,companyName,createdDateTime,creationType,externalUserState,externalUserStateChangeDateTime,signInActivity
        $filter: "${ 'signInActivity/lastSuccessfulSignInDateTime le ' & $daysAgo($number(params.days ? params.days : 90)) }"
        $top: 120
    paging: all
    maxItems: 50000
    cache: { ttl: 3600 }
  never:
    source: graph
    request:
      path: /users
      query:
        $select: id,displayName,userPrincipalName,mail,accountEnabled,userType,companyName,createdDateTime,creationType,externalUserState,externalUserStateChangeDateTime,signInActivity
        $filter: "${ \"userType eq 'Guest' and createdDateTime le \" & $daysAgo($number(params.days ? params.days : 90)) }"
        $top: 120
    paging: all
    maxItems: 20000
    cache: { ttl: 3600 }
  invitations:
    source: graph
    when: ${ params.pending != 'Exclude' }
    request:
      path: /users
      query:
        $select: id,displayName,userPrincipalName,mail,accountEnabled,userType,companyName,createdDateTime,creationType,externalUserState,externalUserStateChangeDateTime
        $filter: userType eq 'Guest' and externalUserState eq 'PendingAcceptance'
        $top: 999
    paging: all
    maxItems: 20000
    cache: { ttl: 3600 }
  guestCount:
    source: graph
    request:
      path: /users
      headers: { ConsistencyLevel: eventual }
      query:
        $filter: userType eq 'Guest'
        $count: true
        $top: 1
        $select: id
    cache: { ttl: 3600 }
    transform: ${ $lookup(value, '@odata.count') }
  guests:
    source: static
    label: Inactive guests
    data: {}
    transform: >-
      ${ (
        $cutoff := $daysAgo($number(params.days ? params.days : 90));
        $pending := params.pending ? params.pending : 'Include';
        $f := function($rows, $clauses) { $applyAdvanced($rows, { "join": "and", "clauses": $clauses }) };
        $guest := { "path": "userType", "type": "string", "op": "eq", "value": "Guest" };
        $enabled := { "path": "accountEnabled", "type": "boolean", "op": "eq", "value": true };
        $redeemed := { "path": "externalUserState", "type": "string", "op": "ne", "value": "PendingAcceptance" };
        $successful := "signInActivity.lastSuccessfulSignInDateTime";
        $inactive := $pending = 'Only' ? [] : $f(ds.inactive.value, [$guest, $enabled, $redeemed,
          { "path": $successful, "type": "date", "op": "le", "value": $cutoff }]);
        $never := $pending = 'Only' ? [] : $f(ds.never.value, [$guest, $enabled, $redeemed,
          { "path": "createdDateTime", "type": "date", "op": "le", "value": $cutoff },
          { "path": $successful, "type": "date", "op": "isEmpty", "value": null }]);
        /* Unredeemed since before the window: by the state change date, or the invitation date when there is none. */
        $unredeemed := { "path": "externalUserState", "type": "string", "op": "eq", "value": "PendingAcceptance" };
        $invites := $pending = 'Exclude' ? [] : $append(
          $f(ds.invitations.value, [$guest, $unredeemed, $enabled, { "path": "externalUserStateChangeDateTime", "type": "date", "op": "le", "value": $cutoff }]),
          $f(ds.invitations.value, [$guest, $unredeemed, $enabled,
            { "path": "externalUserStateChangeDateTime", "type": "date", "op": "isEmpty", "value": null },
            { "join": "or", "clauses": [
              { "path": "createdDateTime", "type": "date", "op": "isEmpty", "value": null },
              { "path": "createdDateTime", "type": "date", "op": "le", "value": $cutoff } ] }]));
        /* A sort key can't be empty: accounts created before mid-2018 have no createdDateTime, listed first. */
        $undated := { "path": "createdDateTime", "type": "date", "op": "isEmpty", "value": null };
        $dated := { "path": "createdDateTime", "type": "date", "op": "notEmpty", "value": null };
        $byInvited := function($rows) { ( $d := $f($rows, [$dated]); $append($f($rows, [$undated]), $d^(createdDateTime)) ) };
        /* Accepted, or an older guest without the state ("Other"). */
        $accepted := { "path": "externalUserState", "type": "string", "op": "eq", "value": "Accepted" };
        $other := { "path": "externalUserState", "type": "string", "op": "ne", "value": "Accepted" };
        $state := function($rows, $s) { $append(
          $withFields($f($rows, [$accepted]), { "invitation": "Accepted", "state": $s }),
          $withFields($f($rows, [$other]), { "invitation": "Other", "state": $s })) };
        $rows := $append([], $append($append(
          $withFields($byInvited($invites), { "invitation": "Pending", "state": "pending" }),
          $state($never^(createdDateTime), "never")),
          $state($inactive^(signInActivity.lastSuccessfulSignInDateTime), "inactive")));
        /* Home domains of the first 10,000 listed (a domain is part of the address, so this needs JSONata per row). */
        $sample := $take($f($rows, [{ "path": "mail", "type": "string", "op": "contains", "value": "@" }]), 10000);
        $domains := $sample{ $substringAfter(mail, '@'): $count($) };
        {
          "rows": $rows,
          "total": $count($rows),
          "pending": $count($invites),
          "never": $count($never),
          "domains": $append([], ([$keys($domains).{ "domain": $, "guests": $lookup($domains, $) }]^(>guests))[[0..5]]),
          "domainsSampled": $count($rows) > 10000,
          "allGuests": ds.guestCount,
          "partial": ds.inactive.truncated = true or ds.never.truncated = true or ds.invitations.truncated = true
        }
      ) }

layout:
  - widget: markdown
    span: 12
    when: ${ guests.partial = true }
    text: >-
      **Partial data.** Microsoft has more matching accounts than this report reads (50,000 inactive accounts, 20,000
      guests created before the window, 20,000 unredeemed invitations); the figures, the list and the export cover the
      ones read.
  - widget: kpi
    id: total
    data: guests.total
    label: Inactive guests
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: pending
    data: guests.pending
    label: Invitations never redeemed
    format: number
  - widget: kpi
    id: allGuests
    data: guests.allGuests
    label: Guests in the directory
    format: number
  - widget: markdown
    span: 12
    when: ${ guests.domainsSampled = true }
    text: The home domains chart counts the first 10,000 guests listed.
  - widget: chart
    id: domains
    title: Top home domains (inactive guests)
    type: bar
    span: 3
    rows: 1
    data: guests.domains
    x: domain
    y: guests
    format: number
  - widget: table
    id: guests
    span: 12
    data: guests.rows
    rowKey: id
    selection: multi
    columns:
      - { field: displayName, label: Guest, kind: identity, secondary: mail, sortable: true }
      - { field: companyName, label: Company, hidden: true }
      - { field: invitation, label: Invitation, kind: status, map: { Pending: [warn, Not redeemed], Accepted: [ok, Accepted], Other: [neutral, Other] }, filter: { type: facet, param: pending } }
      - field: state
        label: Why it's listed
        kind: status
        map: { pending: [warn, Invitation not redeemed], never: [warn, No successful sign-in recorded], inactive: [info, Inactive] }
        filter: facet
      - { field: signInActivity.lastSuccessfulSignInDateTime, label: Last successful sign-in, kind: relativeTime, sortable: true }
      - { field: createdDateTime, label: Invited, kind: date, sortable: true }
      - { field: userPrincipalName, label: Sign-in name, hidden: true }
      - { field: id, label: Object id, kind: guid, hidden: true }
    inspect:
      page: identity.user
      params:
        id: ${ row.id }
    rowActions:
      - playbook: identity.disable-user
        label: Block sign-in
        icon: prohibit
        inputs:
          userId: ${ row.id }
    bulkActions:
      - playbook: identity.disable-user
        label: Block sign-in
        icon: prohibit
        forEach:
          inputs:
            userId: ${ row.id }
          concurrency: 5
        maxItems: 500
    empty:
      title: No inactive guests
      body: Every enabled guest signed in within the window.

export:
  formats: [csv, xlsx]
  fileName: inactive-guests-${ params.days }d
  data: guests.rows
  columns: all
