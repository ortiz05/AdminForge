$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.inactive-users
version: 2.2.0
title: Inactive users
summary: >-
  Enabled member accounts with no successful interactive or non-interactive sign-in for the chosen number of days,
  including accounts with no successful sign-in recorded at all (older than the window). Candidates for disabling and
  offboarding.
owner: identity-team
tags: [identity, users, hygiene, report]
nav: { section: reports, label: Inactive users, icon: clock-user, order: 12 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [User.Read.All, AuditLog.Read.All]
  entraRoles: [Reports Reader]
  licences: [signInLogs]

params:
  days:
    type: enum
    label: Inactive for at least
    facet: true
    default: 90
    values:
      - { value: 30, label: 30 days }
      - { value: 90, label: 90 days }
      - { value: 180, label: 180 days }
      - { value: 365, label: 1 year }
  includeDisabled: { type: boolean, label: Include accounts already blocked, default: false, facet: true }
  licensedOnly: { type: boolean, label: Licensed accounts only, default: false, facet: true }

# Built for large tenants (100k members): Graph filters on the last successful sign-in, so only inactive accounts are
# read, and the transforms only filter and count (no per-row mapping: the table reads the Graph fields). A $filter on
# signInActivity can't be combined with any other filter, and it never matches accounts with no successful sign-in
# recorded (no sign-in activity, only failed attempts, or activity from before Microsoft started recording successful
# sign-ins in December 2023) — those come from a second, capped read of members older than the window. The transform
# re-checks both natively. When either read stops at its cap, the page says the list is partial.
datasources:
  inactive:
    source: graph
    request:
      path: /users
      query:
        $select: id,displayName,userPrincipalName,accountEnabled,userType,department,jobTitle,createdDateTime,onPremisesSyncEnabled,assignedLicenses,signInActivity
        $filter: "${ 'signInActivity/lastSuccessfulSignInDateTime le ' & $daysAgo($number(params.days ? params.days : 90)) }"
        $top: 120
    paging: all
    maxItems: 50000
    cache: { ttl: 3600 }
  never:
    source: graph
    request:
      path: /users
      query:
        $select: id,signInActivity,displayName,userPrincipalName,accountEnabled,userType,department,jobTitle,createdDateTime,onPremisesSyncEnabled,assignedLicenses
        $filter: '${ "userType eq ''Member'' and createdDateTime le " & $daysAgo($number(params.days ? params.days : 90)) & (params.includeDisabled = true ? "" : " and accountEnabled eq true") }'
        $top: 120
    paging: all
    maxItems: 3000
    cache: { ttl: 3600 }
  users:
    source: static
    label: Inactive members
    data: {}
    # Filters run natively ($applyAdvanced, $withFields): JSONata costs ~15 µs a row, too much for 50k accounts.
    transform: >-
      ${ (
        $filter := {
          "join": "and",
          "clauses": $append(
            $append(
              [{ "path": "userType", "type": "string", "op": "eq", "value": "Member" }],
              $$.params.includeDisabled = true ? [] : [{ "path": "accountEnabled", "type": "boolean", "op": "eq", "value": true }]
            ),
            $$.params.licensedOnly = true ? [{ "path": "assignedLicenses", "type": "string", "op": "notEmpty", "value": null }] : []
          )
        };
        $successful := "signInActivity.lastSuccessfulSignInDateTime";
        $inactive := $applyAdvanced(ds.inactive.value, { "join": "and", "clauses": [$filter,
          { "path": $successful, "type": "date", "op": "le", "value": $daysAgo($number(params.days ? params.days : 90)) }
        ] });
        $never := $applyAdvanced(ds.never.value, { "join": "and", "clauses": [$filter,
          { "path": $successful, "type": "date", "op": "isEmpty", "value": null }
        ] });
        $rows := $append(
          $withFields($never, { "state": "never" }),
          $withFields($inactive^(signInActivity.lastSuccessfulSignInDateTime), { "state": "inactive" })
        );
        {
          "rows": $rows,
          "total": $count($rows),
          "never": $count($never),
          "licensed": $count($applyAdvanced($rows, { "join": "and", "clauses": [{ "path": "assignedLicenses", "type": "string", "op": "notEmpty", "value": null }] })),
          "partial": ds.inactive.truncated = true or ds.never.truncated = true
        }
      ) }

layout:
  - widget: markdown
    span: 12
    when: ${ users.partial = true }
    text: >-
      **Partial list.** Microsoft has more matching accounts than this report reads (50,000 inactive, 3,000 with no
      successful sign-in recorded); the figures cover what was read. Narrow it with the filters, or ask for a scheduled
      snapshot.
  - widget: kpi
    id: total
    data: users.total
    label: Inactive members
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: never
    data: users.never
    label: No successful sign-in recorded
    format: number
  - widget: kpi
    id: licensed
    data: users.licensed
    label: Still licensed
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: table
    id: users
    span: 12
    data: users.rows
    rowKey: id
    selection: multi
    columns:
      - { field: displayName, label: User, kind: identity, secondary: userPrincipalName, sortable: true }
      - { field: signInActivity.lastSuccessfulSignInDateTime, label: Last sign-in, kind: date, sortable: true }
      - { field: state, label: Activity, kind: status, map: { inactive: [warn, Inactive], never: [crit, No successful sign-in recorded] }, filter: facet, width: 240 }
      - { field: signInActivity.lastSignInDateTime, label: Last interactive sign-in (any result), kind: date, hidden: true }
      - { field: accountEnabled, label: Sign-in, kind: status, map: { "true": [ok, Allowed], "false": [crit, Blocked] } }
      - { field: department, label: Department, filter: facet }
      - { field: onPremisesSyncEnabled, label: Source, kind: enum, map: { "true": Synced from AD, "false": Cloud, "null": Cloud }, filter: facet }
      - { field: jobTitle, label: Job title, hidden: true }
      - { field: createdDateTime, label: Created, kind: date, sortable: true, hidden: true }
      - { field: id, label: Object id, kind: guid, hidden: true }
    inspect:
      page: identity.user
      params:
        id: ${ row.id }
    rowActions:
      - playbook: identity.disable-user
        label: Block sign-in
        icon: prohibit
        inputs:
          userId: ${ row.id }
        when: ${ row.accountEnabled = true }
      - playbook: identity.offboard-user
        label: Offboard
        icon: user-minus
        inputs:
          userId: ${ row.id }
    bulkActions:
      - playbook: identity.disable-user
        label: Block sign-in
        icon: prohibit
        forEach:
          inputs:
            userId: ${ row.id }
          concurrency: 5
        maxItems: 200
        when: ${ $count(rows[accountEnabled = true and onPremisesSyncEnabled != true]) = $count(rows) }
    empty:
      title: No inactive members
      body: Every enabled member signed in within the window.

export:
  formats: [csv, xlsx]
  fileName: inactive-users-${ params.days }d
  data: users.rows
  columns: all
