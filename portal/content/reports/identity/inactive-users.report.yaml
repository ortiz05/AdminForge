$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.inactive-users
version: 1.0.0
title: Inactive users
summary: >-
  Enabled member accounts with no successful interactive or non-interactive sign-in for the chosen number of days,
  including accounts that never signed in (older than the window). Candidates for disabling and offboarding.
owner: identity-team
tags: [identity, users, hygiene, report]
nav: { section: reports, label: Inactive users, icon: user-clock, order: 12 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [User.Read.All, AuditLog.Read.All]
  entraRoles: [Reports Reader]
  licences: [signInLogs]

params:
  days:
    type: enum
    label: Inactive for at least
    facet: true
    default: 90
    values:
      - { value: 30, label: 30 days }
      - { value: 90, label: 90 days }
      - { value: 180, label: 180 days }
      - { value: 365, label: 1 year }
  includeDisabled: { type: boolean, label: Include accounts already blocked, default: false, facet: true }
  licensedOnly: { type: boolean, label: Licensed accounts only, default: false, facet: true }

# A $filter on signInActivity can't be combined with other filters and misses accounts that never signed in, so all
# members are read (page size 120 when signInActivity is selected) and the window is applied here.
datasources:
  users:
    source: graph
    request:
      path: /users
      query:
        $select: id,displayName,userPrincipalName,accountEnabled,userType,department,jobTitle,createdDateTime,onPremisesSyncEnabled,assignedLicenses,signInActivity
        $filter: userType eq 'Member'
        $top: 120
    paging: all
    maxItems: 100000
    cache: { ttl: 3600 }
    transform: >-
      ${ (
        $days := params.days ? $number(params.days) : 90;
        $latest := function($a) {
          $a.lastSuccessfulSignInDateTime ? $a.lastSuccessfulSignInDateTime
          : ([$a.lastSignInDateTime, $a.lastNonInteractiveSignInDateTime][$])^(>$)[0]
        };
        $rows := [value.value[userType = 'Member'].(
          $last := $latest(signInActivity);
          $inactive := $last ? -$daysUntil($last) : null;
          $age := -$daysUntil(createdDateTime);
          {
            "id": id,
            "displayName": displayName,
            "userPrincipalName": userPrincipalName,
            "accountEnabled": accountEnabled,
            "department": department,
            "jobTitle": jobTitle,
            "licensed": $count(assignedLicenses) > 0,
            "source": onPremisesSyncEnabled = true ? 'Synced' : 'Cloud',
            "created": createdDateTime,
            "lastSignIn": $last,
            "daysInactive": $inactive != null ? $inactive : $age,
            "state": $last ? 'inactive' : 'never'
          }
        )];
        $hits := $rows[
          daysInactive >= $days
          and ($$.params.includeDisabled = true or accountEnabled = true)
          and ($$.params.licensedOnly != true or licensed)
        ];
        {
          "rows": [$hits^(>daysInactive)],
          "total": $count($hits),
          "never": $count($hits[state = 'never']),
          "licensed": $count($hits[licensed])
        }
      ) }

layout:
  - widget: kpi
    id: total
    data: users.total
    label: Inactive members
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: never
    data: users.never
    label: Never signed in
    format: number
  - widget: kpi
    id: licensed
    data: users.licensed
    label: Still licensed
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: table
    id: users
    span: 12
    data: users.rows
    rowKey: id
    selection: multi
    columns:
      - { field: displayName, label: User, kind: identity, secondary: userPrincipalName, sortable: true }
      - { field: daysInactive, label: Days inactive, kind: number, filter: range, sortable: true }
      - { field: lastSignIn, label: Last sign-in, kind: date }
      - { field: state, label: Activity, kind: status, map: { inactive: [warn, Inactive], never: [crit, Never signed in] }, filter: facet }
      - { field: accountEnabled, label: Sign-in, kind: status, map: { "true": [ok, Allowed], "false": [neutral, Blocked] } }
      - { field: licensed, label: Licensed, kind: boolean, filter: facet }
      - { field: department, label: Department, filter: facet }
      - { field: source, label: Source, filter: facet }
      - { field: jobTitle, label: Job title, hidden: true }
      - { field: created, label: Created, kind: date, hidden: true }
      - { field: id, label: Object id, kind: guid, hidden: true }
    inspect:
      page: identity.user
      params:
        id: ${ row.id }
    rowActions:
      - playbook: identity.disable-user
        label: Block sign-in
        icon: prohibit
        inputs:
          userId: ${ row.id }
        when: ${ row.accountEnabled = true }
      - playbook: identity.offboard-user
        label: Offboard
        icon: user-minus
        inputs:
          userId: ${ row.id }
    bulkActions:
      - playbook: identity.disable-user
        label: Block sign-in
        icon: prohibit
        forEach:
          inputs:
            userId: ${ row.id }
          concurrency: 5
        maxItems: 200
        when: ${ $count(rows[accountEnabled = true and source = 'Cloud']) = $count(rows) }
    empty:
      title: No inactive members
      body: Every enabled member signed in within the window.

export:
  formats: [csv, xlsx]
  fileName: inactive-users-${ params.days }d
  data: users.rows
  columns: all
