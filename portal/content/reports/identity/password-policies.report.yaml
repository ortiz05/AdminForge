$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.password-policies
version: 2.0.0
title: Password age and exceptions
summary: >-
  Member accounts whose password hasn't changed in a long time, cloud accounts exempted from password expiry, and
  accounts allowed weak passwords — with the tenant's password expiry policy for context. Old, never-rotated passwords
  on service and shared accounts are the usual finding.
owner: identity-team
tags: [identity, users, passwords, security, hygiene, report]
nav: { section: reports, label: Password age and exceptions, icon: password, order: 23 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [User.Read.All, Directory.Read.All]
  entraRoles: [Global Reader]

params:
  days:
    type: enum
    label: Password older than
    facet: true
    default: 365
    values:
      - { value: 180, label: 6 months }
      - { value: 365, label: 1 year }
      - { value: 730, label: 2 years }
  finding:
    type: enum
    label: Finding
    facet: true
    default: Any
    values:
      - { value: Any, label: Any finding }
      - { value: old, label: Old password }
      - { value: neverExpires, label: Never expires (cloud accounts) }
      - { value: weak, label: Weak passwords allowed }
  includeDisabled: { type: boolean, label: Include accounts already blocked, default: false, facet: true }

# Graph can't filter on lastPasswordChangeDateTime or passwordPolicies, so members are read (999 a page) and the
# findings are native filters ($applyAdvanced — JSONata per account is too slow for 100k members): one row per finding,
# the Graph fields as they are. Synced accounts get DisablePasswordExpiration from password hash sync by design (Active
# Directory decides when they expire), so that exception is only reported for cloud accounts.
datasources:
  domains:
    source: graph
    request:
      path: /domains
      query:
        $select: id,isVerified,isDefault,authenticationType,passwordValidityPeriodInDays
    cache: { ttl: 3600 }
    transform: >-
      ${ (
        $managed := [value.value[isVerified = true and authenticationType = 'Managed']];
        $days := $distinct($managed.passwordValidityPeriodInDays[$ != null]);
        {
          "policy": $count($managed) = 0 ? 'Federated domains only (passwords are managed by the identity provider)'
                    : $count($days) = 0 ? 'Not set on any domain (Microsoft default: passwords never expire)'
                    : $count($days[$ < 2147483647]) = 0 ? 'Passwords never expire'
                    : 'Passwords expire after ' & $join($sort($days[$ < 2147483647]).$string($), ' / ') & ' days',
          "expires": $count($days[$ < 2147483647]) > 0
        }
      ) }
  userList:
    source: graph
    request:
      path: /users
      query:
        $filter: userType eq 'Member'
        $select: id,displayName,userPrincipalName,accountEnabled,passwordPolicies,lastPasswordChangeDateTime,onPremisesSyncEnabled,createdDateTime,department,jobTitle
        $top: 999
    paging: all
    maxItems: 60000
    cache: { ttl: 3600 }
    # One row per account, under its most severe finding (weak passwords, then the expiry exemption, then age), so
    # the list stays small; the counts include every finding among the accounts read (past 60,000 the page says the
    # data is partial). Old passwords are sorted oldest first; the table shows the
    # first 10,000 rows ($take — a [[a..b]] range on a variable is quadratic in JSONata) and the export all of them.
    transform: >-
      ${ (
        $days := params.days ? $number(params.days) : 365;
        $base := $$.params.includeDisabled = true ? value.value
          : $applyAdvanced(value.value, { "join": "and", "clauses": [{ "path": "accountEnabled", "type": "boolean", "op": "eq", "value": true }] });
        $find := function($clauses) { $applyAdvanced($base, { "join": "and", "clauses": $clauses }) };
        $isOld := { "path": "lastPasswordChangeDateTime", "type": "date", "op": "le", "value": $daysAgo($days) };
        $isWeak := { "path": "passwordPolicies", "type": "string", "op": "contains", "value": "DisableStrongPassword" };
        $notWeak := { "path": "passwordPolicies", "type": "string", "op": "notContains", "value": "DisableStrongPassword" };
        $exempt := { "path": "passwordPolicies", "type": "string", "op": "contains", "value": "DisablePasswordExpiration" };
        $cloud := { "path": "onPremisesSyncEnabled", "type": "boolean", "op": "ne", "value": true };
        $weak := $find([$isWeak]);
        $never := $find([$exempt, $cloud]);
        $neverOnly := $applyAdvanced($never, { "join": "and", "clauses": [$notWeak] });
        $oldOnly := $find([$isOld, $notWeak, { "join": "or", "clauses": [
          { "path": "passwordPolicies", "type": "string", "op": "notContains", "value": "DisablePasswordExpiration" },
          { "path": "onPremisesSyncEnabled", "type": "boolean", "op": "eq", "value": true }
        ] }]);
        $oldCount := $count($oldOnly) + $count($applyAdvanced($append($weak, $neverOnly), { "join": "and", "clauses": [$isOld] }));
        $f := $exists($$.params.finding) ? $$.params.finding : 'Any';
        $rows := $append($append(
          $f in ['Any', 'weak'] ? $withFields($weak, { "finding": "Weak passwords allowed", "severity": "crit" }) : [],
          $f in ['Any', 'neverExpires'] ? (
            $n := $f = 'Any' ? $neverOnly : $never;
            $append(
              $withFields($applyAdvanced($n, { "join": "and", "clauses": [$isOld] }), { "finding": "Never expires, old password", "severity": "crit" }),
              $withFields($applyAdvanced($n, { "join": "and", "clauses": [{ "join": "or", "clauses": [
                { "path": "lastPasswordChangeDateTime", "type": "date", "op": "isEmpty", "value": null },
                { "path": "lastPasswordChangeDateTime", "type": "date", "op": "gt", "value": $daysAgo($days) }
              ] }] }), { "finding": "Never expires", "severity": "warn" })
            )
          ) : []),
          $f = 'Any' ? $withFields($oldOnly^(lastPasswordChangeDateTime), { "finding": "Old password", "severity": "warn" })
          : $f = 'old' ? ($old := $find([$isOld]); $withFields($old^(lastPasswordChangeDateTime), { "finding": "Old password", "severity": "warn" })) : []
        );
        {
          "rows": $rows,
          "partial": value.truncated = true,
          "old": $oldCount,
          "neverExpires": $count($never),
          "weak": $count($weak)
        }
      ) }
  # What the page shows of userList: its figures and the first 10,000 rows, so the browser gets a small answer. The
  # export reads userList itself — every row of the view (export.maxRows keeps its read at the same cap).
  users:
    source: static
    data: ${ ds.userList }
    cache: { ttl: 3600 }
    transform: >-
      ${ $merge([value, { "rows": $take(value.rows, 10000), "listCapped": $count(value.rows) > 10000 }]) }

layout:
  - widget: kpi
    id: old
    data: users.old
    label: Passwords older than the threshold
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: neverExpires
    data: users.neverExpires
    label: Cloud accounts exempt from expiry
    format: number
    status: "${ value > 0 ? 'info' : 'ok' }"
  - widget: kpi
    id: weak
    data: users.weak
    label: Weak passwords allowed
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: markdown
    id: policy
    span: 12
    text: |
      **Tenant password expiry policy:** ${ domains.policy }. Microsoft recommends no periodic expiry when every
      account has MFA — so focus on old passwords that were never rotated (service and shared accounts), on accounts
      allowed weak passwords, and on per-account exemptions that bypass a policy you do enforce.
  - widget: markdown
    span: 12
    when: ${ users.partial = true }
    text: >-
      **Partial data.** Microsoft has more accounts than this report reads (60,000); the figures, the list and the
      export cover the ones read.
  - widget: markdown
    span: 12
    when: ${ users.listCapped = true }
    text: The list shows the first 10,000 findings (weak passwords and exemptions first, then the oldest passwords); the CSV/XLSX export has all of them.
  - widget: table
    id: users
    span: 12
    data: users.rows
    rowKey: id
    sort: { field: lastPasswordChangeDateTime }
    columns:
      - { field: displayName, label: User, kind: identity, secondary: userPrincipalName, sortable: true }
      - field: severity
        label: Severity
        kind: status
        map: { crit: [crit, High], warn: [warn, Medium] }
        filter: facet
      - { field: finding, label: Finding, filter: facet }
      - { field: lastPasswordChangeDateTime, label: Password last changed, kind: date, filter: date, sortable: true }
      - { field: onPremisesSyncEnabled, label: Synced, kind: status, map: { "true": [info, Synced] }, filter: facet }
      - { field: accountEnabled, label: Sign-in, kind: status, map: { "true": [ok, Allowed], "false": [neutral, Blocked] } }
      - { field: department, label: Department, filter: facet, hidden: true }
      - { field: jobTitle, label: Job title, hidden: true }
      - { field: passwordPolicies, label: Password policies, kind: code, hidden: true }
      - { field: id, label: Object id, kind: guid, hidden: true }
    inspect:
      page: identity.user
      params:
        id: ${ row.id }
    rowActions:
      - playbook: identity.reset-password
        label: Reset password
        icon: password
        inputs:
          userId: ${ row.id }
        when: ${ row.onPremisesSyncEnabled != true and row.accountEnabled = true }
    empty:
      title: No password findings
      body: No enabled member account has an old password, an expiry exemption or weak passwords allowed.

export:
  formats: [csv, xlsx]
  fileName: password-age-${ params.days }d
  data: userList.rows
  maxRows: 60000
  columns: all
