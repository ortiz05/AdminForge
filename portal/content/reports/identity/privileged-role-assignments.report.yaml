$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: identity.privileged-role-assignments
version: 2.1.0
title: Privileged role assignments
summary: >-
  Every active and eligible assignment of a privileged Microsoft Entra role — who, which role, standing or eligible,
  through a group or directly, and until when — with account findings on each holder (synced from Active Directory,
  guest, blocked, licensed daily-use account). The evidence for a privileged access review.
owner: identity-team
tags: [identity, roles, privileged-access, report, review]
nav: { section: reports, label: Privileged role assignments, icon: crown, order: 14 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [RoleManagement.Read.Directory, RoleEligibilitySchedule.Read.Directory, RoleAssignmentSchedule.Read.Directory, Directory.Read.All]
  entraRoles: [Global Reader]

params:
  scope: { type: enum, values: [Privileged, All], default: Privileged, label: Roles, facet: true }
  assignment: { type: enum, values: [Any, Standing, Eligible, Activated], default: Any, label: Assignment, facet: true }
  principal: { type: enum, values: [Any, User, Group, Service principal], default: Any, label: Holder type, facet: true }

# Eligible and activated assignments need Entra ID P2 (PIM). They stay in this batch rather than a separate
# `requires: { licences: [pim] }` datasource so the table and its export remain one complete list for access reviews:
# without P2 those sub-requests fail, `pimAvailable` is false and only standing assignments show. The licenceGate
# widget below explains the missing licence.
datasources:
  assignments:
    source: graphBatch
    requests:
      definitions: { path: /roleManagement/directory/roleDefinitions }
      active: { path: /roleManagement/directory/roleAssignments, query: { $expand: principal } }
      eligible: { path: /roleManagement/directory/roleEligibilityScheduleInstances, query: { $expand: principal } }
      instances: { path: /roleManagement/directory/roleAssignmentScheduleInstances, query: { $select: "id,roleAssignmentOriginId,assignmentType,memberType,startDateTime,endDateTime" } }
    cache: { ttl: 600 }
    # Built natively: roles and schedule instances are keyed lookups joined onto the assignments ($attach), holder
    # kinds, assignment kinds and account findings are row subsets labelled with $withFields. A JSONata block per
    # assignment doesn't fit the budget at a few hundred assignments.
    transform: >-
      ${ (
        $privilegedNames := ['Global Administrator', 'Privileged Role Administrator', 'Privileged Authentication Administrator',
          'Security Administrator', 'Conditional Access Administrator', 'Application Administrator', 'Cloud Application Administrator',
          'Authentication Administrator', 'Authentication Policy Administrator', 'User Administrator', 'Helpdesk Administrator',
          'Password Administrator', 'Hybrid Identity Administrator', 'Intune Administrator', 'Cloud Device Administrator',
          'Exchange Administrator', 'SharePoint Administrator', 'Domain Name Administrator', 'External Identity Provider Administrator',
          'Partner Tier2 Support', 'Security Operator', 'Directory Writers', 'Global Reader', 'Lifecycle Workflows Administrator'];
        $c := function($path, $type, $op, $v) { { "path": $path, "type": $type, "op": $op, "value": $v } };
        $and := function($clauses) { { "join": "and", "clauses": $clauses } };
        $where := function($rows, $clauses) { $applyAdvanced($rows, $and($clauses)) };
        /* Grouping keys must be text: only rows that have one. */
        $having := function($rows, $path) { $where($rows, [$c($path, 'string', 'notEmpty', null)]) };
        $first := function($v) { $type($v) = 'array' ? $v[0] : $v };
        $defs := [value.definitions.value];
        $withId := $having($defs, 'id');
        $withTemplate := $having($defs, 'templateId');
        $defById := $withId{ id: $ };
        $defByTemplate := $withTemplate{ templateId: $ };
        $active := value.active.value;
        $eligibleRaw := value.eligible.value;
        /* Each role (a few dozen) resolved once: its name and whether it is privileged. */
        $roleIds := $distinct($pluck($append($active, $eligibleRaw), 'roleDefinitionId'));
        $roleInfo := $roleIds{ $: (
          $byId := $first($lookup($defById, $));
          $d := $byId ? $byId : $first($lookup($defByTemplate, $));
          { "role": $d.displayName ? $d.displayName : $, "privileged": $d.isPrivileged = true or $d.displayName in $privilegedNames }
        ) };
        /* The schedule instance of each active assignment (by its origin, else by its id); an origin listed twice keeps
           its first instance. */
        $fields := ['assignmentType', 'memberType', 'startDateTime', 'endDateTime'];
        $instances := $withCount($having(value.instances.value, 'roleAssignmentOriginId'), 'roleAssignmentOriginId', 'n');
        $once := $pick($where($instances, [$c('n', 'number', 'eq', 1)]), $append(['roleAssignmentOriginId'], $fields));
        $twice := $pick($where($instances, [$c('n', 'number', 'gt', 1)]), $append(['roleAssignmentOriginId'], $fields));
        $byOrigin := $merge([$once{ roleAssignmentOriginId: $ }, $twice{ roleAssignmentOriginId: $[0] }]);
        $instancesWithId := $pick($having(value.instances.value, 'id'), $append(['id'], $fields));
        $byInstanceId := $instancesWithId{ id: $ };
        $joined := $attach($active, 'id', $byOrigin);
        $matched := $where($joined, [$c('roleAssignmentOriginId', 'string', 'notEmpty', null)]);
        $unmatched := $where($joined, [$c('roleAssignmentOriginId', 'string', 'isEmpty', null)]);
        $withInstance := $append($matched, $attach($unmatched, 'id', $byInstanceId));
        $kinds := $append($append(
          $withFields($where($withInstance, [$c('assignmentType', 'string', 'eq', 'Activated')]), { "assignment": "Activated" }),
          $withFields($where($withInstance, [$c('assignmentType', 'string', 'ne', 'Activated')]), { "assignment": "Standing" })),
          $withFields($eligibleRaw, { "assignment": "Eligible" }));
        $all := $attach($kinds, 'roleDefinitionId', $roleInfo, { "privileged": false });
        /* Holder kinds from each holder's @odata.type (a few distinct values), then each kind's assignments picked
           natively by holder id; a holder Graph no longer returns counts as a user, as before. */
        $holders := $pluck($all, 'principal');
        $idsByType := $holders{ `@odata.type`: id };
        $idsOf := function($type) { $append([], $lookup($idsByType, '#microsoft.graph.' & $type)) };
        $groupIds := $idsOf('group');
        $spIds := $idsOf('servicePrincipal');
        $sp := $where($all, [$c('principalId', 'string', 'in', $spIds)]);
        $groups := $where($all, [$c('principalId', 'string', 'in', $groupIds)]);
        $usersRaw := $where($all, [$c('principalId', 'string', 'notIn', $append($spIds, $groupIds))]);
        /* The holder's second line: a user's UPN, an app's app id — one entry per holder (a holder with several
           assignments takes its first). */
        $userRows := $withCount($usersRaw, 'principalId', 'n');
        $spRows := $withCount($sp, 'principalId', 'n');
        $once := function($rows) { $where($rows, [$c('n', 'number', 'eq', 1)]) };
        $many := function($rows) { $where($rows, [$c('n', 'number', 'gt', 1)]) };
        $u1 := $once($userRows);
        $uN := $many($userRows);
        $s1 := $once($spRows);
        $sN := $many($spRows);
        $detail := $merge([
          $u1{ principalId: { "principalDetail": principal.userPrincipalName } },
          $uN{ principalId: { "principalDetail": $[0].principal.userPrincipalName } },
          $s1{ principalId: { "principalDetail": principal.appId } },
          $sN{ principalId: { "principalDetail": $[0].principal.appId } }
        ]);
        /* Account findings for users: each subset of the four signals labelled with its list. */
        $signals := [
          { "yes": $c('principal.onPremisesSyncEnabled', 'boolean', 'eq', true), "no": $c('principal.onPremisesSyncEnabled', 'boolean', 'ne', true), "finding": "Synced from AD" },
          { "yes": $c('principal.userType', 'string', 'eq', 'Guest'), "no": $c('principal.userType', 'string', 'ne', 'Guest'), "finding": "Guest account" },
          { "yes": $c('principal.accountEnabled', 'boolean', 'eq', false), "no": $c('principal.accountEnabled', 'boolean', 'ne', false), "finding": "Sign-in blocked" },
          { "yes": $c('principal.assignedLicenses.skuId', 'string', 'notEmpty', null), "no": $c('principal.assignedLicenses.skuId', 'string', 'isEmpty', null), "finding": "Licensed (daily-use account?)" }
        ];
        $parts := $reduce($signals, function($parts, $s) {
          [$parts.(
            $p := $;
            $yes := $where($p.rows, [$s.yes]);
            $no := $where($p.rows, [$s.no]);
            [$count($yes) > 0 ? { "rows": $yes, "findings": $append($p.findings, $s.finding) },
             $count($no) > 0 ? { "rows": $no, "findings": $p.findings }]
          )]
        }, [{ "rows": $usersRaw, "findings": [] }]);
        $users := $append([], $parts.$withFields(rows, { "findings": findings }));
        $synced := $where($users, [$c('principal.onPremisesSyncEnabled', 'boolean', 'eq', true)]);
        $cloud := $where($users, [$c('principal.onPremisesSyncEnabled', 'boolean', 'ne', true)]);
        $labelled := $append($append($append(
          $withFields($synced, { "principalType": "User", "source": "Synced" }),
          $withFields($cloud, { "principalType": "User", "source": "Cloud" })),
          $withFields($groups, { "principalType": "Group", "findings": [] })),
          $withFields($sp, { "principalType": "Service principal", "findings": [] }));
        $detailed := $attach($labelled, 'principalId', $detail);
        $rows := $append(
          $withFields($where($detailed, [$c('endDateTime', 'date', 'isEmpty', null)]), { "permanent": true }),
          $withFields($where($detailed, [$c('endDateTime', 'date', 'notEmpty', null)]), { "permanent": false }));
        $p := $$.params;
        $shown := $where($rows, $append($append(
          $p.scope = 'All' ? [] : [$c('privileged', 'boolean', 'eq', true)],
          $p.assignment = 'Any' ? [] : [$c('assignment', 'string', 'eq', $p.assignment)]),
          $p.principal = 'Any' ? [] : [$c('principalType', 'string', 'eq', $p.principal)]));
        $privileged := $where($rows, [$c('privileged', 'boolean', 'eq', true)]);
        {
          /* A sort key must not be empty: holders without a name go last. */
          "rows": $append(
            [$where($shown, [$c('principal.displayName', 'string', 'notEmpty', null)])^(role, assignment, principal.displayName)],
            [$where($shown, [$c('principal.displayName', 'string', 'isEmpty', null)])^(role, assignment)]),
          "standing": $count($where($privileged, [$c('assignment', 'string', 'eq', 'Standing')])),
          "eligible": $count($where($privileged, [$c('assignment', 'string', 'eq', 'Eligible')])),
          "globalAdmins": $count($where($rows, [
            $c('roleDefinitionId', 'string', 'eq', '62e90394-69f5-4237-9190-012177145e10'), $c('assignment', 'string', 'ne', 'Eligible')
          ])),
          "servicePrincipals": $count($where($privileged, [$c('principalType', 'string', 'eq', 'Service principal')])),
          "accountFindings": $count($distinct($pluck($where($privileged, [
            $c('principalType', 'string', 'eq', 'User'), $c('findings', 'string', 'in', ['Synced from AD', 'Guest account', 'Sign-in blocked'])
          ]), 'principalId'))),
          "pimAvailable": $exists(value.eligible.value),
          "truncated": $exists(value.active.`@odata.nextLink`) or $exists(value.eligible.`@odata.nextLink`)
        }
      ) }

layout:
  - widget: kpi
    id: standing
    data: assignments.standing
    label: Standing privileged assignments
    format: number
    status: "${ value > assignments.globalAdmins + 2 ? 'warn' : 'ok' }"
  - widget: kpi
    id: eligible
    data: assignments.eligible
    label: Eligible privileged assignments
    format: number
  - widget: kpi
    id: globalAdmins
    data: assignments.globalAdmins
    label: Global Administrators (active)
    format: number
    status: "${ value < 2 or value > 4 ? 'warn' : 'ok' }"
  - widget: kpi
    id: servicePrincipals
    data: assignments.servicePrincipals
    label: Service principals holding privileged roles
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    id: accountFindings
    data: assignments.accountFindings
    label: Privileged users that are synced, guests or blocked
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: licenceGate
    feature: pim
    title: Eligible assignments and PIM activations need Microsoft Entra ID P2
    body: eligible role assignments and just-in-time activations next to the standing ones
  - widget: markdown
    id: noPim
    span: 12
    when: ${ assignments.pimAvailable = false }
    text: |
      **Eligible assignments couldn't be read**, so only standing (active) assignments are listed. Without Microsoft
      Entra ID P2 there are none; with it, check that you can read PIM (Privileged Role Administrator or Global Reader).
  - widget: markdown
    id: truncated
    span: 12
    when: ${ assignments.truncated = true }
    text: |
      **Partial result.** Graph returned more assignments than fit in one page; export from PIM for the complete set.
  - widget: table
    id: assignments
    span: 12
    data: assignments.rows
    rowKey: id
    columns:
      - { field: role, label: Role, filter: facet, sortable: true }
      - { field: principal.displayName, label: Holder, kind: identity, secondary: principalDetail, sortable: true }
      - { field: principalType, label: Holder type, filter: { type: facet, param: principal } }
      - field: assignment
        label: Assignment
        kind: status
        map: { Standing: [warn, Standing], Activated: [info, Activated (PIM)], Eligible: [ok, Eligible] }
        filter: { type: facet, param: assignment }
      - { field: memberType, label: Via, filter: facet }
      - { field: findings, label: Account findings, kind: tags }
      - { field: source, label: Source, filter: facet, hidden: true }
      - { field: principal.accountEnabled, label: Sign-in, kind: status, map: { "true": [ok, Allowed], "false": [warn, Blocked] }, hidden: true }
      - { field: directoryScopeId, label: Scope, kind: enum, map: { "/": Directory } }
      - { field: startDateTime, label: Start, kind: date }
      - { field: endDateTime, label: End, kind: date }
      - { field: permanent, label: Permanent, kind: boolean, hidden: true }
      - { field: principalId, label: Holder object id, kind: guid, hidden: true }
      - { field: principal.appId, label: App id, kind: guid, hidden: true }
      - { field: roleDefinitionId, label: Role definition id, kind: guid, hidden: true }
    inspect:
      page: identity.role
      params:
        id: ${ row.roleDefinitionId }
    rowActions:
      - { label: Open user, icon: user, href: "/p/identity.user?id=${ $encode(row.principalId) }", when: "${ row.principalType = 'User' }" }
      - { label: Open group, icon: users-three, href: "/p/identity.group?id=${ $encode(row.principalId) }", when: "${ row.principalType = 'Group' }" }
      - { label: Open enterprise app, icon: app-window, href: "/p/identity.enterprise-app?id=${ $encode(row.principalId) }", when: "${ row.principalType = 'Service principal' }" }
    empty:
      title: No privileged assignments
      body: No one holds a privileged directory role (check the Roles filter).

export:
  formats: [csv, xlsx]
  fileName: privileged-role-assignments
  data: assignments.rows
  columns: all
