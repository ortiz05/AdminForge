$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: m365.message-center-actions
version: 2.0.0
title: Message center actions and major changes
summary: >-
  Message center posts that need action by a date (overdue ones and those due within the chosen number of days) and
  major changes Microsoft announced recently — a change-management digest for the service owners.
owner: m365-team
tags: [m365, message-center, change-management, report]
nav: { section: reports, label: Message center actions, icon: megaphone, order: 148 }
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [ServiceMessage.Read.All]
  entraRoles: [Message Center Reader, Global Reader]

params:
  horizon:
    type: enum
    label: Action due within
    facet: true
    default: 60
    values:
      - { value: 30, label: 30 days }
      - { value: 60, label: 60 days }
      - { value: 90, label: 90 days }
      - { value: 180, label: 180 days }
  majorChanges: { type: boolean, label: Include major changes without an action date, default: true, facet: true }
  service:
    type: enum
    label: Service
    facet: true
    default: All
    values:
      - { value: All, label: All services }
      - Microsoft 365 suite
      - Exchange Online
      - Microsoft Teams
      - SharePoint Online
      - OneDrive for Business
      - Microsoft Entra
      - Microsoft Intune
      - Microsoft 365 apps
      - Microsoft Defender XDR
      - Microsoft Purview
      - Microsoft Copilot (Microsoft 365)
      - Power Platform

filters:
  facets: [horizon, majorChanges, service]

savedViews:
  enabled: true
  shared: true
  presets:
    - { name: Due within 30 days, params: { horizon: 30, majorChanges: false } }
    - { name: Teams changes, params: { service: Microsoft Teams } }

# Posts updated in the last 90 days (and any post that's still within its action window); overdue = the act-by date
# passed in the last 30 days. Service filtering is done here: a post can name several services.
datasources:
  messages:
    source: graph
    label: Message center posts
    request:
      path: /admin/serviceAnnouncement/messages
      query:
        $select: id,title,services,category,severity,isMajorChange,actionRequiredByDateTime,startDateTime,endDateTime,lastModifiedDateTime,tags
        $filter: ${ 'lastModifiedDateTime ge ' & $daysAgo(90) & ' or actionRequiredByDateTime ge ' & $daysAgo(30) }
        $orderby: lastModifiedDateTime desc
        $top: 100
    paging: all
    maxItems: 3000
    cache: { ttl: 900 }
    # Posts are sorted into disjoint sets natively ($applyAdvanced on the act-by date): overdue (passed in the last 30
    # days), due within the horizon, and major changes updated in the last 90 days without an act-by date in either.
    # Services per post are counted with one native pass per service.
    transform: >-
      ${ (
        $horizon := params.horizon ? $number(params.horizon) : 60;
        $svc := params.service ? params.service : 'All';
        $f := function($rows, $clauses) { $applyAdvanced($rows, { "join": "and", "clauses": $clauses }) };
        /* Whole days as before: "due within N days" = N whole days left, so before now + N + 1 days. */
        $now := $daysAgo(0);
        $until := $daysAgo(-($horizon + 1));
        $all := $svc = 'All' ? value.value : $f(value.value, [{ "path": "services", "type": "string", "op": "eq", "value": $svc }]);
        $by := "actionRequiredByDateTime";
        $overdue := $f($all, [
          { "path": $by, "type": "date", "op": "lt", "value": $now },
          { "path": $by, "type": "date", "op": "ge", "value": $daysAgo(30) }
        ]);
        $due := $f($all, [
          { "path": $by, "type": "date", "op": "ge", "value": $now },
          { "path": $by, "type": "date", "op": "lt", "value": $until }
        ]);
        $major := params.majorChanges = false ? [] : $f($all, [
          { "path": "isMajorChange", "type": "boolean", "op": "eq", "value": true },
          { "path": "lastModifiedDateTime", "type": "date", "op": "ge", "value": $daysAgo(90) },
          { "join": "or", "clauses": [
            { "path": $by, "type": "date", "op": "isEmpty", "value": null },
            { "path": $by, "type": "date", "op": "ge", "value": $until }
          ] }
        ]);
        $rows := $append($append(
          $withFields($overdue^(actionRequiredByDateTime), { "kind": "overdue" }),
          $withFields($due^(actionRequiredByDateTime), { "kind": "due" })),
          $withFields($major^(>lastModifiedDateTime), { "kind": "major" }));
        $services := $distinct($rows.services);
        {
          "rows": $rows,
          "overdue": $count($overdue),
          "dueSoon": $count($f($due, [{ "path": $by, "type": "date", "op": "lt", "value": $daysAgo(-15) }])),
          "due": $count($due),
          "major": $count($f($rows, [{ "path": "isMajorChange", "type": "boolean", "op": "eq", "value": true }])),
          "byService": $append([], ([$services.( $s := $; { "service": $s, "posts": $count($f($rows, [{ "path": "services", "type": "string", "op": "eq", "value": $s }])) } )]^(>posts))[[0..7]]),
          "partial": value.truncated = true
        }
      ) }

layout:
  - widget: markdown
    span: 12
    when: ${ messages.partial = true }
    text: >-
      **Partial data.** Message center has more matching posts than this report reads (3,000); the figures and the
      list cover the newest ones.
  - widget: kpi
    data: messages.overdue
    label: Act-by date passed
    format: number
    status: "${ value > 0 ? 'crit' : 'ok' }"
  - widget: kpi
    data: messages.dueSoon
    label: Due within 14 days
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
  - widget: kpi
    data: messages.due
    label: Due in the window
    format: number
  - widget: kpi
    data: messages.major
    label: Major changes
    format: number
    status: "${ value > 0 ? 'info' : 'ok' }"
  - widget: chart
    id: byService
    title: Posts by service
    type: bar
    span: 12
    rows: 2
    data: messages.byService
    x: service
    y: posts
    format: number
  - widget: table
    id: messages
    span: 12
    data: messages.rows
    rowKey: id
    columns:
      - { field: title, label: Post, kind: identity, secondary: id }
      - field: kind
        label: Needs
        kind: status
        map: { overdue: [crit, Act-by date passed], due: [warn, Action by date], major: [info, Major change] }
        filter: facet
      - { field: actionRequiredByDateTime, label: Act by, kind: relativeTime, sortable: true }
      - { field: services, label: Services, kind: tags }
      - field: category
        label: Category
        kind: status
        map:
          preventOrFixIssue: [warn, Prevent or fix issues]
          planForChange: [info, Plan for change]
          stayInformed: [neutral, Stay informed]
        filter: facet
      - { field: isMajorChange, label: Major change, kind: boolean, filter: facet }
      - { field: lastModifiedDateTime, label: Last update, kind: relativeTime, sortable: true }
      - field: severity
        label: Severity
        kind: status
        map: { normal: [neutral, Normal], high: [warn, High], critical: [crit, Critical] }
        hidden: true
      - { field: startDateTime, label: Published, kind: date, hidden: true }
      - { field: tags, label: Tags, kind: tags, hidden: true }
    inspect:
      page: m365.message
      params:
        id: ${ row.id }
    rowActions:
      - label: Open in Microsoft 365 admin center
        icon: arrow-square-out
        href: "https://admin.microsoft.com/Adminportal/Home#/MessageCenter/:/messages/${ $encode(row.id) }"
    empty:
      title: Nothing needs action
      body: No post has an act-by date in the window and no major change was announced recently.

export:
  formats: [csv, xlsx]
  fileName: message-center-actions-${ params.horizon }d
  data: messages.rows
  columns: all
