$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: m365.onedrive-usage
version: 2.1.0
title: OneDrive storage and inactive accounts
summary: >-
  OneDrive accounts with no activity for the chosen number of days (often people who left — hand the files over before
  the OneDrive is deleted) and accounts close to their storage limit, from the OneDrive usage report.
owner: m365-team
tags: [m365, onedrive, sharepoint, storage, offboarding, usage, report]
nav: { section: reports, label: OneDrive storage and activity, icon: cloud, order: 144 }
# Reports catalogue area (the key keeps its m365. prefix so schedules and links keep working).
area: sharepoint
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Reports.Read.All]
  entraRoles: [Reports Reader, SharePoint Administrator, Global Reader]
  licences: [sharepoint]

params:
  view:
    type: enum
    label: Show
    facet: true
    default: attention
    values:
      - { value: attention, label: Inactive or near the storage limit }
      - { value: inactive, label: Inactive accounts }
      - { value: storage, label: Near the storage limit }
      - { value: all, label: All accounts }
  days:
    type: enum
    label: Inactive after
    facet: true
    default: 90
    values:
      - { value: 30, label: 30 days }
      - { value: 90, label: 90 days }
      - { value: 180, label: 180 days }
      - { value: 365, label: 1 year }
  threshold:
    type: number
    label: Near the storage limit at
    unit: "%"
    default: 90
    min: 50
    max: 100
    integer: true
    facet: true

filters:
  facets: [view, days, threshold]

savedViews:
  enabled: true
  shared: true
  presets:
    - { name: Inactive for 90 days, params: { view: inactive, days: 90 } }
    - { name: Near the storage limit, params: { view: storage } }

# File counts cover the last 30 days; storage is current; the last activity date is the account's latest activity
# whenever it was. With concealed report names the URL and owner are hashes.
datasources:
  # Tenant-wide storage from Microsoft's daily summary (one small report), not a sum over every account.
  storage:
    source: graph
    label: OneDrive storage (usage report)
    request:
      beta: true
      path: /reports/getOneDriveUsageStorage(period='D7')
      query: { $format: application/json }
    cache: { ttl: 3600 }
    transform: >-
      ${ { "used": (value.value^(>reportDate))[0].storageUsedInBytes } }
  accountList:
    source: graph
    label: OneDrive usage account detail (usage report)
    request:
      beta: true
      path: /reports/getOneDriveUsageAccountDetail(period='D30')
      query: { $format: application/json }
    paging: all
    maxItems: 40000
    cache: { ttl: 3600 }
    # Native filters ($applyAdvanced) on disjoint sets — near the storage limit, inactive, the rest — and the report's
    # own rows (no per-account JSONata: it doesn't fit the budget beyond ~1,500 accounts). The list keeps the first
    # 10,000 (near the limit first, largest first); the export has every account of the view.
    transform: >-
      ${ (
        $limit := (params.threshold ? $number(params.threshold) : 90) / 100;
        $cutoff := $daysAgo(params.days ? $number(params.days) : 90);
        $view := params.view ? params.view : 'attention';
        $f := function($rows, $clauses) { $applyAdvanced($rows, { "join": "and", "clauses": $clauses }) };
        $all := $f(value.value, [{ "path": "isDeleted", "type": "boolean", "op": "ne", "value": true }]);
        $near := $f($all, [
          { "path": "storageAllocatedInBytes", "type": "number", "op": "gt", "value": 0 },
          { "path": "storageUsedInBytes", "type": "number", "op": "ge", "field": "storageAllocatedInBytes", "times": $limit }
        ]);
        $notNear := { "join": "or", "clauses": [
          { "path": "storageAllocatedInBytes", "type": "number", "op": "isEmpty", "value": null },
          { "path": "storageUsedInBytes", "type": "number", "op": "lt", "field": "storageAllocatedInBytes", "times": $limit }
        ] };
        $inactive := $f($all, [{ "join": "or", "clauses": [
          { "path": "lastActivityDate", "type": "date", "op": "isEmpty", "value": null },
          { "path": "lastActivityDate", "type": "date", "op": "lt", "value": $cutoff }
        ] }]);
        $nearRows := $withFields($near^(>storageUsedInBytes), { "state": "storage" });
        $noDate := { "path": "lastActivityDate", "type": "date", "op": "isEmpty", "value": null };
        $hasDate := { "path": "lastActivityDate", "type": "date", "op": "notEmpty", "value": null };
        /* Never active first, then the longest idle (a sort key can't be empty; sorting a variable runs natively). */
        $oldestFirst := function($rows) { ( $dated := $f($rows, [$hasDate]); $append($f($rows, [$noDate]), $dated^(lastActivityDate)) ) };
        $rows := $view = 'storage' ? $nearRows
          : $view = 'inactive' ? $withFields($oldestFirst($inactive), { "state": "inactive" })
          : $view = 'all' ? $append($nearRows, $withFields($f($all, [$notNear]), { "state": "listed" }))
          : $append($nearRows, $withFields($oldestFirst($f($inactive, [$notNear])), { "state": "inactive" }));
        {
          "rows": $rows,
          "partial": value.truncated = true,
          "inactive": $count($inactive),
          "inactiveStorage": $sum([0, $inactive.storageUsedInBytes]),
          "nearLimit": $count($near),
          "accounts": $count($all),
          "concealed": $exists($all[0].siteUrl) and $substring($all[0].siteUrl, 0, 8) != 'https://'
        }
      ) }
  # What the page shows of accountList: its figures and the first 10,000 rows, so the browser gets a small answer. The
  # export reads accountList itself — every row of the view (export.maxRows keeps its read at the same cap).
  accounts:
    source: static
    data: ${ ds.accountList }
    cache: { ttl: 3600 }
    transform: >-
      ${ $merge([value, { "rows": $take(value.rows, 10000), "listCapped": $count(value.rows) > 10000 }]) }

layout:
  - widget: markdown
    span: 12
    when: ${ accounts.concealed = true }
    text: |
      **User names are concealed in usage reports.** Owners and URLs show as hashes. A Global Administrator can turn off
      *Display concealed user, group, and site names in all reports* in the Microsoft 365 admin center → **Settings →
      Org settings → Services → Reports**.
  - widget: kpi
    data: accounts.inactive
    label: Inactive OneDrives
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
    href: /p/m365.onedrive-usage?view=inactive
  - widget: kpi
    data: accounts.inactiveStorage
    label: Storage held by inactive OneDrives
    format: bytes
  - widget: kpi
    data: accounts.nearLimit
    label: Near the storage limit
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
    href: /p/m365.onedrive-usage?view=storage
  - widget: kpi
    data: storage.used
    label: OneDrive storage used
    format: bytes
  - widget: markdown
    span: 12
    when: ${ accounts.partial = true }
    text: >-
      **Partial data.** Microsoft has more OneDrive accounts than this report reads (40,000); the figures, the list and the
      export cover the ones read.
  - widget: markdown
    span: 12
    when: ${ accounts.listCapped = true }
    text: The list shows the first 10,000 OneDrives (near the storage limit first, largest first); the CSV/XLSX export has all of them.
  - widget: markdown
    span: 12
    text: |
      **Leavers' OneDrives.** When an account is deleted, its OneDrive is kept for the retention period set in the
      SharePoint admin center (30 days by default) and then deleted. Hand the files to the person's manager first with
      [Give someone access to a OneDrive](/playbooks/m365.grant-onedrive-access) (Offboard on the person's profile can
      do it too), and take that access away with
      [Remove someone's access to a OneDrive](/playbooks/m365.remove-onedrive-access) once the handover is done.
  - widget: table
    id: accounts
    span: 12
    data: accounts.rows
    rowKey: siteId
    columns:
      - { field: ownerDisplayName, label: Owner, kind: identity, secondary: ownerPrincipalName, sortable: true }
      - field: state
        label: Status
        kind: status
        map: { storage: [warn, Near the storage limit], inactive: [info, Inactive], listed: [neutral, Below the limit] }
        filter: facet
      - { field: lastActivityDate, label: Last activity, kind: date, filter: date, sortable: true }
      - { field: storageUsedInBytes, label: Storage, kind: bytes, align: end, sortable: true }
      - { field: fileCount, label: Files, kind: number, align: end }
      - { field: activeFileCount, label: Active files (30 days), kind: number, align: end, hidden: true }
      - { field: storageAllocatedInBytes, label: Storage limit, kind: bytes, align: end }
      - { field: siteUrl, label: OneDrive URL, kind: link, hidden: true }
      - { field: reportRefreshDate, label: Report date, kind: date, hidden: true }
    rowActions:
      - label: Open OneDrive
        icon: arrow-square-out
        href: ${ row.siteUrl }
        when: ${ $substring(row.siteUrl, 0, 8) = 'https://' }
      - label: Find the owner
        icon: magnifying-glass
        href: /p/identity.users?q=${ $encode(row.ownerPrincipalName) }
        when: ${ $contains(row.ownerPrincipalName, '@') }
    empty:
      title: No OneDrive needs attention
      body: Every OneDrive had activity within the window and is below the storage threshold.

export:
  formats: [csv, xlsx]
  fileName: onedrive-usage-${ params.view }
  data: accountList.rows
  maxRows: 40000
  columns: all
