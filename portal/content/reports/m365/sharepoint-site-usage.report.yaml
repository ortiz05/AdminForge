$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: m365.sharepoint-site-usage
version: 2.1.0
title: SharePoint site storage and inactive sites
summary: >-
  SharePoint sites with no activity for the chosen number of days (archive or delete candidates) and sites close to
  their storage limit, with storage used, files, page views and owner — from the SharePoint site usage report.
  OneDrive accounts are on the OneDrive storage and activity report.
owner: m365-team
tags: [m365, sharepoint, storage, governance, usage, report]
nav: { section: reports, label: SharePoint site storage and activity, icon: hard-drives, order: 142 }
# Reports catalogue area (the key keeps its m365. prefix so schedules and links keep working).
area: sharepoint
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Reports.Read.All]
  entraRoles: [Reports Reader, SharePoint Administrator, Global Reader]
  licences: [sharepoint]

params:
  view:
    type: enum
    label: Show
    facet: true
    default: attention
    values:
      - { value: attention, label: Inactive or near the storage limit }
      - { value: inactive, label: Inactive sites }
      - { value: storage, label: Near the storage limit }
      - { value: all, label: All sites }
  days:
    type: enum
    label: Inactive after
    facet: true
    default: 180
    values:
      - { value: 90, label: 90 days }
      - { value: 180, label: 180 days }
      - { value: 365, label: 1 year }
  threshold:
    type: number
    label: Near the storage limit at
    unit: "%"
    default: 90
    min: 50
    max: 100
    integer: true
    facet: true

filters:
  facets: [view, days, threshold]

savedViews:
  enabled: true
  shared: true
  presets:
    - { name: No activity for a year, params: { view: inactive, days: 365 } }
    - { name: Near the storage limit, params: { view: storage } }

# Counts (files, active files, page views) cover the last 30 days; storage is current; the last activity date is the
# site's latest activity whenever it was. With concealed report names the URL and owner are hashes.
datasources:
  # Tenant-wide storage from Microsoft's daily summary (one small report), not a sum over every site.
  storage:
    source: graph
    label: SharePoint storage (usage report)
    request:
      beta: true
      path: /reports/getSharePointSiteUsageStorage(period='D7')
      query: { $format: application/json }
    cache: { ttl: 3600 }
    transform: >-
      ${ { "used": (value.value^(>reportDate))[0].storageUsedInBytes } }
  siteList:
    source: graph
    label: SharePoint site usage detail (usage report)
    request:
      beta: true
      path: /reports/getSharePointSiteUsageDetail(period='D30')
      query: { $format: application/json }
    paging: all
    maxItems: 40000
    cache: { ttl: 3600 }
    # Native filters ($applyAdvanced) on disjoint sets — near the storage limit, inactive, the rest — and the report's
    # own rows (no per-site JSONata: it doesn't fit the budget beyond ~1,500 sites). The list keeps the first 10,000
    # (near the limit first, largest first); the export has every site of the view.
    transform: >-
      ${ (
        $limit := (params.threshold ? $number(params.threshold) : 90) / 100;
        $cutoff := $daysAgo(params.days ? $number(params.days) : 180);
        $view := params.view ? params.view : 'attention';
        $f := function($rows, $clauses) { $applyAdvanced($rows, { "join": "and", "clauses": $clauses }) };
        $all := $f(value.value, [{ "path": "isDeleted", "type": "boolean", "op": "ne", "value": true }]);
        $near := $f($all, [
          { "path": "storageAllocatedInBytes", "type": "number", "op": "gt", "value": 0 },
          { "path": "storageUsedInBytes", "type": "number", "op": "ge", "field": "storageAllocatedInBytes", "times": $limit }
        ]);
        $notNear := { "join": "or", "clauses": [
          { "path": "storageAllocatedInBytes", "type": "number", "op": "isEmpty", "value": null },
          { "path": "storageUsedInBytes", "type": "number", "op": "lt", "field": "storageAllocatedInBytes", "times": $limit }
        ] };
        $inactive := $f($all, [{ "join": "or", "clauses": [
          { "path": "lastActivityDate", "type": "date", "op": "isEmpty", "value": null },
          { "path": "lastActivityDate", "type": "date", "op": "lt", "value": $cutoff }
        ] }]);
        $nearSorted := $near^(>storageUsedInBytes);
        $nearRows := $withFields($nearSorted, { "state": "storage" });
        $noDate := { "path": "lastActivityDate", "type": "date", "op": "isEmpty", "value": null };
        $hasDate := { "path": "lastActivityDate", "type": "date", "op": "notEmpty", "value": null };
        /* Never active first, then the longest idle (a sort key can't be empty; sorting a variable runs natively). */
        $oldestFirst := function($rows) { ( $dated := $f($rows, [$hasDate]); $append($f($rows, [$noDate]), $dated^(lastActivityDate)) ) };
        $rows := $view = 'storage' ? $nearRows
          : $view = 'inactive' ? $withFields($oldestFirst($inactive), { "state": "inactive" })
          : $view = 'all' ? $append($nearRows, $withFields($f($all, [$notNear]), { "state": "listed" }))
          : $append($nearRows, $withFields($oldestFirst($f($inactive, [$notNear])), { "state": "inactive" }));
        {
          "rows": $rows,
          "partial": value.truncated = true,
          "inactive": $count($inactive),
          "inactiveStorage": $sum([0, $inactive.storageUsedInBytes]),
          "nearLimit": $count($near),
          "sites": $count($all),
          "largest": [$take($nearSorted, 10).{ "site": $substring(siteUrl ? siteUrl : '', 0, 8) = 'https://' ? $replace(siteUrl, /^https:\/\/[^\/]+/, '') : siteId, "storage": storageUsedInBytes }],
          "concealed": $exists($all[0].siteUrl) and $substring($all[0].siteUrl, 0, 8) != 'https://'
        }
      ) }
  # What the page shows of siteList: its figures and the first 10,000 rows, so the browser gets a small answer. The
  # export reads siteList itself — every row of the view (export.maxRows keeps its read at the same cap).
  sites:
    source: static
    data: ${ ds.siteList }
    cache: { ttl: 3600 }
    transform: >-
      ${ $merge([value, { "rows": $take(value.rows, 10000), "listCapped": $count(value.rows) > 10000 }]) }

layout:
  - widget: markdown
    span: 12
    when: ${ sites.concealed = true }
    text: |
      **Site names are concealed in usage reports.** URLs and owners show as hashes. A Global Administrator can turn off
      *Display concealed user, group, and site names in all reports* in the Microsoft 365 admin center → **Settings →
      Org settings → Services → Reports**.
  - widget: markdown
    span: 12
    when: ${ sites.partial = true }
    text: >-
      **Partial data.** Microsoft has more sites than this report reads (40,000); the figures, the list and the
      export cover the ones read.
  - widget: markdown
    span: 12
    when: ${ sites.listCapped = true }
    text: The list shows the first 10,000 sites (near the storage limit first, largest first); the CSV/XLSX export has all of them.
  - widget: kpi
    data: sites.inactive
    label: Inactive sites
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
    href: /p/m365.sharepoint-site-usage?view=inactive
  - widget: kpi
    data: sites.inactiveStorage
    label: Storage held by inactive sites
    format: bytes
  - widget: kpi
    data: sites.nearLimit
    label: Near the storage limit
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
    href: /p/m365.sharepoint-site-usage?view=storage
  - widget: kpi
    data: storage.used
    label: Storage used by all sites
    format: bytes
  - widget: chart
    id: largest
    title: Largest sites near the storage limit
    type: bar
    span: 12
    rows: 2
    data: sites.largest
    x: site
    y: storage
    format: bytes
  - widget: table
    id: sites
    span: 12
    data: sites.rows
    rowKey: siteId
    columns:
      - { field: siteUrl, label: Site, kind: identity, secondary: siteId, sortable: true }
      - { field: ownerDisplayName, label: Owner, filter: text }
      - field: state
        label: Status
        kind: status
        map: { storage: [warn, Near the storage limit], inactive: [info, Inactive], listed: [neutral, Below the limit] }
        filter: facet
      - { field: lastActivityDate, label: Last activity, kind: date, filter: date, sortable: true }
      - { field: storageUsedInBytes, label: Storage, kind: bytes, align: end, sortable: true }
      - { field: rootWebTemplate, label: Template, filter: facet }
      - { field: fileCount, label: Files, kind: number, align: end }
      - { field: activeFileCount, label: Active files (30 days), kind: number, align: end, hidden: true }
      - { field: pageViewCount, label: Page views (30 days), kind: number, align: end, hidden: true }
      - { field: ownerPrincipalName, label: Owner sign-in name, hidden: true }
      - { field: externalSharing, label: External sharing, kind: boolean, hidden: true }
      - { field: storageAllocatedInBytes, label: Storage limit, kind: bytes, align: end }
      - { field: siteId, label: Site id, kind: guid, hidden: true }
      - { field: reportRefreshDate, label: Report date, kind: date, hidden: true }
    rowActions:
      - label: Open site
        icon: arrow-square-out
        href: ${ row.siteUrl }
        when: ${ $substring(row.siteUrl, 0, 8) = 'https://' }
    empty:
      title: No site needs attention
      body: Every site had activity within the window and is below the storage threshold.

export:
  formats: [csv, xlsx]
  fileName: sharepoint-site-usage-${ params.view }
  data: siteList.rows
  maxRows: 40000
  columns: all
