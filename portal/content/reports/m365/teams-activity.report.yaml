$schema: ../../../packages/schemas/generated/report.schema.json
kind: report
id: m365.teams-activity
version: 2.1.0
title: Inactive, public and guest-active teams
summary: >-
  Teams with no activity for the chosen number of days (archive or delete candidates), public teams anyone in the
  organization can join, and teams where guests or external users were active — from the Microsoft Teams team activity
  report (last 90 days).
owner: m365-team
tags: [m365, teams, governance, guests, usage, report]
nav: { section: reports, label: Team activity and exposure, icon: microsoft-teams-logo, order: 132 }
# Reports catalogue area (the key keeps its m365. prefix so schedules and links keep working).
area: teams
requires:
  portalRoles: [Portal.Reader]
  scopes:
    graph: [Reports.Read.All]
  entraRoles: [Reports Reader, Teams Administrator, Global Reader]
  licences: [teams]

params:
  view:
    type: enum
    label: Show
    facet: true
    default: inactive
    values:
      - { value: inactive, label: Inactive teams }
      - { value: public, label: Public teams }
      - { value: guests, label: Teams with active guests or external users }
      - { value: all, label: All teams }
  days:
    type: enum
    label: Inactive after
    facet: true
    default: 90
    values:
      - { value: 30, label: 30 days }
      - { value: 60, label: 60 days }
      - { value: 90, label: 90 days }
      - { value: 180, label: 180 days }

filters:
  facets: [view, days]

savedViews:
  enabled: true
  shared: true
  presets:
    - { name: Inactive for 90 days, params: { view: inactive, days: 90 } }
    - { name: Public teams, params: { view: public } }
    - { name: Guests or external users active, params: { view: guests } }

# Activity counts cover the last 90 days; the last activity date is the team's latest activity whenever it was. Guest
# and external counts are people who were active in the team, not every guest member. Concealed report names show as
# hashes (no team name), and the team can't be opened from here.
datasources:
  teams:
    source: graph
    label: Teams team activity detail (usage report)
    request:
      beta: true
      path: /reports/getTeamsTeamActivityDetail(period='D90')
      query: { $format: application/json }
    paging: all
    maxItems: 8000
    cache: { ttl: 3600 }
    # Native filters ($applyAdvanced) and the report's own rows. Activity figures sit in `details` (beta) or on the row
    # itself; the listed rows are flattened (so exports have them as columns), which costs JSONata time per team — the
    # read stops at 8,000 teams and the page says the data is partial beyond that.
    transform: >-
      ${ (
        $cutoff := $daysAgo(params.days ? $number(params.days) : 90);
        $view := params.view ? params.view : 'inactive';
        $f := function($rows, $clauses) { $applyAdvanced($rows, { "join": "and", "clauses": $clauses }) };
        $all := $f(value.value, [{ "path": "isDeleted", "type": "boolean", "op": "ne", "value": true }]);
        $idle := { "join": "or", "clauses": [
          { "path": "lastActivityDate", "type": "date", "op": "isEmpty", "value": null },
          { "path": "lastActivityDate", "type": "date", "op": "lt", "value": $cutoff }
        ] };
        $busy := { "path": "lastActivityDate", "type": "date", "op": "ge", "value": $cutoff };
        $public := { "path": "teamType", "type": "string", "op": "eq", "value": "Public" };
        $exposed := { "join": "or", "clauses": [
          { "path": "details.guests", "type": "number", "op": "gt", "value": 0 },
          { "path": "guests", "type": "number", "op": "gt", "value": 0 },
          { "path": "details.activeExternalUsers", "type": "number", "op": "gt", "value": 0 },
          { "path": "activeExternalUsers", "type": "number", "op": "gt", "value": 0 }
        ] };
        $inactive := $f($all, [$idle]);
        $flat := function($rows, $activity) { [$rows.$merge([$, $exists(details) ? details[0] : {}, { "activity": $activity }])] };
        $label := function($rows) { $append($flat($f($rows, [$idle]), 'inactive'), $flat($f($rows, [$busy]), 'active')) };
        $rows := $view = 'all' ? $label($all)
          : $view = 'public' ? $label($f($all, [$public]))
          : $view = 'guests' ? $label($f($all, [$exposed]))
          : $flat($inactive, 'inactive');
        {
          "rows": $rows,
          "inactive": $count($inactive),
          "public": $count($f($all, [$public])),
          "inactivePublic": $count($f($inactive, [$public])),
          "guests": $count($f($all, [$exposed])),
          "total": $count($all),
          "concealed": $exists($all[0]) and $not($contains($all[0].teamId ? $all[0].teamId : '', /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/))
        }
      ) }

layout:
  - widget: markdown
    span: 12
    when: ${ teams.concealed = true }
    text: |
      **Team names are concealed in usage reports**, or some teams can't be matched to a Microsoft 365 group. A Global
      Administrator can turn off *Display concealed user, group, and site names in all reports* in the Microsoft 365
      admin center → **Settings → Org settings → Services → Reports**.
  - widget: kpi
    data: teams.inactive
    label: Inactive teams
    format: number
    status: "${ value > 0 ? 'warn' : 'ok' }"
    href: /p/m365.teams-activity?view=inactive
  - widget: kpi
    data: teams.public
    label: Public teams
    format: number
    status: "${ teams.inactivePublic > 0 ? 'warn' : 'ok' }"
    href: /p/m365.teams-activity?view=public
  - widget: kpi
    data: teams.guests
    label: Teams with active guests or external users
    format: number
    status: "${ value > 0 ? 'info' : 'ok' }"
    href: /p/m365.teams-activity?view=guests
  - widget: kpi
    data: teams.total
    label: Teams
    format: number
  - widget: markdown
    span: 12
    text: |
      **What to do.** Ask the owners of inactive teams whether they still need them, then archive (read-only, keeps
      the content) or delete the team — a Microsoft 365 group expiration policy can automate this. Make public teams
      private unless everyone in the organization should be able to join, and review guest access on teams that hold
      sensitive content. Teams without any owner are on the Teams without owners report.
  - widget: table
    id: teams
    span: 12
    data: teams.rows
    rowKey: teamId
    columns:
      - { field: teamName, label: Team, kind: identity, secondary: teamId, sortable: true }
      - field: activity
        label: Activity
        kind: status
        map: { inactive: [warn, Inactive], active: [ok, Active] }
        filter: facet
      - { field: lastActivityDate, label: Last activity, kind: date, filter: date, sortable: true }
      - field: teamType
        label: Privacy
        kind: status
        map: { Public: [warn, Public], Private: [neutral, Private], Shared: [info, Shared] }
        filter: facet
      - { field: activeUsers, label: Active users, kind: number, align: end, sortable: true }
      - { field: guests, label: Active guests, kind: number, align: end, sortable: true }
      - { field: activeExternalUsers, label: Active external users, kind: number, align: end }
      - { field: channelMessages, label: Channel messages, kind: number, align: end, hidden: true }
      - { field: meetingsOrganized, label: Meetings, kind: number, align: end, hidden: true }
      - { field: activeChannels, label: Active channels, kind: number, align: end, hidden: true }
      - { field: reportRefreshDate, label: Report date, kind: date, hidden: true }
    rowActions:
      - label: Open team
        icon: microsoft-teams-logo
        href: /p/m365.team?id=${ $encode(row.teamId) }
        when: ${ $contains(row.teamId, /^[0-9a-fA-F-]{36}$/) }
      - label: Open in Teams admin center
        icon: arrow-square-out
        href: "https://admin.teams.microsoft.com/teams/manage/${ $encode(row.teamId) }"
        when: ${ $contains(row.teamId, /^[0-9a-fA-F-]{36}$/) }
    empty:
      title: No teams in this view
      body: No team matches. Usage data appears 24–48 hours after activity; new teams show up after their first report.

export:
  formats: [csv, xlsx]
  fileName: teams-activity-${ params.view }
  data: teams.rows
  columns: all
