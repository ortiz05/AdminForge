$schema: ../../../packages/schemas/generated/runbook.schema.json
kind: runbook
id: identity.compromised-account
version: 2.1.0
title: Compromised account response
summary: >-
  Guided response to a suspected account compromise: confirm and scope the signal, contain (block sign-in, revoke
  sessions, mark the user compromised, remove attacker-registered MFA methods), investigate changes, consents and
  roles, recover access safely and close out. Replaces security.compromised-account-response. Sign-in logs need Entra
  ID P1 and Identity Protection steps need P2; without them those steps are skipped.
owner: identity-team
tags: [identity, security, incident, runbook]
nav: { section: security, label: Compromised account response, icon: first-aid-kit, order: 90 }
risk: high
mode: write
requires:
  portalRoles: [Portal.Operator]
  scopes:
    graph:
      - User.Read.All
      - AuditLog.Read.All
      - Directory.Read.All
      - RoleManagement.Read.Directory
      - IdentityRiskyUser.ReadWrite.All
      - IdentityRiskEvent.Read.All
      - UserAuthenticationMethod.Read.All
      - User.EnableDisableAccount.All
      - User.RevokeSessions.All
      - UserAuthenticationMethod.ReadWrite.All
      - SecurityIncident.ReadWrite.All
      - Policy.Read.All
  entraRoles: [User Administrator, Authentication Administrator, Security Operator]
confirm:
  type: click
  message: >-
    ${ 'Start incident response for ' & steps.account.output.userPrincipalName & ' (' & inputs.ticket
       & ')? Containment blocks the user from every app until you restore access in step 4. Tell their manager first.' }
approval:
  required: false
timeout: PT4H

inputs:
  userId: { type: string, format: guid, label: Affected user, picker: user }
  ticket: { type: string, label: Incident or ticket number, minLength: 3, placeholder: INC-1234 }
  reason:
    type: string
    label: What was observed
    minLength: 10
    multiline: true
    placeholder: Password spray, then a successful sign-in from an unfamiliar country
    description: Recorded on every action this runbook takes.
  defenderIncidentId:
    type: string
    label: Defender incident id
    required: false
    pattern: "^[0-9]+$"
    description: Optional — containment is recorded as a comment on this Microsoft Defender XDR incident.
  confirmCompromised:
    type: boolean
    label: Mark the user compromised in Identity Protection
    description: Risk-based Conditional Access then treats any further sign-in as high risk (needs Entra ID P2; skipped without it).
    default: true
  removeMethods:
    type: boolean
    label: Remove all registered MFA methods
    description: Recommended — an attacker who had the password may have registered their own Authenticator or passkey.
    default: true
  tapForRecovery: { type: boolean, label: Issue a one-time Temporary Access Pass for recovery, default: true }

sections:
  - id: triage
    title: 1. Confirm and scope
    body: |
      Confirm the report before acting: who reported it, what they saw (MFA prompts they didn't start, mail sent in
      their name, sign-ins from unfamiliar places). The steps below pull the last 7 days of sign-ins and the user's
      Identity Protection risk and detections so you can judge the scope.
    steps:
      - id: account
        type: graph
        mode: read
        describe: Look up the account
        request:
          method: GET
          path: /users/${ $encode($guid(inputs.userId)) }
          query:
            $select: id,displayName,userPrincipalName,mail,accountEnabled,userType,onPremisesSyncEnabled,lastPasswordChangeDateTime

      - id: signIns
        type: graph
        mode: read
        describe: Sign-ins in the last 7 days (needs Entra ID P1)
        onError: continue
        request:
          method: GET
          path: /auditLogs/signIns
          query:
            $filter: ${ 'userId eq ' & $odata($guid(inputs.userId)) & ' and createdDateTime ge ' & $daysAgo(7) }
            $top: 200

      # A filter, not GET riskyUsers/{id}: a user who was never at risk isn't in riskyUsers, and Graph answers the
      # direct read with a 404 that has no readable message. The filter returns an empty list instead.
      - id: riskLookup
        type: graph
        mode: read
        describe: Identity Protection risk (needs Entra ID P2)
        onError: continue
        request:
          method: GET
          path: /identityProtection/riskyUsers
          query:
            $filter: ${ 'id eq ' & $odata($guid(inputs.userId)) }

      # Only this user's row: an answer (or a fixture) holding other users must not stand in for theirs.
      - id: risk
        type: transform
        expression: ${ ($id := $lowercase(inputs.userId); steps.riskLookup.output.value[$lowercase(id) = $id][0]) }

      - id: detections
        type: graph
        mode: read
        describe: Risk detections in the last 30 days (needs Entra ID P2)
        onError: continue
        request:
          method: GET
          path: /identityProtection/riskDetections
          query:
            $top: 50
            $filter: ${ 'userId eq ' & $odata($guid(inputs.userId)) & ' and detectedDateTime ge ' & $daysAgo(30) }

      - id: scope
        type: transform
        expression: >-
          ${ (
            $s := [steps.signIns.output.value];
            {
              "signIns": $count($s),
              "failures": $count($s[status.errorCode != 0]),
              "countries": [$distinct($s.location.countryOrRegion)],
              "ips": [$distinct($s.ipAddress)],
              "apps": [$distinct($s.appDisplayName)],
              "riskLevel": steps.risk.output.riskLevel ? steps.risk.output.riskLevel : $exists(steps.riskLookup.output) ? 'none' : 'unknown',
              "riskState": steps.risk.output.riskState ? steps.risk.output.riskState : $exists(steps.riskLookup.output) ? 'none' : 'unknown',
              "identityProtection": $exists(steps.detections.output.value),
              "detections": $count(steps.detections.output.value),
              "detectionTypes": [$distinct(steps.detections.output.value.riskEventType)]
            }
          ) }

      - id: confirmed
        type: manual
        instructions: |
          **${ steps.account.output.userPrincipalName }** — ${ steps.scope.output.signIns } sign-ins in 7 days
          (${ steps.scope.output.failures } failed) from ${ $join(steps.scope.output.countries, ', ') }.
          Identity Protection risk: **${ steps.scope.output.riskLevel }** (${ steps.scope.output.riskState }),
          ${ steps.scope.output.detections } detection(s) in 30 days ${ $count(steps.scope.output.detectionTypes) > 0 ? '(' & $join(steps.scope.output.detectionTypes, ', ') & ')' : '' }.

          Review the [sign-in logs](/p/identity.sign-ins?user=${ $encode(steps.account.output.userPrincipalName) }), the
          [risky user page](/p/security.risky-user?id=${ $encode(inputs.userId) }) and the
          [user profile](/p/identity.user?id=${ $encode(inputs.userId) }) for unfamiliar locations, IP addresses and apps,
          then confirm before containing.
        checklist:
          - The activity was not the user's (confirmed out of band — phone or in person, never by email)
          - No approved travel, VPN or new device explains it
          - Ticket ${ inputs.ticket } is open, the security team is informed and the user's manager knows the account will be blocked
          - If the user is an administrator, escalated to the security lead
          - "${ steps.account.output.onPremisesSyncEnabled = true ? 'The account is synced from on-premises AD — also disable it there, or the next sync re-enables sign-in' : 'The account is cloud-only' }"

  - id: contain
    title: 2. Contain
    body: |
      Block sign-in and revoke every session so stolen tokens stop working, mark the user compromised so risk-based
      Conditional Access treats further sign-ins as high risk, and remove MFA methods the attacker may have registered.
      Apps that support Continuous Access Evaluation react within minutes.
    steps:
      - id: disable
        type: playbook
        mode: write
        describe: ${ 'Block sign-in and revoke sessions for ' & steps.account.output.userPrincipalName }
        when: ${ steps.account.output.accountEnabled = true }
        ref: identity.disable-user
        inputs:
          userId: ${ $guid(inputs.userId) }
          reason: ${ 'Compromised account response ' & inputs.ticket & ' — ' & inputs.reason }

      - id: revokeOnly
        type: playbook
        mode: write
        describe: Revoke sessions (sign-in was already blocked)
        when: ${ steps.account.output.accountEnabled = false }
        ref: identity.revoke-sessions
        inputs:
          userId: ${ $guid(inputs.userId) }
          reason: ${ 'Compromised account response ' & inputs.ticket & ' — ' & inputs.reason }

      - id: confirmCompromised
        type: playbook
        mode: write
        describe: ${ 'Confirm ' & steps.account.output.userPrincipalName & ' compromised in Identity Protection' }
        when: >-
          ${ inputs.confirmCompromised = true and steps.scope.output.identityProtection = true
             and $not(steps.risk.output.riskState = 'confirmedCompromised') }
        onError: continue
        ref: security.confirm-risky-user-compromised
        inputs:
          userId: ${ $guid(inputs.userId) }
          reason: ${ 'Compromised account response ' & inputs.ticket & ' — ' & inputs.reason }

      - id: removeMethods
        type: playbook
        mode: write
        describe: Remove all registered MFA methods, including passkeys
        when: ${ inputs.removeMethods = true }
        onError: continue
        ref: identity.reset-mfa
        inputs:
          userId: ${ $guid(inputs.userId) }
          includePhishingResistant: true
          revokeSessions: false
          reason: ${ 'Compromised account response ' & inputs.ticket & ' — ' & inputs.reason }

      - id: incidentNote
        type: playbook
        mode: write
        describe: ${ 'Record containment on Defender incident ' & inputs.defenderIncidentId }
        when: ${ $exists(inputs.defenderIncidentId) and inputs.defenderIncidentId != '' }
        onError: continue
        ref: security.update-incident
        inputs:
          incidentId: ${ inputs.defenderIncidentId }
          status: inProgress
          comment: >-
            ${ $substring('Containment done in AdminForge by ' & user.upn & ' (' & inputs.ticket & '): sign-in blocked, sessions revoked'
               & (inputs.removeMethods = true ? (steps.removeMethods.status in ['succeeded', 'planned'] ? ', MFA methods removed' : ', MFA methods could not be removed') : '')
               & '. ' & inputs.reason, 0, 1000) }

      - id: containOther
        type: manual
        instructions: |
          Contain in the other workloads too:

          ${ steps.account.output.mail
             ? '- **Mail.** Open the [inbox rule audit for this mailbox](/p/m365.inbox-rules?mailbox=' & $encode(steps.account.output.mail)
               & ") and use *Turn rule off* or *Remove rule* on every rule the user didn't create — above all rules that forward"
               & ' outside the organization or hide mail. If the [mailbox](/p/m365.mailbox?mailbox=' & $encode(steps.account.output.mail)
               & ') forwards, [clear the forwarding](/playbooks/m365.clear-mailbox-forwarding?mailbox=' & $encode(steps.account.output.mail)
               & "), and check its Access tab for delegates the user doesn't know."
             : '- **Mail.** The account has no mailbox address; nothing to check in Exchange Online.' }
        checklist:
          - "Exchange Online: inbox rules the user didn't create turned off or removed, mailbox forwarding cleared, delegates checked"
          - "Defender: isolate any device the attacker used"
          - "Synced account: also disable it and reset the password in on-premises AD"

  - id: investigate
    title: 3. Investigate
    body: |
      Find what the attacker did while the account was open: directory changes made by the account, apps it consented
      to, roles it holds and which authentication methods remain registered. Start from the first risky sign-in.
    steps:
      - id: changesBy
        type: graph
        mode: read
        describe: Directory changes made by the account (30 days)
        request:
          method: GET
          path: /auditLogs/directoryAudits
          query:
            $filter: ${ 'initiatedBy/user/id eq ' & $odata($guid(inputs.userId)) }
            $top: 200

      - id: consents
        type: graph
        mode: read
        describe: Delegated permissions the user consented to
        request:
          method: GET
          path: /users/${ $encode($guid(inputs.userId)) }/oauth2PermissionGrants

      # Same request as the user page's Roles tab.
      - id: roles
        type: graph
        mode: read
        describe: Directory roles the account holds
        request:
          method: GET
          path: /roleManagement/directory/roleAssignments
          query:
            $filter: ${ 'principalId eq ' & $odata($guid(inputs.userId)) }
            $expand: roleDefinition

      - id: methodsNow
        type: graph
        mode: read
        describe: Authentication methods still registered
        request:
          method: GET
          path: /users/${ $encode($guid(inputs.userId)) }/authentication/methods

      - id: findings
        type: transform
        expression: >-
          ${ {
            "changes": [steps.changesBy.output.value.(activityDateTime & ' ' & activityDisplayName)],
            "consents": [steps.consents.output.value[consentType = 'Principal'].{ "clientId": clientId, "scope": scope }],
            "roles": [steps.roles.output.value.roleDefinition.displayName],
            "methodsLeft": $count(steps.methodsNow.output.value[`@odata.type` != '#microsoft.graph.passwordAuthenticationMethod'])
          } }

      - id: review
        type: manual
        instructions: |
          - **${ $count(steps.findings.output.changes) }** directory changes by this account — revert anything unexpected
            (new app credentials, role or group changes, new users).
          - **${ $count(steps.findings.output.consents) }** user consent grants${ $count(steps.findings.output.consents) > 0 ? ' (apps ' & $join(steps.findings.output.consents.clientId, ', ') & ')' : '' } —
            open each app from [Enterprise apps](/p/identity.enterprise-apps), use *Revoke grant* on its Permissions tab
            for apps the user doesn't recognise, and *Disable sign-in* for malicious ones.
          - **${ $count(steps.findings.output.roles) }** directory roles held${ $count(steps.findings.output.roles) > 0 ? ' (' & $join(steps.findings.output.roles, ', ') & ')' : '' } —
            review them on the [user's Roles tab](/p/identity.user?id=${ $encode(inputs.userId) }&tab=roles) and remove
            standing assignments that are not needed.
          - **${ steps.findings.output.methodsLeft }** MFA methods still registered.
          - Use [Alerts](/p/security.alerts) and [Incidents](/p/security.incidents) for correlated activity.
        checklist:
          - Malicious directory changes reverted
          - Suspicious app consents revoked and the apps disabled
          - Inbox rules, forwarding (step 2) and recently sent mail reviewed (internal phishing warned about)
          - Files shared externally or downloaded in bulk reviewed (OneDrive / SharePoint)
          - Devices registered or joined by the user reviewed
          - Azure and Entra role assignments of the user reviewed
        inputs:
          notes: { type: string, label: Findings, multiline: true, required: false }

  - id: recover
    title: 4. Recover access
    body: |
      Only after the investigation: verify the user's identity out of band (call back on a known number), make sure
      their device is clean, then reset the password and give them a one-time Temporary Access Pass to register MFA
      again. Resetting the password as an admin also remediates the user's risk in Identity Protection.
    steps:
      - id: verified
        type: manual
        instructions: Verify the user's identity through a channel the attacker can't control before restoring access.
        checklist:
          - Identity verified by call-back to a number on file (or in person)
          - The user's device is clean or has been reimaged

      - id: password
        type: playbook
        mode: write
        describe: Reset the password (attacker knows the old one)
        when: ${ $not(steps.account.output.onPremisesSyncEnabled = true) }
        ref: identity.reset-password
        inputs:
          userId: ${ $guid(inputs.userId) }
          revokeSessions: true
          reason: ${ 'Compromised account recovery ' & inputs.ticket }

      - id: tap
        type: playbook
        mode: write
        describe: Issue a one-time Temporary Access Pass to register MFA again
        when: ${ inputs.tapForRecovery = true }
        onError: continue
        ref: identity.issue-tap
        inputs:
          userId: ${ $guid(inputs.userId) }
          lifetimeMinutes: 60
          isUsableOnce: true
          replaceExisting: true
          reason: ${ 'Compromised account recovery ' & inputs.ticket }

      - id: enable
        type: playbook
        mode: write
        describe: Allow sign-in again
        when: ${ $not(steps.account.output.onPremisesSyncEnabled = true) }
        ref: identity.enable-user
        inputs:
          userId: ${ $guid(inputs.userId) }
          reason: ${ 'Compromised account recovery ' & inputs.ticket }

  - id: close
    title: 5. Close
    body: |
      Record what happened and keep watching the account for two weeks. Resolve the Defender incident as
      **True positive / Compromised account** with a short summary of what was found.
    steps:
      - id: closeout
        type: manual
        instructions: Close the incident.
        checklist:
          - The user re-registered MFA (phishing-resistant if possible)
          - User risk shows remediated or dismissed in Identity Protection
          - Ticket and Defender incident updated with timeline, findings and actions, then resolved
          - Account added to heightened monitoring for 14 days
          - Root cause recorded (phishing, password reuse, token theft…); detection or policy gaps raised with security engineering

outputs:
  # Says what happened: removing the MFA methods may fail (onError: continue) without stopping the response.
  summary: >-
    ${ 'Incident ' & inputs.ticket & ' for ' & steps.account.output.userPrincipalName & ': contained'
       & (inputs.removeMethods = true
          ? (steps.removeMethods.status in ['succeeded', 'planned'] ? ', MFA methods removed' : ', MFA methods could not be removed (see the run)')
          : '')
       & ', investigated and access restored.' }

tests:
  - name: stops when the account doesn't exist
    inputs: { userId: 00000000-0000-4000-8000-000000000199, ticket: INC-1001, reason: Reported phishing click by a contractor }
    errors:
      account: { status: 404, code: Request_ResourceNotFound }
    expect: { status: failed, failedStep: account }
  - name: walks through containment and recovery with Identity Protection and a Defender incident
    inputs: { userId: 00000000-0000-4000-8000-000000000102, ticket: INC-1002, reason: Password spray then a successful sign-in from NL, defenderIncidentId: "4224" }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      account: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member, onPremisesSyncEnabled: null }
      signIns:
        value:
          - { id: s1, createdDateTime: "2026-01-14T03:12:00Z", appDisplayName: Office 365 Exchange Online, ipAddress: 203.0.113.50, status: { errorCode: 0 }, location: { countryOrRegion: NL } }
          - { id: s2, createdDateTime: "2026-01-14T03:10:00Z", appDisplayName: Office 365 Exchange Online, ipAddress: 203.0.113.50, status: { errorCode: 50126 }, location: { countryOrRegion: NL } }
      riskLookup: { value: [{ id: 00000000-0000-4000-8000-000000000102, riskLevel: high, riskState: atRisk }] }
      detections: { value: [{ id: d1, riskEventType: passwordSpray }, { id: d2, riskEventType: unfamiliarFeatures }] }
      changesBy: { value: [{ activityDateTime: "2026-01-14T03:20:00Z", activityDisplayName: Consent to application }] }
      consents: { value: [{ clientId: 00000000-0000-4000-8000-000000000404, consentType: Principal, scope: Mail.Read offline_access }] }
      roles: { value: [] }
      methodsNow: { value: [{ "@odata.type": "#microsoft.graph.passwordAuthenticationMethod", id: 28c10230-6103-485e-b985-444c60001490 }] }
      disable: { summary: Sign-in disabled and sessions revoked for m.chen@example.com }
      confirmCompromised: { summary: m.chen@example.com confirmed compromised }
      removeMethods: { summary: Removed 2 MFA method(s) }
      incidentNote: { summary: Incident 4224 updated }
      password: { summary: Password reset }
      tap: { summary: Temporary Access Pass issued }
      enable: { summary: Sign-in enabled for m.chen@example.com }
    expect:
      status: succeeded
      steps: { disable: succeeded, revokeOnly: skipped, confirmCompromised: succeeded, removeMethods: succeeded, incidentNote: succeeded, password: succeeded, tap: succeeded, enable: succeeded, confirmed: skipped }
      outputs: { summary: "Incident INC-1002 for m.chen@example.com: contained, MFA methods removed, investigated and access restored." }
  - name: says when the MFA methods could not be removed
    inputs: { userId: 00000000-0000-4000-8000-000000000102, ticket: INC-1002, reason: Password spray then a successful sign-in from NL, defenderIncidentId: "4224" }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      account: { id: 00000000-0000-4000-8000-000000000102, userPrincipalName: m.chen@example.com, accountEnabled: true, userType: Member, onPremisesSyncEnabled: null }
      signIns:
        value:
          - { id: s1, createdDateTime: "2026-01-14T03:12:00Z", appDisplayName: Office 365 Exchange Online, ipAddress: 203.0.113.50, status: { errorCode: 0 }, location: { countryOrRegion: NL } }
          - { id: s2, createdDateTime: "2026-01-14T03:10:00Z", appDisplayName: Office 365 Exchange Online, ipAddress: 203.0.113.50, status: { errorCode: 50126 }, location: { countryOrRegion: NL } }
      riskLookup: { value: [{ id: 00000000-0000-4000-8000-000000000102, riskLevel: high, riskState: atRisk }] }
      detections: { value: [{ id: d1, riskEventType: passwordSpray }, { id: d2, riskEventType: unfamiliarFeatures }] }
      changesBy: { value: [{ activityDateTime: "2026-01-14T03:20:00Z", activityDisplayName: Consent to application }] }
      consents: { value: [{ clientId: 00000000-0000-4000-8000-000000000404, consentType: Principal, scope: Mail.Read offline_access }] }
      roles: { value: [] }
      methodsNow: { value: [{ "@odata.type": "#microsoft.graph.passwordAuthenticationMethod", id: 28c10230-6103-485e-b985-444c60001490 }] }
      disable: { summary: Sign-in disabled and sessions revoked for m.chen@example.com }
      confirmCompromised: { summary: m.chen@example.com confirmed compromised }
      incidentNote: { summary: Incident 4224 updated }
      password: { summary: Password reset }
      tap: { summary: Temporary Access Pass issued }
      enable: { summary: Sign-in enabled for m.chen@example.com }
    errors:
      removeMethods: { status: 403, code: Authorization_RequestDenied }
    expect:
      status: succeeded
      steps: { disable: succeeded, revokeOnly: skipped, confirmCompromised: succeeded, removeMethods: failed, incidentNote: succeeded, password: succeeded, tap: succeeded, enable: succeeded, confirmed: skipped }
      outputs: { summary: "Incident INC-1002 for m.chen@example.com: contained, MFA methods could not be removed (see the run), investigated and access restored." }
  - name: skips Identity Protection, the incident note and cloud recovery for a disabled synced account without P2
    inputs: { userId: 30000000-0000-4000-8000-000000000005, ticket: INC-1003, reason: SOC confirmed token theft from a managed device, removeMethods: false, tapForRecovery: false }
    user: { oid: 00000000-0000-4000-8000-0000000000a1, upn: avery@example.com }
    mocks:
      account: { id: 30000000-0000-4000-8000-000000000005, userPrincipalName: eli.obrien@example.com, accountEnabled: false, userType: Member, onPremisesSyncEnabled: true }
      changesBy: { value: [] }
      consents: { value: [] }
      roles: { value: [{ id: ra-30, roleDefinitionId: 729827e3-9c14-49f7-bb1b-9608f156bbb8, roleDefinition: { displayName: Helpdesk Administrator } }] }
      methodsNow: { value: [] }
    errors:
      signIns: { status: 403, code: Authentication_RequestFromNonPremiumTenantOrB2CTenant }
      riskLookup: { status: 403, code: Forbidden }
      detections: { status: 403, code: Forbidden }
    expect:
      status: succeeded
      plan: [revokeOnly]
      steps: { disable: skipped, confirmCompromised: skipped, removeMethods: skipped, incidentNote: skipped, password: skipped, tap: skipped, enable: skipped }
      outputs: { summary: "Incident INC-1003 for eli.obrien@example.com: contained, investigated and access restored." }
