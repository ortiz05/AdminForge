$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: sweep.m365-service-health
version: 1.0.0
title: "Hourly probe: Microsoft 365 service health API"
summary: Runs the probes.m365-service-health probe every hour (minute 27, staggered across the sweep) as the automation identity.
owner: portal-admins
tags: [synthetic, probe-sweep]
cron: "27 * * * *"
timezone: UTC
enabled: true
identity: automation
job:
  kind: probe
  ref: probes.m365-service-health
timeoutSeconds: 120
overlap: skip
requires:
  scopes:
    graph: [ServiceHealth.Read.All]
