$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.adminforge-group-changes-daily
version: 1.0.0
title: Daily AdminForge role group changes report
summary: >-
  Every day at 04:50 UTC, writes member, owner and app role changes to AdminForge's own SG-AdminForge-* role groups over the last 7 days as CSV and emails it. The rolling week means a missed run loses nothing; every change should match an approved access request.
owner: identity-team
tags: [identity, audit, security, adminforge, report]
cron: "50 4 * * *"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: identity.adminforge-group-changes
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { days: 7 }
  delivery:
    - type: file
      format: csv
      path: identity/adminforge-group-changes/{date}.csv
      retain: 92
    # Sent only when AF_MAIL_SENDER and AF_REPORT_RECIPIENTS are configured (and the automation identity has Mail.Send);
    # otherwise the run notes the delivery as not configured and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: csv
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 900
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [AuditLog.Read.All, Group.Read.All]
