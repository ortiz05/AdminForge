$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.app-credential-expiry-daily
version: 1.0.1
title: Daily app credential expiry report
summary: >-
  Every day at 06:00 UTC, writes the app credential expiry report for the next 30 days (including credentials that
  have already expired) as CSV, keeping a month of history. The weekly schedule keeps the long-term XLSX archive. The
  file covers up to 400 app registrations (credentials ending within 7 days first); the report says when there are more.
owner: identity-team
tags: [identity, apps, credentials, report]
cron: "0 6 * * *"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: identity.app-credential-expiry
  params: { days: 30, includeExpired: true }
  delivery:
    - type: file
      format: csv
      path: app-credential-expiry/daily/{date}.csv
      retain: 31
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 900
overlap: skip
requires:
  scopes:
    graph: [Application.Read.All]
