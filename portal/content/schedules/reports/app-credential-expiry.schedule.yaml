$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.app-credential-expiry
version: 1.0.1
title: Weekly app credential expiry report
summary: >-
  Every Monday at 07:00 UTC, writes the 30-day app credential expiry report (including expired credentials) as XLSX —
  up to 400 app registrations, credentials ending within 7 days first.
owner: identity-team
tags: [identity, apps, report]
cron: "0 7 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: identity.app-credential-expiry
  params: { days: 30, includeExpired: true }
  delivery:
    - type: file
      format: xlsx
      path: app-credential-expiry/{date}.xlsx
      retain: 12
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 900
overlap: skip
requires:
  # Application permission held by the automation identity (ADR-011).
  scopes:
    graph: [Application.Read.All]
