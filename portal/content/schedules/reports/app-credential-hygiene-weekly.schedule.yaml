$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.app-credential-hygiene-weekly
version: 1.0.0
title: Weekly app credential hygiene report
summary: >-
  Every Monday at 05:20 UTC, writes live app credentials that break policy (secrets valid longer than a year, several active secrets, credentials on enterprise apps) as XLSX and emails it, keeping six months of history.
owner: identity-team
tags: [identity, apps, credentials, report]
cron: "20 5 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: identity.app-credential-hygiene
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { maxDays: 365, finding: Any }
  delivery:
    - type: file
      format: xlsx
      path: identity/app-credential-hygiene/{date}.xlsx
      retain: 26
    # Sent only when AF_MAIL_SENDER and AF_REPORT_RECIPIENTS are configured (and the automation identity has Mail.Send);
    # otherwise the run notes the delivery as not configured and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [Application.Read.All]
