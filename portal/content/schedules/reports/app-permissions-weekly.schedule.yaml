$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.app-permissions-weekly
version: 1.0.0
title: Weekly application permissions report
summary: >-
  Every Monday at 05:05 UTC, writes the critical and high-impact application permissions held by service principals (Microsoft Graph, Exchange Online, SharePoint Online) as XLSX and emails it, keeping six months of history for the app permission review.
owner: identity-team
tags: [identity, apps, permissions, report]
cron: "5 5 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: identity.app-permissions
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { tier: high, holder: Any }
  delivery:
    - type: file
      format: xlsx
      path: identity/app-permissions/{date}.xlsx
      retain: 26
    # Sent only when AF_MAIL_SENDER and AF_REPORT_RECIPIENTS are configured (and the automation identity has Mail.Send);
    # otherwise the run notes the delivery as not configured and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [Application.Read.All, Directory.Read.All]
