$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.apps-without-owners-weekly
version: 1.0.0
title: Weekly apps without owners report
summary: >-
  Every Monday at 05:15 UTC, writes app registrations and third-party enterprise apps that have no owner as XLSX and emails it, keeping six months of history.
owner: identity-team
tags: [identity, apps, governance, report]
cron: "15 5 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: identity.apps-without-owners
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { kind: Both }
  delivery:
    - type: file
      format: xlsx
      path: identity/apps-without-owners/{date}.xlsx
      retain: 26
    # Sent only when AF_MAIL_SENDER and AF_REPORT_RECIPIENTS are configured (and the automation identity has Mail.Send);
    # otherwise the run notes the delivery as not configured and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [Application.Read.All]
