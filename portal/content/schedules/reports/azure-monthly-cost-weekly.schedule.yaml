$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.azure-monthly-cost-weekly
version: 1.1.0
title: Weekly Azure cost by subscription
summary: >-
  Every Monday at 06:45 UTC, writes Azure cost month to date and last month for every subscription under the
  management group (AF_COST_MANAGEMENT_GROUP_ID, default the tenant root group) with a projection for the month, as
  XLSX. Email goes to the finance team (AF_FINANCE_RECIPIENTS) when it and AF_MAIL_SENDER are configured.
owner: finance-ops
tags: [azure, billing, cost, finops, report]
cron: "45 6 * * 1"
timezone: UTC
# Off until the automation identity holds Cost Management Reader on the cost scope and AF_FINANCE_RECIPIENTS is set
# (docs/operations.md › Azure Billing); then turn it on under Automation › Schedules.
enabled: false
identity: automation
job:
  kind: report
  ref: azure.monthly-cost
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { scope: managementGroup, groupBy: SubscriptionName }
  delivery:
    - type: file
      format: xlsx
      path: azure/monthly-cost/{date}.xlsx
      retain: 26
    - type: email
      to: ["${ env.AF_FINANCE_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Cost Management Reader on the management group for the automation identity (docs/operations.md › Azure Billing).
  azureRoles: [Cost Management Reader]
