$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.databases-public-access-weekly
version: 1.0.0
title: Weekly databases reachable from public networks report
summary: >-
  Every Monday at 05:10 UTC, writes SQL, PostgreSQL, MySQL, Cosmos DB and Redis resources with public network access
  on, with their network rules, authentication and TLS, as XLSX.
  Email goes to AF_REPORT_RECIPIENTS when it and AF_MAIL_SENDER are configured.
owner: azure-team
tags: [azure, databases, security, report]
cron: "10 5 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: azure.databases-public-access
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { publicOnly: true, service: any }
  delivery:
    - type: file
      format: xlsx
      path: azure/databases-public-access/{date}.xlsx
      retain: 26
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  azureRoles: [Reader]
