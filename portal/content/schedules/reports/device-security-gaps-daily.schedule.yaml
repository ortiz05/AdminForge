$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.device-security-gaps-daily
version: 1.0.0
title: Daily unencrypted and jailbroken devices report
summary: >-
  Every weekday at 06:35 UTC, writes Intune devices that aren't encrypted or are jailbroken or rooted as XLSX and
  emails it to the report recipients.
owner: endpoint-team
tags: [endpoint, intune, encryption, security, report]
cron: "35 6 * * 1-5"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: endpoint.device-security-gaps
  params: { issue: any, os: Any, ownership: Any }
  delivery:
    - type: file
      format: xlsx
      path: endpoint/device-security-gaps/{date}.xlsx
      retain: 60
    # Recipients are configuration (never content); without AF_MAIL_SENDER / AF_REPORT_RECIPIENTS the run notes
    # "not configured" and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [DeviceManagementManagedDevices.Read.All]
  licences: [intune]
