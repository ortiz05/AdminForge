$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.directory-changes-daily
version: 1.0.0
title: Daily high-impact directory changes report
summary: >-
  Every day at 04:45 UTC, writes the previous 24 hours of high-impact Entra directory changes (roles and PIM, consents and app permissions, app credentials and owners, Conditional Access, domains and federation) as CSV and emails it, keeping three months of history beyond Entra's own 7 or 30 days.
owner: identity-team
tags: [identity, audit, security, report]
cron: "45 4 * * *"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: identity.directory-changes
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { days: 1, area: All, result: Any }
  delivery:
    - type: file
      format: csv
      path: identity/directory-changes/{date}.csv
      retain: 92
    # Sent only when AF_MAIL_SENDER and AF_REPORT_RECIPIENTS are configured (and the automation identity has Mail.Send);
    # otherwise the run notes the delivery as not configured and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: csv
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 900
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [AuditLog.Read.All, Directory.Read.All]
