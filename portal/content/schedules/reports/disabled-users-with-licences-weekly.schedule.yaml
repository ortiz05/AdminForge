$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.disabled-users-with-licences-weekly
version: 1.0.0
title: Weekly licensed disabled accounts report
summary: >-
  Every Monday at 05:35 UTC, writes blocked accounts that still hold licences (one row per licence, direct or group-assigned) as XLSX and emails it, keeping six months of history for licence reclamation.
owner: identity-team
tags: [identity, licensing, cost, report]
cron: "35 5 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: identity.disabled-users-with-licences
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { assignment: Any }
  delivery:
    - type: file
      format: xlsx
      path: identity/disabled-users-with-licences/{date}.xlsx
      retain: 26
    # Sent only when AF_MAIL_SENDER and AF_REPORT_RECIPIENTS are configured (and the automation identity has Mail.Send);
    # otherwise the run notes the delivery as not configured and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [User.Read.All, Organization.Read.All]
