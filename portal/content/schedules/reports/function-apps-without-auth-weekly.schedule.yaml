$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.function-apps-without-auth-weekly
version: 1.1.0
title: Weekly Function Apps without authentication report
summary: >-
  Retired — AdminForge doesn't manage Azure Functions at this time. Every Monday at 06:10 UTC, writes Function Apps that have no App Service authentication (Easy Auth) enabled, as XLSX.
# Retired 2026-10-17: Azure Functions aren't managed in AdminForge at this time. To bring it back, set
# status: active and enabled: true and bump the version.
status: retired
owner: azure-team
tags: [azure, functions, security, report]
cron: "10 6 * * 1"
timezone: UTC
enabled: false
identity: automation
job:
  kind: report
  ref: azure.function-apps-without-auth
  delivery:
    - type: file
      format: xlsx
      path: azure/function-apps-without-auth/{date}.xlsx
      retain: 26
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  azureRoles: [Reader]
