$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.groups-without-owners-weekly
version: 1.0.0
title: Weekly ownerless and empty groups report
summary: >-
  Every Monday at 05:30 UTC, writes cloud groups that have no owner or no members as XLSX and emails it, keeping six months of history for group clean-up.
owner: identity-team
tags: [identity, groups, governance, report]
cron: "30 5 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: identity.groups-without-owners
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { issue: either, includeSynced: false }
  delivery:
    - type: file
      format: xlsx
      path: identity/groups-without-owners/{date}.xlsx
      retain: 26
    # Sent only when AF_MAIL_SENDER and AF_REPORT_RECIPIENTS are configured (and the automation identity has Mail.Send);
    # otherwise the run notes the delivery as not configured and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 3600
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [Group.Read.All, GroupMember.Read.All]
