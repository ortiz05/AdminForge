$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.inactive-users-weekly
version: 1.0.1
title: Weekly inactive users report
summary: >-
  Every Monday at 05:50 UTC, writes enabled member accounts with no sign-in for 90 days or more (including accounts that never signed in) as XLSX and emails it, keeping six months of history for the offboarding review. Sign-in activity needs Microsoft Entra ID P1.
owner: identity-team
tags: [identity, users, hygiene, report]
# When it runs, in English (compiled to cron "50 5 * * 1"; `cron:` works too).
every: every Monday at 05:50
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: identity.inactive-users
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { days: 90, includeDisabled: false, licensedOnly: false }
  delivery:
    - type: file
      format: xlsx
      path: identity/inactive-users/{date}.xlsx
      retain: 26
    # Sent only when AF_MAIL_SENDER and AF_REPORT_RECIPIENTS are configured (and the automation identity has Mail.Send);
    # otherwise the run notes the delivery as not configured and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 3600
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [User.Read.All, AuditLog.Read.All]
  licences: [signInLogs]
