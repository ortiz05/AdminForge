$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.key-vault-configuration-weekly
version: 1.0.0
title: Weekly Key Vault configuration report
summary: >-
  Every Monday at 05:15 UTC, writes Key Vaults that use access policies, lack purge protection, keep deleted items for
  under 90 days or accept all networks, as XLSX.
  Email goes to AF_REPORT_RECIPIENTS when it and AF_MAIL_SENDER are configured.
owner: azure-team
tags: [azure, key-vault, security, report]
cron: "15 5 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: azure.key-vault-configuration
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { findingsOnly: true }
  delivery:
    - type: file
      format: xlsx
      path: azure/key-vault-configuration/{date}.xlsx
      retain: 26
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  azureRoles: [Reader]
