$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.mailbox-storage-weekly
version: 1.0.0
title: Weekly mailbox storage and inactivity report
summary: >-
  Every Monday at 07:15 UTC, writes mailboxes at 90 % of their send quota or more, and mailboxes inactive for 90
  days, as XLSX and emails it to the report recipients.
owner: m365-team
tags: [m365, exchange, storage, report]
cron: "15 7 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: m365.mailbox-storage
  params: { view: attention, threshold: 90, inactiveDays: 90 }
  delivery:
    - type: file
      format: xlsx
      path: m365/mailbox-storage/{date}.xlsx
      retain: 26
    # Recipients are configuration (never content); without AF_MAIL_SENDER / AF_REPORT_RECIPIENTS the run notes
    # "not configured" and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [Reports.Read.All]
  licences: [exchange]
