$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.open-high-severity-incidents-daily
version: 1.0.0
title: Daily open high-severity incidents report
summary: >-
  Every weekday at 07:00 UTC, writes the open high-severity Defender XDR incidents (with owner and age) as XLSX for the morning security stand-up.
owner: security-team
tags: [security, incidents, report]
cron: "0 7 * * 1-5"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: security.open-high-severity-incidents
  params: { severity: high, assignment: any, minAgeDays: 0 }
  delivery:
    - type: file
      format: xlsx
      path: security/open-high-severity-incidents/{date}.xlsx
      retain: 60
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  scopes:
    graph: [SecurityIncident.Read.All]
  licences: [defender]
