$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.orphaned-resources-weekly
version: 1.0.0
title: Weekly orphaned Azure resources report
summary: >-
  Every Monday at 05:00 UTC, writes orphaned Azure resources (unattached disks, disks of deallocated VMs, unassociated
  public IPs, detached NICs, snapshots older than 90 days, empty App Service plans and resource groups) across every
  subscription the automation identity can read, as XLSX, for the weekly cost clean-up.
  Email goes to AF_REPORT_RECIPIENTS when it and AF_MAIL_SENDER are configured.
owner: azure-team
tags: [azure, cost, hygiene, report]
cron: "0 5 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: azure.orphaned-resources
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { category: any, snapshotDays: 90 }
  delivery:
    - type: file
      format: xlsx
      path: azure/orphaned-resources/{date}.xlsx
      retain: 26
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  azureRoles: [Reader]
