$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.os-versions-weekly
version: 1.0.0
title: Weekly OS version distribution report
summary: >-
  Every Monday at 06:25 UTC, writes the OS release distribution of Intune devices (with out-of-support Windows
  releases flagged) as XLSX and emails it to the report recipients; a year of history shows the upgrade trend. The
  devices on out-of-support releases are listed in the report itself.
owner: endpoint-team
tags: [endpoint, intune, patching, report]
cron: "25 6 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: endpoint.os-versions
  params: { os: Any }
  delivery:
    - type: file
      format: xlsx
      path: endpoint/os-versions/{date}.xlsx
      retain: 52
    # Recipients are configuration (never content); without AF_MAIL_SENDER / AF_REPORT_RECIPIENTS the run notes
    # "not configured" and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [DeviceManagementManagedDevices.Read.All]
  licences: [intune]
