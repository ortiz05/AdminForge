$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.password-policies-weekly
version: 1.0.0
title: Weekly password age and exceptions report
summary: >-
  Every Monday at 05:40 UTC, writes enabled member accounts with passwords older than a year, cloud accounts exempt from expiry and accounts allowed weak passwords as XLSX and emails it, keeping six months of history.
owner: identity-team
tags: [identity, users, passwords, report]
cron: "40 5 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: identity.password-policies
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { days: 365, finding: Any, includeDisabled: false }
  delivery:
    - type: file
      format: xlsx
      path: identity/password-policies/{date}.xlsx
      retain: 26
    # Sent only when AF_MAIL_SENDER and AF_REPORT_RECIPIENTS are configured (and the automation identity has Mail.Send);
    # otherwise the run notes the delivery as not configured and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [User.Read.All, Directory.Read.All]
