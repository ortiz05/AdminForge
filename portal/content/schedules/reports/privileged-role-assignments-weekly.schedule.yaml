$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.privileged-role-assignments-weekly
version: 1.0.0
title: Weekly privileged role assignments report
summary: >-
  Every Monday at 05:00 UTC, writes every active and eligible privileged Microsoft Entra role assignment (with each holder's account hygiene) as XLSX and emails it, keeping six months of evidence for the privileged access review. Eligible (PIM) assignments appear only with Entra ID P2.
owner: identity-team
tags: [identity, roles, privileged-access, report]
cron: "0 5 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: identity.privileged-role-assignments
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { scope: Privileged, assignment: Any, principal: Any }
  delivery:
    - type: file
      format: xlsx
      path: identity/privileged-role-assignments/{date}.xlsx
      retain: 26
    # Sent only when AF_MAIL_SENDER and AF_REPORT_RECIPIENTS are configured (and the automation identity has Mail.Send);
    # otherwise the run notes the delivery as not configured and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [RoleManagement.Read.Directory, Directory.Read.All]
