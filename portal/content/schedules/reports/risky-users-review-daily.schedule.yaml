$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.risky-users-review-daily
version: 1.0.1
title: Daily risky users review
summary: >-
  Every weekday at 07:10 UTC, writes the accounts Entra ID Protection still considers at risk or confirmed
  compromised (with days at risk and recent detections) as XLSX and emails it to the report recipients — the first
  1,000 (confirmed compromised and high risk first); the report says when there are more.
owner: security-team
tags: [security, identity-protection, risk, report]
cron: "10 7 * * 1-5"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: security.risky-users-review
  params: { level: all, minDays: 0 }
  delivery:
    - type: file
      format: xlsx
      path: security/risky-users-review/{date}.xlsx
      retain: 60
    # Recipients are configuration (never content); without AF_MAIL_SENDER / AF_REPORT_RECIPIENTS the run notes
    # "not configured" and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [IdentityRiskyUser.Read.All, IdentityRiskEvent.Read.All]
  licences: [identityProtection]
