$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.secure-score-summary-weekly
version: 1.1.0
title: Weekly Secure Score summary
summary: >-
  Retired — AdminForge doesn't cover the Microsoft Defender portal. Every Monday at 07:55 UTC, writes the 25 open Secure Score improvement actions worth the most points as XLSX and
  emails it to the report recipients; the score, its 7- and 30-day change and the trend are on the report page.
# Retired: AdminForge doesn't cover the Microsoft Defender portal (security operations). To bring it back, set
# status: active and enabled: true, and bump the version.
status: retired
owner: security-team
tags: [security, secure-score, posture, report]
cron: "55 7 * * 1"
timezone: UTC
enabled: false
identity: automation
job:
  kind: report
  ref: security.secure-score-summary
  params: { top: 25, quickWins: false, category: All }
  delivery:
    - type: file
      format: xlsx
      path: security/secure-score-summary/{date}.xlsx
      retain: 52
    # Recipients are configuration (never content); without AF_MAIL_SENDER / AF_REPORT_RECIPIENTS the run notes
    # "not configured" and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [SecurityEvents.Read.All]
