$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.stale-devices-weekly
version: 1.1.0
title: Weekly stale devices report
summary: >-
  Every Monday at 06:15 UTC, writes the Microsoft Entra devices with no activity for 90 days as XLSX and emails it to
  the report recipients — the clean-up list for the week (the Intune devices that stopped checking in are on the
  report page).
owner: endpoint-team
tags: [endpoint, devices, hygiene, report]
every: every Monday at 06:15
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: endpoint.stale-devices
  # Pinned so the archive stays comparable from week to week.
  params: { days: 90, joinType: Any }
  delivery:
    - type: file
      format: xlsx
      path: endpoint/stale-devices/{date}.xlsx
      retain: 26
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011); the Intune part needs Intune.
  scopes:
    graph: [Device.Read.All, DeviceManagementManagedDevices.Read.All]
