$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.teams-activity-weekly
version: 1.0.0
title: Weekly inactive teams report
summary: >-
  Every Monday at 07:20 UTC, writes teams with no activity for 90 days (with privacy and active guests) as XLSX and
  emails it to the report recipients, for the team lifecycle review.
owner: m365-team
tags: [m365, teams, governance, report]
cron: "20 7 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: m365.teams-activity
  params: { view: inactive, days: 90 }
  delivery:
    - type: file
      format: xlsx
      path: m365/teams-activity/{date}.xlsx
      retain: 26
    # Recipients are configuration (never content); without AF_MAIL_SENDER / AF_REPORT_RECIPIENTS the run notes
    # "not configured" and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [Reports.Read.All]
  licences: [teams]
