$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.tenant-baseline-weekly
version: 1.0.0
title: Weekly identity settings baseline report
summary: >-
  Every Monday at 05:45 UTC, writes the Microsoft Entra settings baseline (MFA enforcement, Global Administrator count, consent, guest access, authentication methods, device settings) as XLSX and emails it, so configuration drift shows up week to week.
owner: identity-team
tags: [identity, configuration, baseline, report]
cron: "45 5 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: identity.tenant-baseline
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { status: All }
  delivery:
    - type: file
      format: xlsx
      path: identity/tenant-baseline/{date}.xlsx
      retain: 52
    # Sent only when AF_MAIL_SENDER and AF_REPORT_RECIPIENTS are configured (and the automation identity has Mail.Send);
    # otherwise the run notes the delivery as not configured and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 900
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [Policy.Read.All, Directory.Read.All, RoleManagement.Read.Directory]
