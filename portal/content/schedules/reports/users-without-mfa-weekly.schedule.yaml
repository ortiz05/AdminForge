$schema: ../../../packages/schemas/generated/schedule.schema.json
kind: schedule
id: reports.users-without-mfa-weekly
version: 1.0.0
title: Weekly users without MFA report
summary: >-
  Every Monday at 05:55 UTC, writes member accounts that have not registered an MFA method (admins first) as XLSX and emails it, keeping six months of history. The registration report needs Microsoft Entra ID P1.
owner: identity-team
tags: [identity, mfa, security, report]
cron: "55 5 * * 1"
timezone: UTC
enabled: true
identity: automation
job:
  kind: report
  ref: identity.users-without-mfa
  # Pinned rather than left to the report's defaults so the archive stays comparable from run to run.
  params: { userType: member, adminsOnly: false }
  delivery:
    - type: file
      format: xlsx
      path: identity/users-without-mfa/{date}.xlsx
      retain: 26
    # Sent only when AF_MAIL_SENDER and AF_REPORT_RECIPIENTS are configured (and the automation identity has Mail.Send);
    # otherwise the run notes the delivery as not configured and the file is still kept.
    - type: email
      to: ["${ env.AF_REPORT_RECIPIENTS }"]
      format: xlsx
retry: { max: 2, backoff: exponential, delay: 5m }
timeoutSeconds: 1800
overlap: skip
requires:
  # Application permissions held by the automation identity (ADR-011).
  scopes:
    graph: [AuditLog.Read.All]
  licences: [signInLogs]
