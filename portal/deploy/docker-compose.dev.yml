# Local development Postgres for AdminForge (and, on this host, the services' database too).
#   pnpm --filter @adminforge/api init:local   # adds the dev DATABASE_URL to your env file, POSTGRES_PASSWORD to its owner file (once)
#   pnpm db:up                                 # passes defaults.env, your env file and its owner file to compose, waits until healthy
#   pnpm db:harden                             # roles: non-superuser owners, the services' role limits, pg_hba (idempotent)
#   pnpm --filter @adminforge/api db:migrate
# Names and port come from portal/deploy/defaults.env (AF_PG_USER, AF_PG_DATABASE, AF_PG_PORT; the container is
# AF_PG_CONTAINER = <name>-postgres-1): run compose through `pnpm db:up` / `pnpm db:down` (portal/deploy/db/compose.sh),
# which pass those files. Bound to loopback on AF_PG_PORT (5432 is left to a host Postgres).
# Hardening (docs/operations.md → Postgres hardening): the image is pinned by digest; the server logs connections, DDL,
# lock waits and slow statements (never their bind parameters; passwords are only ever set as SCRAM verifiers, in
# sessions that log no statements); container logs rotate; no privilege escalation inside the container; memory and
# process limits. A changed `command`/`logging` takes effect when `pnpm db:up` recreates the container (the data volume
# is kept).
name: adminforge-dev

services:
  postgres:
    # postgres:18-alpine, pinned (update the digest deliberately: docker pull, then docker image inspect … RepoDigests).
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AF_PG_USER:?AF_PG_USER is not set - run compose through pnpm db:up (portal/deploy/defaults.env)}
      # Only read when the cluster is created (an empty volume); it lives in the env file's owner file, which the
      # services never read. Rotated with `pnpm db:harden --rotate-superuser`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${AF_PG_DATABASE:?AF_PG_DATABASE is not set - run compose through pnpm db:up (portal/deploy/defaults.env)}
      # New clusters only: TCP inside the container needs a password too (the local socket stays for `docker exec`).
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - log_connections=receipt,authentication,authorization
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl
      - -c
      - log_lock_waits=on
      - -c
      - log_min_duration_statement=2s
      # Logged statements never show their bind parameters (session ids, CSRF tokens, sign-in nonces, UPNs).
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - 'log_line_prefix=%m [%p] %u@%d %a %h '
    ports:
      - '127.0.0.1:${AF_PG_PORT:?AF_PG_PORT is not set - run compose through pnpm db:up (portal/deploy/defaults.env)}:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker; mount the parent.
      - pgdata:/var/lib/postgresql
      # New clusters only: the superuser may sign in over the local socket, never over TCP (db/initdb/*.sh).
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${AF_PG_USER} -d ${AF_PG_DATABASE}']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata: {}
