# Enforced only where the cluster runs a network policy engine (AKS: Azure Network Policy Manager, Cilium or Calico) —
# without one, any pod can reach the API and set X-Forwarded-For (README.md → Requirements).
# Ingress: only the HTTP port (narrow `from` to the ingress controller's namespace in the overlay). Egress: DNS, and
# HTTPS to Microsoft (Graph, ARM, Log Analytics, Exchange/Teams/SharePoint for the runner, login.microsoftonline.com,
# first-party feeds) — never the cloud instance metadata service, so the pod can't borrow the node's identity. The
# runner sidecar shares the pod's network, so it is covered too; it listens on the pod's loopback only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adminforge
  labels:
    app.kubernetes.io/name: adminforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: adminforge
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 3300
          protocol: TCP
  egress:
    # DNS only to the cluster's resolver (an open port 53 is a way out for data).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              # Link-local (the cloud instance metadata service at 169.254.169.254 among it) and Azure's WireServer.
              - 169.254.0.0/16
              - 168.63.129.16/32
      ports:
        - port: 443
          protocol: TCP
