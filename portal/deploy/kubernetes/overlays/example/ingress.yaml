# HTTPS for engineers' browsers (PUBLIC_BASE_URL must be this URL: the session cookie is Secure and Entra redirects
# here). ingress-nginx shown; any controller works if it passes Server-Sent Events through unbuffered and keeps them
# open (/api/events, the run streams).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adminforge
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [adminforge.example.com]
      # A certificate for the host (cert-manager, or `kubectl create secret tls adminforge-tls …`).
      secretName: adminforge-tls
  rules:
    - host: adminforge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adminforge
                port:
                  name: http
