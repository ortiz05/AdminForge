# Sandboxing for the AdminForge user units: portal/deploy/install-units.sh installs it as a drop-in for every unit it
# installs (~/.config/systemd/user/adminforge-<unit>.service.d/hardening.conf); then systemctl --user daemon-reload.
#
# Only seccomp/prctl-based options are listed: they are enforced in user units. Filesystem isolation
# (ProtectSystem, ProtectHome, PrivateTmp, ReadWritePaths) needs a mount namespace, which the user manager can't
# create where unprivileged user namespaces are restricted (Ubuntu 24.04 default) — systemd then ignores those
# options silently. For that isolation, run AdminForge as a dedicated system user with system units.
[Service]
NoNewPrivileges=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
# AF_NETLINK: glibc's getaddrinfo (AI_ADDRCONFIG) uses it to resolve login.microsoftonline.com and friends.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
UMask=0077
