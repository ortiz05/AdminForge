# Shared sandbox for the AdminForge system units, inlined into each unit by install-service-account.sh (not a
# drop-in). System units get a mount namespace, so the filesystem isolation the user units can't have is enforced
# here.
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
RemoveIPC=yes
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
# AF_NETLINK: glibc's getaddrinfo (AI_ADDRCONFIG) uses it to resolve login.microsoftonline.com and friends.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
# Writable: only each unit's StateDirectory. Node and .NET JIT need W+X memory, so MemoryDenyWriteExecute stays off.
# The Docker socket is root on the host: never reachable.
InaccessiblePaths=-/run/docker.sock
UMask=0027
